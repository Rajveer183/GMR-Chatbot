explain_only:
  mi_progress: "Meters installed (KPI 1): rows with a meter serial, category resolved and not a replacement; SUM(meter_count) of gold_mi_installation_*."
  total_mi: "Every installed meter incl. replacements, whatever its date (SAT card denominator)."
  eligible_mi: "Installed meters with installation date on/before the project's SAT eligibility cutoff (sat_eligibility_config) - due for SAT now."
  total_sat: "Meters in a SAT batch SAT-1..SAT-13. % SAT vs MI = Total SAT / Total MI; % SAT vs eligible = Total SAT / Eligible MI (can exceed 100%)."
  sat_batch: "A SAT (site acceptance test) batch per project, numbered SAT-n, with SAT, invoice and collection dates in sat_milestones."
  lumpsum: "One-time payment per meter, invoiced per SAT batch after SAT; % = lumpsum-invoiced meters / Total SAT."
  pmpm: "Per Meter Per Month recurring payment that starts after SAT, invoiced per batch; % = PMPM-invoiced meters / Total SAT."
  non_sat: "Eligible meters (installed on/before the cutoff) with no SAT batch yet, aged from installation in 30-day bands."
  defective_meter: "The OLD meter taken out in a completed replacement complaint, typed Meter Faulty, Meter Burnt or Others (Others includes load enhancement/reduction swaps)."
  replacement_install: "The NEW meter fitted in place of a defective one: excluded from MI progress, productivity and the defect-rate base; counted in stock, SAT and non-SAT."
  defect_rate: "Meter Faulty replacements / installed meters (non-replacement, OEMs with defects) x 100; burnt and others are not in the numerator."
  mi_productivity: "Productivity per team -- the default meaning of 'productivity per team' (MI Productivity page) = meters installed / technician-days, where a technician-day is one technician working on one day; the page reads the gold roll-up row of the selected level (all categories, one category or one meter type), so a technician working two meter types on one day is still ONE technician-day (never two -- that double count is only the O&M per-category rows). Replacements are excluded. E.g. 300 installs by 100 technician-days = 3.0."
  utilization_rate: "Cumulative installed / cumulative received into stock x 100."
  remaining_stock: "Received into stock - consumed (installed with a stock record + scrapped)."
  unutilized_stock: "Meters received but never installed or scrapped; age = days since DI (delivery) date."
  di_date: "Delivery/intake date when a meter was received into GMR stock."
  stock_cover: "Days the remaining stock lasts = stock / average meters leaving stock per day (default last 6 months)."
  journey_time: "Average days between handoffs DI -> agency -> supervisor -> technician -> installed -> SAT -> PMPM collected, as ratios of summed days to meters."
  current_stage: "Where a meter without realized revenue sits now: inventory, agency, supervisor, technician, installed SAT pending, SAT done revenue pending."
  revenue_not_realized: "SAT-done meters whose batch has no PMPM collection date, aged from the SAT date (IST)."
  receivables: "Operator-entered rupee amounts (crore) per project and stream: invoiced, realised, within timeline (unpaid, not yet due); overdue = invoiced - realised - within timeline; outstanding = invoiced - realised."
  om_open_ticket: "Any row in the active complaints feed (RESOLVED included), aged from complaint creation at the last refresh."
  om_productivity: "O&M-Productivity per team (only when the question names O&M, complaints or tickets; plain 'productivity per team' is the MI one) = closed QC + non-QC complaints by work completion / technician-day rows."
  om_closed_analysis: "Tickets closed per day (gold_om_closed_tickets_day_agg), every category; in today's data equal to work completed."
  confirmed: "Auto-indexing: the consumer's declared feeder matches the outage evidence."
  reassign: "Auto-indexing: evidence points to a different feeder -- the consumer should be re-tagged to it (the AI-based feeder)."
  outage_match: "Mapping audit: 'dark of seen' for a feeder -- of that feeder's own outage windows (it went dark while its sibling feeders at the substation stayed on), how many the consumer also went dark in. 3 of 3 = strong evidence the consumer is on that feeder; the declared feeder's match vs the best feeder's match decides Confirmed / Reassign. Nothing to do with complaints."
  index_vs_ai_feeder: "Index-based feeder = the feeder the consumer is tagged to in the records (declared / system). AI-based feeder = the feeder the outage evidence says is correct: the same one when Confirmed, the new one when Reassign, none yet when Review / No data."
  mi_ci: "Mapping audit per feeder: MI = consumers declared (tagged) to the feeder in the meter records; CI = consumers indexed to it in the field indexing register. Not meter installation."
  reassign_in_out: "Per feeder: reassign OUT = its declared consumers the evidence moves to another feeder; reassign IN = consumers of other feeders the evidence moves to it. The same reassignments counted at each end, so the totals are equal -- never add them."
  feeder_confidence: "Per feeder: (confirmed + reassign out) / MI x 100 -- the share of its consumers the audit could decide; coverage, not tagging correctness."
  mapping_accuracy: "Dashboard card: (confirmed + reassign) / meters audited x 100, target 95% -- consumers whose correct feeder is now known. Pending verification = (review + no data) / audited, target under 5%. System-index accuracy = confirmed / (confirmed + reassign): how often the existing tag was right."
  review: "Auto-indexing: evidence exists but is inconclusive; needs manual check."
  no_data: "Auto-indexing: consumer never seen in any feeder's outage window, so no evidence."
  auto_indexing_concluded: "Auto-indexing concluded (complete) = Confirmed + Reassigned consumers: a feeder decision has been reached."
  pending_verification: "Auto-indexing pending = Review + No data consumers still needing a decision (target 0)."
  feeder_tagging_importance: "Why correct feeder tagging (consumer-to-feeder mapping) matters: feeder and distribution-transformer energy accounting and AT&C loss calculation add up consumption by feeder, so a consumer on the wrong feeder shifts its energy and losses to another feeder; outage attribution and reliability indices (SAIFI / SAIDI) count affected consumers per feeder; and field teams restore supply and plan load by feeder. The mapping audit finds the wrong tags (Reassign) so they can be corrected."
  mdm_mi: "In MDM tables 'mi' means meters indexed (consumers declared to a feeder), not meter installation."
