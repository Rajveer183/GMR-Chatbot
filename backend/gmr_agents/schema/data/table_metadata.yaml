# Hand-curated table metadata for the Schema agent (loaded by schema/table_metadata.py).
#
#   mdm_tables / wfm_tables / wfm_postgres_tables   the curated table shortlists
#   column_hints             "table.column" -> business meaning, shown to the SQL planner
#   header_label_overrides   "table.column" -> display header for result tables
#   table_descriptions       table -> one-line purpose (planner context + retrieval)
#   place_name_aliases       alternate place names -> stored names
#
# The live structure (columns, types, row counts, sample values) is read from
# information_schema by schema/catalog.py; this file is what cannot be read from
# the database. After editing a table shortlist, refresh the catalog.
#
# PROMPT COST MAP (measured 2026-10-04):
#   table_descriptions     triage table cards (TABLE_HINTS=5 best-ranked) + SQL schema
#                          header of each table sent (SCHEMA_SCOPE=lean: tables triage named)
#   column_hints           SQL planner: schema lines of sent tables (cut short, within
#                          SCHEMA_TOKEN_BUDGET) + "RELEVANT COLUMNS" (~390 tok avg, top
#                          SCHEMA_HINT_COLUMNS) -- a long hint costs on every question that
#                          uses its table
#   header_label_overrides result table headers only -- free in prompts
#   place_name_aliases     code-side matching only -- free in prompts
#   *_tables shortlists    triage TABLES menu, EVERY call: names only (~350 tok)

# --------------------------------------------------------------------------- #
# Curated table shortlist (see schema/catalog.py module docstring)
# --------------------------------------------------------------------------- #
# hes_gold by default, by the original explicit instruction: hes_silver/
# hes_bronze are earlier (raw/staging) layers of this data lake's own
# bronze/silver/gold maturity model, not meant to be queried directly --
# only the curated "gold" layer is exposed to real query execution by
# default. hes_silver's billing/usage/outage/installation-dimension tables
# are a DELIBERATE, SCOPED exception to that rule (explicitly requested --
# see the "hes_silver" key below): they're real, meaningful business
# concepts (billing, block/daily usage, power outage, the installation
# dimension) with no hes_gold equivalent at all, not a blanket "hes_silver
# is now in scope" -- hes_silver's own "_unmapped" staging variants and
# one-off dated rebuild snapshots (verified present: billing_unmapped,
# block_usage_unmapped, daily_usage_unmapped, power_outage_unmapped,
# rebuild_billing_<date>) stay excluded, same reasoning as hes_gold's own
# "_stage_*"/"mapping_audit*" exclusion below. This means MDM currently
# CANNOT answer a device-status question (hes_silver.device_status exists
# but wasn't part of the requested exception) even though the router's own
# domain description still mentions it -- that description is about
# ROUTING scope (recognizing the
# question as MDM's), not a promise every concept in it is queryable yet.
# Add a hes_gold equivalent here (or lift this restriction) if that gap
# needs closing.
mdm_tables:
  # SCOPED DOWN on request: the chatbot answers ONLY WFM data plus these 3
  # meter-to-feeder auto-indexing ("mapping") tables. Every other hes_gold
  # table and the hes_silver exception (billing/block_usage/daily_usage/
  # power_outage/dim_installation) is deliberately not loaded and not
  # queryable -- sql_guard rejects any table outside this catalog, so
  # questions about them are refused. The previous full list is in this
  # file's history; add tables back here to re-enable them.
  hes_gold:
    # Meter-to-feeder auto-indexing (KPI 50) -- source of truth for this
    # concept (supersedes the retired mapping_audit* family).
    - hierarchy_summary_autoindexing
    - consumer_detail_autoindexing
    - feeder_ranking_autoindexing

wfm_tables:
  gmr_wfm_silver:
    # complaints/tickets
    - unified_complaints
    - unified_active_complaints
    # service installations
    - unified_installations
    # meter asset records
    - unified_smart_meter_asset
    - unified_smart_meter_inventory
    # meter lifecycle/discom-owned assets
    - unified_decommissioned_meter
    - unified_discom_meter_asset
    # meter reading/index records
    - unified_indexing
    # complaints that haven't passed QC
    - unified_non_qc_complaints
    # SAT (site acceptance test) tracking
    - sat_meter_mappings
    - sat_milestones

# Postgres database (DB_NAME), public schema -- same gold-tier-only
# principle as MDM above, by the same explicit instruction: only
# "gold_"-prefixed tables are real curated data; every other table there
# (alembic_version/etl_alembic_version, geography_nodes, kpi_*,
# milestone_*, rbac_* (access control, NOT data), revenue_receivables,
# sat_eligibility_*, sku_catalog) is pipeline/config/access-control
# plumbing, never queried for an answer. `gold_refresh_state` is EXCLUDED
# despite the prefix -- verified directly (1 row, 27 columns all named
# "*_rows"/"refreshed_at") to be ETL bookkeeping (when each OTHER gold
# table was last refreshed and how many rows it got), not business data.
# Curated to the tables matching this domain's own description (complaints/
# tickets, field technician activity, installations) out of 21 real gold_
# tables total -- same "starting shortlist, not everything" call as
# MDM_TABLES/WFM_TABLES above; add more from `gold_inventory_*`,
# `gold_revenue_*`, `gold_mi_sat_invoice_*`, `gold_meter_journey_stage_agg`,
# etc. the same way.
# Every real WFM Postgres table prefixed "gold_" EXCEPT
# "gold_refresh_state" -- ETL pipeline metadata (when the pipeline last
# ran), not curated business data, same reasoning as MDM_TABLES' own
# "_stage_*"/"mapping_audit*" exclusions above. Every other real table in
# the "public" schema (rbac_*, kpi_*, milestone_*, sat_eligibility_*,
# sat_workbook_uploads, sku_catalog, revenue_receivables, geography_*,
# alembic_version, etl_alembic_version) is deliberately out of scope by
# the original instruction: only "gold_"-prefixed tables are curated,
# query-execution-ready business data here; everything else is RBAC,
# config, or pipeline internals. Originally a curated 7-table shortlist --
# expanded to the full 21 after confirming (same pattern as the MDM
# expansion) the other 14 weren't out of scope either, just not yet added.
