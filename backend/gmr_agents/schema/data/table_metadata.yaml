  - gold_om_technician_productivity_day_agg
  - gold_om_technician_productivity_month_agg
  - gold_mi_technician_productivity_day_agg
  - gold_mi_technician_productivity_month_agg
  - gold_mi_productivity_trend_month_agg
  - gold_om_open_ageing_snapshot
  - gold_non_sat_ageing_snapshot
  - gold_meter_defect_event_day_agg
  - gold_meter_inventory_event_day_agg
  - gold_meter_inventory_event_month_agg
  - gold_inventory_monthly_balance
  - gold_inventory_unutilized_stock_snapshot
  - gold_meter_journey_stage_agg
  - gold_meter_revenue_pending_stage_snapshot
  - gold_revenue_ageing_snapshot
  - gold_mi_sat_invoice_day_agg
  - gold_mi_sat_invoice_snapshot
  - gold_dashboard_stats_snapshot
