    summary: >-
      **MI vs SAT vs Invoice Funnel** (dashboard KPI 10a) shows how far installed meters have progressed toward
      billing: Total MI -> Total SAT (certified) -> Lumpsum invoiced and PMPM invoiced. It is NOT a separate query:
      the same `/api/v1/kpis/mi_vs_sat` request as MI vs SAT, over Postgres `gold_mi_sat_invoice_snapshot`. Every
      count is SUM(meter_count): Total MI = all rows, Total SAT = sat_stage IS NOT NULL (SAT-1..SAT-13), Lumpsum /
      PMPM invoiced = has_lumpsum_invoice / has_pmpm_invoice (the meter's SAT batch has that invoice date in
