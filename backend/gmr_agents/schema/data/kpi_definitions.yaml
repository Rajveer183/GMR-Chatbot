      - How much unutilized stock is older than 90 days by warehouse?
      - Explain the Supply utilization rate KPI
  - number: 8
    title: MI Vs SAT-Progress
    kpi_code: mi_vs_sat
    backend_kpi_id: 10
    section: SAT
    card: Consolidated MI vs SAT tracking with stage-wise verification progress -- total & category wise.
    aliases:
      - mi vs sat
      - mi vs sat progress
      - mi vs sat-progress
      - sat progress
      - sat-progress
      - sat stage wise
      - stage-wise
      - stage wise
      - sat eligible
      - sat eligibility
      - kpi 8
      - kpi8
      - kpi-8
      - kpi 10
      - kpi10
    summary: >-
      **MI vs SAT-Progress** compares installed meters (total_mi) with meters covered by a SAT (Site Acceptance
      Test) batch. It sums `meter_count` from Postgres `gold_mi_sat_invoice_snapshot`: a meter is SAT-done when
      `sat_stage` (its SAT number normalised to SAT-1..SAT-13) is not NULL; `is_sat_eligible` = installed on/before
      the project's SAT eligibility cutoff. The ETL builds it from Silver `unified_installations` + replacement
      installs from `unified_complaints` (replacements INCLUDED), `sat_meter_mappings` (SAT number per meter) and
      `sat_milestones` (lumpsum/PMPM invoice dates). Stage-wise = meters per SAT-1..SAT-13.
    gold_tables:
      - table: gold_mi_sat_invoice_snapshot
        columns: >-
          project, discom, zone, circle, division, sub_division, category, meter_type, sat_stage,
          has_lumpsum_invoice, has_pmpm_invoice, is_sat_eligible, meter_count
      - table: sat_eligibility_config (Postgres config)
        columns: eligibility_cutoff_date -- display only
    silver_tables:
      - table: unified_installations
        columns: mi_date, project, geography, report_category, new_meter_type, new_meter_serial_number, sat_number
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: replacement leg (included)
        source: COMQC, DOMQC, FOMQC
      - table: sat_meter_mappings
        columns: meter_serial_number, sat_number
        source: SAT CSV uploads
      - table: sat_milestones
        columns: project, sat_number, lumpsum_invoice_date, pmpm_invoice_date
        source: milestone_config
    logic:
      - step: SAT number
        detail: >-
          coalesce(sat_meter_mappings.sat_number, installation.sat_number) joined on the normalised serial (project
          not checked).
      - step: SAT stage
        detail: >-
          regexp_replace(upper(trim(sat_number)),'\s+','') 'SAT-1'..'SAT-13' -> 1..13, anything else NULL. SAT-done
          = sat_stage IS NOT NULL.
      - step: Invoices
        detail: has_lumpsum_invoice / has_pmpm_invoice = the milestone's invoice date is set for that project + SAT.
      - step: Eligibility
        detail: is_sat_eligible = mi_date <= the project's cutoff in sat_eligibility_config (computed at ETL time).
      - step: Snapshot
        detail: Day aggregate (count(*) per mi_date) with the date dropped, grouped by the SAT/invoice flags.
    formulas:
      - output: total_mi
        formula: SUM(meter_count)
      - output: total_mi_eligible
        formula: SUM(meter_count) FILTER (is_sat_eligible)
      - output: total_sat
        formula: SUM(meter_count) FILTER (sat_stage IS NOT NULL)
      - output: total_sat_eligible
        formula: SUM FILTER (sat_stage IS NOT NULL AND is_sat_eligible)
      - output: sat_progress_pct
        formula: total_sat / total_mi x 100
      - output: sat_progress_pct_eligible
        formula: 'as coded: total_sat / total_mi_eligible x 100'
      - output: lumpsum / pmpm invoice %
        formula: invoice total / total_sat x 100
      - output: sat_1 ... sat_13
        formula: SUM(meter_count) WHERE sat_stage = n, by category
    caveats:
      - >-
          Probable bug: sat_progress_pct_eligible divides total_sat (not total_sat_eligible) by total_mi_eligible,
          so it can exceed 100%.
      - Eligibility is baked in at ETL refresh -- a changed cutoff only shows after the next gold run.
      - >-
          SAT values like 'SAT_1', 'SAT1' or 'SAT-14' get sat_stage NULL and count as neither SAT-done nor Non-SAT
          pending.
      - Replacements are included, so total_mi exceeds MI-Progress by the replacement count.
    sql_recipe: >-
      MI vs SAT-Progress (dashboard KPI 10): FROM public.gold_mi_sat_invoice_snapshot: total_mi = SUM(meter_count);
      total_sat = SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) (or SUM(CASE WHEN sat_stage IS NOT NULL THEN
      meter_count ELSE 0 END)); eligible = the same with is_sat_eligible; SAT progress % = 100.0 * total_sat /
      total_mi; stage-wise = GROUP BY sat_stage WHERE sat_stage IS NOT NULL; invoices via has_lumpsum_invoice /
      has_pmpm_invoice. This table has no date column -- it is an as-of snapshot.
    followups:
      - What is the SAT progress percentage by project?
      - How many meters are in each SAT stage?
