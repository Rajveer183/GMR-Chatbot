  - number: 16
    title: O&M Productivity trend
    kpi_code: om_team_productivity
    backend_kpi_id: 18
    section: O&M
    card: >-
      O&M Productivity trend (Total & Category wise): the O&M productivity card read month by month -- total closed
      tickets, total active months, total active technicians, productivity per technician per day, monthly
      performance trend and comparison by project.
    aliases:
      - o&m productivity trend
      - o&m productivity trends
      - om productivity trend
      - o and m productivity trend
      - o&m monthly productivity
      - o&m monthly performance trend
      - monthly performance trend
      - o&m trend
      - total active months
    summary: >-
      **O&M Productivity trend** is not a separate backend KPI: the dashboard calls the same O&M team productivity
      query (`om_team_productivity`) with duration = monthly and draws its trend month by month. Total closed
      tickets = SUM(complaint_count); Total active technicians = distinct technician names; Productivity per
      technician per day = SUM(complaint_count) / SUM(technician_day_count); Total active months = the number of
      months in the trend (computed by the dashboard). Whole months are read from
      `gold_om_technician_productivity_month_agg`, partial first / last months from the day table.
    gold_tables:
      - table: gold_om_technician_productivity_month_agg
        columns: >-
          period_start (1st of month), geography, technician_name, category, meter_type, complaint_count,
          technician_day_count, active_days
      - table: gold_om_technician_productivity_day_agg
        columns: partial first / last month
    silver_tables:
      - table: unified_complaints
        columns: closed QC complaints
        source: COMQC, DOMQC, FOMQC
      - table: unified_non_qc_complaints
        columns: closed non-QC complaints
        source: non-QC complaint reports
    logic:
      - step: Same query
        detail: >-
          kpi_catalog/om_team_productivity.py with duration=monthly -- identical formulas to O&M-Productivity per
          team; only the trend bucket is the month.
      - step: Month table
        detail: >-
          gold_om_technician_productivity_month_agg: complaint_count summed over the month, technician_day_count =
          number of day rows (so the ratio equals the day table's).
      - step: Monthly point
        detail: >-
          per month: SUM(closed), COUNT(distinct technicians that month), SUM(closed) / SUM(technician-day rows).
      - step: Active months
        detail: 'Not in the API: the dashboard counts the months in the trend array.'
      - step: Active days
        detail: >-
          The chart legend shows Active Days, but the O&M API returns none; the chatbot gives distinct closing days
          (COUNT(DISTINCT period_start)).
      - step: Comparison
        detail: Per project (all projects) or discom / zone / circle / division, over the whole range.
    formulas:
      - output: Total closed tickets
        formula: SUM(complaint_count)
      - output: Total active months
        formula: number of months with data in the range
      - output: Total active technicians
        formula: COUNT(DISTINCT technician_name) over the whole range (not the sum of months)
      - output: Productivity per technician per day
        formula: ROUND(SUM(complaint_count) / SUM(technician_day_count), 2)
      - output: Monthly bars
        formula: the same three per month
    caveats:
      - >-
          Total active technicians is the distinct count over the whole range, so it is far below the sum of the
          monthly technician counts.
      - >-
          Same understated denominator as the per-team card: technician-days are counted per row (technician x day x
          geography x category x meter type).
      - The current month is partial (data up to the last ETL refresh), so its bar is smaller.
      - Category = complaint_entity_type (DT/DTR -> DT, FEEDER, else CONSUMER); Consumer is ~99% of tickets.
    sql_recipe: >-
      O&M Productivity trend (dashboard KPI 18, monthly): FROM public.gold_om_technician_productivity_day_agg WHERE
      category <> 'ALL' and the date range, GROUP BY DATE_TRUNC('month', period_start): SUM(complaint_count),
      COUNT(DISTINCT technician_name), ROUND(SUM(complaint_count)::numeric / NULLIF(SUM(technician_day_count), 0),
      2); active months = COUNT(DISTINCT DATE_TRUNC('month', period_start)).
    followups:
      - O&M productivity trend for consumer complaints from Sep 2025 to Sep 2026
      - Which month had the highest O&M productivity?
      - Explain the O&M productivity trend KPI
    filters:
      - filter: duration
        values: monthly
        effect: Trend bucket = month
      - filter: from / to
        values: months
        effect: Range, inclusive
      - filter: project / category / meter type / level
        values: as O&M-Productivity per team
        effect: Same filters
    response:
      - part: Same API
        shape: summary, insights, trend[] (one per month, date YYYY-MM), comparison[], category_breakdown
    example:
      - step: Range
        result: Sep 2025 - Sep 2026, Consumer
      - step: Cards
        result: 342,840 closed tickets, 13 active months, 7,432 technicians, 2.87 per technician per day
      - step: Monthly productivity
        result: >-
          Sep 25 2.33, Oct 1.87, Nov 2.12, Dec 2.16, Jan 26 2.70, Feb 3.08, Mar 3.14, Apr 3.31, May 3.17, Jun 3.11,
          Jul 2.75, Aug 2.61, Sep 2.45
      - step: By project
        result: Kashi 233,549, Agra 73,331, Triveni 35,960 closed tickets
  - number: 17
    title: O&M Not closed ticket Ageing
    kpi_code: om_open_ageing
    backend_kpi_id: 19
    section: O&M
    card: >-
      O&M Not closed ticket Ageing: open complaint tickets by age since creation (0-7 / 8-15 / 16-30 / 31-60 / 60+
      days), with Source, Status, Complaint type, Category, Project and Level filters.
    aliases:
      - o&m not closed ticket ageing
      - not closed ticket ageing
      - not closed tickets
      - open ticket ageing
      - open tickets ageing
      - o&m open ticket ageing
      - open complaint ageing
      - total open tickets
      - open tickets
      - open complaints
      - pending complaints
      - pending tickets
      - unresolved complaints
      - complaint ageing
      - ticket ageing
      - kpi 19
      - kpi19
      - kpi-19
    summary: >-
      **O&M Not closed ticket Ageing** counts complaint tickets in the ACTIVE complaints feed
      (`unified_active_complaints`), banded by days since the complaint was created: 0-7 / 8-15 / 16-30 / 31-60 /
      60+. It sums `ticket_count` from Postgres `gold_om_open_ageing_snapshot`, which also carries the card's
      filters: Source (1912 / AUTO / MANUAL, derived from complaint_by), Status (the ticket's complaint_status),
      Complaint type, Category (Consumer / DT / Feeder) and geography.
    gold_tables:
      - table: gold_om_open_ageing_snapshot
        columns: >-
          project, discom, zone, circle, division, sub_division, category, meter_type, complaint_source,
          complaint_status, complaint_type, age_key, ticket_count
    silver_tables:
      - table: unified_active_complaints
        columns: >-
          complaint_no, ticket_id, complaint_by, complaint_type, complaint_description, complaint_status,
          complaint_created_date, technician_name, supervisor, agency, escalation_status, old_meter_serial_number,
          consumer_number, geography
        source: SmartEMS active complaint report
      - table: unified_smart_meter_inventory
        columns: meter_type by serial (meter_type_lookup)
        source: INVSMM
    logic:
      - step: Flow
        detail: >-
          unified_active_complaints (all rows with a complaint_created_date) -> meter type by old serial -> Spark
          _om_open_ageing_snapshot() -> gold_om_open_ageing_snapshot -> backend kpi_catalog/om_open_ageing.py ->
          card.
      - step: Age
        detail: >-
          datediff(ETL run date in IST, complaint_created_date) -> 0-7 / 8-15 / 16-30 / 31-60 / 60+ -- frozen at the
          refresh, not recomputed per request.
      - step: Source
        detail: >-
          complaint_by containing '1912' -> 1912 (helpline); AUTO / SYSTEM / HES / MDM or containing AUTO / SYSTEM
          -> AUTO (system-raised, e.g. non-communication); everything else -> MANUAL (a person's name).
      - step: Status
        detail: complaint_status upper-cased; blank -> OPEN. Every status is counted -- including RESOLVED.
      - step: Complaint type
        detail: complaint_type upper-cased; blank -> OTHER.
      - step: Category
        detail: complaint_entity_type DT/DTR -> DT, FEEDER -> FEEDER, else CONSUMER.
      - step: Backend
        detail: >-
          SUM(ticket_count) per band x category, total, and per comparison label (project when all projects, else
          discom; or zone / circle / division / sub_division). Source / status / type are IN filters on the snapshot
          columns.
    formulas:
      - output: Total open tickets
        formula: SUM(ticket_count)
      - output: 0-7 / 8-15 / 16-30 / 31-60 / 60+ days
        formula: SUM(ticket_count) WHERE age_key = band
      - output: Band x category
        formula: the same per CONSUMER / DT / FEEDER
    caveats:
      - >-
          'Open' means 'in the active complaints feed': tickets with status RESOLVED (and every other status)
          are counted -- filter Status to exclude them.
      - Ages are frozen at the ETL run date (the last refresh); they only move after the next refresh.
      - 'No de-duplication: a ticket that appears twice in the feed counts twice.'
      - >-
          Source is inferred from the free-text complaint_by: any name that is not 1912 / AUTO / SYSTEM / HES / MDM
          counts as MANUAL.
      - >-
          Technician / supervisor / agency are not in the snapshot -- the chatbot answers those from the raw feed,
          where age is computed as of today.
      - >-
          This is not O&M productivity (closed tickets) -- a closed ticket may still sit in the active feed as
          RESOLVED.
    sql_recipe: >-
      O&M Not closed ticket Ageing (dashboard KPI 19): FROM public.gold_om_open_ageing_snapshot, SUM(ticket_count)
      by age_key ('age_0_7','age_8_15','age_16_30','age_31_60','age_60_plus'), complaint_source
      ('1912','AUTO','MANUAL'), complaint_status (upper case), complaint_type (upper case), category, project /
      geography. Order bands with an explicit CASE. For technician / supervisor / agency or ticket-level detail use
      gmr_wfm_silver.unified_active_complaints.
    followups:
      - Open tickets by source
      - How many AUTO tickets are older than 60 days in kashi?
      - Explain the O&M not closed ticket ageing KPI
    filters:
      - filter: duration
        values: as on latest date
        effect: Snapshot
      - filter: complaint_source
        values: all, 1912, auto, manual
        effect: n.complaint_source IN (...)
      - filter: complaint_status
        values: any status
        effect: n.complaint_status IN (...)
      - filter: complaint_type
        values: any type
        effect: n.complaint_type IN (...)
      - filter: project / category / discom / zone / circle / division / sub_division
        values: as other KPIs
        effect: standard
      - filter: level
        values: discom (default), zone, circle, division, sub_division
        effect: Comparison dimension
    response:
      - part: Parts
        shape: >-
          total_open_tickets, summary.age_0_7 .. age_60_plus (each {CONSUMER, FEEDER, DT, total}), comparison[] per
          label.
    example:
      - step: Snapshot 25 Sep 2026
        result: '674,061 tickets: 0-7 45,237; 8-15 89,018; 16-30 83,146; 31-60 227,844; 60+ 228,816'
      - step: By project
        result: Kashi 276,849 (60+ 119,850); Triveni 212,106; Agra 185,106
      - step: By source
        result: AUTO 525,193; MANUAL 143,706; 1912 5,162
      - step: By status
        result: UNASSIGNED 545,038; CAN NOT ATTEND 53,097; ASSIGNED 32,251; ... RESOLVED 6,633
  - number: 18
    title: O&M Ticket Closed Analysis
    kpi_code: om_ticket_closed_analysis
    backend_kpi_id: 0
    section: O&M
    card: >-
      O&M Ticket Closed Analysis: total closed, daily closures and comparison by project, filtered by category and
      complaint type, for a date range.
    aliases:
      - o&m ticket closed analysis
      - ticket closed analysis
      - closed analysis
      - daily closures
      - ticket closures
      - complaint closures
      - closure analysis
      - closed date
    summary: >-
      **O&M Ticket Closed Analysis** counts NON-QC complaint tickets by their `closed_date` (converted to IST) in
      the selected range -- `gmr_wfm_silver.unified_non_qc_complaints`. It is not a gmr-backend KPI (no kpi_catalog
      module computes it); the definition was matched against the dashboard exactly. Only a tiny share of non-QC
      rows carry a closed_date, so this card is far smaller than O&M productivity's closed tickets
      (work_completed_at, QC + non-QC) for the same range.
    gold_tables:
      - table: (none -- read from Silver)
        columns: unified_non_qc_complaints.closed_date
    silver_tables:
      - table: unified_non_qc_complaints
        columns: >-
          closed_date, work_completed_at, sub_complaint_type, complaint_entity_type, technician_name, complaint_no,
          old_meter_serial_number, consumer_number, geography
        source: non-QC complaint reports
    logic:
      - step: Population
        detail: >-
          unified_non_qc_complaints rows with closed_date set -- QC complaints (unified_complaints) are not in this
          card.
      - step: Date
        detail: >-
          closed_date converted to Asia/Kolkata, then compared with the range (inclusive). A 22:37 UTC close on 24
          Aug counts on 25 Aug.
      - step: Category
        detail: 'complaint_entity_type: DT/DTR -> DT, FEEDER -> FEEDER, else CONSUMER.'
      - step: Complaint type
        detail: sub_complaint_type (e.g. Meter Not in Communication, RC_DC Site/Field related).
      - step: Daily closures
        detail: COUNT(*) per IST closing day; weekly / monthly by the same date.
      - step: Comparison
        detail: COUNT(*) per project (or discom / zone / circle / division).
    formulas:
      - output: Total closed
        formula: COUNT(*) of non-QC tickets with closed_date (IST) in the range
      - output: Daily closures
        formula: the same per day
      - output: Comparison
        formula: the same per project / geography label
    caveats:
      - >-
          closed_date is almost never filled (a tiny share of non-QC rows, nearly all 'Meter Not in Communication'),
          so the card shows a tiny fraction of real closures -- O&M productivity's closed tickets use
          work_completed_at (QC + non-QC) and are the operational figure.
      - >-
          closed_date and work_completed_at can differ by days or weeks (Triveni's 4 closures on 4 Sep 2026 were
          work-completed on 22 Jul).
      - Project names are stored in mixed case ('Kashi' / 'kashi'); they are compared case-insensitively.
      - >-
          This logic is not in the WFM backend repository -- the definition is inferred from an exact match with the
          dashboard and should be confirmed with the dashboard team.
    sql_recipe: >-
      O&M Ticket Closed Analysis: FROM gmr_wfm_silver.unified_non_qc_complaints WHERE closed_date IS NOT NULL, date
      = CAST(closed_date AT TIME ZONE 'Asia/Kolkata' AS DATE); COUNT(*) by date / project / category
      (complaint_entity_type) / complaint type (sub_complaint_type). For operational closures use
      gold_om_technician_productivity_day_agg.
    followups:
      - O&M ticket closed analysis month wise
      - Ticket closures vs work completed in September 2026
      - Explain the O&M ticket closed analysis KPI
    filters:
      - filter: duration
        values: daily, weekly, monthly
        effect: Closure bucket
      - filter: range
        values: dates
        effect: closed_date (IST), inclusive
      - filter: category
        values: total, consumer, DT, feeder
        effect: complaint_entity_type
      - filter: complaint type
        values: any sub_complaint_type
        effect: sub_complaint_type
      - filter: project / level
        values: as other KPIs
        effect: project / geography
    response:
      - part: Card
        shape: Total closed; daily closures series; comparison by project
    example:
      - step: Range
        result: 25 Aug - 24 Sep 2026, all categories and types
      - step: Daily
        result: 25 Aug 1 (Kashi, closed 22:37 UTC on 24 Aug), 4 Sep 4 (Triveni), 11 Sep 4 (Kashi), 14 Sep 1 (Kashi)
      - step: Total
        result: 10 closed -- Kashi 6, Triveni 4 (vs 17,763 closed by work completion on the productivity card)
  - number: 19
    title: Dashboard headline stats
    kpi_code: dashboard_stats
    backend_kpi_id: 0
    section: Home
    card: >-
      The dashboard home page's headline cards: total installations, installed on the last day, SAT meters and SAT
      %, inventory and remaining stock, journey-completed meters and average journey days, invoice and collection
      headlines, plus the monthly installation / remaining-stock charts.
    aliases:
      - dashboard stats
      - dashboard summary
      - dashboard headline
      - headline stats
      - headline numbers
      - home page
      - executive summary
      - executive dashboard
      - dashboard overview
      - overall summary
      - installed on last day
      - meter installed on last day
      - remaining stock
      - monthly balance
      - inventory monthly balance
    summary: >-
      The **dashboard headline stats** come from one precomputed Postgres row, `gold_dashboard_stats_snapshot`
      (singleton = TRUE), rebuilt by every ETL run and served by GET /api/v1/dashboard/stats. Users scoped to a
      geography get the same figures recomputed from the gold tables for their scope. The monthly remaining-stock
      series comes from `gold_inventory_monthly_balance`, which stores RUNNING totals per place.
    gold_tables:
      - table: gold_dashboard_stats_snapshot
        columns: all headline columns + JSONB series
      - table: gold_inventory_monthly_balance
        columns: >-
          period_start, geography, category, meter_type, cumulative inventory_count / installed_count /
          stock_consumed_count
    silver_tables:
      - table: (via the gold tables)
        columns: installations, inventory, SAT mappings, SAT milestones
        source: SmartEMS reports + SAT uploads
    logic:
      - step: Snapshot
        detail: One row, recomputed from the gold tables at the end of each ETL run (refreshed_at).
      - step: Scoped users
        detail: >-
          A zone / circle / division user gets the same metrics aggregated live from the gold tables for their
          geography (dashboard_stats_service._get_scoped_stats).
      - step: Journey headlines
        detail: >-
          MI only (replacements excluded) -- so average_meter_journey_days is slightly different from KPI 12's
          total journey, which includes replacements.
      - step: Monthly balance
        detail: >-
          Running sums per (project, geography, category, meter type) ordered by month, emitted only for months that
          combination had an event. The balance as of month M is therefore the LATEST row per combination with
          period_start <= M, summed -- summing one month's rows across places undercounts.
    formulas:
      - output: Remaining stock
        formula: cumulative inventory_count - stock_consumed_count
      - output: SAT %
        formula: total SAT meters / SAT-eligible meters x 100
      - output: Average journey days
        formula: SUM(total_journey_days_sum) / SUM(revenue_realized_meter_count), NOT is_replacement
    caveats:
      - The snapshot is as of the last ETL refresh (refreshed_at).
      - Headline invoice / collection counts are meters in invoiced / collected SAT batches, not rupees.
      - Journey headlines exclude replacements; KPI 12 includes them.
      - >-
          gold_inventory_monthly_balance counts are cumulative and only present in months with activity -- always
          take the latest row per place up to the month.
    sql_recipe: >-
      Dashboard headline stats: SELECT the columns FROM public.gold_dashboard_stats_snapshot WHERE singleton (one
      row). For stock balance as of a month M from public.gold_inventory_monthly_balance use the LATEST row per
      (project, discom, zone, circle, division, sub_division, category, meter_type) with period_start <= M (DISTINCT
      ON / ROW_NUMBER), then SUM(inventory_count - stock_consumed_count).
    followups:
      - Show the dashboard summary
      - Monthly installations on the dashboard
      - Remaining stock by meter type
    filters:
      - filter: scope
        values: the caller's geography
        effect: global users read the singleton row
    response:
      - part: GET /api/v1/dashboard/stats
        shape: >-
          the headline fields + monthly_installations, monthly_remaining_stock, remaining_stock_by_meter_type,
          sat_stage_trend, revenue_realized_stage_ageing
    example:
      - step: 25 Sep 2026
        result: >-
          4,189,029 installed (2,050 on the last day), 3,754,199 SAT (93.49%), 4,352,642 received, 116,177 in stock,
          3,288,776 journey-completed at 186.59 days, 3,326,034 invoiced / PMPM-collected meters
