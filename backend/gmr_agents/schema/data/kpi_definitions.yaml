# WFM dashboard KPI definitions -- lineage, detection logic and formulas (loaded by
# schema/kpi_definitions.py into SilverTable / GoldTable / KPI objects).
#
# "{GOLD_JOB}" in any text is replaced by gold_job below when loaded.
# Every entry was verified against the ETL and dashboard code (file:line references
# in document/WFM_KPI_Data_Lineage.md); where the formula doc disagrees with the
# code, the CODE is what is written here.

gold_job: gmr-etl/src/infrastructure/gold_transformer/emr_serverless/jobs/iceberg_gold_transform_emr_job.py

# --------------------------------------------------------------------------- #
# Pipeline overview
# --------------------------------------------------------------------------- #
pipeline_steps:
  - step: 1. SmartEMS API
    detail: >-
      CSV reports pulled by the ETL: installations (DMIQC/CMIQC/CNSQC/FMIQC), complaints (DOMQC/COMQC/FOMQC),
      warehouse stock INVSMM; SAT meter lists are CSVs uploaded via the backend.
  - step: 2. Bronze
    detail: >-
      Raw Parquet on S3, plus lineage columns injected at ingest (discom, sku, warehouse, report, source_file_key).
  - step: 3. Silver (Iceberg)
    detail: >-
      Headers renamed to snake_case, blank strings/invalid dates cleaned, report_category derived from the report
      code, a business-key hash per row, QC1/QC2/QC3 versions consolidated into one row, MERGE INTO
      silver_catalog.silver.<table> (queried here as gmr_wfm_silver.<table>).
  - step: 4. SAT enrichment
    detail: >-
      sat_meter_mappings (meter -> SAT batch, from the uploaded SAT CSVs) and sat_milestones (SAT dates and invoice
      dates, from Postgres milestone_config).
  - step: 5. Gold (Spark)
    detail: >-
      ONE EMR Spark job reads Silver and computes every gold_* read model -- a FULL recompute on every run, no
      incremental logic.
  - step: 6. Postgres publish
    detail: >-
      Each gold table is COPY'd to a stage table, then TRUNCATE + INSERT in one transaction into public.gold_* --
      readers see the old data until the swap commits.
  - step: 7. Dashboard API
    detail: >-
      gmr-backend's kpi_catalog/<kpi>.py runs parameterised SQL over the gold tables (filters, row-level security)
      and shapes the JSON each dashboard card shows.

spark_views:
  - view: installations_raw
    detail: gmr_wfm_silver.unified_installations -- the main meter-installation (MI) population.
  - view: replacement leg
    detail: >-
      unified_complaints rows with old AND new meter serial present AND work_completed_at set: an SM-to-SM
      replacement. mi_date = date(work_completed_at), report_category = complaint_entity_type, latest row per new
      serial, serials already in installations removed.
  - view: installations_all
    detail: >-
      installations_raw (is_replacement=FALSE) UNION the replacement leg (is_replacement=TRUE), plus the latest
      sat_meter_mappings row per serial (mapping's sat_number wins).
  - view: installations
    detail: installations_all WHERE NOT is_replacement -- the MI-only population (KPIs 2 and 3).
  - view: inventory_latest / installations_latest
    detail: Latest-wins row per normalised serial (ORDER BY updated_at DESC, ingested_at DESC, ...).

serial_normalisation: regexp_replace(upper(trim(serial)), '[^A-Z0-9]+', '') -- used for every serial join in the gold job.

warehouse_project_map:
  kashi: AZAMGARH_ZW, BALLIA_SWH, MAU_SWH, CHANDAULI_SWH, GHAZIPUR_SWH, JAUNPUR_SWH, VARANASI_HW
  triveni: PRAYAGRAJ_HW, MIRZAPUR_ZW
  agra: AGRA_HW, ALIGARH WAREHOUSE
  unassigned: any other warehouse

replacement_rule: >-
  An SM-to-SM replacement (new smart meter fitted in place of a failed one) is detected from COMPLAINTS:
  old_meter_serial_number and new_meter_serial_number both non-blank and work_completed_at set. It is added to the
  installation population with is_replacement=TRUE. EXCLUDED from KPIs 1, 2, 3 and KPI 4's denominator; INCLUDED in
  KPIs 5, 6, 7, 8, 9.

silver_tables:
  unified_installations:
    name: unified_installations
    source: 'SmartEMS installation reports: CMIQC (consumer), CNSQC (consumer), DMIQC (DT), FMIQC (feeder)'
    load_style: CMIQC/CNSQC/DMIQC date-windowed (monthly chunks); FMIQC an authoritative snapshot
    business_key: >-
      project + discom + report_category + new_meter_serial_number + mi_date (SHA-256 hash) -- the same serial on a
      different date/report is a separate row
    columns:
      project: raw header 'cluster' (agra / kashi / triveni)
      "discom, zone, circle, division": same-named headers
      sub_division: '''subdivision'' / ''sub_division'' / ''subdivisioncode'' / ''subdivison'''
      mi_date: '''installation date'' / ''installationdate'' / ''midate'' / ''mi date'' -- cleaned to a yyyy-MM-dd DATE'
      new_meter_serial_number: '''new meter serial number'' / ''newmeternumber'' / ''new_meter_number'''
      new_meter_type: '''new meter type'' (meter model code, e.g. 1PH-STSM, 3PLTCTSM, HTCTPTSM)'
      new_meter_make: '''new meter make'' (OEM)'
      technician_name: '''technician name'' / ''technicianname'' / ''technician'''
      agency: '''agency'' (present in Silver but not carried into any gold table)'
      sat_number: '''satnumber'' / ''sat_number'' -- overridden by sat_meter_mappings in gold'
      report_category: >-
        DERIVED from the report code in source_file_key: FMIQC->FEEDER, DMIQC->DTR, CMIQC->CONSUMER, anything else
        (CNSQC)->CONSUMER
    aliases:
      - installation silver
      - installations table
  unified_complaints:
    name: unified_complaints
    source: 'SmartEMS complaint (O&M) reports: COMQC (consumer), DOMQC (DT), FOMQC (feeder)'
    load_style: COMQC/DOMQC date-windowed; FOMQC an authoritative snapshot
    business_key: >-
      complaint_entity_type + discom + sub_complaint_type + first non-empty identifier (new serial, old serial,
      consumer number, feeder)
    columns:
      old_meter_serial_number: '''osm number'' / ''oldmeternumber'' / ''old_meter_number'' -- the meter taken OUT'
      new_meter_serial_number: '''nsm number'' / ''newmeternumber'' / ''new_meter_number'' -- the meter put IN'
      new_meter_type: '''nsm type'''
      sub_complaint_type: '''sub complaint type'' / ''subcomplainttype'' -- the defect text used by KPI 4'
      work_completed_at: '''work completed'' / ''workcompleted'' -- completion timestamp (defective date / replacement mi_date)'
      technician_name: '''technician name'''
      complaint_entity_type: 'DERIVED from the report name: FOM*->FEEDER, DOM*->DTR, COM*->CONSUMER'
    aliases:
      - complaints silver
      - complaint table
  unified_smart_meter_inventory:
    name: unified_smart_meter_inventory
    source: SmartEMS INVSMM (warehouse stock status), fetched per discom x warehouse x SKU
    load_style: >-
      Authoritative snapshot -- every run reconciles the whole table (a meter SmartEMS stops reporting disappears
      from history too)
    business_key: upper(warehouse) + upper(sku) + meter_serial_number
    columns:
      di_date: '''didate'' / ''di date'' -- stock intake (dispatch/DI) date; the age anchor for KPI 7'
      meter_serial_number: '''meterserialnumber'' / ''meter serial number'''
      meter_type: '''metertype'''
      manufacturer: '''manufacturer'' (OEM)'
      "sku, warehouse, discom": injected by the ingest request (not report columns)
      "agency, supervisor, technician_name": custody chain -- gives KPI 7's current_stage
      project: '''cluster'' -- NOT used by gold; gold takes project from the warehouse instead'
    aliases:
      - inventory silver
      - stock table
      - inventory table
  sat_meter_mappings:
    name: sat_meter_mappings
    source: SAT meter-list CSVs uploaded through the dashboard backend ({sat_prefix}/{SATn}/{PROJECT}.csv)
    load_style: >-
      Upsert; serial normalised to A-Z0-9, SAT value upper-cased with whitespace removed; first SAT seen per serial
      wins
    business_key: meter_serial_number
    columns:
      meter_serial_number: normalised meter serial
      sat_number: SAT batch, e.g. SAT-1 ... SAT-13
      project: from the CSV file name (AGRA/KASHI/TRIVENI)
    aliases:
      - sat mapping
  sat_milestones:
    name: sat_milestones
    source: Postgres milestone_config (maintained in the dashboard backend)
    load_style: Upsert
    business_key: project + sat_number (sat_number alone repeats across projects)
    columns:
      sat_date: date the SAT batch was accepted
      lumpsum_invoice_date: set once the lumpsum invoice for that SAT batch is raised
      pmpm_invoice_date: set once the PMPM invoice for that SAT batch is raised
    aliases:
      - sat milestone

gold_tables:
  gold_mi_installation_day_agg:
    name: gold_mi_installation_day_agg
    built_by: _installation_day_sql() in {GOLD_JOB} (lines 759-873)
    sources:
      - gmr_wfm_silver.unified_installations (via installations_all)
      - gmr_wfm_silver.unified_complaints (replacement leg, flagged is_replacement)
      - gmr_wfm_silver.sat_meter_mappings (sat_number override)
      - 'gmr_wfm_silver.unified_smart_meter_inventory (OEM fallback: latest manufacturer per serial)'
    grain: >-
      one row per installation day x project x geography x OEM x category x meter type x SAT flags x is_replacement;
      meter_count = count(*) of Silver installation rows in that combination
    used_by:
      - 1
      - 4
      - 9
    columns:
      "period_start / period_end": cast(mi_date AS date) -- the installation date (both equal on the day table)
      "project, discom, zone, circle, division, sub_division": lower(trim(...)) of the Silver values
      oem: coalesce(new_meter_make, inventory.manufacturer, 'Unknown')
      progress_category: >-
        from report_category: CONSUMER->CONSUMER, FEEDER->FEEDER, DT or DTR->DT, else NULL -- the category KPI 1 (MI
        Progress) uses
      inventory_category: >-
        report_category if valid, else new_meter_type 3PLTCTSM->DT, HTCTPTSM->FEEDER, else CONSUMER -- used by the
        SAT/ageing KPIs
      progress_meter_type: >-
        narrow map of new_meter_type: 1PH-STSM/NSM1-PH/NBSM-1PH->1PH-Consumer_meter;
        3PH-STSM/NSM3-PH/NBSM-3PH->3PH-Consumer_meter; 3PLTCTSM->LTCT-Consumer_meter; HTCTPTSM->HTCT-Consumer_meter;
        anything else NULL
      inventory_meter_type: extended map (adds 3PNMLTSM/3PNBLTSM->3PH, 3LTTOUSM/LTNBTOUS->LTCT, HT-TOUSM/HTNBTOUS->HTCT); else NULL
      has_meter_serial: new_meter_serial_number is not blank
      is_replacement: TRUE for SM-to-SM replacement rows that came from unified_complaints
      "has_sat_number / sat_is_null": sat_number present / absent
      is_non_sat_pending: sat_number blank OR equals 'SATPENDING' (whitespace removed, upper-cased)
      sat_stage: 'sat_number normalised: ''SAT-1''..''SAT-13'' -> 1..13, anything else NULL'
      meter_count: count(*) -- number of Silver installation rows (installation events, not distinct meters)
  gold_mi_installation_month_agg:
    name: gold_mi_installation_month_agg
    built_by: _write_period_outputs() month roll-up of gold_mi_installation_day_agg in {GOLD_JOB} (lines 2825-2839)
    sources:
      - gold_mi_installation_day_agg (same columns)
    grain: >-
      one row per month x the same dimensions; period_start = first of month, period_end = last day, meter_count =
      sum(meter_count)
    used_by:
      - 1
      - 4
    columns:
      meter_count: sum of the day table's meter_count for that month
      "period_start / period_end": trunc(date,'MM') / last_day(date)
  gold_mi_technician_productivity_day_agg:
    name: gold_mi_technician_productivity_day_agg
    built_by: _mi_technician_day() in {GOLD_JOB} (lines 1303-1384)
    sources:
      - gmr_wfm_silver.unified_installations via the MI-only `installations` view (NO replacements)
    grain: >-
      one row per date x project x geography x technician_name x category x meter_type, plus rows with
      category='ALL' (no category split); rows need mi_date, a serial and a technician_name
    used_by:
      - 2
      - 3
    columns:
      technician_name: trimmed Silver technician_name -- the unit productivity is measured on
      category: 'from new_meter_type: 3PLTCTSM->DT, HTCTPTSM->FEEDER, else CONSUMER; ''ALL'' = rollup rows'
      meter_type: extended meter-type map (1PH/3PH/LTCT/HTCT-Consumer_meter)
      installation_count: count(*) of installations
      technician_day_count: '1 on every day row (month table: number of day rows)'
      active_days: '1 on every day row (month table: number of day rows)'
  gold_mi_technician_productivity_month_agg:
    name: gold_mi_technician_productivity_month_agg
    built_by: month roll-up of gold_mi_technician_productivity_day_agg
    sources:
      - gold_mi_technician_productivity_day_agg
    grain: one row per month x the same dimensions
    used_by:
      - 2
    columns:
      installation_count: SUM over the month
      "technician_day_count / active_days": count(*) of day rows for that technician/combination
  gold_mi_productivity_trend_month_agg:
    name: gold_mi_productivity_trend_month_agg
    built_by: _mi_productivity_trend() in {GOLD_JOB} (lines 1387-1491)
    sources:
      - gold_mi_technician_productivity_day_agg (KPI 2's day grain) -> unified_installations
    grain: >-
      a pre-aggregated cube: one row per month x project ('ALL' or real) x filter scope (filter_level/filter_label)
      x comparison scope (aggregate_level/label) x category ('ALL' or real) x meter_type
    used_by:
      - 3
    columns:
      "filter_level / filter_label": 'the WHERE-scope: ''all''/''zone''/''circle''/''division''/''sub_division'' and its value'
      "aggregate_level / label": 'the GROUP-BY scope: ''all''/''project''/''discom''/''zone''/''circle''/''division''/''sub_division'''
      total_installations: sum of installations
      active_days: count(DISTINCT mi_date) in the group
      active_technicians: count(DISTINCT technician_name) in the group
      technician_day_count: count of distinct (technician, date) pairs in the group
  gold_meter_defect_event_day_agg:
    name: gold_meter_defect_event_day_agg
    built_by: _defect_fact() + _defect_day() in {GOLD_JOB} (lines 1655-1802)
    sources:
      - gmr_wfm_silver.unified_complaints (completed replacement complaints)
      - gmr_wfm_silver.unified_smart_meter_inventory (OEM / meter type of the OLD meter)
      - gmr_wfm_silver.unified_installations (fallback OEM / meter type)
    grain: >-
      one row per defective date x project x geography x category x meter_type x defective_type x
      detailed_defective_type x OEM
    used_by:
      - 4
    columns:
      period_start: cast(work_completed_at AS date) -- the defective date
      category: 'complaint_entity_type: DT/DTR->DT, FEEDER->FEEDER, else CONSUMER'
      meter_type: >-
        consumer rows only: coalesce(inventory type, installation type, complaint new_meter_type), extended map;
        NULL otherwise
      defective_type: >-
        classified from cleaned sub_complaint_type: Meter Burnt / Meter Faulty / Meter Tampered / Meter Stop / Meter
        Bypass / Others
      detailed_defective_type: 'the cleaned sub_complaint_type text itself: upper(trim(...)) with quotes and non-breaking spaces removed'
      oem: coalesce(inventory.manufacturer, installation.new_meter_make, 'Unknown') of the OLD meter
      defect_count: count(*) of replacement complaint rows
      defect_rate_numerator_count: count of rows where defective_type = 'Meter Faulty' (defect-rate numerator)
  gold_meter_inventory_event_day_agg:
    name: gold_meter_inventory_event_day_agg
    built_by: _inventory_day() in {GOLD_JOB} (lines 1081-1255)
    sources:
      - gmr_wfm_silver.unified_smart_meter_inventory (inventory_latest)
      - gmr_wfm_silver.unified_installations + replacement leg (installations_latest, replacements INCLUDED)
      - gmr_wfm_silver.unified_complaints (old meters scrapped in a replacement = disposals)
    grain: >-
      one row per event date x project x discom x zone x circle x division x sub_division x category x meter_type
    used_by:
      - 5
      - 6
    columns:
      inventory_count: 1 per meter on its DI date (received into stock)
      installed_count: 1 per meter on its MI date (installed)
      stock_consumed_count: >-
        1 on the MI date if the installed meter had an inventory row, plus 1 on the disposal date for an uninstalled
        meter scrapped as an old meter in a replacement
      project: installation project if installed, else warehouse -> project map
      "zone, circle, division, sub_division": from the INSTALLATION only -- NULL for meters still in stock
      category: >-
        inventory side: 3PLTCTSM/HTCTPTSM AND sku NOT LIKE '%CON%' -> DT/FEEDER, else CONSUMER; falls back to the
        installation category
      meter_type: coalesce(inventory, installation, 'OTHER-Consumer_meter'); DT/FEEDER stock keeps raw 3PLTCTSM/HTCTPTSM
  gold_meter_inventory_event_month_agg:
    name: gold_meter_inventory_event_month_agg
    built_by: month roll-up of gold_meter_inventory_event_day_agg
    sources:
      - gold_meter_inventory_event_day_agg
    grain: one row per month x the same dimensions (the three counts summed)
    used_by:
      - 5
      - 6
    columns:
      "inventory_count / installed_count / stock_consumed_count": sums over the month
  gold_inventory_unutilized_stock_snapshot:
    name: gold_inventory_unutilized_stock_snapshot
    built_by: _unutilized_stock() in {GOLD_JOB} (lines 1805-1884)
    sources:
      - gmr_wfm_silver.unified_smart_meter_inventory (inventory_latest)
      - gmr_wfm_silver.unified_installations + replacement leg (serials that were installed)
      - gmr_wfm_silver.unified_complaints (scrapped old meters)
    grain: >-
      one row per DI date x project x warehouse x current_stage x category x meter_type x SKU x OEM, counting
      inventory meters that were never installed and never scrapped
    used_by:
      - 5
      - 6
      - 7
    columns:
      inventory_date: cast(di_date AS date) -- stock intake date; age = today - inventory_date
      warehouse: coalesce(warehouse, 'UNASSIGNED')
      project: warehouse -> project map
      current_stage: >-
        technician_name present -> 'technician', else supervisor -> 'supervisor', else agency -> 'agency', else
        'warehouse'
      "sku / oem": coalesce(sku,'UNKNOWN') / coalesce(manufacturer,'UNKNOWN')
      stock_count: count(*) of unutilized meters
  gold_mi_sat_invoice_day_agg:
    name: gold_mi_sat_invoice_day_agg
    built_by: _mi_sat_invoice_sql() in {GOLD_JOB} (lines 888-954)
    sources:
      - gmr_wfm_silver.unified_installations + replacement leg (replacements INCLUDED)
      - gmr_wfm_silver.sat_meter_mappings (SAT number per meter)
      - gmr_wfm_silver.sat_milestones (lumpsum / PMPM invoice dates)
    grain: one row per installation date x project x geography x category x meter_type x SAT stage x invoice flags
    used_by:
      - 8
      - 12
    columns:
      sat_stage: 'sat_number normalised: ''SAT-1''..''SAT-13'' -> 1..13, anything else NULL (= not SAT-done)'
      has_lumpsum_invoice: sat_milestones.lumpsum_invoice_date IS NOT NULL for that project + SAT
      has_pmpm_invoice: sat_milestones.pmpm_invoice_date IS NOT NULL for that project + SAT
      meter_count: count(*) of installation rows
  gold_mi_sat_invoice_snapshot:
    name: gold_mi_sat_invoice_snapshot
    built_by: _mi_sat_invoice_snapshot() in {GOLD_JOB} (lines 969-1018)
    sources:
      - gold_mi_sat_invoice_day_agg
      - Postgres sat_eligibility_config (per-project SAT eligibility cutoff date, read at ETL time)
    grain: >-
      the day table with the date dropped: one row per project x geography x category x meter_type x sat_stage x
      has_lumpsum_invoice x has_pmpm_invoice x is_sat_eligible
    used_by:
      - 8
      - 12
    columns:
      is_sat_eligible: coalesce(mi_date <= that project's eligibility_cutoff_date, false) -- computed at ETL refresh time
      sat_stage: 1..13 or NULL (NULL = not SAT-done)
      meter_count: sum of meters
  gold_non_sat_ageing_snapshot:
    name: gold_non_sat_ageing_snapshot
    built_by: _non_sat_ageing_snapshot() in {GOLD_JOB} (lines 1021-1077)
    sources:
      - 'gold_mi_installation_day_agg (in-job view: unified_installations + replacements + SAT mapping)'
      - Postgres sat_eligibility_config (per-project cutoff)
    grain: >-
      one row per project x geography x category x meter_type x age_key, for Non-SAT-pending meters installed
      on/before the project's SAT eligibility cutoff
    used_by:
      - 9
    columns:
      age_key: >-
        datediff(ETL run date in Asia/Kolkata, mi_date): <=30 age_0_30, <=60 age_31_60, <=90 age_61_90, <=120
        age_91_120, else age_120_plus -- frozen at ETL refresh time
      "category / meter_type": inventory_category / inventory_meter_type of the installation
      meter_count: sum of Non-SAT-pending meters
  gold_meter_journey_stage_agg:
    name: gold_meter_journey_stage_agg
    built_by: _meter_journey() in {GOLD_JOB} (lines 1906-2014)
    sources:
      - 'gmr_wfm_silver.unified_smart_meter_inventory (inventory_latest: di_date + the 4 handoff timestamps)'
      - >-
          gmr_wfm_silver.unified_installations + replacement leg (installations_latest, replacements INCLUDED;
          geography + sat_number)
      - gmr_wfm_silver.sat_meter_mappings (sat_number override)
      - gmr_wfm_silver.sat_milestones (sat_date, pmpm_collection_date per project + SAT batch)
    grain: >-
      one row per project x geography x installation_year x category x meter_type x is_replacement, holding SUMS of
      elapsed days per stage and meter counts (not averages)
    used_by:
      - 10
    columns:
      installation_year: year(inventory installed_ts) -- NOT the installation report's mi_date
      category: >-
        inventory meter_type + sku: 3PLTCTSM AND sku NOT LIKE '%CON%' -> DT, HTCTPTSM AND sku NOT LIKE '%CON%' ->
        FEEDER, else CONSUMER
      meter_type: >-
        consumer: 1PH/3PH/LTCT/HTCT/OTHER-Consumer_meter (unknown types -> OTHER); DT/FEEDER rows keep the raw
        3PLTCTSM / HTCTPTSM
      inventory_to_agency_days_sum: sum of (gmr_to_agency_ts - di_date) in fractional days
      agency_to_supervisor_days_sum: sum of (agency_to_sup_ts - gmr_to_agency_ts) in days
      supervisor_to_technician_days_sum: sum of (sup_to_tech_ts - agency_to_sup_ts) in days
      technician_to_installation_days_sum: sum of (installed_ts - sup_to_tech_ts) in days
      installation_to_sat_days_sum: sum of (sat_date - installed_ts) over meters whose SAT batch has a sat_date
      sat_to_revenue_realized_days_sum: sum of (pmpm_collection_date - sat_date) over revenue-realized meters
      total_journey_days_sum: sum of (pmpm_collection_date - di_date) over revenue-realized meters
      meter_count: count(*) of eligible meters (all 5 inventory timestamps present and in order, and installed)
      sat_meter_count: count(sat_date) -- denominator of installation_to_sat
      revenue_realized_meter_count: count(pmpm_collection_date) -- denominator of sat_to_revenue_realized and total_journey
      is_replacement: >-
        TRUE for SM-to-SM replacement installs; KPI 12 includes them, the dashboard stats journey cards exclude them
  gold_dashboard_stats_snapshot:
    name: gold_dashboard_stats_snapshot
    built_by: _dashboard_stats() in {GOLD_JOB} (lines 2394-2670)
    sources:
      - gold_mi_installation_day_agg (installations, last-day installs)
      - gold_mi_sat_invoice_snapshot (SAT, SAT %)
      - gold_meter_inventory_event_month_agg / gold_inventory_monthly_balance (inventory, remaining stock)
      - gold_meter_journey_stage_agg (journey, MI-only)
      - installations_all + sat_milestones (invoice / collection headlines)
    grain: >-
      ONE row (singleton = TRUE) of headline numbers plus JSONB series, recomputed every ETL run (refreshed_at);
      read by GET /api/v1/dashboard/stats
    used_by:
      - 19
    columns:
      total_meter_installations: MI-Progress total (no replacements)
      meter_installed_on_last_day: installations on the latest installation day in the data
      total_sat_meters: meters with a parsable SAT-1..SAT-13 number
      sat_percent: SAT meters / SAT-eligible installed meters x 100
      total_current_inventory_count: meters ever received into stock (cumulative inventory)
      total_current_remaining_stock_count: meters still in stock (received - consumed)
      total_journey_completed_meters: revenue-realized meters in the journey table (MI only, no replacements)
      average_meter_journey_days: total journey days / revenue-realized meters (MI only)
      total_invoice_done_meters: installed meters whose SAT batch has a lumpsum or PMPM invoice date
      "total_lumpsum_invoice_done_meters / total_pmpm_invoice_done_meters": lumpsum / PMPM invoiced meters
      total_pmpm_collection_done_meters: meters whose SAT batch has a PMPM collection date
      "monthly_installations / monthly_remaining_stock": JSONB [{month, count}] series for the home-page charts
      remaining_stock_by_meter_type: JSONB [{meter_type, label, count}] for the Supply card hover
      sat_stage_trend: JSONB [{sat_number, count}]
      revenue_realized_stage_ageing: JSONB [{stage, meter_count, average_days}] -- journey stages, MI only
  gold_inventory_monthly_balance:
    name: gold_inventory_monthly_balance
    built_by: _inventory_monthly_balance() in {GOLD_JOB} (lines 1259-1301)
    sources:
      - gold_meter_inventory_event_month_agg
    grain: >-
      one row per month x project x geography x category x meter_type WHERE that combination had an event that
      month; the three counts are RUNNING (cumulative) totals up to that month
    used_by:
      - 19
    columns:
      inventory_count: cumulative meters received up to period_start's month
      installed_count: cumulative meters installed
      stock_consumed_count: cumulative meters consumed from stock (installs with a stock record + scrapped)
      "period_start / period_end": the month
  gold_om_open_ageing_snapshot:
    name: gold_om_open_ageing_snapshot
    built_by: _om_open_ageing_snapshot() in {GOLD_JOB} (lines 1586-1671)
    sources:
      - >-
          gmr_wfm_silver.unified_active_complaints (EVERY row with a complaint_created_date -- no status filter, no
          de-duplication)
      - meter_type_lookup (inventory, then smart-meter asset table, by old_meter_serial_number)
    grain: >-
      one row per project x geography x category x meter_type x complaint_source x complaint_status x complaint_type
      x age_key, ticket_count = count(*); age frozen at the ETL run date
    used_by:
      - 17
    columns:
      age_key: >-
        datediff(ETL run date, complaint_created_date): <=7 age_0_7, <=15 age_8_15, <=30 age_16_30, <=60 age_31_60,
        else age_60_plus
      complaint_source: >-
        complaint_by contains '1912' -> '1912'; AUTO / SYSTEM / HES / MDM (or containing AUTO / SYSTEM) -> 'AUTO';
        anything else -> 'MANUAL'
      complaint_status: >-
        upper(trim(complaint_status)), blank -> 'OPEN' (UNASSIGNED, ASSIGNED, CAN NOT ATTEND, ESCALATED TO DISCOM,
        WORK IN PROGRESS, RESOLVED, ACCEPTED, ON HOLD)
      complaint_type: upper(trim(complaint_type)), blank -> 'OTHER'
      category: 'complaint_entity_type: DT/DTR -> DT, FEEDER -> FEEDER, else CONSUMER'
      meter_type: from meter_type_lookup by old_meter_serial_number
      ticket_count: count(*) of active-complaint rows
  gold_om_technician_productivity_day_agg:
    name: gold_om_technician_productivity_day_agg
    built_by: _om_technician_day() in {GOLD_JOB} (lines 1495-1583)
    sources:
      - gmr_wfm_silver.unified_complaints (QC closed complaints)
      - gmr_wfm_silver.unified_non_qc_complaints (non-QC closed complaints)
      - meter_type_lookup (inventory, then smart-meter asset table, by old_meter_serial_number)
    grain: >-
      one row per closing day x project x geography x technician_name x category x meter_type, plus 'ALL' rows
      (category = 'ALL', meter_type NULL) summed across categories; only rows with work_completed_at and a
      technician_name
    used_by:
      - 15
    columns:
      period_start: cast(work_completed_at AS date) -- the day the complaint was closed
      technician_name: trimmed technician_name (a NAME, not an id -- two people with one name merge)
      category: 'complaint_entity_type: DT/DTR -> DT, FEEDER -> FEEDER, else CONSUMER; ''ALL'' = rollup rows'
      meter_type: 'from meter_type_lookup by old_meter_serial_number: 1PH/3PH/LTCT/HTCT/OTHER-Consumer_meter'
      complaint_count: count(*) of closed complaints
      technician_day_count: >-
        1 on every row -- so SUM() counts ROWS (technician x day x geography x category x meter type), not distinct
        technician-days
      active_days: 1 on every row
  gold_om_technician_productivity_month_agg:
    name: gold_om_technician_productivity_month_agg
    built_by: month roll-up of gold_om_technician_productivity_day_agg (_write_period_outputs)
    sources:
      - gold_om_technician_productivity_day_agg
    grain: >-
      one row per month x the same dimensions; complaint_count summed, technician_day_count / active_days = number
      of day rows
    used_by:
      - 15
    columns:
      complaint_count: SUM over the month
      "technician_day_count / active_days": count of day rows in the month
  gold_revenue_ageing_snapshot:
    name: gold_revenue_ageing_snapshot
    built_by: _revenue_ageing_sql() in {GOLD_JOB} (lines 2084-2170)
    sources:
      - gmr_wfm_silver.unified_installations + replacement leg (installations_latest, with a sat_number)
      - gmr_wfm_silver.sat_meter_mappings (sat_number override)
      - 'gmr_wfm_silver.sat_milestones (INNER join: sat_date NOT NULL and pmpm_collection_date IS NULL)'
      - 'gmr_wfm_silver.unified_smart_meter_inventory (LEFT join: category / meter_type, installation fallback)'
    grain: >-
      one row per sat_date x project x geography x category x meter_type, counting certified meters whose SAT batch
      has no PMPM collection date -- NO age band is stored; bands are computed at query time
    used_by:
      - 14
    columns:
      sat_date: the SAT batch's certification date -- the age anchor (age = today in IST - sat_date)
      category: >-
        coalesce(inventory SKU rule, installation fallback): report_category (CONSUMER / FEEDER / DT, DTR -> DT),
        else 3PLTCTSM -> DT, HTCTPTSM -> FEEDER, else CONSUMER
      meter_type: >-
        coalesce(inventory type, installation type): 1PH/3PH/LTCT/HTCT/OTHER-Consumer_meter; DT / FEEDER rows may
        keep raw 3PLTCTSM / HTCTPTSM
      outstanding_count: count(*) of earned-but-uncollected meters
  gold_meter_installation_pending_stage_snapshot:
    name: gold_meter_installation_pending_stage_snapshot
    built_by: _installation_pending_stage() in {GOLD_JOB} (lines 2017-2081)
    sources:
      - >-
          gmr_wfm_silver.unified_smart_meter_inventory (inventory_latest: the 4 handoff timestamps, warehouse,
          meter_type, sku)
      - >-
          gmr_wfm_silver.unified_installations + replacement leg (installations_all serials -- dropped as installed)
    grain: >-
      one row per project x warehouse x oem x category x meter_type x current_stage, counting inventory meters that
      are NOT installed yet
    used_by:
      - 11
    columns:
      current_stage: >-
        furthest handoff reached: serial in installations OR installed_ts set -> 'installed' (dropped); else
        sup_to_tech_ts -> 'technician'; else agency_to_sup_ts -> 'supervisor'; else gmr_to_agency_ts -> 'agency';
        else 'inventory'
      project: >-
        from the WAREHOUSE (VARANASI_HW/AZAMGARH_ZW/BALLIA/MAU/CHANDAULI/GHAZIPUR/JAUNPUR -> kashi,
        PRAYAGRAJ_HW/MIRZAPUR_ZW -> triveni, AGRA_HW/ALIGARH WAREHOUSE -> agra, else 'unassigned')
      warehouse: coalesce(nullif(trim(warehouse), ''), 'UNASSIGNED')
      oem: coalesce(nullif(trim(manufacturer), ''), 'UNKNOWN')
      category: >-
        inventory meter_type + sku: 3PLTCTSM AND sku NOT LIKE '%CON%' -> DT, HTCTPTSM AND sku NOT LIKE '%CON%' ->
        FEEDER, else CONSUMER
      meter_type: 1PH/3PH/LTCT/HTCT/OTHER-Consumer_meter; DT/FEEDER keep raw 3PLTCTSM / HTCTPTSM
      meter_count: count(*) of uninstalled inventory meters
  gold_meter_revenue_pending_stage_snapshot:
    name: gold_meter_revenue_pending_stage_snapshot
    built_by: _revenue_pending_stage_sql() in {GOLD_JOB} (lines 2185-2246)
    sources:
      - 'gmr_wfm_silver.unified_installations + replacement leg (installations_latest: geography, sat_number)'
      - 'gmr_wfm_silver.unified_smart_meter_inventory (INNER join: category / meter_type)'
      - gmr_wfm_silver.sat_meter_mappings (sat_number override)
      - 'gmr_wfm_silver.sat_milestones (LEFT join on project + sat_number: pmpm_collection_date)'
    grain: >-
      one row per project x geography x category x meter_type x current_stage, counting installed meters whose PMPM
      revenue is NOT collected
    used_by:
      - 11
    columns:
      current_stage: >-
        sat_number parses as SAT-1..SAT-13 -> 'sat_done_revenue_pending'; anything else (blank, 'SAT PENDING',
        unrecognised) -> 'installation_done_sat_pending'. Kept only when the batch's pmpm_collection_date IS NULL
        (or no milestone row)
      project: from the INSTALLATION (lower-case)
      category: inventory meter_type + sku rule (same as the installation-pending snapshot), stored upper-case
      meter_type: 1PH/3PH/LTCT/HTCT/OTHER-Consumer_meter; DT/FEEDER keep raw 3PLTCTSM / HTCTPTSM
      meter_count: count(*) of installed, revenue-not-realized meters

kpis:
  - number: 1
    title: MI-Progress
    kpi_code: mi_progress
    backend_kpi_id: 1
    section: MI
    card: Meter Installation progress tracking -- total & category wise, trend and comparison.
    aliases:
      - mi progress
      - mi-progress
      - meter installation progress
      - installation progress
      - mi installation progress
      - total progress
      - mi count
      - mi counts
      - meter installation count
      - meters installed
      - installed meters
      - meter installations
      - kpi 1
      - kpi1
      - kpi-1
      - meter installation progress tracking
      - mi progress card
      - installation trend
      - mi trend
      - mi comparison
    summary: >-
      **MI-Progress** counts meter installations. It sums `meter_count` from Postgres `gold_mi_installation_day_agg`
      (and `gold_mi_installation_month_agg` for whole months), keeping only rows that have a meter serial, a
      resolved `progress_category` (CONSUMER / FEEDER / DT) and are NOT SM-to-SM replacements. That gold table is
      built by the ETL from Silver `unified_installations` (SmartEMS CMIQC/CNSQC/DMIQC/FMIQC reports), with
      replacement rows added from `unified_complaints` only so they can be flagged and excluded, and OEM taken from
      `unified_smart_meter_inventory` as a fallback.
    gold_tables:
      - table: gold_mi_installation_day_agg
        columns: >-
          period_start, project, discom, zone, circle, division, sub_division, progress_category,
          progress_meter_type, inventory_meter_type (use this one for meter type -- extended map, no Other), oem,
          has_meter_serial, is_replacement, meter_count
      - table: gold_mi_installation_month_agg
        columns: same columns -- read for whole months when duration = monthly
    silver_tables:
      - table: unified_installations
        columns: >-
          mi_date, project, discom, zone, circle, division, sub_division, report_category, new_meter_serial_number,
          new_meter_type, new_meter_make
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: >-
          old/new_meter_serial_number, work_completed_at, complaint_entity_type (replacement rows -- excluded by
          this KPI)
        source: COMQC, DOMQC, FOMQC
      - table: unified_smart_meter_inventory
        columns: meter_serial_number, manufacturer (OEM fallback)
        source: INVSMM
    logic:
      - step: Flow
        detail: >-
          SmartEMS installation reports (DMIQC/CMIQC/CNSQC/FMIQC) -> Silver unified_installations (+
          unified_complaints, + unified_smart_meter_inventory) -> Spark _installation_day_sql() -> Postgres
          gold_mi_installation_day_agg / _month_agg -> backend kpi_catalog/mi_progress.py -> API JSON -> card.
      - step: Silver
        detail: >-
          report_category is NOT a report column: the Silver transform derives it from the file name
          (source_file_key) with a regex -- CMIQC/CNSQC->CONSUMER, DMIQC->DTR, FMIQC->FEEDER.
      - step: Silver dedup
        detail: >-
          Row identity = project + discom + report_category + new_meter_serial_number + mi_date, hashed into
          business_key_hash. Repeat arrivals (QC1/QC2/QC3 versions, re-ingested files) keep one row; the same serial
          with a different date or report stays a separate row.
      - step: Replacement leg
        detail: >-
          _replacement_installations_sql (GOLD:500-579): a complaint is a replacement when old_meter_serial_number
          and new_meter_serial_number are non-blank and work_completed_at IS NOT NULL. mi_date =
          date(work_completed_at); latest complaint per new serial kept; serials already in installations dropped;
          every remaining row gets is_replacement=TRUE.
      - step: installations_all
        detail: >-
          installations (is_replacement=FALSE) UNION replacements (is_replacement=TRUE), plus a SAT-number join that
          KPI 1 does not use.
      - step: OEM lookup
        detail: >-
          inventory_oem = latest manufacturer per serial from inventory; serials normalised with
          regexp_replace(upper(trim(serial)), '[^A-Z0-9]+', '') so 'ab-123 ' matches 'AB123'.
      - step: Gold build
        detail: >-
          installations_all left-joined to inventory_oem; WHERE mi_date IS NOT NULL; GROUP BY every dimension;
          meter_count = count(*). One gold row = one day x one combination of geography / category / meter type /
          OEM / flags.
      - step: Category
        detail: progress_category = report_category mapped CONSUMER / FEEDER / DT (DTR->DT); unknown -> NULL.
      - step: Month table
        detail: >-
          gold_mi_installation_month_agg (GOLD:2825-2839): period_start = trunc(period_start,'MM'), period_end =
          last_day, meter_count = sum(meter_count) -- a 2-year monthly query reads ~24 rows per combination instead
          of ~730.
      - step: Postgres publish
        detail: >-
          Every ETL run recomputes the whole table from Silver, writes Parquet, then TRUNCATE + INSERT in one
          transaction. Nothing incremental: the card changes only after an ETL refresh, and a formula change needs
          no backfill.
      - step: Eligibility
        detail: >-
          has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement, plus the request's filters
          (project, category, geography, oem) and row-level security (a user scoped to one zone gets AND
          LOWER(n.zone) = '<their zone>' appended).
      - step: Date range
        detail: >-
          Up to 4 UNION ALL legs, each with AND NOT n.is_replacement: partial_start_days (day table, from -> end of
          from's month, only if from is not the 1st); full_months (only whole months lying fully inside [from, to]
          -- read from the month table when duration=monthly, else from day rows); partial_end_days (day table,
          start of to's month -> to, only if to is not month-end AND to is in a later month than from). 'to' is
          inclusive. E.g. 2026-01-15 -> 2026-04-10 monthly = Jan 15-31 day rows + Feb, Mar month rows + Apr 1-10 day
          rows.
      - step: Buckets
        detail: >-
          daily = the day; weekly = month-anchored (not ISO) weeks, month_start + floor((day-1)/7)*7: days 1-7 ->
          1st, 8-14 -> 8th, 15-21 -> 15th, 22-28 -> 22nd, 29-31 -> 29th; monthly = 1st of month.
      - step: Comparison label
        detail: >-
          Upper-cased. level=discom with no project selected -> project (AGRA/KASHI/TRIVENI); level=discom with a
          project -> discom; level=zone/circle/division/sub_division/oem -> that column. Blank or null labels are
          dropped.
    formulas:
      - output: CONSUMER / FEEDER / DT
        formula: SUM(meter_count) FILTER (WHERE progress_category = 'X')
      - output: 1PH/3PH/LTCT/HTCT-Consumer_meter
        formula: >-
          SUM(meter_count) FILTER (WHERE inventory_meter_type = 'X') (consumer-only requests; the ETL's extended
          type map)
      - output: total (per period / label)
        formula: SUM(meter_count)
      - output: trend
        formula: the sums above grouped by period bucket (daily / month-anchored weekly / monthly)
      - output: comparison
        formula: the same sums grouped by comparison label; blank or null labels dropped
      - output: total_progress
        formula: sum of the trend totals (computed in Python)
    caveats:
      - >-
          Counts installation ROWS (count(*) of Silver rows), not COUNT(DISTINCT serial) -- the documented
          'duplicate-safe' fallback is not implemented.
      - >-
          Replacements are excluded, so MI vs SAT's total_mi is larger than MI-Progress by exactly the replacement
          count.
      - >-
          Category comes from WHICH REPORT the row came from, not the meter type (a 3PLTCTSM meter in a CMIQC report
          is CONSUMER here but DT in the productivity KPIs).
      - >-
          Consumer meter types use inventory_meter_type, the ETL's extended map: 3PNMLTSM/3PNBLTSM count as 3PH,
          3LTTOUSM/LTNBTOUS as LTCT and HT-TOUSM/HTNBTOUS as HTCT, so the four types add up to the consumer total
          and there is no 'Other' type. The dashboard's MI-Progress card uses the narrow progress_meter_type map, so
          its 3PH / LTCT / HTCT figures are lower by exactly those codes.
      - >-
          A range that starts on the 1st and ends mid-month in the SAME month (e.g. 2026-09-01 -> 2026-09-15)
          matches none of the 4 date legs and returns no rows.
      - '''to'' is inclusive; the dashboard default range is 2024-06-01 to 2026-06-01 when no dates are sent.'
      - If one serial appears with two different mi_date values, or in two reports, it is counted twice.
      - Numbers change only after the ETL gold refresh, which recomputes everything.
      - >-
          Stale ETL comment: GOLD:837-838 says replacements are excluded 'from the defect-rate denominator only' --
          out of date, mi_progress.py excludes them in all four date legs.
    sql_recipe: >-
      MI-Progress (dashboard KPI 1): FROM public.gold_mi_installation_day_agg (or
      public.gold_mi_installation_month_agg for whole-month questions), measure SUM(meter_count), and ALWAYS include
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement. Category breakdown = GROUP BY
      progress_category (values 'CONSUMER','FEEDER','DT'); consumer meter-type breakdown (when the question is
      consumer-only) = GROUP BY inventory_meter_type (values
      '1PH-Consumer_meter','3PH-Consumer_meter','LTCT-Consumer_meter','HTCT-Consumer_meter'). Date filter on
      period_start (inclusive range). Weekly trend uses month-anchored weeks, not ISO: date_trunc('month',
      period_start)::date + (floor((extract(day FROM period_start) - 1) / 7) * 7)::int. A comparison with no project
      named groups by project; with a project named, by discom. Project/geography/oem values are stored lower-case
      -- compare with LOWER(). "How many consumers / DT or DTR or transformer / feeders are installed" means
      installed METERS of that category: the same table and eligibility with progress_category = 'CONSUMER' / 'DT' /
      'FEEDER' (DTR is stored as 'DT'), and "how many meters are installed" is the same query with no category
      filter -- so the three categories always add up to the total. Never answer these from
      gold_meter_inventory_event_*, gold_dashboard_stats_snapshot or any MDM asset table.
    followups:
      - What is the MI progress by category for kashi?
      - Which zone has the highest MI progress?
      - Explain the MI-Productivity per team KPI
    filters:
      - filter: duration
        values: daily (default), weekly, monthly
        effect: Trend bucket size
      - filter: from / to
        values: dates; default 2024-06-01 -> 2026-06-01
        effect: Date range, inclusive
      - filter: project
        values: agra, kashi, triveni, All Project
        effect: n.project IN (...)
      - filter: category
        values: all, consumer, feeder, dt, 1ph/3ph/ltct/htct-consumer_meter
        effect: LOWER(progress_category) IN (...) OR LOWER(progress_meter_type) IN (...)
      - filter: discom / zone / circle / division / sub_division
        values: any name
        effect: LOWER(col) = LOWER(value)
      - filter: oem
        values: any
        effect: LOWER(n.oem) = LOWER(value)
      - filter: level
        values: discom (default), zone, circle, division, sub_division, oem
        effect: Picks the comparison dimension
      - filter: row-level security
        values: automatic
        effect: A user scoped to one zone gets AND LOWER(n.zone) = '<their zone>'
    response:
      - part: Parts
        shape: >-
          total_progress (grand total for the range), trend (per day/week/month), comparison (per geography label or
          OEM).
      - part: Normal request
        shape: 'category = all / feeder / dt / mixed: each item has CONSUMER, FEEDER, DT, total.'
      - part: Consumer-only request
        shape: >-
          category = consumer or a consumer meter type: each item has 1PH-, 3PH-, LTCT-, HTCT-Consumer_meter, total.
      - part: total_progress
        shape: Computed in Python (transform_mi_progress_rows) as the sum of all trend totals.
      - part: Date labels
        shape: period_value is YYYY-MM for monthly, DD-MM-YY for daily and weekly.
      - part: Shape
        shape: >-
          {"total_progress": N, "trend": [{"period_value": "2026-01", "CONSUMER": .., "FEEDER": .., "DT": ..,
          "total": ..}], "comparison": [{"label": "KASHI", "CONSUMER": .., "FEEDER": .., "DT": .., "total": ..}]}
    example:
      - step: Silver rows
        result: >-
          1: CMIQC A1 2026-03-02 CONSUMER 1PH-STSM | 2: CMIQC A2 2026-03-02 CONSUMER 3PH-STSM | 3: DMIQC D1
          2026-03-09 DTR 3PLTCTSM | 4: CMIQC (blank serial) 2026-03-09 CONSUMER 1PH-STSM | 5: complaint replacement
          R1 2026-03-10 CONSUMER 1PH-STSM -- all project kashi
      - step: In gold
        result: Row 3 DTR -> DT; row 4 has_meter_serial = false; row 5 is_replacement = true.
      - step: Request
        result: from=2026-03-01, to=2026-03-31, duration=weekly, project=kashi
      - step: Dropped
        result: Row 4 (no serial) and row 5 (replacement).
      - step: Week of 01-03-26
        result: CONSUMER = 2 (rows 1 and 2), total 2.
      - step: Week of 08-03-26
        result: DT = 1 (row 3), total 1.
      - step: total_progress
        result: '3'
      - step: With category=consumer
        result: Week of 01-03-26 shows 1PH = 1, 3PH = 1, total 2.
  - number: 2
    title: MI-Productivity per team
    kpi_code: mi_progress_productivity_per_team
    backend_kpi_id: 2
    section: MI
    card: Output per installation team (agency) -- total & category wise. Implemented per technician.
    aliases:
      - productivity per team
      - mi productivity per team
      - team productivity
      - mi-productivity
      - mi productivity
      - technician productivity
      - installation productivity per
      - per technician per day
      - productivity per technician
      - kpi 2
      - kpi2
      - kpi-2
    summary: >-
      **MI-Productivity per team** is installations per technician-day: SUM(installation_count) /
      SUM(technician_day_count) from Postgres `gold_mi_technician_productivity_day_agg` (month roll-up
      `gold_mi_technician_productivity_month_agg` for whole months). The gold table is built from Silver
      `unified_installations` through the MI-only view (replacements excluded), keeping rows that have an
      installation date, a meter serial and a technician_name. Despite the card saying 'team (agency)', the code
      measures per `technician_name` -- the Silver `agency` column never reaches gold.
    gold_tables:
      - table: gold_mi_technician_productivity_day_agg
        columns: >-
          period_start, period_end, project, discom, zone, circle, division, sub_division, technician_name,
          category, meter_type, installation_count, technician_day_count
      - table: gold_mi_technician_productivity_month_agg
        columns: same columns (month roll-up)
    silver_tables:
      - table: unified_installations
        columns: >-
          mi_date, new_meter_serial_number, technician_name, new_meter_type, project, discom, zone, circle,
          division, sub_division
        source: CMIQC, CNSQC, DMIQC, FMIQC
    logic:
      - step: Population
        detail: MI-only `installations` view (no replacements); mi_date, serial and technician_name required.
      - step: Category
        detail: 'From new_meter_type: 3PLTCTSM->DT, HTCTPTSM->FEEDER, else CONSUMER (NOT report_category).'
      - step: Day grain
        detail: >-
          GROUP BY date, project, geography, technician_name, category, meter_type: installation_count = count(*),
          technician_day_count = 1; plus category='ALL' rollup rows.
      - step: Month table
        detail: installation_count summed; technician_day_count = number of day rows.
      - step: Backend
        detail: >-
          Per technician: inst = SUM(installation_count), tech_days = SUM(technician_day_count); category=all uses
          the per-category rows (category <> 'ALL').
    formulas:
      - output: productivity_per_technician_per_day
        formula: ROUND(SUM(installation_count) / SUM(technician_day_count), 2)
      - output: total_installations
        formula: SUM(installation_count)
      - output: total_active_technicians
        formula: number of distinct technician_name
      - output: total_active_days
        formula: number of non-empty trend buckets (days / weeks / months)
      - output: insights.top / lowest
        formula: 'technician with the highest / lowest productivity (ties: installs, then name)'
      - output: trend / comparison / category_breakdown
        formula: the same ratio per period / geography label / category
