    sql_recipe: >-
      Non-SAT ageing (dashboard KPI 11): FROM public.gold_non_sat_ageing_snapshot: SUM(meter_count) GROUP BY age_key
      (stored values 'age_0_30','age_31_60','age_61_90','age_91_120','age_120_plus' -- only some occur) and/or
