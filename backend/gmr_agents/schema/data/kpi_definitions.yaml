  - number: 10
    title: Meters Journey Avg time
    kpi_code: meter_journey_avg_time
    backend_kpi_id: 12
    section: Meter Journey
    card: Meters Journey Avg time across the levels for Revenue realized (Total & Category wise).
    aliases:
      - meter journey
      - meters journey
      - meter journey avg time
      - meters journey avg time
      - journey avg time
      - journey average time
      - average journey time
      - avg journey time
      - total journey
      - journey time
      - journey days
      - meter lifecycle
      - workflow lead time
      - lead time
      - di to agency
      - inventory to agency
      - agency to supervisor
      - supervisor to technician
      - technician to installation
      - installation to sat
      - sat to revenue
      - sat to revenue realized
      - revenue realized journey
      - kpi 12
      - kpi12
      - kpi-12
    summary: >-
      **Meters Journey Avg time** is the average number of days a meter spends in each stage from receipt into GMR
      stock (DI date) to revenue realization (PMPM collection): DI -> agency -> supervisor -> technician ->
      installation -> SAT -> revenue. It reads Postgres `gold_meter_journey_stage_agg`, which stores SUMS of days
      and meter counts per group, and divides them: each stage = SUM(stage days) / SUM(denominator), rounded to 2
      decimals. The four handoff stages divide by all eligible meters, installation->SAT by meters with a SAT date,
      and SAT->revenue and total journey by revenue-realized meters only -- so the stage averages do not add up to
      the total journey.
    gold_tables:
      - table: gold_meter_journey_stage_agg
        columns: >-
          project, discom, zone, circle, division, sub_division, installation_year, category, meter_type, the 7
          *_days_sum columns, meter_count, sat_meter_count, revenue_realized_meter_count
    silver_tables:
      - table: unified_smart_meter_inventory
        columns: >-
          meter_serial_number, di_date, gmr_to_agency_ts, agency_to_sup_ts, sup_to_tech_ts, installed_ts,
          meter_type, sku
        source: INVSMM
      - table: unified_installations
        columns: new_meter_serial_number, project, discom, zone, circle, division, sub_division, sat_number
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: replacement leg (INCLUDED, flagged is_replacement)
        source: COMQC, DOMQC, FOMQC
      - table: sat_meter_mappings
        columns: meter_serial_number, sat_number (overrides the installation's sat_number)
        source: SAT CSV uploads
      - table: sat_milestones
        columns: project, sat_number, sat_date, pmpm_collection_date (one row per SAT batch)
        source: Postgres milestone_config
    logic:
      - step: Flow
        detail: >-
          Inventory (5 timestamps) JOIN installations (geography, SAT number) LEFT JOIN sat_milestones (SAT + PMPM
          collection date) -> Spark _meter_journey() -> Postgres gold_meter_journey_stage_agg -> backend
          kpi_catalog/meter_journey_avg_time.py -> card.
      - step: Eligibility
        detail: >-
          A meter counts only if di_date, gmr_to_agency_ts, agency_to_sup_ts, sup_to_tech_ts and installed_ts are
          ALL present and in order (each >= the previous) AND the serial appears in an installation report. One
          missing/out-of-order timestamp drops the meter from every stage.
      - step: SAT dates
        detail: >-
          sat_milestones is loaded from Postgres milestone_config: one row per project + SAT batch, so every meter
          in a batch shares the same sat_date and pmpm_collection_date. No matching batch -> the meter stays, with
          NULL SAT / revenue dates.
      - step: Stage days
        detail: >-
          (unix_timestamp(b) - unix_timestamp(a)) / 86400.0 -- fractional days: DI->agency, agency->supervisor,
          supervisor->technician, technician->installed, installed->sat_date, sat_date->pmpm_collection_date, and
          total = pmpm_collection_date - di_date.
      - step: Gold
        detail: >-
          GROUP BY project, geography, installation_year, category, meter_type, is_replacement; stores sum() of each
          stage's days, meter_count = count(*), sat_meter_count = count(sat_date), revenue_realized_meter_count =
          count(pmpm_collection_date).
      - step: Category
        detail: >-
          From inventory meter_type + sku: 3PLTCTSM without CON in the SKU -> DT, HTCTPTSM without CON -> FEEDER,
          everything else CONSUMER (1PH/3PH/LTCT/HTCT/OTHER-Consumer_meter).
      - step: Replacements
        detail: >-
          INCLUDED -- KPI 12 sums across is_replacement; the dashboard-stats journey cards filter to NOT
          is_replacement, so they differ by design.
      - step: Comparison label
        detail: >-
          level=discom: project when no project is selected, else discom; zone/circle/division/sub_division: that
          column. Upper-cased.
    formulas:
      - output: DI to Agency
        formula: SUM(inventory_to_agency_days_sum) / SUM(meter_count)
      - output: Agency to Supervisor
        formula: SUM(agency_to_supervisor_days_sum) / SUM(meter_count)
      - output: Supervisor to Technician
        formula: SUM(supervisor_to_technician_days_sum) / SUM(meter_count)
      - output: Technician to Installation
        formula: SUM(technician_to_installation_days_sum) / SUM(meter_count)
      - output: Installation to SAT
        formula: SUM(installation_to_sat_days_sum) / SUM(sat_meter_count)
      - output: SAT to Revenue
        formula: SUM(sat_to_revenue_realized_days_sum) / SUM(revenue_realized_meter_count)
      - output: Total Journey
        formula: SUM(total_journey_days_sum) / SUM(revenue_realized_meter_count)
      - output: Total Meters
        formula: SUM(meter_count)
      - output: Rounding
        formula: ROUND(..., 2); a bucket with no data shows 0 (COALESCE)
      - output: Category / meter type
        formula: >-
          same ratios per CONSUMER / FEEDER / DT, or per consumer meter type when the request is consumer-only -- a
          weighted average, not the mean of the buckets
    caveats:
      - >-
          Stage averages use different denominators (all eligible meters / SAT meters / revenue-realized meters), so
          they do NOT add up to Total Journey.
      - Replacements are included here; the dashboard-stats journey cards exclude them.
      - >-
          Strict eligibility: a single missing or out-of-order handoff timestamp removes the meter entirely, so
          Total Meters is smaller than MI-Progress.
      - SAT and revenue dates are per SAT batch, not per meter -- the last two stages move in steps.
      - A bucket with no SAT / revenue meters shows 0 days, not blank.
      - 'SAT dates are not order-checked: a sat_date before installed_ts gives negative days for that stage.'
      - installation_year comes from the inventory installed_ts, not the installation report's mi_date.
      - No date range -- always 'as on latest date'; the only time filter is installation_year.
    sql_recipe: >-
      Meters Journey Avg time (dashboard KPI 12): FROM public.gold_meter_journey_stage_agg. NEVER AVG() a *_days_sum
      column -- every figure is a ratio of sums, ROUND(..., 2): DI to Agency =
      SUM(inventory_to_agency_days_sum)/NULLIF(SUM(meter_count),0); Agency to Supervisor =
      SUM(agency_to_supervisor_days_sum)/NULLIF(SUM(meter_count),0); Supervisor to Technician =
      SUM(supervisor_to_technician_days_sum)/NULLIF(SUM(meter_count),0); Technician to Installation =
      SUM(technician_to_installation_days_sum)/NULLIF(SUM(meter_count),0); Installation to SAT =
      SUM(installation_to_sat_days_sum)/NULLIF(SUM(sat_meter_count),0); SAT to Revenue =
      SUM(sat_to_revenue_realized_days_sum)/NULLIF(SUM(revenue_realized_meter_count),0); Total Journey =
      SUM(total_journey_days_sum)/NULLIF(SUM(revenue_realized_meter_count),0); Total Meters = SUM(meter_count). Do
      NOT filter is_replacement (the KPI includes replacements). Category breakdown = GROUP BY category
      ('CONSUMER','FEEDER','DT'); consumer-only = WHERE category = 'CONSUMER' GROUP BY meter_type
      ('1PH-Consumer_meter','3PH-Consumer_meter','LTCT-Consumer_meter','HTCT-Consumer_meter','OTHER-Consumer_meter').
      Year filter = installation_year (integer). No date column exists -- it is a snapshot. Project/geography values
      are lower-case -- compare with LOWER().
    followups:
      - What is the average meter journey time by category?
      - Which project has the longest installation to SAT time?
      - Explain the Meters Journey Avg time KPI
    filters:
      - filter: duration
        values: as on latest date
        effect: No date range; from/to are ignored
      - filter: project
        values: agra, kashi, triveni, All Project
        effect: LOWER(n.project) = LOWER(value)
      - filter: category
        values: all, consumer, feeder, dt, 1ph/3ph/ltct/htct/other-consumer_meter
        effect: LOWER(category) = ANY(...) OR LOWER(meter_type) = ANY(...)
      - filter: installation_year
        values: all, 2024, 2025, 2026
        effect: installation_year = value
      - filter: zone / circle / division / sub_division
        values: any name
        effect: LOWER(col) = LOWER(value)
      - filter: level
        values: discom (default), zone, circle, division, sub_division
        effect: Picks the comparison dimension
    response:
      - part: Parts
        shape: total_meters, summary (one object per stage), comparison (per geography label).
      - part: Stage object
        shape: >-
          {total, CONSUMER, FEEDER, DT} -- or {total, 1PH-, 3PH-, LTCT-, HTCT-, OTHER-Consumer_meter} when the
          category filter is consumer-only.
      - part: Stage keys
        shape: >-
          inventory_to_agency, agency_to_supervisor, supervisor_to_technician, technician_to_installation,
          installation_to_sat, sat_to_revenue_realized, total_journey.
      - part: Shape
        shape: >-
          {"total_meters": N, "summary": {"inventory_to_agency": {"total": .., "CONSUMER": .., "FEEDER": .., "DT":
          ..}, ..., "total_meters": N}, "comparison": [{"label": "KASHI", "total_meters": N, "inventory_to_agency":
          {...}, ...}]}
    example:
      - step: Meters
        result: >-
          M1 consumer 1PH and M2 consumer 3PH (same SAT batch, revenue collected), M3 DT with no SAT yet, M4 missing
          sup_to_tech_ts -- all kashi
      - step: Dropped
        result: M4 (a handoff timestamp is missing); total_meters = 3.
      - step: DI to Agency
        result: (2 + 4 + 1) / 3 = 2.33 days (CONSUMER 3, DT 1).
      - step: Technician to Installation
        result: (4 + 4 + 10) / 3 = 6 days.
      - step: Installation to SAT
        result: (20 + 18) / 2 = 19 days -- only the 2 SAT meters; DT shows 0 (no data).
      - step: SAT to Revenue
        result: (30 + 30) / 2 = 30 days.
      - step: Total Journey
        result: >-
          59 days over 2 meters -- while the stages add up to 60.33, because the stages use different meter
          populations.
  - number: 11
    title: Meters Current Stage for Revenue not realized
    kpi_code: meter_current_stage_revenue_not_realized
    backend_kpi_id: 16
    section: Meter Journey
    card: Meters Current Stage for Revenue not realized (Total & Category wise).
    aliases:
      - meter current stage
      - meters current stage
      - current stage for revenue not realized
      - current stage for revenue not realised
      - meters current stage for revenue not realized
      - revenue not realized
      - revenue not realised
      - revenue not realized stage
      - revenue pending stage
      - installation done sat pending
      - installed sat pending
      - sat done revenue pending
      - revenue pending
      - meter current stage kpi
      - kpi 16
      - kpi16
      - kpi-16
    summary: >-
      **Meters Current Stage for Revenue not realized** counts every meter whose PMPM revenue is not collected yet,
      placed in the ONE stage it is in right now: Inventory, Agency, Supervisor, Technician (not installed yet),
      Installed / SAT pending, or SAT done / revenue pending. It is a UNION ALL of two Postgres snapshots --
      `gold_meter_installation_pending_stage_snapshot` (uninstalled inventory meters, by the furthest handoff
      timestamp reached) and `gold_meter_revenue_pending_stage_snapshot` (installed meters with no PMPM collection
      date, split by whether the SAT number parses as SAT-1..SAT-13) -- and every number is SUM(meter_count).
    gold_tables:
      - table: gold_meter_installation_pending_stage_snapshot
        columns: >-
          project (from warehouse), category, meter_type, current_stage (inventory/agency/supervisor/technician),
          meter_count
      - table: gold_meter_revenue_pending_stage_snapshot
        columns: >-
          project (from installation), category, meter_type, current_stage (installation_done_sat_pending /
          sat_done_revenue_pending), meter_count
    silver_tables:
      - table: unified_smart_meter_inventory
        columns: >-
          meter_serial_number, gmr_to_agency_ts, agency_to_sup_ts, sup_to_tech_ts, installed_ts, warehouse,
          meter_type, sku
        source: INVSMM
      - table: unified_installations
        columns: new_meter_serial_number, project, geography
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: replacement leg (INCLUDED)
        source: COMQC, DOMQC, FOMQC
      - table: sat_meter_mappings
        columns: meter_serial_number, sat_number
        source: SAT CSV uploads
      - table: sat_milestones
        columns: project, sat_number, pmpm_collection_date (one row per SAT batch)
        source: Postgres milestone_config
    logic:
      - step: Flow
        detail: >-
          Inventory + installations (+ SAT mapping and milestones) -> Spark _installation_pending_stage() and
          _revenue_pending_stage_sql() -> two Postgres snapshots -> backend
          kpi_catalog/meter_current_stage_revenue_not_realized.py (UNION ALL) -> card.
      - step: Pre-install stages
        detail: >-
          From the latest inventory row per serial. A serial found in installations_all, or with installed_ts set,
          is 'installed' and dropped. Otherwise the furthest handoff wins: sup_to_tech_ts -> technician; else
          agency_to_sup_ts -> supervisor; else gmr_to_agency_ts -> agency; else inventory.
      - step: Pre-install project
        detail: >-
          From the warehouse -> project map (VARANASI_HW etc. -> kashi, PRAYAGRAJ_HW / MIRZAPUR_ZW -> triveni,
          AGRA_HW / ALIGARH WAREHOUSE -> agra, else unassigned).
      - step: Post-install stages
        detail: >-
          Latest installation per serial (replacements included) INNER JOIN inventory, LEFT JOIN sat_milestones on
          project + sat_number, kept only when pmpm_collection_date IS NULL. SAT-1..SAT-13 ->
          sat_done_revenue_pending; anything else -> installation_done_sat_pending.
      - step: Post-install project
        detail: From the installation report's project.
      - step: Category
        detail: >-
          Inventory meter_type + sku: 3PLTCTSM without CON in the SKU -> DT, HTCTPTSM without CON -> FEEDER, else
          CONSUMER (1PH/3PH/LTCT/HTCT/OTHER-Consumer_meter).
      - step: Backend
        detail: >-
          UNION ALL of both snapshots (category upper-cased); bucket = meter_type when consumer-only else category;
          SUM(meter_count) per stage x bucket; stage total = sum of its buckets; comparison always by
          UPPER(project).
    formulas:
      - output: Inventory / Agency / Supervisor / Technician
        formula: SUM(meter_count) FROM gold_meter_installation_pending_stage_snapshot WHERE current_stage = 'X'
      - output: Installed, SAT pending
        formula: >-
          SUM(meter_count) FROM gold_meter_revenue_pending_stage_snapshot WHERE current_stage =
          'installation_done_sat_pending'
      - output: SAT done, revenue pending
        formula: >-
          SUM(meter_count) FROM gold_meter_revenue_pending_stage_snapshot WHERE current_stage =
          'sat_done_revenue_pending'
      - output: Total meters
        formula: SUM(meter_count) over both snapshots
      - output: Category / meter type
        formula: the same sums per CONSUMER / FEEDER / DT, or per consumer meter type
      - output: Comparison
        formula: the same sums per UPPER(project)
    caveats:
      - Snapshot only -- no date filter; it changes only after the ETL refresh.
      - >-
          Project comes from the warehouse before installation and from the installation after it, so a meter can
          change project label when it is installed.
      - >-
          'SAT done' only means the SAT number parses as SAT-1..SAT-13 -- it does not check sat_date (Agra
          SAT-8/10/12 have no SAT date yet but still count as SAT done, revenue pending).
      - >-
          Unrecognised SAT values (e.g. 'SAT-14') count as Installed / SAT pending here, while MI vs SAT and Non-SAT
          ageing treat them as neither.
      - >-
          Installed meters with no inventory row, and meters with installed_ts but no installation row, are in
          neither snapshot.
      - Replacements are included.
      - Scrapped old meters are not removed from the pre-install stages (unlike unutilized stock ageing).
      - Only project and category filters exist -- no zone / circle / division comparison.
    sql_recipe: >-
      Meters Current Stage for Revenue not realized (dashboard KPI 16): FROM (SELECT project, category, meter_type,
      current_stage, meter_count FROM public.gold_meter_installation_pending_stage_snapshot UNION ALL SELECT
      project, UPPER(category), meter_type, current_stage, meter_count FROM
      public.gold_meter_revenue_pending_stage_snapshot) n: SUM(meter_count) by current_stage (stored values
      'inventory','agency','supervisor','technician','installation_done_sat_pending','sat_done_revenue_pending').
      'Not yet installed' = the first four; 'installed but revenue pending' = the last two; 'total meters' =
      everything. Category = GROUP BY category ('CONSUMER','FEEDER','DT'); consumer meter types via meter_type. No
      date column. Project values are lower-case; comparison is by project only. Never answer this from
      gold_inventory_unutilized_stock_snapshot (unutilized stock ageing) or gold_non_sat_ageing_snapshot (Non-SAT
      ageing).
    followups:
      - How many meters are SAT done but revenue pending by project?
      - Meters current stage for revenue not realized category wise
      - Explain the Meters Current Stage KPI
    filters:
      - filter: duration
        values: as on latest date
        effect: No date range
      - filter: project
        values: agra, kashi, triveni, All Project
        effect: n.project IN (...)
      - filter: category
        values: all, consumer, feeder, dt, 1ph/3ph/ltct/htct/other-consumer_meter
        effect: LOWER(category) = ANY(...) OR LOWER(meter_type) = ANY(...)
    response:
      - part: Parts
        shape: total_meters, summary (one object per stage), comparison (per project).
      - part: Stage keys
        shape: inventory, agency, supervisor, technician, installation_done_sat_pending, sat_done_revenue_pending.
      - part: Stage object
        shape: >-
          {CONSUMER, FEEDER, DT, total} -- or the 5 consumer meter types + total when the category filter is
          consumer-only; total is summed in Python.
      - part: Shape
        shape: >-
          {"total_meters": N, "summary": {"inventory": {"CONSUMER": .., "FEEDER": .., "DT": .., "total": ..}, ...,
          "total_meters": N}, "comparison": [{"label": "KASHI", "total_meters": N, "inventory": {...}, ...}]}
    example:
      - step: Meters (kashi)
        result: >-
          A in VARANASI_HW with no handoffs | B handed to a supervisor, not installed | C installed, SAT number
          blank | D installed, SAT-9, PMPM collected | E installed, SAT-11, no PMPM | F installed but not in
          inventory
      - step: Stages
        result: A inventory, B supervisor, C installation_done_sat_pending, E sat_done_revenue_pending.
      - step: Excluded
        result: D (revenue realized) and F (no inventory row -- in neither snapshot).
      - step: total_meters
        result: '4'
  - number: 12
    title: MI vs SAT vs Invoice Funnel
    kpi_code: mi_vs_sat
    backend_kpi_id: 10
    section: Invoicing
