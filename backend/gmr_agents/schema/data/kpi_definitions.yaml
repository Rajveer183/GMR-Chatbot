          has_lumpsum_invoice, has_pmpm_invoice, is_sat_eligible, meter_count
      - table: gold_mi_sat_invoice_day_agg
        columns: the day grain it is built from (period_start = mi_date)
    silver_tables:
      - table: unified_installations
        columns: mi_date, project, geography, report_category, new_meter_type, new_meter_serial_number
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: replacement leg (INCLUDED)
        source: COMQC, DOMQC, FOMQC
      - table: sat_meter_mappings
        columns: meter_serial_number, sat_number (the SAT batch)
        source: SAT CSV uploads
      - table: sat_milestones
        columns: project, sat_number, lumpsum_invoice_date, pmpm_invoice_date (one row per batch)
        source: Postgres milestone_config
    logic:
      - step: Flow
        detail: >-
          installations_all (installations + replacements, SAT number from sat_meter_mappings) LEFT JOIN
          sat_milestones on project + sat_number -> _mi_sat_invoice_sql() -> gold_mi_sat_invoice_day_agg ->
          _mi_sat_invoice_snapshot() (date dropped, is_sat_eligible added) -> gold_mi_sat_invoice_snapshot ->
          backend kpi_catalog/mi_vs_sat.py -> the MI vs SAT card AND the invoice funnel card.
      - step: Installed
        detail: Every installation row with an mi_date (count(*) of rows, replacements included).
      - step: Certified (SAT)
        detail: >-
          sat_number with spaces removed, upper-cased = 'SAT-1'..'SAT-13' -> sat_stage 1..13; anything else (blank,
          'SAT PENDING', 'SAT-14') -> NULL = not certified.
      - step: Invoiced
        detail: >-
          has_lumpsum_invoice / has_pmpm_invoice = that project + SAT batch has a lumpsum / PMPM invoice date.
          Invoice dates belong to the batch, so every meter in an invoiced batch counts.
      - step: Category
        detail: >-
          report_category first (CONSUMER / FEEDER / DT, DTR -> DT); if blank, 3PLTCTSM -> DT, HTCTPTSM -> FEEDER,
          else CONSUMER. Consumer meter type 1PH/3PH/LTCT/HTCT, unknown -> NULL (shown as OTHER).
      - step: No batching step
        detail: >-
          A meter gets a sat_number only through sat_meter_mappings, whose identity IS the batch, so 'batched' and
          'SAT done' are the same event.
      - step: Comparison
        detail: >-
          level=discom: project when no project is selected, else discom; or zone / circle / division /
          sub_division. The same six figures per label.
    formulas:
      - output: Total MI
        formula: SUM(meter_count)
      - output: Total SAT
        formula: SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL)
      - output: Lumpsum invoiced
        formula: SUM(meter_count) FILTER (WHERE has_lumpsum_invoice)
      - output: '% Lumpsum of SAT'
        formula: Lumpsum invoiced x 100 / Total SAT (0 when Total SAT = 0), 2 decimals
      - output: PMPM invoiced
        formula: SUM(meter_count) FILTER (WHERE has_pmpm_invoice)
      - output: '% PMPM of SAT'
        formula: PMPM invoiced x 100 / Total SAT, 2 decimals
      - output: Drop-offs (chatbot)
        formula: >-
          installed not SAT = sat_stage IS NULL; SAT not lumpsum/PMPM invoiced = sat_stage IS NOT NULL AND NOT
          has_lumpsum_invoice / has_pmpm_invoice
    caveats:
      - >-
          The invoice percentages are shares of SAT-done meters, not of installed meters: a meter cannot be billed
          before its SAT, so dividing by MI would mix the DISCOM's certification lag into GMR's billing lag. %
          Lumpsum of SAT can read 100% while SAT progress reads 60% -- both correct.
      - >-
          Lumpsum and PMPM are independent counts, never to be added -- a batch can have either, both or neither
          (today they are identical: every invoiced batch has both dates).
      - >-
          Invoice dates are per SAT batch, not per meter; (project, sat_number) is unique so nothing double-counts.
      - '''SAT done'' checks only the SAT number, not sat_date -- batches without a SAT date yet still count.'
      - Replacements are included, so Total MI exceeds MI-Progress (KPI 1) by the replacement installs.
      - Counts installation ROWS (installations_all is not reduced to one row per serial).
      - >-
          No eligible variants: only the SAT progress % has an eligible version; invoicing uses the full population.
      - >-
          Stale WFM docs: they say day_agg (code reads the snapshot), SAT-1..SAT-11 (code: 1..13), cutoffs seeded
          2026-05-10 and total_mi = KPI 1 -- none true today.
      - Snapshot 'as on latest SAT' -- no date range; changes after the ETL gold refresh.
    sql_recipe: >-
      MI vs SAT vs Invoice Funnel (dashboard KPI 10a, same data as MI vs SAT): FROM
      public.gold_mi_sat_invoice_snapshot: Total MI = SUM(meter_count); Total SAT = SUM(meter_count) FILTER (WHERE
      sat_stage IS NOT NULL); Lumpsum invoiced = SUM(meter_count) FILTER (WHERE has_lumpsum_invoice); PMPM invoiced
      = SUM(meter_count) FILTER (WHERE has_pmpm_invoice); % Lumpsum of SAT = 100.0 * lumpsum / NULLIF(Total SAT, 0)
      and % PMPM of SAT = 100.0 * PMPM / NULLIF(Total SAT, 0) -- divide by Total SAT, NEVER by Total MI, and never
      add lumpsum and PMPM. 'SAT done but not invoiced' = sat_stage IS NOT NULL AND NOT has_lumpsum_invoice (or
      has_pmpm_invoice). No date column; replacements included.
    followups:
      - Show the MI vs SAT vs invoice funnel project wise
      - How many meters are SAT done but not invoiced?
      - Why is the lumpsum invoice percentage calculated on SAT and not MI?
    filters:
      - filter: duration
        values: as on latest sat
        effect: Snapshot; from / to ignored
      - filter: project
        values: agra, kashi, triveni, All Project (repeatable)
        effect: n.project IN (...)
      - filter: category
        values: all, consumer, feeder, dt, 1ph/3ph/ltct/htct-consumer_meter
        effect: LOWER(category) = ANY(...) OR LOWER(meter_type) = ANY(...)
      - filter: level
        values: discom (default), zone, circle, division, sub_division
        effect: Comparison dimension
      - filter: discom / zone / circle / division / sub_division
        values: any name
        effect: LOWER(col) = LOWER(value)
    response:
      - part: Funnel fields
        shape: >-
          total_mi, total_sat, total_lumpsum_invoice, lumpsum_invoice_pct, total_pmpm_invoice, pmpm_invoice_pct --
          at the top level of the MI vs SAT response and on every comparison row.
      - part: Same response also has
        shape: >-
          total_mi_eligible, total_sat_eligible, sat_progress_pct(_eligible), sat_eligibility_cutoff_date,
          summary.sat_1..sat_13.
    example:
      - step: Meters (kashi)
        result: >-
          M1 SAT-9, batch lumpsum + PMPM invoiced | M2 SAT-10, lumpsum only | M3 no SAT number | M4 SAT-11, not
          invoiced | M5 'SAT-14'
      - step: Total MI
        result: '5'
      - step: Total SAT
        result: 3 (M1, M2, M4) -- M3 blank and M5's 'SAT-14' do not parse.
      - step: Lumpsum
        result: 2 (M1, M2) -> % Lumpsum of SAT = 2 / 3 = 66.67%.
      - step: PMPM
        result: 1 (M1) -> % PMPM of SAT = 1 / 3 = 33.33%.
      - step: Not invoiced
        result: SAT done but not lumpsum invoiced = 1 (M4); not PMPM invoiced = 2 (M2, M4).
  - number: 13
    title: Invoice vs Revenue Released (Receivables summary)
    kpi_code: revenue_receivables
    backend_kpi_id: 14
    section: Commercial
    card: >-
      Receivables summary - Delay analysis: Invoice Amount (Net) vs Realised vs Within Timeline (unpaid, not yet due) vs Overdue, for
      Lumpsum, PMPM and Cable, per project (money, in crore rupees).
    aliases:
      - invoice vs revenue released
      - invoice vs revenue
      - revenue released
      - released revenue
      - receivables
      - receivables summary
      - receivable
      - delay analysis
      - revenue receivables
      - realised revenue
      - realized revenue
      - amount realised
      - amount realized
      - outstanding amount
      - cable invoiced
      - cable realised
      - cable realized
      - within timeline
      - kpi 14
      - kpi14
      - kpi-14
      - cable revenue realized
      - cable revenue realised
      - cable revenue
      - cable revenue growth
      - receivables trend
      - receivables history
      - last submission
    summary: >-
      **Invoice vs Revenue Released** (dashboard KPI 14, 'Receivables summary - Delay analysis') is MONEY, not
      meters: how much GMR invoiced, how much was realised (released / paid) and how much was realised within the
      agreed timeline, for three streams -- Lumpsum, PMPM and Cable -- in crore rupees. There is no ETL: an operator
      types the figures into a form (POST /api/v1/revenue-receivables) that appends a row per project to Postgres
      `revenue_receivables`. The card takes each project's LATEST submission and SUMs the projects.
    gold_tables:
      - table: revenue_receivables (Postgres, operator-entered -- not a gold table)
        columns: id, created_at, project, lumpsum/pmpm/cable _invoiced, _realised, _within_timeline
    silver_tables:
      - table: (none)
        columns: No Silver / Gold / ETL -- the figures are typed in by an operator
        source: POST /api/v1/revenue-receivables (permission submit_revenue_data)
    logic:
      - step: Source
        detail: >-
          An operator submits one project's 9 amounts; the row is appended (never updated), with the project
          validated against the geography tree (unknown project -> 422).
      - step: Latest per project
        detail: >-
          ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) = 1 -- a new submission
          supersedes the previous one for that project.
      - step: Discom
        detail: Resolved through geography_nodes (the PROJECT node's parent), not stored on the row.
      - step: Summary
        detail: SUM of each of the 9 amounts across the projects in scope -- never the single newest row overall.
      - step: Comparison
        detail: The same 9 amounts per UPPER(project).
      - step: Scope
        detail: 'Filters: project (repeatable), discom. A user scoped below project level sees their whole project.'
      - step: Percentages
        detail: >-
          The backend returns none; realised % etc. are computed by the dashboard (and by the chatbot the same way).
      - step: Cable Revenue realized card
        detail: >-
          The dashboard's 'Cable Revenue realized' card is the Cable slice of this KPI: SUM(cable_realised) per
          project (and cable_invoiced / cable_within_timeline). Cable is billed service-cable work; nothing links it
          to installation data.
      - step: History
        detail: >-
          Every submission is kept. The backend exposes GET /api/v1/revenue-receivables/{project}/latest and
          /{project}/history (operator-only); the chatbot's trend and 'change since the last submission' answers
          read every stored row.
    formulas:
      - output: Invoice Amount (Net) / Realised / Within Timeline
        formula: SUM(<stream>_invoiced / _realised / _within_timeline) over the latest row of each project
      - output: Overdue (dashboard card)
        formula: invoiced - realised - within_timeline (unpaid and past due; Within Timeline = unpaid, not yet due)
      - output: Outstanding (all unpaid)
        formula: invoiced - realised = Within Timeline + Overdue
      - output: '% Realised'
        formula: realised / invoiced x 100
    caveats:
      - >-
          Operator-entered and unvalidated: nothing checks realised <= invoiced, within_timeline <= invoiced - realised (a negative Overdue), or
          that values are positive.
      - 'Units are what the operator typed: the docs say crore, but their own POST example uses raw rupees.'
      - >-
          It is money, and has nothing to do with the MI vs SAT vs Invoice Funnel, which counts METERS in invoiced
          SAT batches -- the two are not comparable.
      - 'No history on the card: older submissions stay in the table but only the latest per project is shown.'
      - A project never submitted is missing from the comparison and contributes 0.
      - >-
          A project's latest within_timeline can be 0 while realised is not -- worth confirming with the
          operator when it happens.
      - >-
          Dashboard mismatch (seen once): the 'Cable Revenue realized' card plotted the PMPM realised values
          instead of cable realised -- the card appears to read the wrong column (frontend).
      - >-
          The card's Category (Consumer / DT / Feeder) and Daily / date-range controls cannot apply: receivables
          have no category and no date other than the submission date, so 'Cable revenue growth' shows no records
          for a daily range.
      - >-
          Earlier Agra submissions went down and back up (cable realised 21 -> 9 -> 23); to-date amounts cannot
          fall, so those look like corrections or test entries.
    sql_recipe: >-
      Invoice vs Revenue Released / Receivables (dashboard KPI 14): answered by the receivables fast path from the
      operator table public.revenue_receivables (latest row per project, summed). Never answer receivable / realised
      / released AMOUNTS from gold_mi_sat_invoice_snapshot (that counts meters, not money).
    followups:
      - What is the lumpsum invoiced vs realised amount by project?
      - Cable revenue realized by project
      - What changed since the last receivables submission?
    filters:
      - filter: project
        values: All Project, agra, kashi, triveni (repeatable)
        effect: latest row of those projects
      - filter: discom
        values: any discom name
        effect: LOWER(discom) = LOWER(value), via geography_nodes
    response:
      - part: summary
        shape: '{lumpsum_invoiced, lumpsum_realised, lumpsum_within_timeline, pmpm_..., cable_...} -- summed.'
      - part: comparison
        shape: 'one object per project: {label: ''AGRA'', the same 9 amounts}.'
    example:
      - step: Submissions
        result: Agra files lumpsum 110 / 70 / 5 on 1 Sep, then 111.90 / 70.10 / 0.00 on 2 Sep.
      - step: Card
        result: Only Agra's 2 Sep row counts; the all-projects total adds Agra's, Kashi's and Triveni's latest rows.
      - step: Derived
        result: 'Agra lumpsum: 70.10 / 111.90 = 62.65% realised, 41.80 cr outstanding, 70.10 cr after the timeline.'
  - number: 14
    title: Revenue not realized ageing
    kpi_code: revenue_not_realized_ageing
    backend_kpi_id: 17
    section: Revenue
    card: >-
      Revenue not realized ageing (Total & Category wise): SAT-certified meters whose PMPM revenue is not collected,
      by days since the SAT date (0-30 / 31-60 / 61-90 / 91-120 / 120+).
    aliases:
      - revenue not realized ageing
      - revenue not realised ageing
      - revenue not realized aging
      - revenue not realised aging
      - revenue ageing
      - revenue aging
      - revenue ageing breakdown
      - outstanding ageing
      - outstanding aging
      - total outstanding
      - unrealized revenue ageing
      - kpi 17
      - kpi17
      - kpi-17
    summary: >-
      **Revenue not realized ageing** (dashboard KPI 17) counts METERS whose revenue is earned but not collected:
      the meter has a SAT number, its SAT batch has a sat_date, and the batch has no PMPM collection date. Each
      meter is aged from its SAT date -- age = today (Asia/Kolkata) - sat_date, never below 0 -- and banded 0-30 /
      31-60 / 61-90 / 91-120 / 120+ days AT REQUEST TIME. It reads Postgres `gold_revenue_ageing_snapshot` (sat_date
      + outstanding_count per geography and meter type) and sums outstanding_count.
    gold_tables:
      - table: gold_revenue_ageing_snapshot
        columns: >-
          sat_date, project, discom, zone, circle, division, sub_division, category, meter_type, outstanding_count
    silver_tables:
      - table: unified_installations
        columns: new_meter_serial_number, project, geography, report_category, new_meter_type
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: replacement leg (INCLUDED)
        source: COMQC, DOMQC, FOMQC
      - table: sat_meter_mappings
        columns: meter_serial_number, sat_number
        source: SAT CSV uploads
      - table: sat_milestones
        columns: project, sat_number, sat_date, pmpm_collection_date
        source: Postgres milestone_config
      - table: unified_smart_meter_inventory
        columns: meter_type, sku (category; optional -- LEFT join)
        source: INVSMM
    logic:
      - step: Flow
        detail: >-
          installations_latest (one row per serial, replacements included) with a sat_number -> LEFT JOIN inventory
          for category -> INNER JOIN sat_milestones on project + sat_number, keeping sat_date NOT NULL and
          pmpm_collection_date IS NULL -> _revenue_ageing_sql() -> gold_revenue_ageing_snapshot -> backend
          kpi_catalog/revenue_not_realized_ageing.py -> card.
      - step: Earned
        detail: >-
          Only certified meters: a sat_number AND a sat_date on its batch. No SAT, or a batch without a sat_date yet
          (e.g. Agra SAT-8/10/12), is not outstanding here.
      - step: Not realized
        detail: pmpm_collection_date IS NULL alone (the legacy report needed both collection dates null).
      - step: No inventory row
        detail: Still counted -- the installation report's type gives the category.
      - step: Age
        detail: >-
          GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0), computed per request, so
          meters move bands every day with no ETL refresh.
      - step: Bands
        detail: <=30 age_0_30, <=60 age_31_60, <=90 age_61_90, <=120 age_91_120, else age_120_plus.
      - step: Comparison
        detail: >-
          level=discom: project when no project is selected, else discom; or zone / circle / division /
          sub_division. Blank labels drop out of the comparison but stay in the totals.
    formulas:
      - output: Total outstanding
        formula: SUM(outstanding_count)
      - output: Age band A
        formula: SUM(outstanding_count) WHERE the age falls in A
      - output: Band x category
        formula: the same per CONSUMER / FEEDER / DT, or per consumer meter type (NULL -> OTHER)
      - output: Average age (chatbot)
        formula: SUM(age x outstanding_count) / SUM(outstanding_count)
    caveats:
      - Counts METERS, not rupees -- the rupee receivables are the Invoice vs Revenue Released card.
      - >-
          All meters in one SAT batch share one sat_date, so whole batches move band together; today every
          outstanding meter is SAT-11 (14 Jul 2026), so everything sits in one band (61-90 as of 25 Sep 2026).
      - >-
          It is smaller than Current Stage's 'SAT done, revenue pending' (KPI 16): that card counts any parsable
          SAT-1..13 number even with no sat_date and needs an inventory row; this one needs a sat_date and does not.
      - Replacements are included; meters are de-duplicated by serial (latest installation row).
      - Not the same as Non-SAT ageing, which ages meters WITHOUT SAT from their installation date.
    sql_recipe: >-
      Revenue not realized ageing (dashboard KPI 17): FROM public.gold_revenue_ageing_snapshot, age =
      GREATEST(CAST(CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata' AS DATE) - sat_date, 0); bands <=30 / <=60 / <=90
      / <=120 / >120; SUM(outstanding_count) per band and/or category / meter_type / project / zone. Never use
      gold_non_sat_ageing_snapshot (Non-SAT) or revenue_receivables (rupees) for this.
    followups:
      - Revenue not realized ageing project wise
      - How many meters have revenue outstanding for more than 60 days?
      - Explain the revenue not realized ageing KPI
    filters:
      - filter: duration
        values: as on today
        effect: Age computed at request time
      - filter: project
        values: agra, kashi, triveni, All Project
        effect: n.project IN (...)
      - filter: category
        values: all, consumer, feeder, dt, 1ph/3ph/ltct/htct/other-consumer_meter
        effect: LOWER(category) = ANY(...) OR LOWER(meter_type) = ANY(...)
      - filter: level
        values: discom (default), zone, circle, division, sub_division
        effect: Comparison dimension
      - filter: discom / zone / circle / division / sub_division
        values: any name
        effect: LOWER(col) = LOWER(value)
    response:
      - part: Parts
        shape: >-
          total_outstanding, summary.age_0_30 .. age_120_plus (each {CONSUMER, FEEDER, DT, total} or the 5 consumer
          types), comparison[] per label with the same bands.
    example:
      - step: Batch
        result: 'Kashi SAT-11: sat_date 14 Jul 2026, no PMPM collection, 75,483 meters.'
      - step: Age on 25 Sep 2026
        result: 73 days -> band 61-90.
      - step: On 12 Oct 2026
        result: 90 days -> still 61-90; on 13 Oct it moves to 91-120 with no ETL run.
      - step: Once collected
        result: When SAT-11's pmpm_collection_date is filled, the next ETL refresh removes all its meters.
  - number: 15
    title: O&M-Productivity per team
    kpi_code: om_team_productivity
    backend_kpi_id: 18
    section: O&M
    card: >-
      O&M-Productivity per team (Total & Category wise): closed complaint tickets, active technicians, productivity
      per technician per day, top performer / requires support, resolution speed trend.
    aliases:
      - o&m productivity
      - o&m-productivity
      - om productivity
      - o and m productivity
      - o&m productivity per team
      - o&m team productivity
      - om team productivity
      - complaint productivity
      - ticket productivity
      - total closed tickets
      - closed tickets
      - resolution speed
      - top performer
      - requires support
      - kpi 18
      - kpi18
      - kpi-18
    summary: >-
      **O&M-Productivity per team** measures complaint (O&M) closing productivity: Total closed tickets =
      SUM(complaint_count), Total active technicians = number of distinct technician names who closed at least one
      ticket, Productivity per technician per day = closed tickets / SUM(technician_day_count), for the selected
      date range. It reads Postgres `gold_om_technician_productivity_day_agg` (per-category rows, category <>
      'ALL'), built from Silver `unified_complaints` (QC) + `unified_non_qc_complaints` (non-QC) closed complaints
      -- open complaints are never counted.
    gold_tables:
      - table: gold_om_technician_productivity_day_agg
        columns: >-
          period_start, project, discom, zone, circle, division, sub_division, technician_name, category,
          meter_type, complaint_count, technician_day_count
      - table: gold_om_technician_productivity_month_agg
        columns: same columns -- used for whole months when duration = monthly
    silver_tables:
      - table: unified_complaints
        columns: technician_name, work_completed_at, complaint_entity_type, old_meter_serial_number, geography
        source: COMQC, DOMQC, FOMQC
      - table: unified_non_qc_complaints
        columns: the same columns for non-QC complaints
        source: non-QC complaint reports
      - table: unified_smart_meter_inventory
        columns: meter_type by serial (meter_type_lookup)
        source: INVSMM
    logic:
      - step: Flow
        detail: >-
          QC + non-QC closed complaints (UNION ALL) -> meter type by old serial -> Spark _om_technician_day() ->
          gold_om_technician_productivity_day_agg / _month_agg -> backend kpi_catalog/om_team_productivity.py ->
          card.
      - step: Eligible
        detail: >-
          work_completed_at IS NOT NULL and a technician_name. The active (open) complaints table is excluded --
          open tickets have no closing date.
      - step: Category
        detail: >-
          complaint_entity_type DT/DTR -> DT, FEEDER -> FEEDER, else CONSUMER. Total = the per-category rows
          (category <> 'ALL'), never the 'ALL' rows.
      - step: Date range
        detail: >-
          Same 3-leg reading as MI-Progress: partial start month and partial end month from the day table, whole
          months in between (month table when duration = monthly). 'to' is inclusive.
      - step: Technician-day
        detail: >-
          technician_day_count is 1 per ROW, and a row is technician x day x geography x category x meter type -- a
          technician who closes a consumer and a DT ticket on one day counts 2 days.
      - step: Insights
        detail: >-
          Top performer = the technician with the highest closed / technician-days (ties: more closed tickets, then
          name A-Z); Requires support = the lowest (ties: fewer tickets, then name A-Z).
      - step: Comparison / trend
        detail: >-
          Per label (project when no project is selected, else discom; or zone / circle / division / sub_division)
          and per day / month-anchored week / month: closed, distinct technicians, and the same ratio.
    formulas:
      - output: Total closed tickets
        formula: SUM(complaint_count)
      - output: Total active technicians
        formula: COUNT(DISTINCT technician_name)
      - output: Productivity per technician per day
        formula: ROUND(SUM(complaint_count) / SUM(technician_day_count), 2)
      - output: Top performer / requires support
        formula: 'per technician: SUM(complaint_count) / SUM(technician_day_count), highest / lowest'
      - output: Category breakdown
        formula: the same three per CONSUMER / DT / FEEDER
    caveats:
      - >-
          The denominator counts rows, not distinct technician-days, so productivity is understated compared with
          tickets / distinct technician-days.
      - >-
          'Top performer' and 'Requires support' are ratios, so a technician with one day and 13 tickets tops the
          list, and many technicians tie at 1.00 -- the alphabetical tie-break picks the name shown (ABHAY).
      - >-
          Technicians are identified by name only; the same name in two teams merges, and name spellings split one
          person.
      - >-
          Active technicians in the comparison are counted per label, so the projects' technicians add up to more
          than the total when someone worked in two projects.
      - >-
          A range from the 1st to mid-month of the same month returns no data (the backend's date-leg gap, as in
          MI-Progress).
      - Open complaints are not included; this is closed-ticket productivity only.
    sql_recipe: >-
      O&M-Productivity per team (dashboard KPI 18): FROM public.gold_om_technician_productivity_day_agg WHERE
      category <> 'ALL' (per-category rows) and the period_start range: closed tickets = SUM(complaint_count);
      active technicians = COUNT(DISTINCT technician_name); productivity = ROUND(SUM(complaint_count)::numeric /
      NULLIF(SUM(technician_day_count), 0), 2). Top performer = GROUP BY technician_name ORDER BY that ratio DESC,
      closed DESC, name. Never use gold_mi_technician_productivity_* (installations) for O&M / complaints.
    followups:
