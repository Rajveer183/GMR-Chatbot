      - kpi3
      - kpi-3
    summary: >-
      **Monthly Productivity trend** reads the pre-aggregated cube `gold_mi_productivity_trend_month_agg`, which the
      ETL builds from KPI 2's day grain (`gold_mi_technician_productivity_day_agg` <- Silver
      `unified_installations`, replacements excluded). Each month row carries total_installations, active_days
      (distinct dates), active_technicians (distinct technicians) and technician_day_count; productivity =
      total_installations / technician_day_count.
    gold_tables:
      - table: gold_mi_productivity_trend_month_agg
        columns: >-
          month_start, month_end, project, filter_level, filter_label, aggregate_level, label, category, meter_type,
          total_installations, active_days, active_technicians, technician_day_count
    silver_tables:
      - table: unified_installations
        columns: mi_date, new_meter_serial_number, technician_name, new_meter_type, project, geography
        source: CMIQC, CNSQC, DMIQC, FMIQC
    logic:
      - step: Input
        detail: >-
          KPI 2's day grain regrouped to (month, geography, category, meter_type, technician, date), plus
          category='ALL' copies.
      - step: Project
        detail: Every row duplicated as project='ALL' and as its real project.
      - step: Cube
        detail: >-
          LATERAL VIEW stack(...) expands a filter scope (all/zone/circle/division/sub_division) and an aggregate
          scope (all/project/discom/zone/circle/division/sub_division); kept when aggregate_rank >= filter_rank.
      - step: Measures
        detail: >-
          total_installations = sum, active_days = count(DISTINCT mi_date), active_technicians = count(DISTINCT
          technician_name), technician_day_count = count(*) of distinct tech-days.
      - step: Backend
        detail: >-
          Months overlapping [from, to] are included whole; geography via filter_level/filter_label; summary rows
          are aggregate_level='all'.
    formulas:
      - output: total_installations
        formula: SUM(total_installations) at aggregate_level='all'
      - output: productivity_per_technician_per_day
        formula: SUM(total_installations) / SUM(technician_day_count)
      - output: avg active technicians (trend)
        formula: technician_day_count / active_days
      - output: total_active_technicians
        formula: SUM(active_technicians) (a sum, not distinct)
      - output: total_active_months
        formula: number of trend months
