      - stock aging
      - unutilized stock ageing
      - unutilized stock aging
      - uninstalled stock
      - didate
      - kpi 7
      - kpi7
      - kpi-7
    summary: >-
      **Un-utilized stock ageing** counts meters sitting in inventory that were never installed or scrapped,
      bucketed by days since stock intake (DI date). It sums `stock_count` from Postgres
      `gold_inventory_unutilized_stock_snapshot`, which the ETL builds from Silver `unified_smart_meter_inventory`
      (INVSMM) minus every serial found in the installations (incl. replacement installs) or scrapped as an old
      meter in `unified_complaints`. Age = today - inventory_date, banded 0-30 / 31-60 / 61-90 / 90+.
    gold_tables:
      - table: gold_inventory_unutilized_stock_snapshot
        columns: inventory_date, project, warehouse, current_stage, category, meter_type, sku, oem, stock_count
    silver_tables:
      - table: unified_smart_meter_inventory
        columns: >-
          meter_serial_number, di_date, warehouse, technician_name, supervisor, agency, meter_type, sku,
          manufacturer
        source: INVSMM
      - table: unified_installations
        columns: new_meter_serial_number, mi_date
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: old/new_meter_serial_number, work_completed_at
        source: COMQC, DOMQC, FOMQC
    logic:
      - step: Detection
        detail: >-
          Inventory serial (latest row per serial, di_date required) NOT IN (installed serials with mi_date UNION
          scrapped old-meter serials).
      - step: current_stage
        detail: technician_name present -> technician; else supervisor; else agency; else warehouse.
      - step: Project
        detail: From the warehouse -> project map (kashi / triveni / agra / unassigned).
      - step: Gold
        detail: >-
          GROUP BY inventory_date, project, warehouse, current_stage, category, meter_type, sku, oem; stock_count =
          count(*).
      - step: Age (backend, query time)
        detail: GREATEST(CURRENT_DATE - inventory_date, 0) days.
    formulas:
      - output: age band
        formula: <=30 age_0_30; <=60 age_31_60; <=90 age_61_90; else age_90_plus
      - output: summary[age_band][bucket]
        formula: SUM(stock_count); bucket = CONSUMER / FEEDER / DT (or meter types)
      - output: total_stock
        formula: SUM(stock_count)
      - output: comparison[label]
        formula: same, per warehouse (default) / oem / sku
    caveats:
      - Which meters are unutilized is fixed at the last ETL refresh; age moves daily with CURRENT_DATE.
      - >-
          Comparison levels are warehouse / oem / sku (the formula doc's discom/zone/circle levels are not
          implemented).
      - '''Trend'' on this card is the age-band distribution; there is no time series.'
    sql_recipe: >-
      Un-utilized stock ageing (dashboard KPI 7): FROM public.gold_inventory_unutilized_stock_snapshot,
      SUM(stock_count); age bucket = CASE WHEN CURRENT_DATE - inventory_date <= 30 THEN 'age_0_30' WHEN <= 60 THEN
      'age_31_60' WHEN <= 90 THEN 'age_61_90' ELSE 'age_90_plus' END; GROUP BY that bucket and/or warehouse / oem /
      sku / current_stage / category.
