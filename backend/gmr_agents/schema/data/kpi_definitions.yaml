      - Per TECHNICIAN, not per agency/team; same-named technicians in different projects are merged.
      - >-
          Tech-days are over-counted: a technician installing two meter types (or in two sub-divisions) on one day
          counts as 2 tech-days, which lowers productivity.
      - total_active_days counts buckets, so for weekly/monthly it is weeks/months, not days.
    sql_recipe: >-
      MI-Productivity per team (dashboard KPI 2): FROM public.gold_mi_technician_productivity_day_agg (or
      _month_agg). Productivity = ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count),0), 2).
      For an all-categories figure the dashboard uses the per-category rows: WHERE category <> 'ALL'; for one
      category filter category = 'CONSUMER'/'FEEDER'/'DT'. Per technician = GROUP BY technician_name. Active
      technicians = COUNT(DISTINCT technician_name).
