    summary: >-
      **Non-SAT ageing** counts installed meters that have no SAT yet, bucketed by days since installation. It sums
      `meter_count` from Postgres `gold_non_sat_ageing_snapshot` by `age_key`. The ETL builds it from the
      installation day aggregate (Silver `unified_installations` + replacement installs, SAT number from
      `sat_meter_mappings`): a meter is Non-SAT pending when its sat_number is blank or 'SATPENDING', and it is only
