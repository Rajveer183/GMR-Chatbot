      - >-
          total_active_technicians is SUMMED across months (and categories when category=all), so it over-counts.
      - >-
          With category=all, trend active_days / tech-days are summed across category rows (inflated); the correct
          distinct values are on category='ALL' rows.
      - A discom filter is ignored (no discom filter level in the cube).
      - Row-level-security-scoped users get empty data (every filter has no db column -> AND 1=0).
    sql_recipe: >-
      Monthly Productivity trend (dashboard KPI 3): FROM public.gold_mi_productivity_trend_month_agg. For the
      program-wide monthly series use WHERE project = 'ALL' AND filter_level = 'all' AND aggregate_level = 'all' AND
      category = 'ALL' (a real project: project = 'kashi' etc.; one category: category = 'CONSUMER'). Per month:
      SUM(total_installations), ROUND(SUM(total_installations)::numeric / NULLIF(SUM(technician_day_count),0), 2) AS
      productivity, SUM(active_technicians), SUM(active_days), GROUP BY month_start. For a zone/circle/division
      scope use filter_level + filter_label; for a per-zone comparison use aggregate_level = 'zone' and GROUP BY
      label.
    followups:
      - Show the monthly installation productivity trend
      - Explain the MI-Progress KPI
  - number: 4
    title: Meter Replacement
    kpi_code: defective_meters
    backend_kpi_id: 4
    section: MI
    card: Tracks defective meters based on replacement data (KPI display name 'Defective Meters').
    aliases:
      - meter replacement
      - defective meter
      - defective meters
      - defect rate
      - defect kpi
      - defective type
      - burnt meter
      - faulty meter
      - meter burnt
      - meter faulty
      - kpi 4
      - kpi4
      - kpi-4
    summary: >-
      **Meter Replacement** (code `defective_meters`) counts meters found defective when they were replaced. A
      defect is a completed replacement complaint in Silver `unified_complaints`: old AND new meter serial present
      and work_completed_at set. The ETL classifies the complaint's `sub_complaint_type` into Meter Burnt / Meter
      Faulty / Others (plus Tampered / Stop / Bypass), looks up the OLD meter's OEM from
      `unified_smart_meter_inventory`, and writes Postgres `gold_meter_defect_event_day_agg`. Defect rate =
      Meter-Faulty count / installed meters (from `gold_mi_installation_*_agg`, replacements excluded) x 100, per
      OEM.
    gold_tables:
      - table: gold_meter_defect_event_day_agg
        columns: >-
          period_start, project, geography, category, meter_type, defective_type, detailed_defective_type, oem,
          defect_count, defect_rate_numerator_count
      - table: gold_mi_installation_month_agg + _day_agg
        columns: 'denominator: oem, has_meter_serial, is_replacement, meter_count'
    silver_tables:
      - table: unified_complaints
        columns: >-
          old_meter_serial_number, new_meter_serial_number, work_completed_at, sub_complaint_type,
          complaint_entity_type, new_meter_type, project, geography
        source: COMQC, DOMQC, FOMQC
      - table: unified_smart_meter_inventory
        columns: meter_serial_number, manufacturer, meter_type (of the OLD meter)
        source: INVSMM
      - table: unified_installations
        columns: new_meter_serial_number, new_meter_make, new_meter_type (fallback) + the installation denominator
        source: CMIQC, CNSQC, DMIQC, FMIQC
    logic:
      - step: Detection
        detail: >-
          A defect = complaint with old_meter_serial_number AND new_meter_serial_number non-blank AND
          work_completed_at IS NOT NULL.
      - step: Defective date
        detail: cast(work_completed_at AS date).
      - step: Text cleaning
        detail: upper(trim(sub_complaint_type)) with double quotes and non-breaking spaces removed.
      - step: Classification
        detail: >-
          METER BURNT / METER TERMINAL BURNT -> Meter Burnt; DISPLAY BACK LED OFF OR PARTIAL DISPLAY, METER DISPLAY
          FAULTY / DISPLAY NOT VISIBLE, METER RTC CORRUPTED, NO DISPLAY OR DISPLAY NOT VISIBLE, PUSH BUTTON NOT
          WORKING -> Meter Faulty; METER TAMPERED variants -> Meter Tampered; METER STOP/STOPPED/RUNNING SLOW ->
          Meter Stop; METER BYPASSED variants -> Meter Bypass; anything else -> Others.
      - step: OEM / meter type
        detail: >-
          OEM of the OLD meter: coalesce(inventory.manufacturer, installation.new_meter_make, 'Unknown'), joined on
          the normalised old serial.
      - step: Gold aggregate
        detail: defect_count = count(*); defect_rate_numerator_count = rows where defective_type = 'Meter Faulty'.
      - step: Denominator
        detail: >-
          installed meters from gold_mi_installation_month/day_agg WHERE NOT is_replacement AND has_meter_serial AND
          oem IS NOT NULL, grouped by UPPER(oem).
    formulas:
      - output: total_defective
        formula: SUM(defect_count)
      - output: total_burnt / total_faulty / total_others
        formula: SUM(defect_count) FILTER (defective_type = 'Meter Burnt' / 'Meter Faulty' / 'Others')
      - output: installed_meters
        formula: SUM(meter_count) from the installation aggregates (no replacements), per OEM
      - output: defect_rate_pct
        formula: ROUND(SUM(defect_rate_numerator_count) / installed_meters x 100, 2) -- Meter Faulty only
    caveats:
      - Counts complaint rows (count(*)), not distinct old serials.
      - >-
          Tampered / Stop / Bypass count in total_defective but in none of burnt/faulty/others, so those three can
          sum to less than the total.
      - No period breakdown in the response -- the card's 'Trend' label has no time series behind it.
      - The denominator ignores the discom filter and row-level-security scope (the numerator applies both).
    sql_recipe: >-
      Meter Replacement / Defective Meters (dashboard KPI 4): counts FROM public.gold_meter_defect_event_day_agg:
      SUM(defect_count) (GROUP BY defective_type for Burnt/Faulty/Others, by oem for per-OEM, by
      detailed_defective_type for the exact reason); date filter on period_start (the defective date). Defect rate %
      = 100 * SUM(defect_rate_numerator_count) / installed meters, where installed meters = SUM(meter_count) FROM
      public.gold_mi_installation_month_agg WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL --
      combine the two as scalar subqueries in one SELECT (no JOIN between these tables).
    followups:
      - How many defective meters are there by defect type?
      - Which OEM has the most burnt meters?
  - number: 5
    title: Total & category wise supply utilization rate
    kpi_code: inventory_utilization
    backend_kpi_id: 5
    section: Supply
    card: Efficiency of material usage (Installed vs Total Stock) -- trend and comparison.
    aliases:
      - supply utilization
      - supply utilisation
      - utilization rate
      - utilisation rate
      - inventory utilization
      - inventory utilisation
      - material usage
      - installed vs total stock
      - kpi 5
      - kpi5
      - kpi-5
    summary: >-
      **Supply utilization rate** = total installed / total inventory x 100, cumulative up to the 'to' date. It sums
      `inventory_count` (meters received, by DI date) and `installed_count` (meters installed, by MI date) from
      Postgres `gold_meter_inventory_event_day_agg` / `_month_agg`. The ETL builds those events from Silver
      `unified_smart_meter_inventory` (INVSMM stock) FULL OUTER JOIN the installations (`unified_installations` +
      replacement installs from `unified_complaints`), one row per normalised meter serial; remaining stock =
      inventory - stock_consumed.
    gold_tables:
      - table: gold_meter_inventory_event_day_agg / _month_agg
        columns: >-
          period_start, period_end, project, discom, zone, circle, division, sub_division, category, meter_type,
          inventory_count, installed_count, stock_consumed_count
      - table: gold_inventory_unutilized_stock_snapshot
        columns: project, warehouse, category, meter_type, inventory_date, stock_count (comparison section only)
    silver_tables:
      - table: unified_smart_meter_inventory
        columns: meter_serial_number, di_date, discom, warehouse, meter_type, sku
        source: INVSMM
      - table: unified_installations
        columns: new_meter_serial_number, mi_date, project, geography, report_category, new_meter_type
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: old/new_meter_serial_number, work_completed_at (replacement installs, scrapped old meters)
        source: COMQC, DOMQC, FOMQC
    logic:
      - step: One row per serial
        detail: >-
          inventory_latest FULL OUTER JOIN installations_latest on the normalised serial, LEFT JOIN disposed old
          meters.
      - step: Events
        detail: >-
          Receipt on DI date (inventory_count=1); install on MI date (installed_count=1, stock_consumed_count=1 if
          the meter had an inventory row); disposal of an uninstalled scrapped old meter (stock_consumed_count=1).
      - step: Project / geography
        detail: >-
          project = installation project else warehouse -> project map; zone/circle/division/sub_division only from
          the installation (NULL for stock).
      - step: Category
        detail: >-
          Inventory: 3PLTCTSM / HTCTPTSM with sku NOT LIKE '%CON%' -> DT / FEEDER, else CONSUMER; falls back to the
          installation category.
      - step: Backend
        detail: >-
          Opening snapshot sums every month before 'from' (totals are cumulative); a project filter zeroes all three
          counts for other projects.
      - step: Trend
        detail: 'Running totals per bucket: SUM(x) OVER (PARTITION BY bucket ORDER BY period_start).'
    formulas:
      - output: total_inventory
        formula: SUM(inventory_count) (DI date <= to)
      - output: total_installed
        formula: SUM(installed_count) (MI date <= to)
      - output: remaining_stock
        formula: SUM(inventory_count) - SUM(stock_consumed_count)
      - output: utilization_rate_pct
        formula: ROUND(total_installed x 100 / total_inventory, 2)
      - output: comparison[label]
        formula: installed = SUM(installed_count); inventory = installed + current unutilized stock_count
    caveats:
      - A project filter also reduces inventory (the formula doc says inventory is global).
      - remaining_stock uses stock_consumed_count, not inventory - installed.
      - >-
          Stock rows have NULL zone/circle/division in Gold. The chatbot counts stock in the zone of its warehouse
          (sql/hierarchy.py) so zone-wise supplied / utilization include it; circle/division still exclude stock.
      - The comparison's stock is the CURRENT snapshot, not stock as of 'to'.
    sql_recipe: >-
      Supply utilization rate (dashboard KPI 5): FROM public.gold_meter_inventory_event_month_agg (or _day_agg),
      cumulative up to the as-of date: total_inventory = SUM(inventory_count), total_installed =
      SUM(installed_count), utilization % = ROUND(100.0 * SUM(installed_count) / NULLIF(SUM(inventory_count),0), 2),
      remaining stock = SUM(inventory_count) - SUM(stock_consumed_count); as-of date filter period_start <= date.
      Category breakdown GROUP BY category ('CONSUMER','FEEDER','DT').
    followups:
      - What is the supply utilization rate by category?
      - Explain the MI pace vs stock availability KPI
  - number: 6
