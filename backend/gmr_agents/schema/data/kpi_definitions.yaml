      KPI (built from Silver `unified_smart_meter_inventory` + `unified_installations` + replacement complaints):
      remaining stock = running SUM(inventory_count - stock_consumed_count), where consumed = installed from stock +
      scrapped.
    gold_tables:
      - table: gold_meter_inventory_event_day_agg / _month_agg
        columns: >-
          period_start, period_end, project, geography, category, meter_type, inventory_count, installed_count,
          stock_consumed_count
      - table: gold_inventory_unutilized_stock_snapshot
        columns: project, warehouse, category, meter_type, stock_count (comparison)
    silver_tables:
      - table: unified_smart_meter_inventory
        columns: meter_serial_number, di_date, discom, warehouse, meter_type, sku
        source: INVSMM
      - table: unified_installations
        columns: new_meter_serial_number, mi_date, project, geography, report_category, new_meter_type
        source: CMIQC, CNSQC, DMIQC, FMIQC
      - table: unified_complaints
        columns: old/new_meter_serial_number, work_completed_at
        source: COMQC, DOMQC, FOMQC
    logic:
      - step: Events
        detail: Same receipt / install / disposal events as the supply-utilization KPI (one row per serial).
      - step: Stock available
        detail: received - consumed, where consumed = installed from stock + scrapped old meters.
      - step: Trend
        detail: Running totals per bucket of inventory, installed and remaining_stock.
      - step: By meter type
        detail: >-
          remaining_stock_by_meter_type = SUM(inventory_count - stock_consumed_count) GROUP BY meter_type (3PLTCTSM
          shown as DT, HTCTPTSM as FEEDER).
    formulas:
      - output: total_inventory / total_installed
        formula: SUM(inventory_count) / SUM(installed_count)
      - output: remaining_stock
        formula: SUM(inventory_count - stock_consumed_count)
      - output: utilization_rate_pct
        formula: installed x 100 / inventory
      - output: comparison[label]
        formula: >-
          installed = SUM(installed_count); remaining_stock = current unutilized stock_count; inventory = installed
          + stock
    caveats:
      - >-
          Period and comparison remaining_stock use stock_consumed_count / the current snapshot, not inventory -
          installed.
      - >-
          Same caveats as supply utilization: project filter reduces inventory; stock rows have no
          zone/circle/division.
    sql_recipe: >-
      MI pace vs Stock availability (dashboard KPI 6): FROM public.gold_meter_inventory_event_month_agg: per month
      SUM(inventory_count) AS received, SUM(installed_count) AS installed, SUM(inventory_count -
      stock_consumed_count) AS net_stock_change; cumulative remaining stock = running SUM of net_stock_change
      (SUM(...) OVER (ORDER BY period_start)). Remaining stock by meter type = SUM(inventory_count -
      stock_consumed_count) GROUP BY meter_type.
