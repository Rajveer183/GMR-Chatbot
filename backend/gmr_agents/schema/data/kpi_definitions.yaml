  - number: 7
    title: Un-utilized stock ageing
    kpi_code: unutilized_stock_aging
    backend_kpi_id: 7
    section: Supply
    card: Duration in days since stock intake (DIDate) for uninstalled items.
    aliases:
      - unutilized stock
      - un-utilized stock
      - unutilised stock
      - un-utilised stock
