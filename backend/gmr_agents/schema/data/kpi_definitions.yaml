      - step: Age
        detail: >-
          datediff(ETL run date in Asia/Kolkata, mi_date) -> age_0_30 / age_31_60 / age_61_90 / age_91_120 /
          age_120_plus (frozen at refresh time).
      - step: Gold
        detail: GROUP BY project, geography, inventory_category, inventory_meter_type, age_key; meter_count = sum.
    formulas:
      - output: total_non_sat
