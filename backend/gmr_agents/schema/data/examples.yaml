      WHERE LOWER(project) = 'agra'

  - q: ["Show the full journey of meter AL1151970 from supply to revenue", "meter AL1151970 lifecycle supply to collection", "track meter journey of a serial number"]
    note: "One Athena query, never Postgres: supply + custody (inventory), installation, SAT batch, invoice and collection dates (sat_milestones, joined on project AND sat_number). Revenue realised = collection dates. A missing stage stays NULL -- say it has not happened yet. Durations come from the days_* columns, never computed by hand."
    sql: |
      WITH inv AS (SELECT meter_serial_number, di_date, warehouse, manufacturer, gmr_to_agency_ts, agency, agency_to_sup_ts, sup_to_tech_ts
                   FROM gmr_wfm_silver.unified_smart_meter_inventory WHERE meter_serial_number = 'AL1151970' ORDER BY updated_at DESC LIMIT 1),
           mi AS (SELECT new_meter_serial_number, consumer_number, mi_date, report_category, new_meter_type, new_meter_make, project, zone, division, technician_name
                  FROM gmr_wfm_silver.unified_installations WHERE new_meter_serial_number = 'AL1151970' ORDER BY updated_at DESC LIMIT 1),
           sat AS (SELECT m.meter_serial_number, m.sat_number, s.sat_date, s.lumpsum_invoice_date, s.pmpm_invoice_date, s.lumpsum_collection_date, s.pmpm_collection_date
                   FROM gmr_wfm_silver.sat_meter_mappings m
                   LEFT JOIN gmr_wfm_silver.sat_milestones s ON s.project = m.project AND s.sat_number = m.sat_number
                   WHERE m.meter_serial_number = 'AL1151970' ORDER BY m.updated_at DESC LIMIT 1)
      SELECT COALESCE(mi.new_meter_serial_number, inv.meter_serial_number, sat.meter_serial_number) AS meter_serial,
             mi.consumer_number, mi.report_category AS category, mi.new_meter_type AS meter_type, COALESCE(mi.new_meter_make, inv.manufacturer) AS make,
             mi.project, mi.zone, mi.division, inv.di_date AS supplied_on, inv.warehouse, inv.gmr_to_agency_ts AS issued_to_agency_at, inv.agency,
             inv.agency_to_sup_ts AS issued_to_supervisor_at, inv.sup_to_tech_ts AS issued_to_technician_at, mi.mi_date AS installed_on,
             mi.technician_name AS technician, sat.sat_number, sat.sat_date, sat.lumpsum_invoice_date, sat.pmpm_invoice_date,
             sat.lumpsum_collection_date, sat.pmpm_collection_date,
             date_diff('day', CAST(inv.di_date AS date), CAST(mi.mi_date AS date)) AS days_supply_to_install,
             date_diff('day', CAST(mi.mi_date AS date), CAST(sat.sat_date AS date)) AS days_install_to_sat,
             date_diff('day', CAST(sat.sat_date AS date), CAST(sat.lumpsum_invoice_date AS date)) AS days_sat_to_lumpsum_invoice,
             date_diff('day', CAST(sat.lumpsum_invoice_date AS date), CAST(sat.lumpsum_collection_date AS date)) AS days_lumpsum_invoice_to_collection,
             date_diff('day', CAST(sat.pmpm_invoice_date AS date), CAST(sat.pmpm_collection_date AS date)) AS days_pmpm_invoice_to_collection
      FROM mi FULL OUTER JOIN inv ON inv.meter_serial_number = mi.new_meter_serial_number
      FULL OUTER JOIN sat ON sat.meter_serial_number = COALESCE(mi.new_meter_serial_number, inv.meter_serial_number)

  - q: ["What is the current stage of meter SC10143933?", "which stage is meter AL1650206 in", "where is meter X now", "meter X kis stage pe hai", "status of meter X"]
    note: "One meter's stage = furthest step reached across inventory, installations and SAT mapping (FULL OUTER JOIN -- a meter not yet installed is only in inventory). Never unified_smart_meter_asset. Answer with the current_stage name and the date it reached that step."
    sql: |
      WITH inv AS (SELECT meter_serial_number, meter_status, warehouse, di_date, gmr_to_agency_ts, agency, agency_to_sup_ts, sup_to_tech_ts, installed_ts
                   FROM gmr_wfm_silver.unified_smart_meter_inventory WHERE meter_serial_number = 'SC10143933' ORDER BY updated_at DESC LIMIT 1),
           mi AS (SELECT new_meter_serial_number, mi_date, project, zone, division
                  FROM gmr_wfm_silver.unified_installations WHERE new_meter_serial_number = 'SC10143933' ORDER BY updated_at DESC LIMIT 1),
           sat AS (SELECT m.meter_serial_number, m.sat_number, s.sat_date, s.pmpm_collection_date
                   FROM gmr_wfm_silver.sat_meter_mappings m
                   LEFT JOIN gmr_wfm_silver.sat_milestones s ON s.project = m.project AND s.sat_number = m.sat_number
                   WHERE m.meter_serial_number = 'SC10143933' ORDER BY m.updated_at DESC LIMIT 1)
      SELECT COALESCE(mi.new_meter_serial_number, inv.meter_serial_number, sat.meter_serial_number) AS meter_serial,
             CASE WHEN TRY_CAST(regexp_extract(sat.sat_number, '(\d+)') AS integer) BETWEEN 1 AND 13
                       AND sat.pmpm_collection_date IS NOT NULL THEN 'Revenue realized'
                  WHEN TRY_CAST(regexp_extract(sat.sat_number, '(\d+)') AS integer) BETWEEN 1 AND 13 THEN 'SAT to Revenue (SAT done, revenue pending)'
                  WHEN mi.mi_date IS NOT NULL OR inv.installed_ts IS NOT NULL THEN 'Installation to SAT (installed, SAT pending)'
                  WHEN inv.sup_to_tech_ts IS NOT NULL THEN 'Technician to Installation (with technician)'
                  WHEN inv.agency_to_sup_ts IS NOT NULL THEN 'Supervisor to Technician (with supervisor)'
                  WHEN inv.gmr_to_agency_ts IS NOT NULL THEN 'Agency to Supervisor (with agency)'
                  ELSE 'DI to Agency (in GMR stock)' END AS current_stage,
             inv.meter_status, inv.warehouse, inv.di_date AS received_in_stock, inv.gmr_to_agency_ts AS issued_to_agency_at, inv.agency,
             inv.agency_to_sup_ts AS issued_to_supervisor_at, inv.sup_to_tech_ts AS issued_to_technician_at,
             mi.mi_date AS installed_on, mi.project, mi.zone, mi.division, sat.sat_number, sat.sat_date, sat.pmpm_collection_date
      FROM mi FULL OUTER JOIN inv ON inv.meter_serial_number = mi.new_meter_serial_number
      FULL OUTER JOIN sat ON sat.meter_serial_number = COALESCE(mi.new_meter_serial_number, inv.meter_serial_number)

  - q: ["Which category and meter type is meter AL1654509", "what type of meter is X", "meter X consumer hai ya DT", "make and phase of meter X"]
    note: "One meter's category / type / make: installation row first, inventory as the fallback for a meter not yet installed. Never unified_smart_meter_asset."
    sql: |
      WITH mi AS (SELECT new_meter_serial_number, report_category, new_meter_type, new_meter_make, project
                  FROM gmr_wfm_silver.unified_installations WHERE new_meter_serial_number = 'AL1654509' ORDER BY updated_at DESC LIMIT 1),
           inv AS (SELECT meter_serial_number, meter_type, sku, manufacturer, meter_status
                   FROM gmr_wfm_silver.unified_smart_meter_inventory WHERE meter_serial_number = 'AL1654509' ORDER BY updated_at DESC LIMIT 1)
      SELECT COALESCE(mi.new_meter_serial_number, inv.meter_serial_number) AS meter_serial,
             mi.report_category AS category, COALESCE(mi.new_meter_type, inv.meter_type) AS meter_type,
             COALESCE(mi.new_meter_make, inv.manufacturer) AS make, inv.sku, mi.project, inv.meter_status
      FROM mi FULL OUTER JOIN inv ON inv.meter_serial_number = mi.new_meter_serial_number

  - q: ["Total active days in Chunar division last month", "how many days did technicians work in a division", "active days zone wise this month"]
    note: "Active days = COUNT(DISTINCT period_start) (calendar days with an install) -- never SUM(active_days), which is 1 per row and only counts rows. Give technician-days, technicians and installs alongside."
    sql: |
      SELECT COUNT(DISTINCT period_start) AS active_days,
             EXTRACT(DAY FROM date_trunc('month', CURRENT_DATE) - INTERVAL '1 day')::int AS days_in_month,
             SUM(technician_day_count) AS technician_days,
             COUNT(DISTINCT technician_name) AS active_technicians,
             SUM(installation_count) AS installations
      FROM public.gold_mi_technician_productivity_day_agg
      WHERE category = 'ALL' AND LOWER(division) = 'edd chunar'
        AND period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '1 month')::date
        AND period_start < date_trunc('month', CURRENT_DATE)::date

  - q: ["Productivity weekly in August 2026 in Kashi", "week-wise installation productivity this month", "weekly installs and technicians in a month"]
    note: "Weekly = month-anchored weeks (1-7, 8-14, 15-21, 22-28, 29-end), never ISO. Compute week_start in a subquery, then GROUP BY ROLLUP (week_start) -- GROUPING() cannot take a SELECT alias. Same bucket for installs (gold_mi_installation_day_agg)."
    sql: |
      SELECT CASE WHEN GROUPING(week_start) = 1 THEN 'Total'
                  ELSE to_char(week_start, 'DD Mon') || ' - ' || to_char(LEAST(week_start + 6, (date_trunc('month', week_start) + INTERVAL '1 month - 1 day')::date), 'DD Mon') END AS week,
             ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS productivity,
             COUNT(DISTINCT technician_name) AS active_technicians,
             COUNT(DISTINCT period_start) AS active_days,
             SUM(installation_count) AS installations
      FROM (SELECT *, date_trunc('month', period_start)::date + ((EXTRACT(DAY FROM period_start)::int - 1) / 7) * 7 AS week_start
            FROM public.gold_mi_technician_productivity_day_agg
            WHERE category = 'ALL' AND LOWER(project) = 'kashi'
              AND period_start >= DATE '2026-08-01' AND period_start <= DATE '2026-08-31') d
      GROUP BY ROLLUP (week_start)
      ORDER BY GROUPING(week_start) DESC, week_start

  - q: ["Remaining stock zone wise", "stock left division-wise", "how much stock is in each zone"]
    note: "Stock counts in the zone of the warehouse holding it (the app places it); a warehouse with no matching zone stays in 'Not installed yet (in stock)'. Never refuse."
    sql: |
      SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total' WHEN zone IS NULL OR zone = '' THEN 'Not installed yet (in stock)' ELSE UPPER(zone) END AS zone,
             CASE WHEN GROUPING(zone) = 1 OR zone IS NULL OR zone = '' THEN '' ELSE MAX(UPPER(project)) END AS project,
             SUM(inventory_count) AS supplied, SUM(installed_count) AS installed,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= CURRENT_DATE
      GROUP BY ROLLUP (zone)
      ORDER BY GROUPING(zone) DESC, remaining_stock DESC, supplied DESC
    extra:
      - purpose: "Remaining stock by project (where the stock actually sits)"
        sql: |
          SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
                 SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
          FROM public.gold_meter_inventory_event_day_agg
          WHERE period_start <= CURRENT_DATE
          GROUP BY ROLLUP (project)
          ORDER BY GROUPING(project) DESC, remaining_stock DESC

