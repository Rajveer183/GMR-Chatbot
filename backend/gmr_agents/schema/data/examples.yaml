# Verified question -> SQL examples (few-shot "training" bank for the planner).
# Every SQL here was run against the live data and its numbers checked by hand
# (eval/question_bank/verify_examples.py re-runs them all). For each question the
# planner sees the EXAMPLES_PER_QUESTION (3) most similar examples (hybrid retrieval:
# BM25 + embeddings) as worked patterns. Re-read automatically when the file changes.
#
# PROMPT COST MAP (measured 2026-10-04) -- keep each example small:
#   q[0] (first 90 chars)     triage, TRIAGE_EXAMPLE_MENU_SIZE (8) best-ranked     ~25 tok each
#   q[0] + note + sql + extra SQL planner, 3 best-ranked             ~730 tok total (~160 tok sql avg)
#   q[1:], suggest, note      retrieval index (note: first 300 chars) -- free in prompts
#   suggest                   offered follow-ups (no prompt cost)
#   q:      one or more phrasings
#   sql:    the main query
#   extra:  optional extra queries [{purpose, sql}]
#   note:   optional hint the planner should carry over
#   suggest: optional -- the exact question offered as a suggested follow-up. Only
#           examples with `suggest` are ever offered, and each one was asked live
#           and its answer checked; asked verbatim it routes to this example's SQL.
examples:
  - q: ["How many smart meters have been installed so far?", "total meters installed till date", "kitne meter lage ab tak"]
    suggest: "How many smart meters have been installed so far?"
    note: "'smart meters' = all meters. MI progress filters exactly: has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement -- nothing else."
    sql: |
      SELECT SUM(meter_count) AS meters_installed
      FROM public.gold_mi_installation_month_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement

  - q: ["How many meters were installed yesterday?", "kal kitne meter lage", "installs yesterday by category"]
    suggest: "How many meters were installed yesterday?"
    sql: |
      SELECT CURRENT_DATE - 1 AS install_date, SUM(meter_count) AS meters_installed,
             COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'CONSUMER'), 0) AS consumer,
             COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'DT'), 0) AS dtr,
             COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'FEEDER'), 0) AS feeder
      FROM public.gold_mi_installation_day_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        AND period_start = CURRENT_DATE - 1

  - q: ["Give me a one-line status of the program", "program status", "quick update on the programme", "export today's headline stats", "CXO weekly summary", "Give me installed so far, SAT percentage and remaining stock in one go"]
    suggest: "Give me installed so far, SAT percentage and remaining stock in one go."
    note: "Headline numbers come from the dashboard stats row (sat_percent = SAT / ELIGIBLE meters). Never compute SAT % from gold_mi_installation_* tables. Invoiced meters = total_lumpsum_invoice_done_meters; PMPM collected = total_pmpm_collection_done_meters."
    sql: |
      SELECT refreshed_at, total_meter_installations AS meters_installed, meter_installed_on_last_day AS installed_last_day,
             total_sat_meters AS sat_meters, sat_percent AS sat_pct, total_current_inventory_count AS meters_supplied,
             total_current_remaining_stock_count AS remaining_stock, total_lumpsum_invoice_done_meters AS invoiced_meters,
             total_pmpm_collection_done_meters AS pmpm_collected_meters, average_meter_journey_days AS avg_journey_days
      FROM public.gold_dashboard_stats_snapshot
      WHERE singleton

  - q: ["What has changed since last week on the headline KPIs?", "week over week change in KPIs", "headline numbers now vs 7 days ago"]
    suggest: "What has changed since last week on the headline KPIs?"
    note: "SAT/invoice snapshots have no history: say SAT change cannot be computed."
    sql: |
      SELECT 'Meters installed' AS kpi,
             SUM(meter_count) AS now_value,
             SUM(meter_count) FILTER (WHERE period_start <= CURRENT_DATE - 7) AS week_ago_value,
             SUM(meter_count) - SUM(meter_count) FILTER (WHERE period_start <= CURRENT_DATE - 7) AS change
      FROM public.gold_mi_installation_day_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
      UNION ALL
      SELECT 'Meters supplied', SUM(inventory_count), SUM(inventory_count) FILTER (WHERE period_start <= CURRENT_DATE - 7),
             SUM(inventory_count) - SUM(inventory_count) FILTER (WHERE period_start <= CURRENT_DATE - 7)
      FROM public.gold_meter_inventory_event_day_agg
      UNION ALL
      SELECT 'Remaining stock', SUM(inventory_count - stock_consumed_count),
             SUM(inventory_count - stock_consumed_count) FILTER (WHERE period_start <= CURRENT_DATE - 7),
             SUM(inventory_count - stock_consumed_count) - SUM(inventory_count - stock_consumed_count) FILTER (WHERE period_start <= CURRENT_DATE - 7)
      FROM public.gold_meter_inventory_event_day_agg

  - q: ["Which three numbers should I worry about today?", "red flags today", "what should I worry about", "top risks", "watchlist"]
    suggest: "Which three numbers should I worry about today?"
    note: "Each check: value vs threshold; severity = value / threshold - 1 (higher = worse). Show all, the answer names the top 3 by severity."
    sql: |
      WITH t AS (
        SELECT 'Open O&M tickets older than 60 days (% of open)' AS check_name,
               (SELECT ROUND(SUM(ticket_count) FILTER (WHERE age_key = 'age_60_plus') * 100.0 / NULLIF(SUM(ticket_count), 0), 2)
                FROM public.gold_om_open_ageing_snapshot) AS value, 20.0 AS threshold
        UNION ALL
        SELECT 'Eligible meters waiting > 90 days for SAT (% of installed)',
               (SELECT ROUND(SUM(meter_count) FILTER (WHERE age_key IN ('age_91_120', 'age_120_plus')) * 100.0
                       / (SELECT SUM(meter_count) FROM public.gold_mi_sat_invoice_snapshot), 2)
                FROM public.gold_non_sat_ageing_snapshot), 3.0
        UNION ALL
        SELECT 'Lumpsum outstanding (% of invoiced)',
               (SELECT ROUND((SUM(lumpsum_invoiced) - SUM(lumpsum_realised)) * 100.0 / NULLIF(SUM(lumpsum_invoiced), 0), 2)
                FROM (SELECT lumpsum_invoiced, lumpsum_realised,
                             ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
                      FROM public.revenue_receivables) r WHERE rn = 1), 20.0
        UNION ALL
        SELECT 'Revenue not realized > 60 days since SAT (% of SAT meters)',
               (SELECT ROUND(SUM(outstanding_count) FILTER (WHERE CURRENT_DATE - sat_date > 60) * 100.0
                       / (SELECT SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) FROM public.gold_mi_sat_invoice_snapshot), 2)
                FROM public.gold_revenue_ageing_snapshot), 5.0
        UNION ALL
        SELECT 'Installs: last 7 days vs previous 7 (% drop)',
               (SELECT ROUND((1 - SUM(meter_count) FILTER (WHERE period_start > CURRENT_DATE - 7) * 1.0
                       / NULLIF(SUM(meter_count) FILTER (WHERE period_start <= CURRENT_DATE - 7), 0)) * 100, 2)
                FROM public.gold_mi_installation_day_agg
                WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
                  AND period_start > CURRENT_DATE - 14), 20.0
        UNION ALL
        SELECT 'Defect rate (%)',
               (SELECT ROUND((SELECT SUM(defect_rate_numerator_count) FROM public.gold_meter_defect_event_day_agg) * 100.0
                       / SUM(meter_count), 2)
                FROM public.gold_mi_installation_month_agg
                WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL), 1.5
      )
      SELECT check_name, value, threshold,
             ROUND(LEAST(GREATEST(value / threshold - 1, -1), 3), 2) AS severity,
             CASE WHEN value > threshold THEN 'RED FLAG' ELSE 'ok' END AS status
      FROM t
      ORDER BY severity DESC

  - q: ["What is our remaining stock?", "how much stock is left", "stock balance", "meters in stock now"]
    suggest: "What is our remaining stock?"
    note: "Remaining stock = SUM(inventory_count) - SUM(stock_consumed_count) -- NEVER supplied minus installed (installs without a stock record would distort it)."
    sql: |
      SELECT SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock,
             SUM(inventory_count) AS meters_supplied, SUM(stock_consumed_count) AS stock_consumed
      FROM public.gold_meter_inventory_event_day_agg

  - q: ["What percentage of supplied meters has been installed?", "utilization rate", "supply utilization", "What is the supply utilization rate?"]
    suggest: "What percentage of supplied meters has been installed?"
    note: "Always the card's four figures: supplies, installed, utilization %, remaining stock -- never the rate alone."
    sql: |
      SELECT SUM(inventory_count) AS meters_supplied, SUM(installed_count) AS meters_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= CURRENT_DATE

  - q: ["Supply utilization summary from 23 Jun 2026 to 23 Sep 2026 in Varanasi I and Varanasi II zone", "utilization rate between two dates", "supply utilization for a date range zone wise"]
    note: "Utilization for a range = cumulative up to the END date (never in-range rows only -- that can exceed 100%); the range's own supplied / installed are extra FILTER columns."
    sql: |
      SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total' ELSE UPPER(zone) END AS zone,
             SUM(inventory_count) AS total_supplies, SUM(installed_count) AS total_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock,
             SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-06-23') AS supplied_in_period,
             SUM(installed_count) FILTER (WHERE period_start >= DATE '2026-06-23') AS installed_in_period
      FROM public.gold_meter_inventory_event_day_agg
      WHERE LOWER(project) = 'kashi' AND LOWER(zone) IN ('varanasi i', 'varanasi ii')
        AND period_start <= DATE '2026-09-23'
      GROUP BY ROLLUP (zone)
      ORDER BY GROUPING(zone) DESC, zone

  - q: ["Supply utilization rate for OEMs CAP and SEIPL", "supply utilization for some OEMs", "utilization rate for two SKUs", "supply utilization for these warehouses"]
    note: "warehouse / sku / oem are event-table columns. Several named: Total (them combined) first via ROLLUP, then each. One named: the same four figures without the ROLLUP."
    sql: |
      SELECT CASE WHEN GROUPING(UPPER(oem)) = 1 THEN 'Total' ELSE UPPER(oem) END AS oem,
             SUM(inventory_count) AS total_supplies, SUM(installed_count) AS total_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE UPPER(oem) IN ('CAP', 'SEIPL') AND period_start <= CURRENT_DATE
      GROUP BY ROLLUP (UPPER(oem))
      ORDER BY GROUPING(UPPER(oem)) DESC, total_supplies DESC

  - q: ["Supply utilization rate warehouse wise", "supply utilization OEM wise", "supply utilization SKU wise", "remaining stock and utilization by warehouse"]
    note: "X-wise = plain GROUP BY over every row up to the as-of date (no per-month window that drops quiet groups); installs with no warehouse stay only in the Total. Swap warehouse for oem / sku."
    sql: |
      SELECT CASE WHEN GROUPING(warehouse) = 1 THEN 'Total' ELSE UPPER(warehouse) END AS warehouse,
             SUM(inventory_count) AS total_supplies, SUM(installed_count) AS total_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= CURRENT_DATE
      GROUP BY ROLLUP (warehouse)
      HAVING GROUPING(warehouse) = 1 OR COALESCE(TRIM(warehouse), '') <> ''
      ORDER BY GROUPING(warehouse) DESC, total_supplies DESC

  - q: ["Supply utilization monthwise from Jan 2026 to Aug 2026 in Kashi", "monthly utilization rate trend", "utilization rate month by month"]
    note: "Trend = running totals: earlier history folds into the first month, rate per month = cumulative installed / cumulative supplied (never one month's installs / that month's supplies)."
    sql: |
      WITH m AS (
        SELECT GREATEST(date_trunc('month', period_start)::date, DATE '2026-01-01') AS month,
               SUM(inventory_count) AS supplied, SUM(installed_count) AS installed
        FROM public.gold_meter_inventory_event_month_agg
        WHERE LOWER(project) = 'kashi' AND period_start <= DATE '2026-08-31'
        GROUP BY 1)
      SELECT to_char(month, 'Mon YYYY') AS month,
             SUM(supplied) OVER (ORDER BY month) AS cumulative_supplied,
             SUM(installed) OVER (ORDER BY month) AS cumulative_installed,
             ROUND(SUM(installed) OVER (ORDER BY month) * 100.0 / NULLIF(SUM(supplied) OVER (ORDER BY month), 0), 2) AS utilization_rate_pct
      FROM m
      ORDER BY m.month

  - q: ["remaining stock type wise as of june 2026", "stock by meter type as on a date", "meter type wise stock left"]
    note: "Stock is a balance: everything up to the END of the named month (period_start <= last day), never that month's rows alone (that gives negative 'stock'). Output the stored meter_type; the app shows it as 1PH / 3PH / LTCT / HTCT (consumer), DTR, Feeder."
    sql: |
      SELECT CASE WHEN GROUPING(meter_type) = 1 THEN 'Total' ELSE meter_type END AS meter_type,
             CASE WHEN GROUPING(meter_type) = 1 THEN 'All' ELSE MIN(category) END AS category,
             SUM(inventory_count) AS supplied_till_date,
             SUM(stock_consumed_count) AS used_from_stock,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= DATE '2026-06-30'
      GROUP BY ROLLUP (meter_type)
      ORDER BY GROUPING(meter_type) DESC, remaining_stock DESC

  - q: ["mi pace vs stock category wise", "Is installation pace keeping up with stock category wise in Kashi", "installs per day vs remaining stock by category", "days of stock left by category", "MI pace vs stock availability for a warehouse / OEM / SKU"]
    note: "Card figures first (supplies, installed, utilization %, remaining stock), then the pace. MI pace = average meters installed per day over the 6 months up to the as-of date (that month so far + 5 full months); stock = as of that date. The as-of date lives ONLY in w (CURRENT_DATE, or e.g. DATE '2026-08-31' for 'as of August 2026') -- every other place reads (SELECT as_of FROM w) / (SELECT since FROM w), so nothing extra goes into GROUP BY. One SELECT with GROUP BY ROLLUP (never join separate CTEs without ON). pace_period carries the window so the answer can state it. Without 'category wise' drop the category column and ROLLUP; warehouse / oem / sku wise or a picked one uses those event-table columns the same way."
    sql: |
      WITH w AS (SELECT CURRENT_DATE AS as_of, (date_trunc('month', CURRENT_DATE) - INTERVAL '5 months')::date AS since)
      SELECT CASE WHEN GROUPING(category) = 1 THEN 'Total' ELSE category END AS category,
             SUM(inventory_count) AS total_supplies, SUM(installed_count) AS total_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock,
             ROUND(SUM(installed_count) FILTER (WHERE period_start >= (SELECT since FROM w)) * 1.0
                   / ((SELECT as_of FROM w) - (SELECT since FROM w) + 1), 1) AS installs_per_day,
             ROUND((SUM(inventory_count) - SUM(stock_consumed_count))
                   / NULLIF(SUM(installed_count) FILTER (WHERE period_start >= (SELECT since FROM w)) * 1.0
                            / ((SELECT as_of FROM w) - (SELECT since FROM w) + 1), 0)) AS days_of_stock_left,
             (SELECT to_char(since, 'DD Mon YYYY') || ' to ' || to_char(as_of, 'DD Mon YYYY') FROM w) AS pace_period
      FROM public.gold_meter_inventory_event_day_agg
      WHERE LOWER(project) = 'kashi' AND period_start <= (SELECT as_of FROM w)
      GROUP BY ROLLUP (category)
      ORDER BY GROUPING(category) DESC, days_of_stock_left

  - q: ["mi pace vs stock daily from 1 sep 2026 to 15 sep 2026 in agra", "installation pace vs stock day wise", "daily installs vs remaining stock trend"]
    note: "One row per day (generate_series, so quiet days show 0): that day's received / installed, and remaining stock at the end of the day = running SUM(inventory_count - stock_consumed_count) with all earlier history folded into the first day. Every column the outer query uses must come out of the CTE."
    sql: |
      WITH days AS (SELECT generate_series(DATE '2026-09-01', DATE '2026-09-15', INTERVAL '1 day')::date AS day),
      e AS (
        SELECT GREATEST(period_start, DATE '2026-09-01') AS day,
               SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-09-01') AS received,
               SUM(installed_count) FILTER (WHERE period_start >= DATE '2026-09-01') AS installed,
               SUM(inventory_count - stock_consumed_count) AS net_stock
        FROM public.gold_meter_inventory_event_day_agg
        WHERE LOWER(project) = 'agra' AND period_start <= DATE '2026-09-15'
        GROUP BY 1)
      SELECT to_char(days.day, 'DD Mon YYYY') AS day,
             COALESCE(e.received, 0) AS meters_received,
             COALESCE(e.installed, 0) AS meters_installed,
             SUM(COALESCE(e.net_stock, 0)) OVER (ORDER BY days.day) AS remaining_stock
      FROM days LEFT JOIN e ON e.day = days.day
      ORDER BY days.day

  - q: ["Un-utilized stock ageing for Agra HW", "stock ageing for a warehouse", "unused stock ageing in Prayagraj HW", "stock ageing for Aligarh Warehouse"]
    note: "A name ending HW / ZW / SWH / Warehouse is the warehouse (LOWER(warehouse) = 'agra_hw'), never the project 'agra'. Total plus every age band."
    sql: |
      SELECT 'Agra_HW' AS warehouse, SUM(stock_count) AS total_stock,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) <= 30), 0) AS days_0_30,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) BETWEEN 31 AND 60), 0) AS days_31_60,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) BETWEEN 61 AND 90), 0) AS days_61_90,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) > 90), 0) AS days_90_plus
      FROM public.gold_inventory_unutilized_stock_snapshot
      WHERE LOWER(warehouse) = 'agra_hw'

  - q: ["Top performing O&M technician in the last 30 days", "O&M top performer", "lowest O&M technician", "O&M technicians requiring support"]
    note: "Per technician on the category = 'ALL' rows: productivity = closed tickets / distinct days worked; rank by productivity, then closed tickets, then name (ASC for lowest). No minimum days, like the card."
    sql: |
      SELECT technician_name AS technician, UPPER(MIN(project)) AS project,
             ROUND(SUM(complaint_count)::numeric / NULLIF(COUNT(DISTINCT period_start), 0), 2) AS productivity_per_tech_day,
             SUM(complaint_count) AS closed_tickets, COUNT(DISTINCT period_start) AS active_days
      FROM public.gold_om_technician_productivity_day_agg
      WHERE category = 'ALL' AND period_start BETWEEN CURRENT_DATE - 31 AND CURRENT_DATE - 1
      GROUP BY technician_name
      ORDER BY productivity_per_tech_day DESC, closed_tickets DESC, technician_name
      LIMIT 10

  - q: ["O&M productivity category wise in September 2026", "O&M productivity for consumer meters", "complaint productivity DT vs feeder"]
    note: "One category = its own rows (split by meter type), technician-days = distinct (technician, day) pairs."
    sql: |
      SELECT category,
             ROUND(SUM(complaint_count)::numeric / NULLIF(COUNT(DISTINCT (technician_name, period_start)), 0), 2) AS productivity_per_tech_day,
             SUM(complaint_count) AS closed_tickets,
             COUNT(DISTINCT technician_name) AS active_technicians
      FROM public.gold_om_technician_productivity_day_agg
      WHERE category <> 'ALL' AND period_start BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
      GROUP BY category
      ORDER BY closed_tickets DESC

  - q: ["Open ticket ageing for AUTO and MANUAL complaint sources", "O&M active ticket ageing", "open tickets ageing SAT done vs pending", "unassigned open tickets ageing"]
    note: "The card: total open, SAT Done, SAT Pending and every band. Several values of a filter: Total of them first (ROLLUP), then each. One value or none: drop the ROLLUP column."
    sql: |
      SELECT CASE WHEN GROUPING(complaint_source) = 1 THEN 'Total' ELSE complaint_source END AS source,
             SUM(ticket_count) AS total_open_tickets,
             COALESCE(SUM(ticket_count) FILTER (WHERE sat_status = 'SAT DONE'), 0) AS sat_done,
             COALESCE(SUM(ticket_count) FILTER (WHERE sat_status = 'SAT PENDING'), 0) AS sat_pending,
             COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_0_7'), 0) AS days_0_7,
             COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_8_15'), 0) AS days_8_15,
             COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_16_30'), 0) AS days_16_30,
             COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_31_60'), 0) AS days_31_60,
             COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_60_plus'), 0) AS days_60_plus
      FROM public.gold_om_open_ageing_snapshot
      WHERE complaint_source IN ('AUTO', 'MANUAL')
      GROUP BY ROLLUP (complaint_source)
      ORDER BY GROUPING(complaint_source) DESC, total_open_tickets DESC

  - q: ["Total complaint meters, SAT done meters and non-SAT meters with their complaints", "complaint meters by SAT status", "SAT done vs non-SAT complaint meters", "complaint meters SAT status for a project in a month"]
    note: "Closed Analysis 'Top 50 Meters & SAT Status' tab: only meters in areas with tickets closed in the window (default last 30 days ending yesterday -- say so); a project / zone filter goes in both the areas CTE and the meter query."
    sql: |
      WITH areas AS (
        SELECT DISTINCT COALESCE(LOWER(discom), '') AS discom, COALESCE(LOWER(zone), '') AS zone,
               COALESCE(LOWER(circle), '') AS circle, COALESCE(LOWER(division), '') AS division,
               COALESCE(LOWER(sub_division), '') AS sub_division
        FROM public.gold_om_closed_tickets_day_agg
        WHERE closed_date BETWEEN CURRENT_DATE - 31 AND CURRENT_DATE - 1),
      m AS (
        SELECT c.* FROM public.gold_om_meter_complaints_agg c
        JOIN areas a ON a.discom = COALESCE(LOWER(c.discom), '') AND a.zone = COALESCE(LOWER(c.zone), '')
                    AND a.circle = COALESCE(LOWER(c.circle), '') AND a.division = COALESCE(LOWER(c.division), '')
                    AND a.sub_division = COALESCE(LOWER(c.sub_division), ''))
      SELECT COUNT(*) AS complaint_meters,
             COUNT(*) FILTER (WHERE sat_status = 'SAT Done') AS sat_done_meters,
             ROUND(COUNT(*) FILTER (WHERE sat_status = 'SAT Done') * 100.0 / NULLIF(COUNT(*), 0), 2) AS sat_done_pct,
             COUNT(*) FILTER (WHERE sat_status = 'Non-SAT') AS non_sat_meters,
             SUM(total_complaints) AS total_complaints,
             SUM(total_complaints) FILTER (WHERE sat_status = 'SAT Done') AS sat_done_complaints,
             ROUND(SUM(total_complaints) FILTER (WHERE sat_status = 'SAT Done') * 100.0 / NULLIF(SUM(total_complaints), 0), 2) AS sat_done_complaints_pct,
             SUM(total_complaints) FILTER (WHERE sat_status = 'Non-SAT') AS non_sat_complaints,
             MAX(total_complaints) AS max_complaints_one_meter
      FROM m

  - q: ["Top 50 complaint meters in Kashi", "Top 50 meters by number of complaints", "meters with most complaints", "repeat complaint meters top 50", "which meters had the most complaints in a month"]
    note: "Same window scoping as the SAT-status tiles: areas with a ticket closed in the window (default last 30 days). A month / date range named = that closed_date window -- answerable, never refuse it; total_complaints itself is the meter's all-time count."
    sql: |
      WITH areas AS (
        SELECT DISTINCT COALESCE(LOWER(discom), '') AS discom, COALESCE(LOWER(zone), '') AS zone,
               COALESCE(LOWER(circle), '') AS circle, COALESCE(LOWER(division), '') AS division,
               COALESCE(LOWER(sub_division), '') AS sub_division
        FROM public.gold_om_closed_tickets_day_agg
        WHERE closed_date BETWEEN CURRENT_DATE - 31 AND CURRENT_DATE - 1 AND LOWER(project) = 'kashi')
      SELECT c.meter_serial_number, UPPER(c.project) AS project, c.zone, c.category, c.total_complaints,
             c.open_complaints, c.closed_complaints, c.sat_status, c.sat_number
      FROM public.gold_om_meter_complaints_agg c
      JOIN areas a ON a.discom = COALESCE(LOWER(c.discom), '') AND a.zone = COALESCE(LOWER(c.zone), '')
                  AND a.circle = COALESCE(LOWER(c.circle), '') AND a.division = COALESCE(LOWER(c.division), '')
                  AND a.sub_division = COALESCE(LOWER(c.sub_division), '')
      WHERE LOWER(c.project) = 'kashi'
      ORDER BY c.total_complaints DESC
      LIMIT 50

  - q: ["Never / non-comm status", "non comm tickets summary", "never comm and not in communication tickets", "how many non-comm tickets are unassigned or escalated"]
    note: "Always complaint_type IN ('NEVER COMM', 'METER NOT IN COMMUNICATION') -- the table holds every open ticket. The card's ten figures; a filter (project / zone / category / status / remark) goes in the WHERE."
    sql: |
      SELECT SUM(ticket_count) AS total_tickets,
             SUM(ticket_count) FILTER (WHERE complaint_type = 'NEVER COMM') AS never_comm,
             SUM(ticket_count) FILTER (WHERE complaint_type = 'METER NOT IN COMMUNICATION') AS not_in_communication,
             SUM(ticket_count) - SUM(repeat_ticket_count) AS distinct_meters,
             SUM(repeat_ticket_count) AS repeat_tickets,
             SUM(ticket_count) FILTER (WHERE complaint_status <> 'UNASSIGNED') AS assigned,
             SUM(ticket_count) FILTER (WHERE complaint_status = 'UNASSIGNED') AS unassigned,
             SUM(ticket_count) FILTER (WHERE is_escalated) AS escalated_to_discom,
             SUM(ticket_count) FILTER (WHERE is_sm_replaced) AS meter_replaced_sm_to_sm,
             SUM(ticket_count) FILTER (WHERE sat_status = 'SAT PENDING') AS sat_pending
      FROM public.gold_om_open_ticket_detail_snapshot
      WHERE complaint_type IN ('NEVER COMM', 'METER NOT IN COMMUNICATION')

  - q: ["Never comm tickets status wise", "never comm tickets technician remark wise", "never comm tickets by status"]
    note: "One non-comm type named = that type only (complaint_type = 'NEVER COMM'); 'non-comm' = both. Swap complaint_status for remark_bucket (technician remark) or age_key."
    sql: |
      SELECT CASE WHEN GROUPING(complaint_status) = 1 THEN 'Total' ELSE complaint_status END AS status,
             SUM(ticket_count) AS tickets
      FROM public.gold_om_open_ticket_detail_snapshot
      WHERE complaint_type = 'NEVER COMM'
      GROUP BY ROLLUP (complaint_status)
      ORDER BY GROUPING(complaint_status) DESC, tickets DESC

  - q: ["O&M tickets escalated to discom", "escalated to discom summary", "discom approved rejected pending escalations", "average days discom takes to attend escalations"]
    note: "Tickets = SUM(ticket_count), never escalation_count. Average days = SUM(attend_days_sum) / SUM(attended_count)."
    sql: |
      SELECT SUM(ticket_count) AS escalated_tickets,
             SUM(ticket_count) FILTER (WHERE age_key IN ('age_31_60', 'age_60_plus')) AS older_than_30_days,
             SUM(ticket_count) FILTER (WHERE complaint_type IN ('NEVER COMM', 'METER NOT IN COMMUNICATION')) AS non_comm_tickets,
             SUM(ticket_count) FILTER (WHERE escalation_status = 'PENDING') AS discom_pending,
             SUM(ticket_count) FILTER (WHERE escalation_status = 'APPROVED') AS discom_approved,
             SUM(ticket_count) FILTER (WHERE escalation_status = 'REJECTED') AS discom_rejected,
             ROUND(SUM(attend_days_sum)::numeric / NULLIF(SUM(attended_count), 0), 2) AS discom_avg_days_to_attend
      FROM public.gold_om_discom_escalation_snapshot

  - q: ["Pending discom escalations zone wise in Agra", "escalations to discom project wise", "escalated tickets circle wise"]
    note: "Per place with a Total row; a status asked (pending) = escalation_status = 'PENDING' in the WHERE instead of the three columns."
    sql: |
      SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total' ELSE UPPER(zone) END AS zone,
             SUM(ticket_count) AS escalated_tickets,
             COALESCE(SUM(ticket_count) FILTER (WHERE escalation_status = 'PENDING'), 0) AS discom_pending,
             COALESCE(SUM(ticket_count) FILTER (WHERE escalation_status = 'APPROVED'), 0) AS discom_approved,
             COALESCE(SUM(ticket_count) FILTER (WHERE escalation_status = 'REJECTED'), 0) AS discom_rejected
      FROM public.gold_om_discom_escalation_snapshot
      WHERE LOWER(project) = 'agra'
      GROUP BY ROLLUP (zone)
      ORDER BY GROUPING(zone) DESC, escalated_tickets DESC

  - q: ["HHU reading trend month wise in 2026", "HHU uploads month wise in a year", "HHU upload success rate month by month"]
    note: "Total row first, then one row per month (weekly / daily: swap the bucket). No period = the card's last 12 months ending yesterday; say so."
    sql: |
      SELECT CASE WHEN GROUPING(date_trunc('month', period_start)) = 1 THEN 'Total'
                  ELSE to_char(date_trunc('month', period_start), 'Mon YYYY') END AS month,
             SUM(ticket_count) AS tickets_with_hhu_upload,
             SUM(ticket_count) FILTER (WHERE hhu_status = 'OK') AS upload_ok,
             SUM(ticket_count) FILTER (WHERE hhu_status = 'FAILED') AS upload_failed,
             SUM(ticket_count) FILTER (WHERE hhu_status = 'OTHER') AS upload_other,
             ROUND(SUM(ticket_count) FILTER (WHERE hhu_status = 'OK') * 100.0 / NULLIF(SUM(ticket_count), 0), 2) AS success_rate_pct,
             SUM(upload_count) AS upload_attempts
      FROM public.gold_om_hhu_reading_day_agg
      WHERE period_start BETWEEN DATE '2026-01-01' AND CURRENT_DATE - 1
      GROUP BY ROLLUP (date_trunc('month', period_start))
      ORDER BY GROUPING(date_trunc('month', period_start)) DESC, date_trunc('month', period_start)

  - q: ["Invoice vs revenue released", "receivables summary delay analysis", "how much is overdue", "overdue amount lumpsum and cable", "invoice amount net vs realised"]
    note: "Dashboard card per stream: Realised + Within Timeline (unpaid, not yet due) + Overdue = Invoice Amount (Net); Overdue = invoiced - realised - within_timeline. Latest row per project, summed. A negative overdue = the operator's figures do not add up -- say so."
    sql: |
      WITH l AS (
        SELECT * FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
                       FROM public.revenue_receivables r) x
        WHERE rn = 1),
      t AS (
        SELECT SUM(lumpsum_invoiced) AS li, SUM(lumpsum_realised) AS lr, SUM(lumpsum_within_timeline) AS lw,
               SUM(pmpm_invoiced) AS pi, SUM(pmpm_realised) AS pr, SUM(pmpm_within_timeline) AS pw,
               SUM(cable_invoiced) AS ci, SUM(cable_realised) AS cr, SUM(cable_within_timeline) AS cw
        FROM l)
      SELECT v.stream, ROUND(v.inv, 2) AS invoice_amount_net_cr, ROUND(v.rea, 2) AS realised_cr,
             ROUND(v.wt, 2) AS within_timeline_cr, ROUND(v.inv - v.rea - v.wt, 2) AS overdue_cr,
             ROUND(v.rea * 100.0 / NULLIF(v.inv, 0), 2) AS pct_realised
      FROM t CROSS JOIN LATERAL (VALUES
        (1, 'Lumpsum', t.li, t.lr, t.lw), (2, 'PMPM', t.pi, t.pr, t.pw), (3, 'Cable', t.ci, t.cr, t.cw),
        (4, 'All streams', t.li + t.pi + t.ci, t.lr + t.pr + t.cr, t.lw + t.pw + t.cw)) AS v(ord, stream, inv, rea, wt)
      ORDER BY v.ord

  - q: ["receivables summary project wise", "show the receivables summary project wise", "invoice vs revenue released project wise", "overdue amount project wise", "receivables by project"]
    note: "Per project (latest row each) plus Total, each stream SEPARATE like the card (lumpsum, PMPM, cable: invoiced, realised, overdue = invoiced - realised - within_timeline) -- never one merged amount. A discom = its projects: PUVVNL = kashi + triveni, DVVNL = agra (WHERE LOWER(project) IN (...)). A negative overdue = the operator's figures do not add up -- say so."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(lumpsum_invoiced) AS lumpsum_invoiced_cr, SUM(lumpsum_realised) AS lumpsum_realised_cr,
             SUM(lumpsum_invoiced - lumpsum_realised - lumpsum_within_timeline) AS lumpsum_overdue_cr,
             SUM(pmpm_invoiced) AS pmpm_invoiced_cr, SUM(pmpm_realised) AS pmpm_realised_cr,
             SUM(pmpm_invoiced - pmpm_realised - pmpm_within_timeline) AS pmpm_overdue_cr,
             SUM(cable_invoiced) AS cable_invoiced_cr, SUM(cable_realised) AS cable_realised_cr,
             SUM(cable_invoiced - cable_realised - cable_within_timeline) AS cable_overdue_cr
      FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables r) l
      WHERE rn = 1
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, project

  - q: ["Cable revenue realized for consumer meters", "lumpsum invoiced for DT meters", "pmpm realised zone wise", "receivables category wise", "cable realised for feeder meters"]
    note: "Receivables are filed per project only -- no category, meter type or zone split. Drop that filter and give the asked stream per project plus Total; the answer opens by saying the split is not recorded."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             ROUND(SUM(cable_invoiced), 2) AS cable_invoiced_cr, ROUND(SUM(cable_realised), 2) AS cable_realised_cr,
             ROUND(SUM(cable_realised) * 100.0 / NULLIF(SUM(cable_invoiced), 0), 2) AS cable_pct_realised
      FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables r) l
      WHERE rn = 1
      GROUP BY ROLLUP(project)
      ORDER BY GROUPING(project), project

  - q: ["Revenue not realized meters project wise", "how many meters have revenue not realized", "revenue not realized meters zone wise", "revenue pending meters project wise"]
    note: "KPI 16: every meter without collected PMPM revenue -- both stage tables (not-installed + installed), one row per project plus Total."
    sql: |
      SELECT CASE WHEN GROUPING(LOWER(project)) = 1 THEN 'Total' ELSE UPPER(MIN(project)) END AS project,
             COALESCE(SUM(meter_count) FILTER (WHERE current_stage IN ('inventory', 'agency', 'supervisor', 'technician')), 0) AS not_installed_yet,
             COALESCE(SUM(meter_count) FILTER (WHERE current_stage IN ('installation_done_sat_pending', 'sat_done_revenue_pending')), 0) AS installed_revenue_pending,
             SUM(meter_count) AS revenue_not_realized
      FROM (SELECT project, category, meter_type, current_stage, meter_count
            FROM public.gold_meter_installation_pending_stage_snapshot
            UNION ALL
            SELECT project, UPPER(category), meter_type, current_stage, meter_count
            FROM public.gold_meter_revenue_pending_stage_snapshot) n
      GROUP BY ROLLUP (LOWER(project))
      ORDER BY GROUPING(LOWER(project)), revenue_not_realized DESC

  - q: ["Revenue not realized stage wise for agra", "meters current stage stage wise", "where are meters stuck stage wise", "revenue not realized current stage"]
    note: "All six workflow stages from BOTH stage tables, in workflow order, Total last. The app shows the stages as DI to Agency ... SAT to Revenue."
    sql: |
      SELECT CASE WHEN GROUPING(current_stage) = 1 THEN 'Total' ELSE current_stage END AS stage,
             SUM(meter_count) AS meters
      FROM (SELECT project, category, meter_type, current_stage, meter_count
            FROM public.gold_meter_installation_pending_stage_snapshot
            UNION ALL
            SELECT project, UPPER(category), meter_type, current_stage, meter_count
            FROM public.gold_meter_revenue_pending_stage_snapshot) n
      WHERE LOWER(project) = 'agra'
      GROUP BY ROLLUP (current_stage)
      ORDER BY GROUPING(current_stage),
               CASE current_stage WHEN 'inventory' THEN 1 WHEN 'agency' THEN 2 WHEN 'supervisor' THEN 3
                    WHEN 'technician' THEN 4 WHEN 'installation_done_sat_pending' THEN 5
                    WHEN 'sat_done_revenue_pending' THEN 6 END

  - q: ["Meters current stage for revenue not realized in Varanasi I zone", "stage wise meters in a zone", "current stage in one zone"]
    note: "Same six-stage source with its zone column; filter / group zone on the OUTER query (the first four stages get the zone of the warehouse holding the meter)."
    sql: |
      SELECT CASE WHEN GROUPING(current_stage) = 1 THEN 'Total' ELSE current_stage END AS stage,
             SUM(meter_count) AS meters
      FROM (SELECT project, zone, category, meter_type, current_stage, meter_count
            FROM public.gold_meter_installation_pending_stage_snapshot
            UNION ALL
            SELECT project, zone, UPPER(category), meter_type, current_stage, meter_count
            FROM public.gold_meter_revenue_pending_stage_snapshot) n
      WHERE LOWER(project) = 'kashi' AND LOWER(zone) = 'varanasi i'
      GROUP BY ROLLUP (current_stage)
      ORDER BY GROUPING(current_stage),
               CASE current_stage WHEN 'inventory' THEN 1 WHEN 'agency' THEN 2 WHEN 'supervisor' THEN 3
                    WHEN 'technician' THEN 4 WHEN 'installation_done_sat_pending' THEN 5
                    WHEN 'sat_done_revenue_pending' THEN 6 END

  - q: ["Show meters journey avg time across the levels for revenue realized", "journey time stage wise", "average days at each level of the meter journey", "lead time per stage", "journey avg time for one year or category"]
    note: "'levels' = the six journey stages + Total Journey, one row each in workflow order (bars like the dashboard's Workflow Lead Time card). Each stage keeps its own denominator; meters = the meters behind it (DI to Agency's = the card's Total Meters). Filters (project, category, installation_year = 2025) go inside s."
    sql: |
      WITH s AS (
        SELECT SUM(inventory_to_agency_days_sum) AS di_agency, SUM(agency_to_supervisor_days_sum) AS agency_sup,
               SUM(supervisor_to_technician_days_sum) AS sup_tech, SUM(technician_to_installation_days_sum) AS tech_inst,
               SUM(meter_count) AS meters, SUM(installation_to_sat_days_sum) AS inst_sat, SUM(sat_meter_count) AS sat_meters,
               SUM(sat_to_revenue_realized_days_sum) AS sat_rev, SUM(total_journey_days_sum) AS total_days,
               SUM(revenue_realized_meter_count) AS rev_meters
        FROM public.gold_meter_journey_stage_agg)
      SELECT v.stage, v.avg_days, v.meters
      FROM s CROSS JOIN LATERAL (VALUES
        (1, 'DI to Agency', ROUND(s.di_agency / NULLIF(s.meters, 0), 2), s.meters),
        (2, 'Agency to Supervisor', ROUND(s.agency_sup / NULLIF(s.meters, 0), 2), s.meters),
        (3, 'Supervisor to Technician', ROUND(s.sup_tech / NULLIF(s.meters, 0), 2), s.meters),
        (4, 'Technician to Installation', ROUND(s.tech_inst / NULLIF(s.meters, 0), 2), s.meters),
        (5, 'Installation to SAT', ROUND(s.inst_sat / NULLIF(s.sat_meters, 0), 2), s.sat_meters),
        (6, 'SAT to Revenue', ROUND(s.sat_rev / NULLIF(s.rev_meters, 0), 2), s.rev_meters),
        (7, 'Total Journey', ROUND(s.total_days / NULLIF(s.rev_meters, 0), 2), s.rev_meters)) AS v(ord, stage, avg_days, meters)
      ORDER BY v.ord

  - q: ["how many days does each step of the meter journey take in agra zone wise", "journey levels zone wise", "journey time per stage category wise", "average days at each level by division"]
    note: "Stages BY a dimension: one row per zone (Total first), the six stages + total_journey as columns -- not one row per zone x stage."
    sql: |
      SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total'
                  WHEN zone IS NULL OR zone = '' THEN 'Unmapped' ELSE UPPER(zone) END AS zone,
             ROUND(SUM(inventory_to_agency_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS di_to_agency,
             ROUND(SUM(agency_to_supervisor_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS agency_to_supervisor,
             ROUND(SUM(supervisor_to_technician_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS supervisor_to_technician,
             ROUND(SUM(technician_to_installation_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS technician_to_installation,
             ROUND(SUM(installation_to_sat_days_sum) / NULLIF(SUM(sat_meter_count), 0), 2) AS installation_to_sat,
             ROUND(SUM(sat_to_revenue_realized_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS sat_to_revenue,
             ROUND(SUM(total_journey_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS total_journey,
             SUM(meter_count) AS total_meters
      FROM public.gold_meter_journey_stage_agg
      WHERE LOWER(project) = 'agra'
      GROUP BY ROLLUP (zone)
      ORDER BY GROUPING(zone) DESC, total_meters DESC

  - q: ["how long has meter HP8500592 been waiting for sat", "is meter X SAT done", "SAT status of one meter", "since when is this meter pending SAT"]
    note: "One meter: its install row LEFT JOIN its SAT mapping -- a meter with no SAT batch is still found (an inner join / sat_milestones filter returns nothing for exactly the meters that are waiting). Waiting days = today - mi_date while no SAT batch."
    sql: |
      SELECT i.new_meter_serial_number AS meter_serial, i.mi_date AS installed_on, i.project, i.zone,
             m.sat_number,
             CASE WHEN m.sat_number IS NULL THEN 'Waiting for SAT' ELSE 'SAT done' END AS sat_status,
             CASE WHEN m.sat_number IS NULL THEN date_diff('day', CAST(i.mi_date AS date), current_date) END AS days_waiting_since_install
      FROM (SELECT new_meter_serial_number, mi_date, project, zone FROM gmr_wfm_silver.unified_installations
            WHERE new_meter_serial_number = 'HP8500592' ORDER BY updated_at DESC LIMIT 1) i
      LEFT JOIN (SELECT meter_serial_number, sat_number FROM gmr_wfm_silver.sat_meter_mappings
                 WHERE meter_serial_number = 'HP8500592' ORDER BY updated_at DESC LIMIT 1) m
             ON m.meter_serial_number = i.new_meter_serial_number

  - q: ["How many installed meters have not yet cleared SAT?", "meters pending SAT", "how many meters are pending SAT", "SAT pending meters", "feeder meters without sat", "meters without SAT", "how many meters not SAT done"]
    suggest: "How many installed meters have not yet cleared SAT?"
    note: "Use public.gold_mi_sat_invoice_snapshot (never gold_mi_installation_day_agg). Answer = installed_not_sat, split into eligible_pending_sat and not_yet_due."
    sql: |
      SELECT SUM(meter_count) AS total_mi,
             SUM(meter_count) FILTER (WHERE sat_stage IS NULL) AS installed_not_sat,
             SUM(meter_count) FILTER (WHERE sat_stage IS NULL AND is_sat_eligible) AS eligible_pending_sat,
             SUM(meter_count) FILTER (WHERE sat_stage IS NULL AND NOT is_sat_eligible) AS not_yet_due
      FROM public.gold_mi_sat_invoice_snapshot

  - q: ["Which project is worst on pending SAT?", "which project has most meters pending SAT", "SAT pending project-wise"]
    suggest: "Which project is worst on pending SAT?"
    note: "'Worst' = highest eligible pending as % of its installed meters (pending_pct_of_mi); also give the count, and say if a different project has the higher count."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(meter_count) AS total_mi,
             SUM(meter_count) FILTER (WHERE sat_stage IS NULL AND is_sat_eligible) AS eligible_pending_sat,
             ROUND(SUM(meter_count) FILTER (WHERE sat_stage IS NULL AND is_sat_eligible) * 100.0 / NULLIF(SUM(meter_count), 0), 2) AS pending_pct_of_mi,
             SUM(meter_count) FILTER (WHERE sat_stage IS NULL) AS installed_not_sat
      FROM public.gold_mi_sat_invoice_snapshot
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, eligible_pending_sat DESC

  - q: ["SAT percentage against eligible MI for Agra", "SAT % vs eligible MI", "how much of eligible MI has SAT done", "SAT progress against eligible meters"]
    note: "% SAT vs eligible MI = ALL SAT meters (sat_stage IS NOT NULL, eligible or not) / eligible MI -- the dashboard formula, can exceed 100%. Never SAT(eligible) / eligible. Show both percentages."
    sql: |
      SELECT SUM(meter_count) AS total_mi,
             COALESCE(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0) AS eligible_mi,
             COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS total_sat,
             ROUND(COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) * 100.0
                   / NULLIF(SUM(meter_count), 0), 2) AS sat_pct_vs_mi,
             ROUND(COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0), 2) AS sat_pct_vs_eligible
      FROM public.gold_mi_sat_invoice_snapshot
      WHERE LOWER(project) = 'agra'

  - q: ["MI vs SAT vs invoice funnel", "invoice funnel project wise", "installed to SAT to invoiced funnel", "lumpsum and PMPM invoiced vs SAT"]
    note: "The funnel card: installed, SAT done, lumpsum invoiced and PMPM invoiced, each invoice count also as % of SAT done (never of installed, never summed). Drop the project ROLLUP when no breakdown is asked. Never exclude a meter type (OTHER-Consumer_meter, NULL) the question did not."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(meter_count) AS installed,
             COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS sat_done,
             COALESCE(SUM(meter_count) FILTER (WHERE has_lumpsum_invoice), 0) AS lumpsum_invoiced,
             ROUND(COALESCE(SUM(meter_count) FILTER (WHERE has_lumpsum_invoice), 0) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0), 2) AS lumpsum_pct_of_sat,
             COALESCE(SUM(meter_count) FILTER (WHERE has_pmpm_invoice), 0) AS pmpm_invoiced,
             ROUND(COALESCE(SUM(meter_count) FILTER (WHERE has_pmpm_invoice), 0) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0), 2) AS pmpm_pct_of_sat
      FROM public.gold_mi_sat_invoice_snapshot
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, installed DESC

  - q: ["Revenue not realized ageing project wise", "revenue not realized ageing for Agra", "revenue ageing by project", "uncollected PMPM meters by age project wise"]
    note: "Ageing = public.gold_revenue_ageing_snapshot (SAT done, PMPM not collected), never the current-stage tables. A project with no rows has 0 such meters (its PMPM collection arrived -- Agra today): list it as 0, never 'no data'. These are METER counts -- never Rs / crore / 'revenue of 157,979'."
    sql: |
      SELECT p.project, COALESCE(SUM(s.outstanding_count), 0) AS meters_revenue_not_realized,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) <= 30), 0) AS days_0_30,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) BETWEEN 31 AND 60), 0) AS days_31_60,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) BETWEEN 61 AND 90), 0) AS days_61_90,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) BETWEEN 91 AND 120), 0) AS days_91_120,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) > 120), 0) AS days_120_plus
      FROM (VALUES (1, 'Total', NULL), (2, 'AGRA', 'agra'), (3, 'KASHI', 'kashi'), (4, 'TRIVENI', 'triveni')) AS p(ord, project, key)
      LEFT JOIN public.gold_revenue_ageing_snapshot s ON p.key IS NULL OR LOWER(s.project) = p.key
      GROUP BY p.ord, p.project
      ORDER BY p.ord

  - q: ["Non-SAT ageing for feeder meters", "Non-SAT ageing", "non sat ageing for consumer meters", "non-SAT ageing band wise", "eligible meters pending SAT by age"]
    note: "The card: one row per band in order (empty bands as 0) plus Total, over the whole scope -- no project split unless asked. Filters go in the ON clause."
    sql: |
      SELECT b.label AS ageing_band, COALESCE(SUM(n.meter_count), 0) AS non_sat_meters
      FROM (VALUES (1, 'age_0_30', '0-30 days'), (2, 'age_31_60', '31-60 days'), (3, 'age_61_90', '61-90 days'),
                   (4, 'age_91_120', '91-120 days'), (5, 'age_120_plus', '120+ days'), (6, NULL, 'Total')) AS b(ord, age_key, label)
      LEFT JOIN public.gold_non_sat_ageing_snapshot n
        ON (n.age_key = b.age_key OR b.age_key IS NULL) AND n.category = 'FEEDER'
      GROUP BY b.ord, b.label
      ORDER BY b.ord

  - q: ["How many SAT-passed meters are still not invoiced?", "SAT done but not invoiced", "Why are SAT meters not yet invoiced?"]
    suggest: "How many SAT-passed meters are still not invoiced?"
    note: "Not-invoiced SAT meters sit in specific SAT batches: show them per project and batch so the reason (batch not yet invoiced) is visible in the table. Chart one bar per project (x = project, y = not_lumpsum_invoiced, no group) -- never the batches."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             CASE WHEN GROUPING(sat_stage) = 1 THEN 'All batches' ELSE 'SAT-' || sat_stage END AS sat_batch,
             SUM(meter_count) AS sat_meters,
             COALESCE(SUM(meter_count) FILTER (WHERE NOT has_lumpsum_invoice), 0) AS not_lumpsum_invoiced,
             COALESCE(SUM(meter_count) FILTER (WHERE NOT has_pmpm_invoice), 0) AS not_pmpm_invoiced
      FROM public.gold_mi_sat_invoice_snapshot
      WHERE sat_stage IS NOT NULL
      GROUP BY ROLLUP (project, sat_stage)
      HAVING COALESCE(SUM(meter_count) FILTER (WHERE NOT has_lumpsum_invoice), 0) > 0
      ORDER BY GROUPING(project) DESC, project, GROUPING(sat_stage) DESC, sat_stage
    extra:
      - purpose: "SAT batch dates and invoice dates (which batches are not invoiced yet)"
        sql: |
          SELECT LOWER(project) AS project, sat_number, sat_date, lumpsum_invoice_date, pmpm_invoice_date
          FROM gmr_wfm_silver.sat_milestones
          WHERE lumpsum_invoice_date IS NULL OR pmpm_invoice_date IS NULL
          ORDER BY project, sat_number

  - q: ["Where is the biggest drop-off in the supply-to-collection funnel?", "Build the full funnel from supply to collection with conversion at each stage", "funnel conversion"]
    suggest: "Build the full funnel from supply to collection with conversion at each stage."
    note: "Conversion = step / previous step. Collected = meters of SAT batches with a lumpsum collection date (extra Athena query, joined by project + SAT batch in the answer)."
    sql: |
      WITH f AS (
        SELECT (SELECT total_current_inventory_count FROM public.gold_dashboard_stats_snapshot WHERE singleton) AS supplied,
               SUM(meter_count) AS installed,
               SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) AS sat_done,
               SUM(meter_count) FILTER (WHERE has_lumpsum_invoice) AS invoiced,
               (SELECT total_pmpm_collection_done_meters FROM public.gold_dashboard_stats_snapshot WHERE singleton) AS collected
        FROM public.gold_mi_sat_invoice_snapshot)
      SELECT step, meters, LAG(meters) OVER (ORDER BY ord) - meters AS lost_from_previous,
             ROUND(meters * 100.0 / NULLIF(LAG(meters) OVER (ORDER BY ord), 0), 2) AS conversion_pct
      FROM (SELECT 1 AS ord, '1 Supplied' AS step, supplied AS meters FROM f
            UNION ALL SELECT 2, '2 Installed', installed FROM f
            UNION ALL SELECT 3, '3 SAT done', sat_done FROM f
            UNION ALL SELECT 4, '4 Invoiced (lumpsum)', invoiced FROM f
            UNION ALL SELECT 5, '5 Collected (PMPM)', collected FROM f) s
      ORDER BY ord

  - q: ["How much was supplied in Feb '26 and how did it compare with Jan '26?", "supply this month vs last month", "compare supplies of two months"]
    sql: |
      SELECT SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-02-01' AND period_start < DATE '2026-03-01') AS supplied_feb_2026,
             SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-02-01') AS supplied_jan_2026,
             SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-02-01' AND period_start < DATE '2026-03-01')
               - SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-02-01') AS change,
             ROUND((SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-02-01' AND period_start < DATE '2026-03-01')
               - SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-02-01')) * 100.0
               / NULLIF(SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-02-01'), 0), 2) AS change_pct
      FROM public.gold_meter_inventory_event_month_agg
      WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-03-01'

  - q: ["In which month did supply start to decline?", "when did supply peak", "since when is supply falling"]
    suggest: "In which month did supply start to decline?"
    note: "Sustained decline starts the month AFTER the peak month (highest supply); a one-month dip that later recovers above it is not the start. Return the series plus the peak."
    sql: |
      WITH m AS (SELECT period_start AS month, SUM(inventory_count) AS supplied
                 FROM public.gold_meter_inventory_event_month_agg
                 WHERE period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '18 months')::date
                 GROUP BY period_start),
      pk AS (SELECT month AS peak_month FROM m ORDER BY supplied DESC LIMIT 1)
      SELECT m.month, m.supplied, m.supplied - LAG(m.supplied) OVER (ORDER BY m.month) AS change_vs_prev_month,
             pk.peak_month, (pk.peak_month + INTERVAL '1 month')::date AS decline_starts
      FROM m CROSS JOIN pk
      ORDER BY m.month

  - q: ["monthly supply trend", "Is supply keeping pace with installation over the last three months?", "supply vs installation month-wise"]
    note: "A decline starts at the first month below the previous month that is followed by lower months; the peak is the month before. Keeping pace = supplied >= installed in each month."
    sql: |
      SELECT period_start AS month, SUM(inventory_count) AS supplied, SUM(installed_count) AS installed,
             SUM(inventory_count) - SUM(installed_count) AS net_supplied_minus_installed,
             SUM(inventory_count) - LAG(SUM(inventory_count)) OVER (ORDER BY period_start) AS supply_change_vs_prev_month
      FROM public.gold_meter_inventory_event_month_agg
      WHERE period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '12 months')::date
      GROUP BY period_start
      ORDER BY period_start

  - q: ["At the current pace, how many days will our stock last?", "stock kitne din chalega", "when does stock run out"]
    suggest: "At the current pace, how many days will our stock last?"
    note: "Pace = average daily stock consumption over the last 6 months (current month by days elapsed). Run-out date = CURRENT_DATE + days_left. Store / site / godown / warehouse asks use the warehouse-wise example instead."
    sql: |
      WITH m AS (
        SELECT LOWER(project) AS project, category, date_trunc('month', period_start)::date AS mon, SUM(stock_consumed_count) AS used
        FROM public.gold_meter_inventory_event_day_agg
        WHERE period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '5 months')::date AND period_start <= CURRENT_DATE
        GROUP BY 1, 2, 3),
      p AS (SELECT project, category,
                   SUM(used / CASE WHEN mon = date_trunc('month', CURRENT_DATE)::date THEN EXTRACT(DAY FROM CURRENT_DATE)
                                   ELSE EXTRACT(DAY FROM (mon + INTERVAL '1 month - 1 day')) END) / 6 AS pace
            FROM m GROUP BY 1, 2),
      s AS (SELECT LOWER(project) AS project, category, SUM(inventory_count) - SUM(stock_consumed_count) AS stock
            FROM public.gold_meter_inventory_event_day_agg GROUP BY 1, 2),
      u AS (SELECT project, category, stock, 0 AS pace FROM s UNION ALL SELECT project, category, 0, pace FROM p)
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'TOTAL' ELSE UPPER(project) END AS project,
             CASE WHEN GROUPING(category) = 1 THEN 'All' ELSE category END AS category,
             SUM(stock) AS in_stock, ROUND(SUM(pace), 1) AS pace_per_day,
             ROUND(SUM(stock) / NULLIF(SUM(pace), 0)) AS days_left,
             CURRENT_DATE + CAST(ROUND(SUM(stock) / NULLIF(SUM(pace), 0)) AS int) AS runs_out_on
      FROM u
      GROUP BY GROUPING SETS ((), (project), (project, category))
      ORDER BY GROUPING(project) DESC, days_left NULLS LAST

  - q: ["Which stores or sites have less than one week of stock?", "warehouse-wise days of stock left", "which warehouse will run out of stock first", "stock cover by warehouse", "kis godown mein ek hafte se kam stock hai", "warehouses with less than 15 days of stock"]
    suggest: "Which warehouses have less than one week of stock?"
    note: "Store / site / godown = warehouse. One Athena query (Postgres has warehouse stock but no warehouse pace). Stock = latest inventory row per serial with no installed_ts and no installation row (matches the unused-stock card). Pace = meters installed a day from that warehouse (installed_ts), average of the last 6 months' daily rates (current month by days elapsed). 'Less than N days' = days_left < N (days_left kept to 1 decimal so the filter and the shown value agree); when none are below N, say none and name the lowest few with their days left."
    sql: |
      WITH inv AS (
        SELECT UPPER(TRIM(meter_serial_number)) AS serial, COALESCE(NULLIF(TRIM(warehouse), ''), 'UNASSIGNED') AS warehouse,
               CAST(installed_ts AS date) AS installed_on,
               ROW_NUMBER() OVER (PARTITION BY UPPER(TRIM(meter_serial_number)) ORDER BY updated_at DESC) AS rn
        FROM gmr_wfm_silver.unified_smart_meter_inventory
        WHERE meter_serial_number IS NOT NULL AND di_date IS NOT NULL),
      inst AS (SELECT DISTINCT UPPER(TRIM(new_meter_serial_number)) AS serial
               FROM gmr_wfm_silver.unified_installations
               WHERE mi_date IS NOT NULL AND new_meter_serial_number IS NOT NULL),
      s AS (SELECT i.warehouse, COUNT(*) AS stock
            FROM inv i LEFT JOIN inst x ON x.serial = i.serial
            WHERE i.rn = 1 AND i.installed_on IS NULL AND x.serial IS NULL
            GROUP BY i.warehouse),
      m AS (SELECT warehouse, date_trunc('month', installed_on) AS mon, COUNT(*) AS used
            FROM inv
            WHERE rn = 1 AND installed_on >= date_add('month', -5, date_trunc('month', current_date)) AND installed_on <= current_date
            GROUP BY 1, 2),
      p AS (SELECT warehouse,
                   SUM(used * 1.0 / CASE WHEN mon = date_trunc('month', current_date) THEN day(current_date)
                                         ELSE day(last_day_of_month(mon)) END) / 6 AS pace
            FROM m GROUP BY 1),
      u AS (SELECT warehouse AS wh, stock, 0.0 AS pace FROM s UNION ALL SELECT warehouse, 0, pace FROM p)
      SELECT CASE WHEN GROUPING(wh) = 1 THEN 'TOTAL' ELSE wh END AS warehouse,
             SUM(stock) AS in_stock, ROUND(SUM(pace), 1) AS pace_per_day,
             ROUND(SUM(stock) / NULLIF(SUM(pace), 0), 1) AS days_left,
             date_add('day', CAST(FLOOR(SUM(stock) / NULLIF(SUM(pace), 0)) AS integer), current_date) AS runs_out_on
      FROM u
      GROUP BY ROLLUP (wh)
      ORDER BY GROUPING(wh) DESC, days_left NULLS LAST

  - q: ["MI pace vs stock category wise", "installation pace vs stock by category", "is installation keeping up with stock category-wise", "MI pace vs stock availability by category"]
    suggest: "MI pace vs stock category wise"
    note: "MI pace = meters installed a day over the last 6 months (current month to today). Days of stock = remaining stock / pace. Postgres date - date is already whole days (an integer): never EXTRACT(EPOCH/DAY FROM date - date)."
    sql: |
      WITH w AS (SELECT (date_trunc('month', CURRENT_DATE) - INTERVAL '5 months')::date AS since)
      SELECT CASE WHEN GROUPING(category) = 1 THEN 'Total' ELSE category END AS category,
             SUM(inventory_count) AS supplied, SUM(installed_count) AS installed,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock,
             ROUND(SUM(installed_count) FILTER (WHERE period_start >= (SELECT since FROM w)) * 1.0
                   / (CURRENT_DATE - (SELECT since FROM w) + 1), 1) AS installs_per_day,
             ROUND((SUM(inventory_count) - SUM(stock_consumed_count))
                   / NULLIF(SUM(installed_count) FILTER (WHERE period_start >= (SELECT since FROM w)) * 1.0
                            / (CURRENT_DATE - (SELECT since FROM w) + 1), 0)) AS days_of_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= CURRENT_DATE
      GROUP BY ROLLUP (category)
      ORDER BY GROUPING(category) DESC, category

  - q: ["Supplied minus installed is about 1.68 lakh, but stock shows 1.21 lakh. Where are the other meters?", "reconcile supplied minus installed with stock", "why doesn't stock match supplied minus installed"]
    note: "stock = supplied - MI installs - replacement installs + installs with no stock record (scrapped stock would subtract)."
    sql: |
      SELECT inv.supplied, mi.mi_installed, inv.supplied - mi.mi_installed AS supplied_minus_installed, inv.stock AS remaining_stock,
             inv.supplied - mi.mi_installed - inv.stock AS gap,
             mi.replacement_installed,
             mi.all_installed - inv.consumed AS installs_without_stock_record,
             inv.supplied - mi.mi_installed - mi.replacement_installed + (mi.all_installed - inv.consumed) AS stock_rebuilt
      FROM (SELECT SUM(inventory_count) AS supplied, SUM(stock_consumed_count) AS consumed,
                   SUM(inventory_count) - SUM(stock_consumed_count) AS stock
            FROM public.gold_meter_inventory_event_day_agg) inv
      CROSS JOIN (SELECT SUM(meter_count) FILTER (WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement) AS mi_installed,
                         SUM(meter_count) FILTER (WHERE is_replacement) AS replacement_installed,
                         SUM(meter_count) AS all_installed
                  FROM public.gold_mi_installation_day_agg) mi

