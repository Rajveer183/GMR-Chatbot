  - q: ["O&M productivity per team","O&M productivity per team by project", "complaint productivity project wise", "tickets per technician per day by project", "O&M tickets closed per technician per day in a project"]
    note: "Team measure on the category = 'ALL' rows: closed tickets / distinct (technician, day) pairs per project plus Total -- not per technician, never SUM(technician_day_count). No period given = last 30 days ending yesterday; say so."
