  - q: ["Status of ticket 3394577", "ticket 3394577 status", "who handled ticket 3394577", "details of complaint number 3394577", "is ticket 3394577 closed"]
    note: "One ticket: both ticket feeds together, matched as text exactly as typed (no prefix). Open feed gives the live status; non-QC gives work completed / closed. Say not found only when both are empty."
    sql: |
      SELECT 'Open / active ticket' AS found_in, ticket_id AS ticket_no, complaint_status AS status,
             complaint_type, project, zone, division, consumer_number, old_meter_serial_number AS meter_serial,
             technician_name AS technician, CAST(complaint_created_date AS VARCHAR) AS raised_on,
             CAST(NULL AS VARCHAR) AS work_completed_on, CAST(NULL AS VARCHAR) AS closed_on
