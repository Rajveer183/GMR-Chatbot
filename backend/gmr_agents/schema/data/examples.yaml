      SELECT 'Completed O&M work (non-QC)', helpdesk_ticket_id,
             CASE WHEN closed_date IS NOT NULL THEN 'Closed' WHEN work_completed_at IS NOT NULL THEN 'Work completed' ELSE 'Recorded' END,
             sub_complaint_type, project, zone, division, consumer_number, old_meter_serial_number,
             technician_name, CAST(NULL AS VARCHAR),
             CAST(work_completed_at AS VARCHAR), CAST(closed_date AS VARCHAR)
      FROM gmr_wfm_silver.unified_non_qc_complaints
      WHERE regexp_replace(TRIM(helpdesk_ticket_id), '^0+', '') = '3394577' OR regexp_replace(TRIM(complaint_no), '^0+', '') = '3394577'
      LIMIT 20

