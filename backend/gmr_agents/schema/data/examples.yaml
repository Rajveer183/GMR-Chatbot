      ORDER BY GROUPING(UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown'))) DESC, meter_burnt DESC

  - q: ["How many consumer meters have been audited for feeder tagging?", "What share of auto-indexing is complete?", "How many consumers are ready to be re-tagged now?", "How many consumers need re-tagging?", "How far are we from the pending-verification target?"]
    suggest: "What share of auto-indexing is complete?"
    note: "No project filter unless the question names one. Grand total row = every level IS NULL; read its stored columns, NEVER SUM the cube (rows at every level would be counted many times). Concluded = confirmed + reassign; pending verification = review + no data (target 0) -- keep all four parts in the result so the answer can show the split."
    sql: |
      SELECT meters_audited, confirmed_number, reassign_number, review_number, no_data_number,
             auto_indexing_concluded_number, auto_indexing_concluded_pct, pending_verification_number, pending_verification_pct
      FROM hes_gold.hierarchy_summary_autoindexing
