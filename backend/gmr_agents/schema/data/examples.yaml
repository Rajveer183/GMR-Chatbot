      SELECT project, division, reassign_number, reassign_pct, meters_audited
      FROM hes_gold.hierarchy_summary_autoindexing
      WHERE project IS NOT NULL AND discom IS NOT NULL AND zone IS NOT NULL AND circle IS NOT NULL AND division IS NOT NULL
