  - q: ["Compare Agra and Kashi installations in September 2026 and give the difference.", "Agra vs Kashi installations last month", "difference between two projects' installations in a month", "how many more meters did Agra install than Kashi"]
    note: "A comparison returns EACH value and the difference (and % difference) as columns. Projects and the month come from the question."
    sql: |
      SELECT SUM(meter_count) FILTER (WHERE LOWER(project) = 'agra') AS agra_installed,
             SUM(meter_count) FILTER (WHERE LOWER(project) = 'kashi') AS kashi_installed,
             SUM(meter_count) FILTER (WHERE LOWER(project) = 'agra') - SUM(meter_count) FILTER (WHERE LOWER(project) = 'kashi') AS difference,
             ROUND((SUM(meter_count) FILTER (WHERE LOWER(project) = 'agra') - SUM(meter_count) FILTER (WHERE LOWER(project) = 'kashi')) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE LOWER(project) = 'kashi'), 0), 2) AS difference_pct
