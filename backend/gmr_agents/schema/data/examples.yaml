  - q: ["Which substations have the highest share in Review?", "How can we shrink the Review bucket fastest?", "substation review share"]
    suggest: "Which substations have the highest share in Review?"
    note: "Share = SUM(review)/SUM(mi) per substation; also show review count so the biggest absolute buckets (fastest wins) are visible."
    sql: |
      SELECT substation, SUM(review) AS review_consumers, SUM(mi) AS consumers_indexed,
