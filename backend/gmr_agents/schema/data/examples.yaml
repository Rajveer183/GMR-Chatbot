  - q: ["At the current SAT pace, when will we reach 98% of eligible MI?", "SAT ETA", "when will SAT reach target"]
    suggest: "At the current SAT pace, when will we reach 98% of eligible MI?"
    note: "Main query: needed meters per project. Extra (Athena): batch dates. Pace = meters in batches with sat_date in the last 182 days x 30.44 / 182 per month (batch meters = main/extra join on project + SAT-n). ETA = today + needed / pace months."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(meter_count) FILTER (WHERE is_sat_eligible) AS eligible_mi,
             SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) AS total_sat,
             ROUND(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) * 100.0 / NULLIF(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0), 2) AS sat_pct_of_eligible,
             GREATEST(CEIL(0.98 * SUM(meter_count) FILTER (WHERE is_sat_eligible)) - SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS more_needed,
             SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL AND sat_stage >= 9) AS sat_meters_in_batches_9_plus
      FROM public.gold_mi_sat_invoice_snapshot
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, project
    extra:
      - purpose: "SAT batches dated in the last 182 days, with each batch's meters (pace)"
        sql: |
          SELECT LOWER(project) AS project, sat_number, sat_date
          FROM gmr_wfm_silver.sat_milestones
          WHERE sat_date >= date_add('day', -182, current_date)
          ORDER BY project, sat_date

