      UNION ALL SELECT 'Home page headline (dashboard stats)', (SELECT total_meter_installations FROM public.gold_dashboard_stats_snapshot WHERE singleton)
      UNION ALL SELECT 'MI vs SAT page Total MI (incl. replacements)', (SELECT SUM(meter_count) FROM public.gold_mi_sat_invoice_snapshot)
      UNION ALL SELECT 'Inventory utilization page installed (incl. replacements)', (SELECT SUM(installed_count) FROM public.gold_meter_inventory_event_day_agg)
      UNION ALL SELECT 'Replacement installs', (SELECT SUM(meter_count) FROM public.gold_mi_installation_day_agg WHERE is_replacement)

  - q: ["Compare August and September 2026 installations.", "compare installations of two months", "How many installations were done in September 2026?"]
