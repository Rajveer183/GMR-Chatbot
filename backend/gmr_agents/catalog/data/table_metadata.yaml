  "communication_failures.nc_bucket": >-
    Stored as 'Non_Communicating_3_30_Days', 'Non_Communicating_31_60_Days', 'Non_Communicating_61_90_Days',
    'Non_Communicating_More_than_90_Days' -- never '3-30 Days'.
