# A column name + real values (or a role) doesn't always self-evidently
# connect to how a real question would phrase the same concept -- verified
# live: "SAT pending" never got recognized as `is_non_sat_pending` (a
# double-negative name -- "pending" because it's NOT-yet-SAT'd) despite
# that column's real True/False values already being shown via
# sample_values, and "Inventory"/"Installation" status never got connected
# to `inventory_category`/`progress_category` (which track the SAME
# Feeder/DT/Consumer breakdown at two different STAGES, not two different
# category sets). Sample values fix "which literal do I use," not "which
# COLUMN does this business term even mean" -- this fixes the latter for
# specific columns confirmed to cause a real refusal, without trying to
# solve column-name clarity in general. Keyed (table_name, column_name);
# rendered in prompt_context() right next to that column.
column_hints:
  "gold_mi_installation_day_agg.is_non_sat_pending": &hint1 >-
    True means this meter is still PENDING its SAT (Site Acceptance Test) -- this IS what "SAT pending"/"pending
    SAT" in a question refers to.
  "gold_mi_installation_month_agg.is_non_sat_pending": *hint1
  "gold_mi_installation_day_agg.inventory_category": &hint2 >-
    Which entity type (Feeder/DT/Consumer) this row's INVENTORY intake is categorized under -- a meter that has been
    received into inventory but not necessarily installed yet. "DT" means DTR here.
  "gold_mi_installation_month_agg.inventory_category": *hint2
  "gold_mi_installation_day_agg.progress_category": &hint3 >-
    Which entity type (Feeder/DT/Consumer) this row's INSTALLATION PROGRESS is categorized under -- a meter that has
    actually been installed, not just received. "DT" means DTR here.
  "gold_mi_installation_month_agg.progress_category": *hint3
  # "mf" verified live against real data before adding, not assumed: real
  # distinct values on feeder_loss.mf run 0, 1, 30, 40...32000 (classic
  # CT/PT multiplying-factor magnitudes for feeder/DT-level meters, which
  # carry large CT ratios) -- not a flag, percentage, or small bounded
  # code. "Multiplying Factor" is standard DISCOM/utility metering
  # terminology: the number the base metered reading is multiplied by to
  # get true consumption (a consumer-level meter with no CT/PT is MF=1;
  # a feeder/DT meter behind a current transformer is not).
  "dt_loss.mf": &hint4 >-
    MF = Multiplying Factor -- the meter's CT/PT ratio; multiply the raw metered reading by this to get true
    consumption. NOT a flag or a percentage.
  "dt_loss_consumers.mf": *hint4
  "feeder_loss.mf": *hint4
  "feeder_loss_ai.mf": *hint4
  "feeder_loss_ai_consumers.mf": *hint4
  "feeder_loss_consumers.mf": *hint4
  "dim_meter.mf": *hint4
  "dim_meter_energy.mf": *hint4
  # "mi_date" verified live: real dates (e.g. 2026-09-21), consistent with
  # this table's own name and the "gold_mi_*" table-name prefix elsewhere
  # in this schema (MI = Meter Installation, as opposed to "gold_om_*" =
  # Operations & Maintenance/complaints). This IS the date a question
  # asking "installed on/during <date>" should filter on for this table.
  "unified_installations.mi_date": &hint5 >-
    MI = Meter Installation. This is the date this meter's installation was recorded/completed -- filter on this for
    "installed on/during <date>" questions.
  "unified_installations.new_meter_serial_number": &hint6 >-
    VERIFIED LIVE (2,000-row sample): this column is ALWAYS alphabetic-prefixed (e.g. 'CA6028422', 'HP9000387',
    'AL3479094'), NEVER purely numeric -- see consumer_number's own hint for the contrasting format. A question
    about "this consumer"/"this meter" asking for BOTH installation date and SAT date is answerable with ONE query,
    not two: SELECT this table's mi_date (installation date) alongside sat_milestones.sat_date, chained through TWO
    declared joins -- this table's new_meter_serial_number = sat_meter_mappings.meter_serial_number, then
    sat_meter_mappings to sat_milestones on BOTH project AND sat_number (see sat_milestones' own hint). Never
    answer_kind="unanswerable"/"clarify" just because reaching the SAT date needs this table as a bridge to
    sat_meter_mappings -- every join in that chain is declared and verified live (millions of overlapping meters
    between this table and sat_meter_mappings).
  "unified_installations.consumer_number": &hint7 >-
    VERIFIED LIVE (2,000-row sample): this column is ALWAYS purely numeric (e.g. '5108523000'), NEVER
    alphabetic-prefixed -- new_meter_serial_number (see its own hint), by contrast, always starts with letters (e.g.
    'CA6028422'). If the question calls a value "this consumer"/"consumer number" but the actual value given starts
    with letters, that word choice is NOT reliable evidence it belongs in THIS column -- match the filter column to
    the VALUE'S OWN format, not the question's incidental wording (verified live to go wrong: 'CA6028422' filtered
    against consumer_number returned zero rows even though that exact value is a real row's
    new_meter_serial_number). If you cannot tell which identifier column a value belongs to, filter with OR across
    every plausible candidate column instead of guessing a single one from wording alone.
  # Consumer-to-feeder mapping audit (KPI 50) -- the WFM dashboard's own tables (Advanced Analytics ->
  # Consumer-to-Feeder Mapping Audit; HES-BACKEND-GMR reads mapping_audit / _feeder / _summary, written by
  # gmr-etl kpi_50_mapping_audit.py). Verified live 27 Oct 2026; months 2026-06-01 .. 2026-08-01.
  "mapping_audit.verdict": >-
    Exactly one of 'CONFIRMED', 'REASSIGN', 'REVIEW', 'NO DATA' (upper-case, 'NO DATA' with a space). CONFIRMED =
    the declared feeder matches the outage evidence; REASSIGN = the evidence points to another feeder (re-tag);
    REVIEW = evidence seen but not decisive (field check); NO DATA = never in a feeder-specific outage window.
  "mapping_audit.data_date": >-
    The audit MONTH (first of the month, e.g. DATE '2026-08-01'); one full copy of every consumer per month. ALWAYS
    pin one month: data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) for 'now' / no month
    named, or DATE '2026-07-01' for July -- never mix months.
  "mapping_audit.meter_no": >-
    The consumer meter serial (e.g. 'AL1157049') -- 'consumer', 'meter' and 'consumer meter' all mean this column.
  "mapping_audit.declared_feeder": >-
    feeder_code the consumer is tagged to in the records = the INDEX-BASED / system / current / declared / original
    feeder. NULL only for the 51,102 consumers with no hierarchy at all.
  "mapping_audit.auto_feeder": >-
    feeder_code the audit says is correct = the AI-BASED / recommended / auto-indexed / corrected feeder: the
    declared feeder when CONFIRMED, the new feeder when REASSIGN, NULL when REVIEW or NO DATA (undecided).
  "mapping_audit.best_feeder": >-
    The candidate feeder with the strongest outage evidence (the re-tag target for REASSIGN). Not the recommended
    feeder for REVIEW rows -- use auto_feeder for 'AI feeder'.
  "mapping_audit.declared_dark": >-
    Outage windows of the DECLARED feeder in which this consumer also went dark (evidence FOR the declared feeder).
    Outage match of the declared feeder = declared_dark || ' of ' || (declared_dark + declared_powered).
  "mapping_audit.declared_powered": >-
    Outage windows of the DECLARED feeder in which this consumer stayed powered (evidence AGAINST it).
  "mapping_audit.best_dark": >-
    Outage windows of best_feeder in which this consumer went dark. Outage match of the recommended feeder =
    best_dark || ' of ' || (best_dark + best_powered). The correction queue ranks by best_dark DESC.
  "mapping_audit.cluster": >-
    The PROJECT: 'Agra', 'Kashi', 'Triveni' (title case; compare LOWER(cluster) = 'kashi'). NULL for the 51,102
    consumers with no hierarchy (they are NO DATA and are part of the all-project totals).
  "mapping_audit.zone": >-
    Upper-case zone name ('AGRA', 'VARANASI II', 'PRAYAGRAJ I' ...); compare UPPER(zone) = 'VARANASI II'.
  "mapping_audit.sub_station": >-
    Substation name with its code ('ETMADPUR SS_22238', 'SIKRARA_416382'); match a named substation with
    UPPER(sub_station) LIKE '%ETMADPUR%' and show the full name.
  "mapping_audit.mapping_confidence": >-
    How the DECLARED tag was sourced in the meter master ('high', 'declared_only', 'cross_substation', ...) -- NOT
    the audit's confidence. was_cross_substation = declared feeder belongs to another substation (always REASSIGN).
  "mapping_audit_feeder.feeder_code": >-
    One row per feeder_code per month; the reliable feeder key. The row with feeder_code NULL is not a feeder: it
    holds the 51,103 consumers with no feeder -- exclude it (feeder_code IS NOT NULL) from feeder listings/rankings.
  "mapping_audit_feeder.feeder_name": >-
    Feeder name with its code appended ('METHAPAR_41638210383MET'). A named feeder: UPPER(feeder_name) LIKE
    '%METHAPAR%' -- one row per feeder_code (a short name can match several feeders; list them, never SUM them).
  "mapping_audit_feeder.mi": >-
    MI = consumers DECLARED (tagged in the records) to this feeder = correct_tagging + out + review + nodata. 'MI'
    here means meters indexed, not Meter Installation.
  "mapping_audit_feeder.ci": >-
    CI = consumers indexed to this feeder in the field indexing register (WFM unified_indexing) -- a separate count
    from MI; MI vs CI gaps show register mismatches.
  "mapping_audit_feeder.auto": >-
    Consumers the EVIDENCE places on this feeder (correct_tagging + inc) = the AI-based consumer count.
  "mapping_audit_feeder.correct_tagging": >-
    Consumers declared here and CONFIRMED (correct tagging). Same value as `correct`.
  "mapping_audit_feeder.out": >-
    REASSIGN OUT: consumers declared to this feeder that the evidence moves to another feeder.
  "mapping_audit_feeder.inc": >-
    REASSIGN IN: consumers declared to other feeders that the evidence moves TO this feeder. SUM(out) = SUM(inc)
    over all feeders (the same reassignments counted at each end) -- never add out + inc as 'total reassignments'.
  "mapping_audit_feeder.review": >-
    Consumers declared here whose evidence is inconclusive (REVIEW).
  "mapping_audit_feeder.nodata": >-
    Consumers declared here with no outage evidence at all (NO DATA). Pending for a feeder = review + nodata.
  "mapping_audit_feeder.confidence_pct": >-
    Feeder confidence % = determined (correct_tagging + out) * 100 / mi, one decimal: the share of the feeder's
    consumers the audit could DECIDE -- coverage, not 'correctly tagged %' (that is correct_tagging * 100 / mi).
    Lowest-accuracy / least-confident feeder = lowest confidence_pct (with a meaningful mi, e.g. mi >= 100).
  "mapping_audit_feeder.zone": >-
    Upper-case zone; this table has NO project column -- a project is its zones: Agra = AGRA, ALIGARH, ETAH,
    FIROZABAD, MATHURA; Kashi = AZAMGARH, VARANASI I, VARANASI II; Triveni = MIRZAPUR, PRAYAGRAJ I, PRAYAGRAJ II.
  "mapping_audit_candidates.candidate_feeder": >-
    One row per (consumer meter_no, candidate feeder, month): every feeder of the consumer's substation the audit
    scored it against. is_declared = TRUE marks the consumer's current (index-based) feeder. ALWAYS filter meter_no
    (or one feeder) and data_date -- ~15-20M rows a month.
  "mapping_audit_candidates.supporting": >-
    Outages of this candidate feeder in which the consumer ALSO went dark (evidence FOR this feeder);
    contradicting = its outages in which the consumer stayed powered (evidence AGAINST); net_score = supporting -
    contradicting. The dashboard ranks candidates ORDER BY supporting DESC, net_score DESC -- the top one is the
    feeder the evidence points to.
  "mapping_audit_evidence.slot": >-
    One 30-minute block (UTC timestamp) inside an outage of candidate_feeder; event_id numbers the outages of that
    feeder for this consumer (an outage = its slots; start = MIN(slot), end = MAX(slot)). consumer_dark = the
    consumer had no supply in that slot; consumer_comm = FALSE means the consumer sent no reading. Show times in
    IST: slot AT TIME ZONE 'Asia/Kolkata'. Written for REASSIGN consumers only (others have no rows). HUGE (~90-500M
    rows a month): ALWAYS filter meter_no (or declared_feeder / candidate_feeder) and data_date.
  "mapping_audit_summary.verdict": >-
    'CONFIRMED', 'REASSIGN', 'REVIEW', 'NO DATA' -- one row per (substation, verdict) with consumer_count.
  "mapping_audit_summary.consumer_count": >-
    Consumers with this verdict at this substation. SUM over the month = meters audited (4,162,914 for Aug 2026).
  "mapping_audit_summary.zone": >-
    Upper-case zone; no project column -- a project is its zones (see mapping_audit_feeder.zone). The row with
    zone / sub_station NULL holds the 51,102 consumers with no hierarchy (NO DATA): keep it in all-project totals.
  # --------------------------------------------------------------------- #
  # WFM full audit (gmr_wfm_silver Athena tables + WFM Postgres gold_*
  # tables) -- unlike the Postgres gold_* tables below (auto-sampled by
  # _sample_dimension_values at refresh() time), Athena tables get NO
  # automatic sample-value profiling at all (see module docstring point 1
  # -- scanning a 90M-row Athena table per column on every catalog build
  # isn't practical), so every enum/status-like column on the Athena
  # (gmr_wfm_silver) side needed a manually-verified hint the same way
  # consumer_detail_autoindexing.status got one above -- each verified live
  # via SELECT <col>, COUNT(*) FROM <table> GROUP BY <col> ORDER BY COUNT(*)
  # DESC LIMIT 31 against the real table. Columns NOT covered here are
  # either self-evident geo/name dimensions (zone/circle/technician_name/
  # agency/...), free_text remarks, or internal ETL/QC lineage plumbing
  # (business_key_hash, source_record_hash, qc*_source_file_fingerprint,
  # qc*_logical_record_number, content_hash_version, normalization_version,
  # geo_entity_key, processing_run_id, ...) that a real business question
  # essentially never references directly -- role="identifier" plus HARD
  # RULE 1 (only reference listed columns) already keeps those out of a
  # sensible plan without needing a dedicated hint each.
  "unified_complaints.qc_tier": &hint24 >-
    Exactly 1, 2, or 3 (verified live) -- WHICH QC review tier this row's data most recently passed/reached (matches
    the qc1_status/qc2_status/qc3_status pipeline and the 'report' column's QC1/QC2/QC3 suffix). A discrete tier
    number, NOT a summable quantity -- never SUM(qc_tier).
  "unified_installations.qc_tier": &hint25 >-
    Exactly 1, 2, or 3 (verified live) -- WHICH QC review tier this row's data most recently passed/reached (matches
    the qc1_status/qc2_status/qc3_status pipeline and the 'report' column's QC-tier suffix). A discrete tier number,
    NOT a summable quantity -- never SUM(qc_tier).
  "unified_indexing.qc_tier": &hint26 >-
