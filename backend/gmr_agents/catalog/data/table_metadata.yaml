  "dt_loss.asset_billed": *hintab
  "feeder_loss_ai.asset_billed": *hintab
  "feeder_loss.mapping_coverage": "children_reporting / children_mapped as a 0-1 fraction (x 100 for %)."
  # ---- grpG_m (10 Nov 2026) ----
  "unified_discom_escalations.escalation_supervisor": >-
    The DISCOM officer who approved/rejected the escalation (not a GMR supervisor); NULL while pending.
  "unified_discom_escalations.escalation_supervisor_remarks": >-
    The discom officer's free-text decision remark ('why rejected / approved'), not the technician's remark.
  "unified_discom_escalations.escalation_attended_on": >-
    When the discom decided (approved/rejected) -- UTC; days to decide = escalated_on -> this.
  "unified_discom_escalations.escalation_status": >-
    Mixed case ('Pending','Approved','Rejected') or blank: compare UPPER(TRIM(...)); blank = 'UNKNOWN' on the card.
  "unified_discom_escalations.technician_remarks": >-
    GMR technician's reason for escalating (the card's technician_remark, upper-cased there).

# --- only if the MVs are swapped in later (not recommended now) ---
# gold_mi_sat_eligibility_mv: >-
#   MI vs SAT vs invoice by place, category, meter_type, sat_stage, invoice/collection flags and is_sat_eligible
#   (installed on/before the project cutoff in sat_eligibility_config, applied at refresh); SUM(meter_count).
#   The dashboard's MI vs SAT card and home SAT tiles read this; same rows as gold_mi_sat_invoice_snapshot.
# gold_non_sat_ageing_mv: >-
#   Eligible meters still without SAT by place, category, meter_type and age_key (days since install at refresh);
#   the Non-SAT Ageing card's table; same rows as gold_non_sat_ageing_snapshot.
# gold_mi_eligible_installations_mv: >-
#   3 rows: eligible installations per project (replacements included) -- denominator of the home 'SAT % of eligible MI'.
  # ---- grpE (10 Nov 2026) ----
  overload_md_breach:
    assessed_meters: "Fleet-wide consumers assessed, the SAME constant on every row -- never SUM it and never use it as a filtered denominator; use SUM(assessed_meters) FROM load_assessed_consumers with the same filters."
    risk_bucket: "'90-105%' = 90 to under 106, '106-120%' = 106 to 120, '>120%' = above 120 (% of sanctioned load). Below 90% is not stored."
    md_source: "'Billing MD' (June) or 'Block data' (July, August: MD derived from half-hour energy). Not a filter users ask for."
    sanctioned_load_kw: "1 kW for ~63% of consumers (system default). Credible = sanctioned_load_kw > 1 (there is no assessment_credible column)."
  load_diversion:
    utilisation_factor: "Same value as uf_value (legacy alias) -- use uf_value."
    is_uf_suspect: "Identical to is_diversion_suspect -- use is_diversion_suspect."
  energy_theft_suspect:
    data_date: "The DAY, not the month -- filter month_date for a month."
    suspect_pattern: "NULL unless is_theft_suspect; a meter can carry both patterns on different days."
  theft_reduction_trend:
    reduction_pct: "Per sub-division and NULL where prev_suspects = 0 -- never AVG it; recompute from SUM(prev_suspects) and SUM(curr_suspects)."
  total_anomalies_detected:
    distinct_meters: "Meters flagged for THIS anomaly_type in this area/category; additive within one type, but a meter with two types counts in both (sum over types = anomaly flags, not meters)."
  repeat_anomaly_tracking:
    repeat_band: "Text '3' / '5' / '7' / '9' -- exact detector counts; 4, 6, 8 are not stored. Sort with CAST(repeat_band AS INTEGER)."
  # ---- grpH (10 Nov 2026) ----
  "block_usage.wh_import": >-
    Wh imported in THIS half-hour (not cumulative): kWh = wh_import / 1000.0. Feeder meters read secondary side:
    true energy = x MF (dim_meter.mf).
  "block_usage.data_date": Partition column (IST day). Always pin it to one day (max 3) together with meter_no.
  "daily_usage.wh_import": >-
    CUMULATIVE register reading in Wh at 00:00 IST of data_date (not the day's use): consumption = later reading
    minus earlier reading, / 1000 = kWh.
  "dim_meter.consumer_id": >-
    Consumer (account) number as text; may carry leading zeros -- match regexp_replace(TRIM(consumer_id), '^0+', '').

# Deterministic label overrides for a handful of columns whose raw name
# reads badly once title-cased into a KPI/table-header label (see
# gmr_agents/sql/executor.py::build_profile_for_plan, which falls back to
# ColumnMeta.header_label for any SQL alias that matches a real column name
# verbatim) -- "reassign_out"/"reassign_number" title-case into "Reassign
# Out"/"Reassign Number", an imperative-verb-reading label that a live user
# question flagged as confusing; "Reassigned"/"Reassigned Out"/"Reassigned
# In" read as the status they actually are. Keyed (table_name, column_name),
# consulted in refresh() when building each Athena column's ColumnMeta.
header_label_overrides:
  "mapping_audit.declared_feeder": Index-based Feeder
  "mapping_audit.auto_feeder": AI-based Feeder
  "mapping_audit.best_feeder": Best Evidence Feeder
  "mapping_audit_candidates.candidate_feeder": Candidate Feeder
  "mapping_audit_candidates.supporting": Outages Dark With Feeder
  "mapping_audit_candidates.contradicting": Outages Stayed Powered
  "mapping_audit_candidates.net_score": Net Score
  "mapping_audit_candidates.is_declared": Current (Index-based) Feeder
  "mapping_audit_evidence.consumer_dark": Consumer Went Dark
  "mapping_audit_evidence.consumer_comm": Consumer Reporting
  "mapping_audit_feeder.mi": Consumers Declared (MI)
  "mapping_audit_feeder.ci": Consumers Indexed (CI)
  "mapping_audit_feeder.correct_tagging": Correctly Tagged
  "mapping_audit_feeder.out": Reassigned Out
  "mapping_audit_feeder.inc": Reassigned In
  "mapping_audit_feeder.nodata": No Data
  "mapping_audit_feeder.confidence_pct": Confidence %

# One-sentence, per-table description -- derived from each table's own
# column composition (verified: every claim below is directly readable off
# the real column list, not guessed business context) plus this session's
# already-established acronym meanings (SAT, MF, MI vs OM). Purpose:
# BOTH the SQL planner prompt (prompt_context() below) AND schema/retrieval.py's
# BM25 document get this text, so a natural-language question has more to
# match against than a bare table/column name -- e.g. "technician
# productivity" alone can't tell gold_om_* (complaint-handling) apart from
# gold_mi_* (installation) by name/columns alone nearly as well as it can
# once each says what kind of productivity it counts.
#
# NOT individually live-verified against real data the way the column
# hints and place-name aliases above are (that isn't practical for a
# one-line gloss on 96 tables) -- flag any of these that turn out wrong so
# it can be corrected the same verified way those were.
table_descriptions:
  # hes_gold -- theft / loss
  # hes_gold -- voltage quality
  low_voltage_pockets: >-
    Low-voltage pockets card: per month x discom/category/zone/circle/division/sub_division x band (Critical /
    Poor / Average) x ageing_bucket, unique_meter_count. A meter can sit in several bands -- count meters from
    low_voltage_pockets_meters.
  low_voltage_pockets_meters: >-
    Low-voltage pockets, one row per meter x band per month (days, band_blocks, phases_affected, ageing_bucket,
    category, cluster, zone..sub_division, feeder_code, dtr_code). Meters flagged = COUNT(DISTINCT meter_no).
  voltage_deviation: Per-meter voltage deviation from nominal (mean/max % deviation, min/max/avg voltage).
  voltage_deviation_index: >-
    Voltage Deviation Index (VDI) card: one row per meter per month -- vdi_mean / vdi_p95 / vdi_rms (% away from
    nominal), live_blocks, status Good / Moderate / Poor / Offline, role (meter type), zone..sub_station.
  voltage_drop: >-
    Voltage Drop card: one row per meter per month -- drop_mean / drop_max (volts below the 0.9 x nominal floor),
    intervals_with_drop, status OK / Mild / Moderate / Severe / Offline, per-phase R/Y/B drops.
  voltage_fluctuation_index: >-
    Voltage Fluctuation Index (VFI) card: one row per meter per month -- vfi_pct (swing vs its own daily average),
    six signed band counts (dips / surges), status Stable / Moderate / Unstable / Offline.
  voltage_unbalance_index: >-
    Voltage Unbalance Index (VUI) card: 3-phase meters, one row per meter per month -- vui_mean / vui_max, block
    counts 0-2% / 2-3% / >3%, status Good / Moderate / Poor (Phase missing / Offline excluded).
  current_unbalance: >-
    Meter Current Unbalance card: 3-phase meters, one row per meter per month -- current_unbalance_mean / _max (%),
    block counts <3 / 3-5 / 5-10 / >=10%, status Good / Moderate / Elevated / Poor / Offline/NoLoad.
  pct_time_current_imbalance: >-
    % Time with unacceptable current imbalance (>10%) card: one row per 3-phase meter per month --
    ci_gt_10pct_blocks / phase_i_live_blocks, status Compliant / Borderline / NonCompliant.
  pct_time_out_of_band: >-
    % Time beyond voltage tolerance band card: one row per meter per month -- ov_blocks / uv_blocks / oob_blocks of
    live_blocks (+-10% of nominal), status Compliant / Borderline / NonCompliant / ChronicViolation / Offline.
  # hes_gold -- power factor
  low_power_factor: Zone/area-level count of low-power-factor meters/events, banded by severity and ageing.
  low_power_factor_meters: Meter-level detail behind low_power_factor (per-meter low-PF %, min/avg PF, ageing).
  # hes_gold -- load / DTR / feeder network loss
  dim_dtr_capacity: DTR (distribution transformer) rated capacity (kVA) reference/dimension table.
  dt_loading: >-
    % DT Loading card: one row per DT x loading_band per month (only bands the DT spent time in) -- block_count of
    total_blocks, plus per-DT peak_block_band / max_pct_loading / overload_blocks repeated on each row. Count DTs
    with COUNT(DISTINCT meter_no).
  dt_load_kva: >-
    DT Load (kVA) card: one row per DT per DAY (data_date = day, month_date = month) -- peak/avg/min load kVA,
    peak_pct_loading, overload_slots (half-hours at/above rating), 48-slot load_profile array, peak_band.
  dt_load_profile: Per area x day x half-hour slot sums of DT load kVA and rating (area load profile).
  dt_load_rise: >-
    DT Load Rise card: one row per DT per month -- pct_loading (average % of rating) vs prev_pct_loading (previous
    month), load_rise_pp (percentage points), peak rise.
  dt_loading_daily: Per DT x day x loading band half-hour counts (daily view of dt_loading).
  dt_peak_loading_feeder: >-
    % DT Peak Loading by feeder: one row per feeder per month -- assessed_dts, overloaded_90_dts (>90%, includes
    >100), overloaded_100_dts, underloaded_dts, most loaded DT.
  load_assessed_consumers: >-
    Denominator of % Consumers with Load Violation: consumers assessed (assessed_meters) per month x discom /
    category / cluster / zone..sub_division.
  dt_peak_loading: >-
    % DT Peak Loading card: one row per DT per month -- peak_load_kva, pct_peak_loading (% of dtr_rating_kva),
    peak_band, load_status Overloaded >100% / Overloaded 90-100% / Normal / Underloaded <20%.
  load_violation: >-
    % Consumers with Load Violation card: VIOLATORS ONLY, one row per consumer per month whose max demand md_kw is
    over 1.6 x sanctioned_load_kw (excess_kw, excess_pct, category consumer_1_phase / consumer_3_phase, cluster,
    zone..sub_division). Denominator = load_assessed_consumers.
  # hes_gold -- outage / reliability
  # hes_gold -- anomaly / consumption
  # hes_gold -- communication / data quality
  # hes_gold -- meter master
  # hes_gold -- ETL staging (internal plumbing, not a business metric)
  _stage_pq_phase: >-
    ETL staging table (intermediate build artifact) for phase-level power-quality metrics -- not a finished business
    table.
  _stage_pq_voltage: >-
    ETL staging table (intermediate build artifact) for voltage power-quality metrics -- not a finished business
    table.
  # hes_gold -- Consumer-to-Feeder Mapping Audit (KPI 50): the WFM dashboard's own tables (Advanced Analytics
  # card; HES-BACKEND-GMR routes kpi_code=mapping_audit to these three; written by gmr-etl
  # kpi_50_mapping_audit.py). One full copy per month (data_date); the dashboard opens on the LATEST month.
  # WHICH TABLE:
  #   - counts / % for all, a project (its zones), discom, zone, circle, division, sub-division or substation
  #     -> mapping_audit_summary (small): SUM(consumer_count) by verdict.
  #   - one feeder, feeder rankings, MI / CI / reassign in / out / confidence -> mapping_audit_feeder (small).
  #   - one consumer / meter, the correction queue (REASSIGN list), per-meter attributes -> mapping_audit (large:
  #     always data_date pinned, plus a meter_no / place filter).
  mapping_audit: >-
    Consumer-to-feeder mapping audit, one row per consumer meter per month (~4.16M rows a month, large): verdict
    (CONFIRMED / REASSIGN / REVIEW / NO DATA), declared_feeder (index-based / system feeder), auto_feeder (AI-based /
    recommended feeder; NULL when undecided), best_feeder (strongest candidate), outage evidence counts
    (declared_dark / declared_powered for the declared feeder, best_dark / best_powered for best_feeder),
    cluster (= project), discom_code, zone, circle, division, sub_division, sub_station. Use for one consumer
    (WHERE meter_no = 'X' AND data_date = latest month) and for correction-queue lists (verdict = 'REASSIGN').
  mapping_audit_feeder: >-
    Per-feeder roll-up of the mapping audit per month (one row per feeder_code): feeder_name, sub_station, zone ..
    sub_division, mi (consumers declared), ci (consumers in the field indexing register), auto (consumers the
    evidence places here), correct_tagging (confirmed), out (reassign OUT), inc (reassign IN), review, nodata,
    determined (correct_tagging + out), confidence_pct (determined / mi). No project column (project = its zones).
  mapping_audit_candidates: >-
    Mapping-audit evidence scores, one row per consumer meter x candidate feeder x month (large): meter_no,
    declared_feeder, candidate_feeder, supporting (its outages in which the consumer went dark), contradicting (its
    outages in which the consumer stayed powered), net_score, is_declared (the current feeder), discom_code .. sub_station.
    Use for 'which feeders was meter X scored against / why was it reassigned / evidence for meter X': WHERE meter_no =
    'X' AND data_date = latest, ORDER BY supporting DESC, net_score DESC.
  mapping_audit_evidence: >-
    Mapping-audit outage log behind each REASSIGN verdict, one row per consumer x candidate feeder x 30-minute outage
    slot (UTC) x month (huge): meter_no, sub_station, declared_feeder, candidate_feeder, event_id (the outage), slot,
    consumer_dark, consumer_comm. Use for 'when did feeder Y go dark and did meter X go dark with it' / the proof pack
    of one feeder's re-tags -- always WHERE meter_no or a feeder AND data_date. Outages = GROUP BY candidate_feeder,
    event_id (start MIN(slot), end MAX(slot), dark = BOOL_OR(consumer_dark)).
  mapping_audit_summary: >-
    Per-substation verdict counts of the mapping audit per month: one row per (sub_station, verdict) with
    consumer_count, declared_feeders and cross_substation_count, plus discom_code, zone, circle, division,
    sub_division. The headline source: meters audited = SUM(consumer_count); confirmed / reassign / review /
    no data = SUM FILTER (verdict = ...); substations = COUNT(DISTINCT sub_station). No project column (project =
    its zones).
  # hes_silver
  billing: 'Per-meter billing-cycle record: cumulative energy (import/export, tariff-zone-wise) and max-demand readings.'
  power_outage: Per-meter individual power-outage event records (start, end, duration, category).
  dim_installation: Per-meter installation/location dimension table (network hierarchy, sanctioned load, GPS coordinates).
  # gmr_wfm_silver -- complaints/tickets, installations, assets
  unified_complaints: >-
    Full consumer-complaint/ticket lifecycle records (raised, worked, QC-reviewed) -- large table, needs a date/geo
    filter.
  unified_active_complaints: >-
    Currently OPEN/active complaints only -- not the full historical complaint log (see unified_complaints for
    that).
  unified_installations: >-
    Meter-installation service records (a new meter fitted at a consumer) -- large table, needs a date/geo filter.
  unified_smart_meter_asset: >-
    Smart-meter asset master: network hierarchy (feeder/DTR GIS identifiers), consumer category mix, and capacity.
    Not for one meter's details (stage, status, category, type, install, SAT): those come from
    unified_installations, unified_smart_meter_inventory and sat_meter_mappings.
  unified_smart_meter_inventory: >-
    Smart-meter inventory lifecycle: warehouse -> agency -> supervisor -> technician -> installed, with seal/serial
    tracking.
  unified_decommissioned_meter: Meters taken out of service (decommissioned), with the warehouse/supervisor/agency acceptance chain.
  unified_discom_meter_asset: >-
    DISCOM-side meter/feeder/DTR asset register -- network configuration detail (AMR/RTDAS monitoring, consumer mix,
    capacity).
  unified_indexing: Meter geo-indexing service records (recording a meter's GPS location against its network hierarchy).
  unified_non_qc_complaints: >-
    Complaint records that bypassed the normal QC pipeline -- includes seal/cable-replacement detail
    unified_complaints doesn't have.
  sat_meter_mappings: >-
    Maps each meter to its SAT (Site Acceptance Test) number. For "when was meter X's SAT done/completed", this
    table alone only gives the sat_number -- JOIN to sat_milestones (on BOTH project AND sat_number, see its own
    hint) to get the actual sat_date. When the question identifies a CONSUMER (consumer_number) instead of a meter
    serial number directly, JOIN in from unified_installations first (new_meter_serial_number = this table's
    meter_serial_number) -- that table also has mi_date (installation date), so a "when was this consumer installed
    AND when was its SAT done" question is one query across all three tables, not two separate ones.
  sat_milestones: >-
    Per-SAT-number milestone dates (SAT date, lumpsum/PMPM invoice and collection dates). Has no meter column itself
    -- for a per-METER SAT date question, JOIN to sat_meter_mappings first (meter_serial_number -> project +
    sat_number), then to this table on BOTH project AND sat_number. VERIFIED LIVE: sat_number is NOT globally unique
    -- values like 'SAT-8' repeat across multiple different projects, so joining on sat_number alone silently
    matches the wrong project's milestone row (or multiplies rows 3x). ALWAYS join on project AND sat_number
    together, never sat_number alone.
  # gold_* (Postgres, pre-aggregated) -- installation/inventory/productivity/SAT
  gold_meter_installation_pending_stage_snapshot: Current snapshot of meter counts still PENDING at each installation stage, by project/warehouse/OEM.
  gold_mi_installation_day_agg: >-
    Daily aggregated Meter-Installation (MI) counts by zone/OEM -- both inventory-intake and installation-progress
    breakdowns.
  gold_mi_installation_month_agg: >-
    Monthly aggregated Meter-Installation (MI) counts by zone/OEM (same shape as gold_mi_installation_day_agg,
    coarser grain).
  gold_om_technician_productivity_day_agg: 'Daily per-technician complaint-handling (O&M) productivity: complaint_count, active days.'
  gold_om_technician_productivity_month_agg: Monthly per-technician complaint-handling (O&M) productivity (same shape as the day-agg version).
  gold_mi_technician_productivity_day_agg: >-
    Daily per-technician meter-INSTALLATION productivity (MI): installation_count, active days -- NOT
    complaint-handling (see gold_om_* for that).
  gold_mi_technician_productivity_month_agg: Monthly per-technician meter-installation (MI) productivity (same shape as the day-agg version).
  gold_mi_productivity_trend_month_agg: >-
    Monthly meter-installation productivity trend, aggregated at a configurable level
    (filter_level/aggregate_level), across active technicians.
  gold_om_open_ageing_snapshot: Current snapshot of OPEN complaint ticket counts, bucketed by how long they've been open (ageing).
  gold_non_sat_ageing_snapshot: Current snapshot of installed-but-not-yet-SAT'd meter counts, bucketed by ageing.
  gold_meter_defect_event_day_agg: Daily count of meter-defect events, broken down by defect type and OEM.
  gold_meter_inventory_event_day_agg: Daily meter inventory/installed/stock-consumed event counts by zone/category.
  gold_meter_inventory_event_month_agg: Monthly meter inventory/installed/stock-consumed event counts (same shape as the day-agg version).
  gold_inventory_monthly_balance: >-
    Dashboard chart feed only: monthly RUNNING totals per place (needs latest-row-per-place logic). For remaining stock,
    supplied, installed, utilization or MI pace -- today or as of any date -- use gold_meter_inventory_event_day_agg instead.
  gold_inventory_unutilized_stock_snapshot: Current snapshot of unutilized (not-yet-deployed) stock sitting in warehouses, by SKU/OEM.
  gold_meter_journey_stage_agg: >-
    Aggregated end-to-end meter journey duration (inventory -> agency -> supervisor -> technician -> installation ->
    SAT -> revenue), summed per group.
  gold_meter_revenue_pending_stage_snapshot: Current snapshot of meter counts still pending REVENUE realization, by current stage.
  gold_revenue_ageing_snapshot: Current snapshot of revenue-pending meter counts, bucketed by ageing since SAT.
  gold_mi_sat_invoice_day_agg: Daily counts of meters reaching SAT and lumpsum/PMPM invoice milestones.
  gold_mi_sat_invoice_snapshot: Current snapshot of SAT-stage and invoice-eligibility status, by group.
  gold_dashboard_stats_snapshot: Singleton (one row) snapshot of overall program-wide headline KPIs -- not filterable by zone or date.
  revenue_receivables: >-
    Revenue Receivables KPI input -- one row per upload per project (latest created_at per project is current) with
    lumpsum / PMPM / cable amounts invoiced, realised and realised within timeline (INR).
  geography_nodes: >-
    Geography hierarchy (project/DISCOM/zone/circle/division nodes, parent_id links, valid_from/valid_to versions) --
    lookup for names and levels, e.g. mapping revenue_receivables.project to its DISCOM.
  sat_eligibility_config: >-
    Per-project SAT eligibility cutoff date (eligibility_cutoff_date) -- meters installed after it are not yet
    eligible for SAT; used by the MI vs SAT and Non-SAT ageing KPIs.
  gold_om_closed_tickets_day_agg: >-
    O&M tickets closed per day (closed_date) by place, feeder, dtr, category (CONSUMER / DT / FEEDER), meter_type,
    complaint_type -- the Ticket Closed Analysis card, every category; SUM(closed_tickets). Place values lower-case.
  gold_om_open_ticket_detail_snapshot: >-
    Open O&M tickets in detail (Never / Non-comm card): complaint type, status, is_escalated, technician remark
    (remark_bucket), age band, SAT status, is_sm_replaced (meter already replaced SM to SM), repeat_ticket_count.
  gold_om_discom_escalation_snapshot: >-
    Tickets escalated to the discom (SmartEMS DISESC): technician remark, complaint received, escalation_status
    PENDING / APPROVED / REJECTED, days since escalation (age_key), attended_count / attend_days_sum.
  gold_om_hhu_reading_day_agg: >-
    O&M tickets with a handheld-unit (HHU) meter-data upload per day: hhu_status OK / FAILED / OTHER, ticket_count,
    upload_count, technician_name.
  gold_om_meter_complaints_agg: >-
    One row per meter (meter_serial_number) with its O&M complaint counts (total/open/closed_complaints) and SAT status
    (sat_status 'SAT Done'/'Non-SAT', sat_number). Place values UPPER-case. CONSUMER rows carry only open complaints,
    DT/FEEDER rows only closed ones.
  # ---- grpA (10 Nov 2026) ----
  # hes_gold -- Operation Analytics phase imbalance (3-sigma test; NOT the Power Quality VUI / current_unbalance cards)
  voltage_imbalance: >-
    Voltage Imbalance card (Operation Analytics): EVERY feeder / DT / 3-phase / HT meter assessed, one row per meter
    per month -- total_blocks, imbalanced_blocks (half-hours failing the 3-sigma phase-voltage test), imbalance_pct,
    imbalance_days (days with > 50% imbalanced half-hours), days_with_data, ageing_bucket ('3-30 Days'... ; NULL =
    under 3 days, not flagged), category, cluster, zone..sub_division, feeder_code, dtr_code.
  current_imbalance: >-
    Current Imbalance card: same shape as voltage_imbalance for phase currents -- every meter assessed, flagged =
    ageing_bucket IS NOT NULL.
  voltage_imbalance_alerts: >-
    Voltage Imbalance Alerts card: alert meters ONLY, one row per meter per month -- severity (dominant day grade:
    Critical >= 85% / Poor >= 70% / Average >= 50% of half-hours imbalanced), severity_blocks, severity_days (3+),
    ageing_bucket; severity_run_days / ageing_bucket_run = consecutive-day reading.
  current_imbalance_alerts: >-
    Current Imbalance Alerts card: alert meters only, same shape as voltage_imbalance_alerts for phase currents.
  voltage_imbalance_reduction: >-
    'Phase imbalance reduced by minimum 30%' card, voltage half: EVERY meter compared, one row per meter;
    data_date = the CURRENT month (2026-07-01 = June -> July). prev_pct / curr_pct (imbalance % last / this month),
    reduction_pp (points), qualifies (reduction_pp >= 30 -- filter it to count improved meters), qualifies_relative,
    qualifies_live / *_live (usable 3-phase readings only), live_share_prev / _curr, comparable.
  current_imbalance_reduction: >-
    'Phase imbalance reduced by minimum 30%' card, current half: same shape as voltage_imbalance_reduction.
  imbalance_thresholds: >-
    Diagnostic only, not a dashboard card: the 3-sigma threshold per quantity (voltage / current), reference_group
    (meter type) and block_time, per month, written beside the imbalance jobs (source_kpi phase_imbalance /
    imbalance_reduction). Never used to count meters.
  # ---- grpB (10 Nov 2026) ----
  reverse_flow: >-
    Reverse Flow card: one row per CONSUMER meter (consumer_1_phase / consumer_3_phase) per month, every consumer
    checked -- is_anomaly marks findings; anomaly_type 'net_meter_non_exporting' (net meter NSM1-PH / NSM3-PH that
    exported nothing) / 'non_net_meter_exporting' (not a net meter, exported) / NULL; total_kwh_export, max_kwh_export
    (kWh), smart_meter_type, cluster, zone..sub_division, feeder_code, dtr_code. data_date = month 1st.
  data_quality_issues: >-
    Data Quality Issues card: one row per meter per month, EVERY meter with readings -- days_with_data, partial_days
    (days with 2-46 of 48 half-hour readings), partial_day_pct, total_blocks, avg_completeness_pct, category, cluster,
    zone..sub_division. data_date = month 1st.
  data_quality_issues_daily: >-
    Data Quality Issues weekly / daily view: one row per PARTIAL meter-day only -- month_date (month 1st), data_date
    (the day), week_label ('Week 1 July' = days 1-7 ... 'Week 5 July'), blocks, missing_blocks, completeness_pct.
  communication_failures: >-
    Meters Stopped Communicating card: one row per SILENT meter per month (no reading for 3+ days at the end of the
    month's data, incl. meters that never reported) -- last_seen_date, days_since_last_seen, never_reported, nc_bucket
    ('Non_Communicating_3_30_Days' / '_31_60_Days' / '_61_90_Days' / '_More_than_90_Days'), window_end (last data
    day), category, cluster, zone..sub_division. HES readings, not O&M tickets.
  hidden_outage_summary: >-
    Hidden Outage Pockets card (+ its four detector rows): one row per meter x detector per month -- detector
    'hidden_power_event' / 'outage_not_recorded' / 'unreported_blockload_gap' / 'abnormal_current_flow',
    total_block_count_flagged (flagged half-hours), total_block_count (half-hours checked), pct_blocks_flagged,
    total_flagged_occurrences / total_occurrences (outages), days_affected, first_slot / last_slot (UTC), category,
    cluster, zone..sub_division, feeder_code. data_date = month 1st. Not outage counts / SAIDI.
  hidden_outage_events: >-
    Slot-level rows behind hidden_outage_summary: one row per flagged 30-minute slot (slot UTC, detector, detail),
    month_date + data_date (day). 300M+ rows a month -- only for one meter (WHERE meter_no AND month_date).
  consumption_spike_drop: >-
    Consumption Spikes / Drops card: one row per meter per month, the WHOLE fleet -- is_spike_or_drop_suspect (10+
    outlier readings), spike_count, drop_count, total_outliers, meter_flag 'Spike' / 'Drop' / NULL, profile_std,
    category, cluster, zone..sub_division. Month column month_date (no data_date).
  consumption_spike_drop_detail: >-
    One row per outlier half-hour reading of flagged spike/drop meters -- month_date, data_date, block_time (UTC
    'HH:MM'), actual_kwh_import, baseline_mean, upper, lower, flag 'Spike' / 'Drop', deviation. 90M+ rows a month: only
    WHERE meter_no = 'X'.
  # ---- grpC (10 Nov 2026) ----
  lpf2_low_power_factor: >-
    Low Power Factor (%) by DT/Feeder card (LIVE): rollup of meters with 3+ observed flagged days, one row per month x
    discom_code x category x zone/circle/division/sub_division/sub_station x severity x ageing_bucket -- unique_meter_count,
    avg_low_pf_pct, max_ageing_days, avg_streak_coverage_pct, total_block_count (low-PF half-hours), pf_live_block_count.
    Card = WHERE severity NOT IN ('Normal','NoData'). No cluster / feeder / meter columns. Each month = rolling 90-day window.
  lpf2_low_power_factor_meters: >-
    One row per meter per month (every meter, incl. Not Aged / Normal / NoData): low_pf_pct = low_blocks / total_blocks
    (PF-valid half-hours, PF < 0.9), severity Critical > 50 / Poor > 35 / Average > 25 / Borderline >= 20 / Normal / NoData,
    ageing_days (observed flagged days in current run), ageing_bucket, streak_coverage_pct, avg_pf, min_pf, category,
    cluster, zone..sub_station, feeder_code, dtr_code, as_of_date. Rolling 90-day window ending as_of_date.
  lpf2_low_power_factor_daily: >-
    One row per meter per delivered DAY: pf_live_blocks, low_pf_blocks, pct_time_low_pf, avg/min/max_power_factor,
    energy_power_factor, status (Insufficient when < 12 PF-valid half-hours), is_flagged_day (>= 20%). Filter data_date by day range.
  power_factor_deterioration: >-
    Power factor deterioration card: one row per month x discom/category/zone..sub_division x pf_band ('Critical' < 0.30,
    'Poor' < 0.85, 'Moderate' < 0.95, 'Leading PF' > 1.0) x ageing_bucket -- unique_meter_count (meters with > 3 consecutive
    qualifying days), total_block_count = qualifying days. No cluster.
  power_factor_deterioration_meters: >-
    One row per meter x pf_band per month: qualifying_days, ageing_bucket, category, feeder_code, dtr_code, zone..sub_division.
    A meter can appear in two bands -- total meters = COUNT(DISTINCT meter_no).
  # ---- grpD (10 Nov 2026) ----
  reliability_indices: >-
    SAIDI / SAIFI / CAIDI / CAIFI / MAIFI cards and the Reliability Trends chart: ONE row per feeder per month
    (data_date = month 1st; 4,976 feeders every month, zero-outage feeders included). Consumer outages rolled up to
    the consumer's feeder: total_consumers (consumers mapped to the feeder), events (interruptions), dur (outage
    minutes), affected (consumers hit at least once), momentary (< 5 min events); the feeder's own saidi / saifi /
    caidi / caifi / maifi (rounded, for ranking feeders only). Area / fleet index = SUM(numerator) / SUM(denominator),
    never AVG of the ratios. below_min_consumers = under 100 consumers (left out of worst/best lists). cluster
    'Agra' / 'Kashi' / 'Triveni', zone..sub_division, sub_station, feeder_code, feeder_name, feeder_category.
    Outage data: June = Agra only, July = all, August = none (all zeros).
  outage_ranking: >-
    Number of Outages (Frequency) / Duration of Outages (Minutes) / Feeders with Maximum Outages cards: one row per
    METER per month (2026-06, 2026-07) with the outages that meter itself recorded -- outage_count,
    total_duration_min, avg_duration_min, max_duration_min, days_with_outage. category = 'feeder' (feeder meters) /
    'dt_meter' / 'consumer_1_phase' / 'consumer_3_phase' / 'consumer_ht' -- always pin one, never add categories.
    below_min_outages = fewer than 5 outages (left out of the top-10 lists). rank_by_count / rank_by_duration rank
    within discom_code x category, not within an area. feeder_code / dtr_code / meter_no, cluster, zone..sub_division.
  reliability_improvement_trends: >-
    Reliability Improvement Trend card: one row per feeder per COMPARISON. comparison_mode 'months'
    (comparison_label '2026-06 vs 2026-07', data_date = later month 1st) or 'halves' ('2026-07 days 1-15 vs 16-EOM',
    data_date 2026-07-16) -- July holds both, so always group by comparison_mode. prev_/curr_ saidi, saifi, caidi,
    caifi, maifi; <index>_delta = prev - curr; <index>_improvement_pct = delta * 100 / prev (positive = improved,
    NULL when prev = 0); prev_total_consumers / curr_total_consumers are the weights for fleet figures.
  # ---- grpF (10 Nov 2026) ----
  feeder_loss: >-
    Feeder Loss (%) / Energy Gap / Top X cards: one row per feeder per month (data_date = 1st; June-July 2026) --
    net_input (feeder meter kWh x MF), asset_billed (kWh its mapped consumers recorded), loss_kwh, loss_pct,
    added_kwh, children_mapped / children_reporting, loss_category, loss_credible, cluster, zone..sub_division.
  feeder_loss_ai: >-
    Feeder Loss on the AI mapping basis: same shape as feeder_loss, but consumers are attached by the mapping
    audit's auto_feeder (CONFIRMED / REASSIGN only) instead of the declared feeder. Use only when AI basis is asked.
  dt_loss: >-
    LT Loss (%) card: one row per DT per month -- dtr_code, parent feeder_code, net_input (DT meter kWh, MF 1.0
    placeholder), asset_billed, loss_kwh, loss_pct, loss_category, loss_credible, cluster, zone..sub_division.
  feeder_loss_consumers: >-
    Consumers behind one feeder's loss: one row per reporting consumer per month -- feeder_code, meter_no,
    category, mapping_confidence, raw_kwh, billed_kwh (pro-rated; sums to the feeder's asset_billed), added_kwh.
  feeder_loss_ai_consumers: Consumers behind one feeder on the AI mapping basis (same shape as feeder_loss_consumers).
  dt_loss_consumers: >-
    Consumers behind one DT's LT loss: one row per reporting consumer per month -- dtr_code, meter_no, category,
    raw_kwh, billed_kwh, added_kwh.
  # ---- grpG_m (10 Nov 2026) ----
  unified_discom_escalations: >-
    Every escalation of an O&M ticket to the discom (SmartEMS DISESC), one row per (discom, ticket_id,
    escalated_on); a ticket escalated 6 times has 6 rows -- count tickets at their latest escalation. Ticket,
    consumer_number, old_meter_serial_number, feeder / dtr / sub_station, technician_name, escalation_status
    (Pending / Approved / Rejected / blank), escalated_on and escalation_attended_on (UTC timestamps),
    escalation_supervisor (discom officer) and remarks. Detail behind the Escalated to Discom card; card
    totals come from gold_om_discom_escalation_snapshot.
  # ---- grpE (10 Nov 2026) ----
  # hes_gold -- Technical > Load Management (remainder) + Theft Analysis cards (gmr-etl kpi_60 / kpi_70 / kpi_72 /
  # kpi_45). Verified live 10 Nov 2026; months 2026-06..08, dashboard default month July 2026.
  overload_md_breach: >-
    Overload / MD breach risk card: AT-RISK consumers ONLY, one row per consumer per month whose maximum demand md_kw
    is 90%+ of sanctioned_load_kw -- overload_pct, risk_bucket '90-105%' / '106-120%' / '>120%' (healthy < 90% rows are
    not stored), category consumer_1_phase / consumer_3_phase, cluster, zone..sub_division, feeder_code, dtr_code.
    assessed_meters = fleet-wide constant; per-area denominator = load_assessed_consumers.
  load_diversion: >-
    Theft / Load diversion card: EVERY scored consumer, one row per consumer per month -- md_kw, monthly_kwh,
    active_hours, uf_value (utilisation factor = kWh / (md_kw x active hours)), is_diversion_suspect (= uf_value < 0.3),
    sanctioned_load_kw, category, cluster, zone..sub_division. Suspects = FILTER (WHERE is_diversion_suspect).
  energy_theft_suspect: >-
    Theft Suspect Flags card: EVERY meter, one row per meter per DAY (month_date = month, data_date = day) --
    is_theft_suspect (10+ day streak), suspect_pattern 'evening_high' / 'day_night_pattern', streak_length,
    evening_pct, day_avg_kwh, night_avg_kwh, category, cluster, zone..sub_division. Filter month_date AND
    is_theft_suspect; count COUNT(DISTINCT meter_no).
  theft_risk_by_area: >-
    Areas with Highest Theft Risk card: one row per DISTINCT at-risk meter per month -- theft_flag (theft suspect),
    diversion_flag (load diversion suspect), risk_score 1-2, cluster, zone..sub_division, feeder_code, dtr_code (no
    category). Count meters per area with COUNT(DISTINCT meter_no).
  theft_reduction_trend: >-
    % Reduction in Theft Events card: one row per sub-division per month -- prev_suspects (month in prev_period),
    curr_suspects, delta, reduction_pct; discom_code, zone..sub_division, NO cluster. Reduction % =
    (SUM(prev) - SUM(curr)) / SUM(prev).
  total_anomalies_detected: >-
    Total Anomalies Detected card: one row per area x category x anomaly_type per month -- distinct_meters flagged
    under that type (Hidden_Outage_Pockets, Consumption_Spike_Drop, Theft_Suspect_Flags, Load_Diversion,
    MD_Breach_Risk, ... 14 types). Per type = SUM(distinct_meters); no meter_no column.
  repeat_anomaly_tracking: >-
    Repeat Anomaly Tracking card: one row per meter per month flagged by EXACTLY 3, 5, 7 or 9 detector KPIs --
    repeat_count, repeat_band ('3'/'5'/'7'/'9'), flagged_kpis (e.g. 'Hidden Outage, Spike/Drop, PF Deterioration'),
    cluster, zone..sub_division (no category).
  # ---- grpH (10 Nov 2026) ----
  # hes_silver -- per-meter source readings (the dashboard's drill drawer 'Fetch from source data'). Replace the old
  # one-line entries. ADD a `hes_silver:` key under mdm_tables with block_usage and daily_usage (today the shortlist
  # has only hes_gold, so neither table is queryable), and dim_meter + dim_meter_replaced under hes_gold.
  block_usage: >-
    HUGE (~3.1 billion rows, ~175M a day, ~0.4-0.8 GB scanned per day even for one meter): one row per meter per
    half-hour, partitioned ONLY by discom_code + data_date (IST day) -- ALWAYS filter meter_no = 'X' AND data_date =
    one day (max 3). rtc = IST block start text, reading_ts_utc; wh_import / wh_export / vah_import = Wh / VAh in the
    half-hour (/ 1000 = kWh); 1-phase average_voltage / average_current (DOUBLE); 3-phase, DT and feeder voltage_rn /
    voltage_yn / voltage_bn, current_r / current_y / current_b (VARCHAR -> TRY_CAST); power_factor_total always NULL
    (PF = wh_import / vah_import); meter_type 'consumer' / 'dtr' / 'feeder'. Dates: Jun 1-2, Jun 27-30, Jul 5-9,
    13-17, 20-24, Aug 1-2 2026.
  daily_usage: >-
    One row per meter per IST day (data_date; partitioned by discom_code + data_date, ~4 GB in all): the CUMULATIVE
    register at 00:00 -- wh_import / wh_export / vah_import / vah_export in Wh (/ 1000 = kWh reading; consumption =
    later reading minus earlier), md_w_import (VARCHAR W, billing-period maximum demand) at md_w_date_time. Always
    meter_no = 'X' AND a data_date range of at most a month. Dates: Jun 1-2, Jun 27-30, Jul 5-8, 13-16, 20-23 2026
    (no August). The Energy Audit drawer's daily evidence.
  # hes_gold -- meter master
  dim_meter: >-
    HES meter master, one row per CURRENT meter (4,381,272): category ('consumer_1_phase', 'consumer_3_phase',
    'consumer_ht', 'dt_meter', 'feeder'), meter_type ('CONSUMER' / 'DT' / 'FEEDER'), smart_meter_type, discom_code
    ('DVVNL' / 'PUVVNL'), cluster (project 'Agra' / 'Kashi' / 'Triveni'; NULL for 107,509 unplaced meters), zone,
    circle, division, sub_division, sub_station, feeder_code, feeder_name, dtr_code, dtr_name, feeder_meter_no,
    consumer_id (text, leading zeros), mf, sanctioned_load_kw, installation_date. Swapped-out meters are in
    dim_meter_replaced.
  dim_meter_replaced: >-
    Meters swapped out in a replacement (3.46M, mostly the pre-smart meters a smart meter replaced), one row each,
    located where the replacing meter is: meter_no (old), replaced_by (new meter_no), replaced_on, category,
    cluster, zone .. sub_station, feeder_code, dtr_code. Look here when a meter serial is not in dim_meter.
  dim_meter_energy: Retired 16 Sep 2026 (stale copy of dim_meter) -- do not use; dim_meter replaces it.

# Well-known historical/former names for places that also appear as real
# zone/circle values in this DISCOM's schema -- mapped to the LIST of real
# stored value(s) they correspond to. Verified live against the actual data
# before adding, not assumed -- and the two domains disagree, which is
# exactly why this was checked rather than guessed:
#   - MDM (Athena hes_gold.theft_risk_by_area, `zone` column): THREE
#     distinct values -- "VARANASI", "VARANASI I", "VARANASI II" (confirmed
#     via a live `SELECT DISTINCT zone` -- Athena tables have no
#     sample_values grounding at all, so this alias dict IS the only
#     grounding available for them). Same three-way split for Prayagraj
#     (former Allahabad): "PRAYAGRAJ", "PRAYAGRAJ I", "PRAYAGRAJ II".
#   - WFM (Postgres gold_mi_installation_day_agg etc., `zone` column): only
#     TWO values, no bare city name -- "varanasi i" / "varanasi ii" (see
#     gmr_agents/cache/wfm_catalog.json's sample_values).
# The lists below carry the union (uppercase, matching the Athena ground
# truth); validation/sql_guard.py's case-insensitive filter rewriting means the
# casing here doesn't need to match a given table's own casing, and an IN-
# list member that happens not to exist on a particular table (e.g. bare
# "VARANASI" against a WFM table that only has the two sub-zones) simply
# contributes zero rows for that literal -- never an error. A bare "Kashi"
# -> "VARANASI" substitution would have silently dropped the two sub-zones
# entirely; using the union is what keeps this correct on both domains.
#
# This is a curated dict for genuine alternate names of the same real-world
# place (historical name, common alternate spelling) -- reviewed the same
# way MDM_TABLES/WFM_TABLES above are. It is deliberately NOT a general
# fuzzy-matching mechanism and must never be extended to column names or
# measure names -- that is exactly the guessed-substitute behavior
# planner/prompts.py rule 17 was written to stop.
place_name_aliases:
  kashi:
    - VARANASI
    - VARANASI I
    - VARANASI II
  banaras:
    - VARANASI
    - VARANASI I
    - VARANASI II
  benares:
    - VARANASI
    - VARANASI I
    - VARANASI II
  allahabad:
    - PRAYAGRAJ
    - PRAYAGRAJ I
    - PRAYAGRAJ II
  illahabad:
    - PRAYAGRAJ
    - PRAYAGRAJ I
    - PRAYAGRAJ II
