  "lpf2_low_power_factor.max_ageing_days": "Longest run in the group -- combine groups with MAX(), never SUM()."
  "lpf2_low_power_factor.total_block_count": "Low-PF half-hours (SUM of low_blocks), not all half-hours; PF-valid half-hours = pf_live_block_count."
