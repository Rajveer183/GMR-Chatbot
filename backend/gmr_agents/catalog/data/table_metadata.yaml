  "voltage_imbalance.ageing_bucket": &ihint1 >-
    NULL means NOT flagged (fewer than 3 imbalanced days) -- flagged meters = ageing_bucket IS NOT NULL. The table
    holds every meter assessed, so COUNT(*) alone is the assessed population, not meters with imbalance.
  "current_imbalance.ageing_bucket": *ihint1
  "voltage_imbalance_reduction.qualifies": &ihint2 >-
    TRUE = imbalance fell by 30+ percentage points vs last month (the card's 'improved' meters). The table holds
    every meter compared -- always filter qualifies to count improvements.
  "current_imbalance_reduction.qualifies": *ihint2
  "voltage_imbalance_reduction.data_date": &ihint3 >-
    The CURRENT month of the comparison: 2026-07-01 = June -> July, 2026-08-01 = July -> August.
  "current_imbalance_reduction.data_date": *ihint3
  "voltage_imbalance_alerts.severity": &ihint4 >-
    The meter's dominant day grade, Critical / Poor / Average (by share of imbalanced half-hours: >= 85 / 70 / 50%)
    -- not the Power Quality status bands.
  "current_imbalance_alerts.severity": *ihint4
