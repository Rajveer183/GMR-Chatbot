  - q: ["If Triveni productivity rose from 2.7 to 3.0, how many extra meters per day would we install?", "what if productivity increases", "what-if more technicians"]
    note: "Base = last 30 complete days. extra/day = (p_new - p_old) x technicians/day; also x30 per month. Compute in SQL."
    sql: |
      SELECT ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS current_productivity,
             ROUND(SUM(technician_day_count) / 30.0, 1) AS technicians_per_day,
             ROUND((3.0 - 2.7) * SUM(technician_day_count) / 30.0) AS extra_meters_per_day,
             ROUND((3.0 - 2.7) * SUM(technician_day_count) / 30.0 * 30) AS extra_meters_per_month
      FROM public.gold_mi_technician_productivity_day_agg
      WHERE category = 'ALL' AND LOWER(project) = 'triveni'
        AND period_start BETWEEN CURRENT_DATE - 30 AND CURRENT_DATE - 1

  - q: ["Which technician is responsible for Triveni's low productivity?", "who is to blame for low productivity", "which technicians pull productivity down in a project"]
    note: "Never blame one person: productivity is a team measure. Show the project's productivity, how many technicians (>= 5 active days, last 30 days) average under 2 installs a day, and the lowest few as 'may need support'."
    sql: |
      WITH t AS (SELECT technician_name, SUM(installation_count) AS installs, SUM(technician_day_count) AS tech_days,
                        COUNT(DISTINCT period_start) AS active_days
                 FROM public.gold_mi_technician_productivity_day_agg
                 WHERE category = 'ALL' AND LOWER(project) = 'triveni' AND period_start BETWEEN CURRENT_DATE - 30 AND CURRENT_DATE - 1
                 GROUP BY technician_name)
      SELECT (SELECT ROUND(SUM(installs)::numeric / NULLIF(SUM(tech_days), 0), 2) FROM t) AS project_productivity,
             (SELECT COUNT(*) FROM t WHERE active_days >= 5) AS technicians_5_plus_days,
             (SELECT COUNT(*) FROM t WHERE active_days >= 5 AND installs < 2 * tech_days) AS below_2_per_day,
             technician_name AS technician, ROUND(installs::numeric / NULLIF(tech_days, 0), 2) AS productivity, active_days
      FROM t
      WHERE active_days >= 5
      ORDER BY productivity, installs
      LIMIT 5

  - q: ["Which zone or circle has the lowest productivity, and why?", "least productive zone and reason"]
    suggest: "Which zone or circle has the lowest productivity, and why?"
    note: "Last 30 complete days; drop units with < 2% of technician-days; low-output days = technician-days with <= 1 install. Never blame a person. Totals come from the category = 'ALL' roll-up rows, the DT/feeder share from the per-category roll-ups (meter_type = 'ALL') -- each measure FILTERs to its own level. The Total row (all zones) is the yardstick: 'why' = the lowest zone's measures that are worse than Total's (more low-output days, fewer days per technician, a different DT/feeder share)."
    sql: |
      SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total' ELSE UPPER(zone) END AS zone,
             CASE WHEN GROUPING(zone) = 1 THEN 'ALL' ELSE UPPER(MAX(project)) END AS project,
             ROUND(SUM(installation_count) FILTER (WHERE category = 'ALL')::numeric
                   / NULLIF(SUM(technician_day_count) FILTER (WHERE category = 'ALL'), 0), 2) AS productivity,
             SUM(technician_day_count) FILTER (WHERE category = 'ALL') AS technician_days,
             ROUND(SUM(technician_day_count) FILTER (WHERE category = 'ALL' AND installation_count <= 1) * 100.0
                   / NULLIF(SUM(technician_day_count) FILTER (WHERE category = 'ALL'), 0), 1) AS pct_low_output_days,
             ROUND(SUM(technician_day_count) FILTER (WHERE category = 'ALL')::numeric
                   / NULLIF(COUNT(DISTINCT technician_name), 0), 1) AS days_per_technician,
             ROUND(SUM(installation_count) FILTER (WHERE category IN ('DT', 'FEEDER')) * 100.0
                   / NULLIF(SUM(installation_count) FILTER (WHERE category = 'ALL'), 0), 1) AS pct_dt_feeder
      FROM public.gold_mi_technician_productivity_day_agg
      WHERE (category = 'ALL' OR meter_type = 'ALL')
        AND period_start BETWEEN CURRENT_DATE - 30 AND CURRENT_DATE - 1 AND zone IS NOT NULL
      GROUP BY ROLLUP (zone)
      HAVING GROUPING(zone) = 1
          OR SUM(technician_day_count) >= 0.02 * (SELECT SUM(technician_day_count) FROM public.gold_mi_technician_productivity_day_agg
                                                 WHERE category = 'ALL' AND period_start BETWEEN CURRENT_DATE - 30 AND CURRENT_DATE - 1)
      ORDER BY GROUPING(zone) DESC, productivity

