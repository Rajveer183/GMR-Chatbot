  - q: ["How many meters installed, how many SAT done, how many defects found OEM wise", "OEM wise installs SAT and defects", "installed vs SAT vs defective by make"]
    note: "Combine tables with UNION ALL + one GROUP BY (never JOIN the raw gold rows - that multiplies counts). Add the same project / category filter to EVERY leg (DT = progress_category 'DT' in installs, category 'DT' in defects)."
    sql: |
      SELECT u.oem, SUM(u.installed) AS installed_meters, SUM(u.sat_done) AS sat_done, SUM(u.defects) AS defects_found
      FROM (SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) AS oem, meter_count AS installed,
                   CASE WHEN has_sat_number THEN meter_count ELSE 0 END AS sat_done, 0 AS defects
            FROM public.gold_mi_installation_month_agg
            WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
            UNION ALL
            SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')), 0, 0, defect_count
            FROM public.gold_meter_defect_event_day_agg) u
      GROUP BY u.oem
      ORDER BY installed_meters DESC
  - q: ["oem wise meter installed in last month", "OEM wise meters installed last month", "make wise installs in a month"]
    note: "'last month' = the previous full calendar month. OEM-wise = GROUP BY oem over ALL categories - add a category filter only when the question names one."
