  - q: ["What revenue is at risk from non-SAT meters older than 120 days?", "revenue blocked by non-SAT meters"]
    suggest: "What revenue is at risk from non-SAT meters older than 120 days?"
    note: "Rates per project from the latest receivables row: lumpsum per meter = lumpsum_invoiced cr x 1e7 / lumpsum-invoiced meters; PMPM per meter per month = pmpm_invoiced cr x 1e7 / (pmpm-invoiced meters x months billed, approx. months since first PMPM invoice) -- here a simpler steady-state proxy: pmpm_invoiced per pmpm-invoiced meter. State the method."
    sql: |
      WITH r AS (SELECT project, lumpsum_invoiced, pmpm_invoiced,
                        ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
                 FROM public.revenue_receivables),
      inv AS (SELECT LOWER(project) AS project, SUM(meter_count) FILTER (WHERE has_lumpsum_invoice) AS ls_meters
              FROM public.gold_mi_sat_invoice_snapshot GROUP BY 1),
      ns AS (SELECT LOWER(project) AS project, SUM(meter_count) AS old_non_sat
             FROM public.gold_non_sat_ageing_snapshot WHERE age_key = 'age_120_plus' GROUP BY 1)
      SELECT UPPER(ns.project) AS project, ns.old_non_sat AS non_sat_120_plus_meters,
             ROUND(r.lumpsum_invoiced * 1e7 / NULLIF(inv.ls_meters, 0), 0) AS lumpsum_rs_per_meter,
             ROUND(ns.old_non_sat * r.lumpsum_invoiced / NULLIF(inv.ls_meters, 0), 2) AS lumpsum_blocked_cr
      FROM ns JOIN inv ON inv.project = ns.project JOIN r ON LOWER(r.project) = ns.project AND r.rn = 1
      ORDER BY lumpsum_blocked_cr DESC

  - q: ["The project totals add up to ≈2.27L but the age buckets add to ≈3.01L. Why?", "The project totals add up to 2.27L but the age buckets add to 3.01L. Why?", "project totals and age buckets of non-SAT do not match", "why do non-SAT totals not match", "non-SAT project totals vs age buckets"]
    note: "A data question: always run this query (never an explanation-only reply). Show every scope side by side so the gap is explained: non-SAT (eligible pending) by project and by band from the ageing snapshot, and all installed-not-SAT incl. not-yet-due from the SAT snapshot. Quote today's figures; the user's numbers may come from an older refresh or a filtered dashboard view."
    sql: |
      SELECT 'Non-SAT ageing card: sum of project totals' AS measure, SUM(meter_count) AS meters FROM public.gold_non_sat_ageing_snapshot
      UNION ALL SELECT 'Non-SAT ageing card: sum of age buckets', SUM(meter_count) FROM public.gold_non_sat_ageing_snapshot WHERE age_key IS NOT NULL
      UNION ALL SELECT 'Non-SAT ageing card: 120+ days bucket', SUM(meter_count) FROM public.gold_non_sat_ageing_snapshot WHERE age_key = 'age_120_plus'
      UNION ALL SELECT 'Eligible pending SAT (MI vs SAT card)', SUM(meter_count) FROM public.gold_mi_sat_invoice_snapshot WHERE sat_stage IS NULL AND is_sat_eligible
      UNION ALL SELECT 'All installed not SAT incl. not yet due', SUM(meter_count) FROM public.gold_mi_sat_invoice_snapshot WHERE sat_stage IS NULL
      UNION ALL SELECT 'Installed after cutoff (not yet due)', SUM(meter_count) FROM public.gold_mi_sat_invoice_snapshot WHERE sat_stage IS NULL AND NOT is_sat_eligible

  - q: ["Why do meters usually get stuck in non-SAT?", "stuck rate by category", "Why are the 0 to 90 day buckets zero when we installed meters yesterday?", "project totals vs age buckets don't match"]
    suggest: "Why do meters usually get stuck in non-SAT?"
    note: "Non-SAT counts only ELIGIBLE meters (installed on/before the project cutoff in sat_eligibility_config); installs after the cutoff are 'not yet due' and not aged, so young bands are empty. 'Stuck' = eligible meters with no SAT batch (eligible_not_sat) -- not-yet-due meters are NOT stuck and the cutoff is NOT why meters get stuck. No reason field exists: say so, and compare stuck rates by category."
    sql: |
      SELECT CASE WHEN GROUPING(category) = 1 THEN 'Total' WHEN category = 'DT' THEN 'DTR' ELSE category END AS category,
             SUM(meter_count) FILTER (WHERE is_sat_eligible) AS eligible_mi,
             SUM(meter_count) FILTER (WHERE is_sat_eligible AND sat_stage IS NULL) AS eligible_not_sat,
             ROUND(SUM(meter_count) FILTER (WHERE is_sat_eligible AND sat_stage IS NULL) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0), 2) AS stuck_rate_pct,
             SUM(meter_count) FILTER (WHERE NOT is_sat_eligible) AS installed_after_cutoff_not_due
      FROM public.gold_mi_sat_invoice_snapshot
      GROUP BY ROLLUP (category)
      ORDER BY GROUPING(category) DESC, stuck_rate_pct DESC
    extra:
      - purpose: "SAT eligibility cutoff date per project"
        sql: |
          SELECT project, eligibility_cutoff_date FROM public.sat_eligibility_config ORDER BY project

  - q: ["How many defective meters have been replaced?", "total defective meters", "How many burnt meters do we have?"]
    suggest: "How many defective meters have been replaced?"
    sql: |
      SELECT SUM(defect_count) AS defective_replaced,
             COALESCE(SUM(defect_count) FILTER (WHERE defective_type = 'Meter Faulty'), 0) AS meter_faulty,
             COALESCE(SUM(defect_count) FILTER (WHERE defective_type = 'Meter Burnt'), 0) AS meter_burnt,
             COALESCE(SUM(defect_count) FILTER (WHERE defective_type = 'Others'), 0) AS others,
             COALESCE(SUM(defect_count) FILTER (WHERE UPPER(detailed_defective_type) IN ('LOAD ENHANCEMENT', 'LOAD REDUCTION')), 0) AS load_change_in_others
