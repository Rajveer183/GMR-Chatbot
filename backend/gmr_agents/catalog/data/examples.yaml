    suggest: "Which month in 2026 had the lowest installations?"
    note: "Complete months only: the current month is still in progress (period_start < date_trunc('month', CURRENT_DATE)). Lowest = ORDER BY installed ASC, highest = DESC. Year filter only when the question names one."
