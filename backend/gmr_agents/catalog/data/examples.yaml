    sql: "SELECT MAX(data_date) AS data_month, MAX(prev_period) AS compared_with,\n       SUM(prev_suspects) AS prev_suspects, SUM(curr_suspects) AS curr_suspects,\n       ROUND((SUM(prev_suspects) - SUM(curr_suspects)) * 100.0 / NULLIF(SUM(prev_suspects), 0), 2) AS reduction_pct\nFROM hes_gold.theft_reduction_trend WHERE data_date = DATE '2026-07-01'"
  - q:
    - Power factor deterioration in Agra
    - PF deterioration in Agra project
    - how many meters in Agra have deteriorating power factor
    note: Agra = the project (zones AGRA, ALIGARH, ETAH, FIROZABAD, MATHURA). Total = COUNT(DISTINCT meter_no) from the _meters table (a meter sits in several bands).
    sql: "WITH b AS (\n  SELECT pf_band, SUM(unique_meter_count) AS meters FROM hes_gold.power_factor_deterioration\n  WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND UPPER(zone) IN ('AGRA', 'ALIGARH', 'ETAH', 'FIROZABAD', 'MATHURA') GROUP BY pf_band),\n t AS (SELECT COUNT(DISTINCT meter_no) AS total FROM hes_gold.power_factor_deterioration_meters\n       WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND UPPER(zone) IN ('AGRA', 'ALIGARH', 'ETAH', 'FIROZABAD', 'MATHURA'))\nSELECT (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AS data_month, t.total AS meters_with_pf_issue,\n       SUM(b.meters) FILTER (WHERE b.pf_band IN ('Poor', 'Critical')) AS poor_critical_meters,\n       SUM(b.meters) FILTER (WHERE b.pf_band = 'Critical') AS critical_meters\nFROM b CROSS JOIN t GROUP BY t.total"

  # ---- Group H: one meter's source readings (hes_silver.block_usage / daily_usage) + HES meter master (hes_gold.dim_meter).
  # Every SQL run live 10 Nov 2026; MB = Athena bytes scanned. block_usage ALWAYS meter_no + one data_date.
  - q: ["Show the half-hourly readings of meter AL1159584 on 14 July 2026", "half hour readings of meter X on a date", "meter AL1159584 ki 14 July ki half hour readings dikhao", "30-min kWh profile of a meter for a day"]
    note: "block_usage: one row per half-hour (48 a day), Wh per half-hour -> /1000 kWh; 1-phase voltage/current = average_voltage / average_current; PF = wh / vah (power_factor_total is always NULL). ALWAYS meter_no + ONE data_date (796 MB)."
    sql: |
      SELECT rtc AS reading_time_ist,
             average_voltage AS voltage_v, average_current AS current_a,
             ROUND(wh_import / 1000.0, 3) AS kwh_import, ROUND(wh_export / 1000.0, 3) AS kwh_export,
             ROUND(vah_import / 1000.0, 3) AS kvah_import,
             ROUND(wh_import / NULLIF(vah_import, 0), 3) AS power_factor
      FROM hes_silver.block_usage
      WHERE meter_no = 'AL1159584' AND data_date = DATE '2026-07-14'
      ORDER BY reading_ts_utc

  - q: ["Phase-wise voltage and current of meter AL2861184 on 15 July 2026", "R Y B phase voltage of a 3-phase meter on a day", "phase voltages of DT meter X on date"]
    note: "3-phase / DT / feeder meters: voltage_rn / voltage_yn / voltage_bn and current_r / current_y / current_b are VARCHAR -> TRY_CAST AS DOUBLE (average_voltage is NULL for them). 700 MB."
    sql: |
      SELECT rtc AS reading_time_ist,
             TRY_CAST(voltage_rn AS DOUBLE) AS voltage_r, TRY_CAST(voltage_yn AS DOUBLE) AS voltage_y, TRY_CAST(voltage_bn AS DOUBLE) AS voltage_b,
             TRY_CAST(current_r AS DOUBLE) AS current_r, TRY_CAST(current_y AS DOUBLE) AS current_y, TRY_CAST(current_b AS DOUBLE) AS current_b,
             ROUND(wh_import / 1000.0, 3) AS kwh_import,
             ROUND(wh_import / NULLIF(vah_import, 0), 3) AS power_factor
      FROM hes_silver.block_usage
      WHERE meter_no = 'AL2861184' AND data_date = DATE '2026-07-15'
      ORDER BY reading_ts_utc

  - q: ["Daily summary of meter AL1159584 on 14 July 2026 from its half-hour readings", "What was the voltage of meter AL1159584 on 14 July 2026? lowest, highest and average", "How many kWh did meter X use on a day and how many half-hours did it report?"]
    note: "The drill drawer's stage-2 day row: half-hours reported of 48, completeness %, kWh, PF, avg / min / max voltage (zeros = not reporting -> NULLIF). AL1159584 14 Jul: 48/48, 7.81 kWh, PF 0.855, 228.7-252.7 V. 646 MB."
    sql: |
      SELECT data_date, COUNT(*) AS half_hours_reported, 48 AS expected_half_hours,
             ROUND(COUNT(*) * 100.0 / 48, 1) AS completeness_pct,
             ROUND(SUM(wh_import) / 1000.0, 2) AS kwh_import, ROUND(SUM(wh_export) / 1000.0, 2) AS kwh_export,
             ROUND(SUM(vah_import) / 1000.0, 2) AS kvah_import,
             ROUND(SUM(wh_import) / NULLIF(SUM(vah_import), 0), 3) AS power_factor,
             ROUND(AVG(NULLIF(COALESCE(average_voltage, TRY_CAST(voltage_rn AS DOUBLE)), 0)), 1) AS avg_voltage,
             MIN(NULLIF(COALESCE(average_voltage, TRY_CAST(voltage_rn AS DOUBLE)), 0)) AS min_voltage,
             MAX(COALESCE(average_voltage, TRY_CAST(voltage_rn AS DOUBLE))) AS max_voltage,
             ROUND(MAX(wh_import) * 2 / 1000.0, 2) AS peak_half_hour_kw
      FROM hes_silver.block_usage
      WHERE meter_no = 'AL1159584' AND data_date = DATE '2026-07-14'
      GROUP BY data_date

  - q: ["At what time was the load of meter AL1159584 highest on 14 July 2026?", "peak load time of a meter on a day", "when did meter X draw the most power"]
    note: "Demand of a half-hour = Wh x 2 / 1000 kW. 07:00 IST, 0.56 kW. 742 MB."
    sql: |
      SELECT rtc AS reading_time_ist, ROUND(wh_import / 1000.0, 3) AS kwh_in_half_hour,
             ROUND(wh_import * 2 / 1000.0, 2) AS demand_kw, average_voltage AS voltage_v, average_current AS current_a
      FROM hes_silver.block_usage
      WHERE meter_no = 'AL1159584' AND data_date = DATE '2026-07-14'
      ORDER BY wh_import DESC, reading_ts_utc
      LIMIT 3

  - q: ["How many half-hours was meter AL1159584 below 216 V on 14 July 2026?", "low voltage half-hours of a meter on a day", "was meter X out of the voltage band on date"]
    note: "One day only; band 230 V +-6% (216-253 V). For a month use the Power Quality cards (pct_time_out_of_band). 540 MB."
    sql: |
      SELECT data_date, COUNT(*) AS half_hours_reported,
             COUNT_IF(average_voltage < 216) AS half_hours_below_216v,
             COUNT_IF(average_voltage > 253) AS half_hours_above_253v,
