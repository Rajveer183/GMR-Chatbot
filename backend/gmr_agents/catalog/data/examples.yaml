                AND qualifies AND LOWER(cluster) = 'triveni') AS current_meters_improved

  - q: ["Reverse flow anomalies", "reverse flow meters", "how many meters show reverse flow", "net meters not exporting and non-net meters exporting"]
    note: "Card Reverse Flow: total flagged = both anomaly types; the Export (kWh) tile is the average per flagged meter."
    sql: |
      SELECT MAX(data_date) AS data_month,
             COUNT_IF(is_anomaly) AS total_flagged_meters,
             COUNT_IF(anomaly_type = 'net_meter_non_exporting') AS net_meters_not_exporting,
             COUNT_IF(anomaly_type = 'non_net_meter_exporting') AS non_net_meters_exporting,
             ROUND(AVG(CASE WHEN is_anomaly THEN total_kwh_export END), 2) AS avg_export_kwh_per_flagged_meter,
             ROUND(SUM(CASE WHEN anomaly_type = 'non_net_meter_exporting' THEN total_kwh_export END), 1) AS export_kwh_by_non_net_meters,
             COUNT(*) AS consumers_checked
      FROM hes_gold.reverse_flow WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

  - q: ["Reverse flow meters circle-wise", "reverse flow by circle", "which circle has the most reverse flow meters"]
    sql: |
      SELECT MAX(data_date) AS data_month, circle,
             COUNT_IF(is_anomaly) AS flagged_meters,
             COUNT_IF(anomaly_type = 'non_net_meter_exporting') AS non_net_meters_exporting,
             COUNT_IF(anomaly_type = 'net_meter_non_exporting') AS net_meters_not_exporting
      FROM hes_gold.reverse_flow WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND is_anomaly AND circle IS NOT NULL
      GROUP BY circle ORDER BY flagged_meters DESC LIMIT 15

