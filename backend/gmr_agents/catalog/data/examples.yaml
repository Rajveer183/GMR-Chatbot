    sql: |
      SELECT CASE WHEN GROUPING(UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown'))) = 1 THEN 'Total'
                  ELSE UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) END AS oem,
             SUM(defect_count) AS meter_burnt
      FROM public.gold_meter_defect_event_day_agg
      WHERE defective_type = 'Meter Burnt' AND LOWER(project) = 'kashi'
        AND period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '3 months')::date
        AND period_start < (date_trunc('month', CURRENT_DATE) - INTERVAL '2 months')::date
