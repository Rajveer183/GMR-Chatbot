      ORDER BY GROUPING(UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown'))) DESC, meter_burnt DESC

  - q: ["Mapping audit key metrics", "How many consumer meters have been audited for feeder tagging?", "What share of auto-indexing is complete?", "How far are we from the pending-verification target?", "What is the mapping accuracy?", "auto indexing concluded and pending verification", "confirmed reassigned review and no data counts", "What is the system-index accuracy?", "What is auto-indexing concluded and pending verification?", "What is the auto-indexing concluded number and percentage?"]
    suggest: "What share of auto-indexing is complete?"
    note: "The Mapping Audit card for the latest month: meters audited, the four verdicts, concluded (= Mapping Accuracy, target 95%), pending verification (target < 5%), system-index accuracy, reassign %, substations and feeders. Read the month from the data and say it. COALESCE every FILTER sum (Athena returns NULL for none)."
    sql: |
      SELECT s.meters_audited, s.confirmed, s.reassigned, s.review, s.no_data,
             s.confirmed + s.reassigned AS concluded, s.review + s.no_data AS pending_verification,
             ROUND((s.confirmed + s.reassigned) * 100.0 / s.meters_audited, 1) AS mapping_accuracy_pct,
             ROUND((s.review + s.no_data) * 100.0 / s.meters_audited, 1) AS pending_verification_pct,
             ROUND(s.confirmed * 100.0 / NULLIF(s.confirmed + s.reassigned, 0), 1) AS system_index_accuracy_pct,
             ROUND(s.reassigned * 100.0 / s.meters_audited, 1) AS reassign_pct,
             s.substations, f.feeders, s.audit_month
      FROM (SELECT SUM(consumer_count) AS meters_audited,
                   COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'CONFIRMED'), 0) AS confirmed,
                   COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) AS reassigned,
                   COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW'), 0) AS review,
                   COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'NO DATA'), 0) AS no_data,
                   COUNT(DISTINCT sub_station) AS substations, MAX(data_date) AS audit_month
            FROM hes_gold.mapping_audit_summary
            WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)) s
      CROSS JOIN (SELECT COUNT(*) FILTER (WHERE mi > 0 OR correct_tagging > 0) AS feeders
                  FROM hes_gold.mapping_audit_feeder
                  WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)) f

  - q: ["How many consumers are ready to be re-tagged now?", "How many consumers need re-tagging?", "consumers to re-tag", "reassign count", "how many reassigned in Kashi", "mismatches to re-tag"]
    suggest: "How many consumers need re-tagging?"
    note: "Re-tag = REASSIGN (evidence points to another feeder). Pending verification (review + no data) is NOT re-tagging. A project = its zones (Kashi: AZAMGARH, VARANASI I, VARANASI II)."
    sql: |
      SELECT COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) AS consumers_to_retag,
             ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) * 100.0 / SUM(consumer_count), 1) AS share_of_audited_pct,
             SUM(consumer_count) AS meters_audited, MAX(data_date) AS audit_month
      FROM hes_gold.mapping_audit_summary
      WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)

  - q: ["Mapping audit project wise", "confirmed reassign review no data by project", "which project has the most pending verification", "auto indexing concluded project wise", "mapping accuracy by zone"]
    note: "No project column: map zones to projects with CASE (the 51,102 consumers with no hierarchy are their own row and stay in the Total). Zone / circle / division wise = GROUP BY that column instead."
    sql: |
      SELECT CASE WHEN GROUPING(proj) = 1 THEN 'Total' ELSE proj END AS project,
             SUM(consumer_count) AS meters_audited,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'CONFIRMED'), 0) AS confirmed,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) AS reassigned,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW'), 0) AS review,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'NO DATA'), 0) AS no_data,
             ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')), 0) * 100.0 / SUM(consumer_count), 1) AS concluded_pct,
             ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('REVIEW', 'NO DATA')), 0) * 100.0 / SUM(consumer_count), 1) AS pending_pct
      FROM (SELECT CASE WHEN UPPER(zone) IN ('AGRA', 'ALIGARH', 'ETAH', 'FIROZABAD', 'MATHURA') THEN 'Agra'
                        WHEN UPPER(zone) IN ('AZAMGARH', 'VARANASI I', 'VARANASI II') THEN 'Kashi'
                        WHEN UPPER(zone) IN ('MIRZAPUR', 'PRAYAGRAJ I', 'PRAYAGRAJ II') THEN 'Triveni'
                        ELSE 'No hierarchy' END AS proj, verdict, consumer_count
            FROM hes_gold.mapping_audit_summary
            WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)) t
      GROUP BY ROLLUP (proj)
      ORDER BY GROUPING(proj) DESC, SUM(consumer_count) DESC

  - q: ["In which division is re-tagging highest?", "reassign by division", "divisions with most consumers to re-tag", "In which division are the most consumers to re-tag?"]
    suggest: "In which division is re-tagging highest?"
    sql: |
      SELECT division, zone,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) AS reassigned,
             SUM(consumer_count) AS meters_audited,
             ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) * 100.0 / SUM(consumer_count), 1) AS reassign_pct
      FROM hes_gold.mapping_audit_summary
      WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND division IS NOT NULL
      GROUP BY division, zone
      ORDER BY reassigned DESC
      LIMIT 10

  - q: ["Which substations have the highest share in Review?", "How can we shrink the Review bucket fastest?", "substation with most consumers", "substation with lowest mapping accuracy", "substations with most pending verification", "substation ranking", "Which substations have the highest share in review?"]
    suggest: "Which substations have the highest share in Review?"
    note: "Substation ranking from the summary (one row per substation x verdict): consumers, confirmed, reassigned, review, no data, pending and accuracy (concluded %) per substation; ORDER BY the asked measure. Share rankings need a size floor (>= 500 consumers); count rankings do not."
    sql: |
      SELECT sub_station, zone, SUM(consumer_count) AS consumers,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'CONFIRMED'), 0) AS confirmed,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) AS reassigned,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW'), 0) AS review,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'NO DATA'), 0) AS no_data,
             ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW'), 0) * 100.0 / SUM(consumer_count), 1) AS review_share_pct,
             ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')), 0) * 100.0 / SUM(consumer_count), 1) AS accuracy_pct,
             ROW_NUMBER() OVER (ORDER BY ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW'), 0) * 100.0 / SUM(consumer_count), 1) DESC,
                                SUM(consumer_count) DESC) AS rank_by_review_share
      FROM hes_gold.mapping_audit_summary
      WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND sub_station IS NOT NULL
      GROUP BY sub_station, zone
      HAVING SUM(consumer_count) >= 500
      ORDER BY review_share_pct DESC, consumers DESC
      LIMIT 15

  - q: ["Which substation has the most correctly tagged consumers?", "substation with the most confirmed consumers", "substations with most correct tagging"]
    note: "Correctly tagged = CONFIRMED. Rank by the confirmed COUNT (not total consumers); the first row is the answer."
    sql: |
      SELECT sub_station, zone,
             SUM(consumer_count) AS consumers,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'CONFIRMED'), 0) AS confirmed,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) AS reassigned,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW'), 0) AS review,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'NO DATA'), 0) AS no_data,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('REVIEW', 'NO DATA')), 0) AS pending_verification
      FROM hes_gold.mapping_audit_summary
      WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND sub_station IS NOT NULL
      GROUP BY sub_station, zone
      ORDER BY confirmed DESC
      LIMIT 10

  - q: ["Which substation has the most pending verification?", "substations with most review plus no data", "substation with most pending consumers"]
    note: "Pending verification = review + no data, ranked by that COUNT; the first row is the answer."
    sql: |
      SELECT sub_station, zone,
             SUM(consumer_count) AS consumers,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'CONFIRMED'), 0) AS confirmed,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) AS reassigned,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW'), 0) AS review,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'NO DATA'), 0) AS no_data,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('REVIEW', 'NO DATA')), 0) AS pending_verification
      FROM hes_gold.mapping_audit_summary
      WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND sub_station IS NOT NULL
      GROUP BY sub_station, zone
      ORDER BY pending_verification DESC
      LIMIT 10

  - q: ["Which substation has the lowest mapping accuracy?", "substations with lowest auto-indexing concluded share", "worst substations on mapping accuracy"]
    note: "Accuracy = (confirmed + reassign) / consumers, substations with >= 500 consumers. Many sit at 0%: substations_at_lowest says how many tie -- say so and name the largest ones (ordered by consumers)."
    sql: |
      SELECT t.*, SUM(CASE WHEN accuracy_pct = min_acc THEN 1 ELSE 0 END) OVER () AS substations_at_lowest
      FROM (SELECT sub_station, zone, SUM(consumer_count) AS consumers,
                   COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')), 0) AS concluded,
                   ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')), 0) * 100.0 / SUM(consumer_count), 1) AS accuracy_pct,
                   MIN(ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')), 0) * 100.0 / SUM(consumer_count), 1)) OVER () AS min_acc
            FROM hes_gold.mapping_audit_summary
            WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND sub_station IS NOT NULL
            GROUP BY sub_station, zone
            HAVING SUM(consumer_count) >= 500) t
      ORDER BY accuracy_pct, consumers DESC
      LIMIT 10

  - q: ["Which zone has the lowest auto-indexing concluded percentage?", "zone with lowest mapping accuracy", "zones ranked by concluded percentage"]
    note: "One row per zone (no Total row in a ranking), ORDER BY concluded % ascending; the first row is the answer."
    sql: |
      SELECT zone, SUM(consumer_count) AS meters_audited,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')), 0) AS concluded,
             ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')), 0) * 100.0 / SUM(consumer_count), 1) AS concluded_pct
      FROM hes_gold.mapping_audit_summary
      WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND zone IS NOT NULL
      GROUP BY zone
      ORDER BY concluded_pct
      LIMIT 11

  - q: ["Which feeder has the most pending consumers?", "feeder with most review and no data", "feeders with most pending verification"]
    note: "Feeder pending = review + nodata from mapping_audit_feeder (feeder_code IS NOT NULL), ranked by that count; the first row is the answer."
    sql: |
      SELECT feeder_code, feeder_name, sub_station, zone, mi, review, nodata, review + nodata AS pending
      FROM hes_gold.mapping_audit_feeder
      WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND feeder_code IS NOT NULL
      ORDER BY review + nodata DESC
      LIMIT 10

  - q: ["Which feeder has the most review consumers?", "feeder with most consumers in review", "feeders ranked by review"]
    note: "Rank feeders by their own review column (one row per feeder_code, never SUM across feeders); the first row is the answer."
    sql: |
      SELECT feeder_code, feeder_name, sub_station, zone, mi, review, nodata
      FROM hes_gold.mapping_audit_feeder
      WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND feeder_code IS NOT NULL
      ORDER BY review DESC
      LIMIT 10

  - q: ["Which feeders have the lowest confidence?", "least confident feeders", "feeders with lowest accuracy"]
    note: "Lowest confidence_pct among feeders with mi >= 100 (smaller ones are noise). Many sit at 0%: feeders_at_lowest says how many tie -- say so and name the largest (ordered by mi)."
    sql: |
      SELECT t.*, SUM(CASE WHEN confidence_pct = min_conf THEN 1 ELSE 0 END) OVER () AS feeders_at_lowest
      FROM (SELECT feeder_code, feeder_name, sub_station, zone, mi, correct_tagging, out AS reassign_out, review, nodata,
                   confidence_pct, MIN(confidence_pct) OVER () AS min_conf
            FROM hes_gold.mapping_audit_feeder
            WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary) AND feeder_code IS NOT NULL AND mi >= 100) t
      ORDER BY confidence_pct, mi DESC
      LIMIT 10

