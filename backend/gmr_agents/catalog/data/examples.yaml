    note: "Consumer meter type = inventory_meter_type (never progress_meter_type): the four types add up to the consumer total, no 'Other' / 'Unmapped'."
    sql: |
      SELECT CASE WHEN GROUPING(inventory_meter_type) = 1 THEN 'Total' ELSE inventory_meter_type END AS meter_type,
             SUM(meter_count) AS meters_installed
      FROM public.gold_mi_installation_month_agg
      WHERE has_meter_serial AND progress_category = 'CONSUMER' AND NOT is_replacement
