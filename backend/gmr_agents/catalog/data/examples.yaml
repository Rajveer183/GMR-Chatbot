  - q: ["Should we raise a quality issue with AEW?", "is AEW worse than other OEMs", "OEM quality comparison"]
    suggest: "Should we raise a quality issue with AEW?"
    note: "Compare AEW's faulty rate with the other OEMs' combined rate in the same categories; flag when > 15% worse; state each base."
    sql: |
      SELECT u.oem, u.category, SUM(u.faulty) AS meter_faulty, SUM(u.burnt) AS meter_burnt, SUM(u.installed) AS installed,
             ROUND(SUM(u.faulty) * 100.0 / NULLIF(SUM(u.installed), 0), 3) AS faulty_rate_pct,
             ROUND(SUM(u.burnt) * 100.0 / NULLIF(SUM(u.installed), 0), 3) AS burnt_rate_pct
      FROM (SELECT CASE WHEN UPPER(TRIM(oem)) = 'AEW' THEN 'AEW' ELSE 'OTHER OEMS' END AS oem, category,
                   defect_rate_numerator_count AS faulty,
                   CASE WHEN defective_type = 'Meter Burnt' THEN defect_count ELSE 0 END AS burnt, 0 AS installed
            FROM public.gold_meter_defect_event_day_agg WHERE oem IS NOT NULL AND TRIM(oem) <> ''
            UNION ALL
            SELECT CASE WHEN UPPER(TRIM(oem)) = 'AEW' THEN 'AEW' ELSE 'OTHER OEMS' END, progress_category, 0, 0, meter_count
            FROM public.gold_mi_installation_month_agg
            WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL AND TRIM(oem) <> ''
              AND UPPER(TRIM(oem)) IN ('AEW', 'CAP', 'HPL', 'SEIPL')) u
      GROUP BY u.oem, u.category
      ORDER BY u.category, u.oem

