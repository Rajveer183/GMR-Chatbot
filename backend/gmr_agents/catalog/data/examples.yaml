      SELECT CASE WHEN GROUPING(meter_type) = 1 THEN 'Total' ELSE meter_type END AS meter_type,
             COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'inventory'), 0) AS di_to_agency,
             COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'agency'), 0) AS agency_to_supervisor,
             COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'supervisor'), 0) AS supervisor_to_technician,
             COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'technician'), 0) AS technician_to_installation,
