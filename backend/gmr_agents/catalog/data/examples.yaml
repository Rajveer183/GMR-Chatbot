      GROUP BY u.oem
      ORDER BY installed_meters DESC

  - q: ["Consumer meter productivity per technician per day, installations and active technicians in September 2026", "consumer MI productivity in a month", "consumer installation productivity summary"]
    note: "ONE summary row (no GROUP BY): one category = category = 'CONSUMER' AND meter_type = 'ALL' (its roll-up row)."
    sql: |
      SELECT ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS productivity_per_tech_day,
             SUM(installation_count) AS installations,
             COUNT(DISTINCT technician_name) AS active_technicians,
             COUNT(DISTINCT period_start) AS active_days
      FROM public.gold_mi_technician_productivity_day_agg
      WHERE category = 'CONSUMER' AND meter_type = 'ALL'
        AND period_start BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'

  - q: ["3PH meter productivity per technician per day, installations and active technicians in September 2026", "three phase meter productivity", "3PH installs per technician day"]
    note: "1PH / 3PH exist only in CONSUMER. A meter type = category <> 'ALL' AND meter_type = '3PH-Consumer_meter' -- never category = 'DT' with it (no such rows)."
    sql: |
      SELECT ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS productivity_per_tech_day,
             SUM(installation_count) AS installations,
             COUNT(DISTINCT technician_name) AS active_technicians
      FROM public.gold_mi_technician_productivity_day_agg
      WHERE category <> 'ALL' AND meter_type = '3PH-Consumer_meter'
        AND period_start BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'

  - q: ["LTCT meter productivity per technician per day, installations and active technicians in September 2026", "LTCT meters (all categories) productivity", "HTCT meter productivity"]
    note: "The dashboard's LTCT filter covers every category: DT meters are 3-phase LTCT, so most LTCT installs are DT. Give the dashboard figure and the consumer-only part beside it (HTCT: same, the feeder part is FEEDER)."
    sql: |
      SELECT ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS productivity_per_tech_day,
             SUM(installation_count) AS installations,
             COUNT(DISTINCT technician_name) AS active_technicians,
             COALESCE(SUM(installation_count) FILTER (WHERE category = 'CONSUMER'), 0) AS consumer_ltct_installations,
             COALESCE(SUM(installation_count) FILTER (WHERE category = 'DT'), 0) AS dt_installations
      FROM public.gold_mi_technician_productivity_day_agg
      WHERE category <> 'ALL' AND meter_type = 'LTCT-Consumer_meter'
        AND period_start BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'

  - q: ["MI productivity discom wise in September 2026", "DVVNL vs PUVVNL productivity", "discom wise installation productivity"]
    note: "KPI 2 card: technician productivity table grouped by discom, category = 'ALL' -- not the monthly trend cube."
    sql: |
      SELECT CASE WHEN GROUPING(discom) = 1 THEN 'Total' ELSE UPPER(discom) END AS discom,
             ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS productivity_per_tech_day,
             SUM(installation_count) AS installations,
             COUNT(DISTINCT technician_name) AS active_technicians
      FROM public.gold_mi_technician_productivity_month_agg
      WHERE category = 'ALL' AND period_start = DATE '2026-09-01'
      GROUP BY ROLLUP (discom)
      ORDER BY GROUPING(discom) DESC, installations DESC

  - q: ["MI productivity month wise in Agra from January 2026 to September 2026", "DT meter MI productivity month wise in Mathura zone from April 2026 to September 2026", "productivity month wise of a zone or project"]
    note: "Month wise = _month_agg GROUP BY period_start (KPI 2), never the trend cube. A category named -> category = 'X' AND meter_type = 'ALL'; a place -> its own column."
    sql: |
      SELECT CASE WHEN GROUPING(period_start) = 1 THEN 'Total' ELSE to_char(period_start, 'Mon YYYY') END AS month,
             ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS productivity_per_tech_day,
             SUM(installation_count) AS installations,
             COUNT(DISTINCT technician_name) AS active_technicians
      FROM public.gold_mi_technician_productivity_month_agg
      WHERE category = 'DT' AND meter_type = 'ALL' AND LOWER(zone) = 'mathura'
        AND period_start BETWEEN DATE '2026-04-01' AND DATE '2026-09-01'
      GROUP BY ROLLUP (period_start)
      ORDER BY GROUPING(period_start) DESC, period_start

  - q: ["Feeder meter MI productivity circle wise in Triveni from July 2026 to September 2026", "category productivity circle wise in a project", "consumer productivity division wise"]
    note: "Place-wise with a category: technician productivity table, category = 'X' AND meter_type = 'ALL', GROUP BY the place column."
    sql: |
      SELECT CASE WHEN GROUPING(circle) = 1 THEN 'Total' ELSE UPPER(circle) END AS circle,
             ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS productivity_per_tech_day,
             SUM(installation_count) AS installations,
             COUNT(DISTINCT technician_name) AS active_technicians
      FROM public.gold_mi_technician_productivity_month_agg
      WHERE category = 'FEEDER' AND meter_type = 'ALL' AND LOWER(project) = 'triveni'
        AND period_start BETWEEN DATE '2026-07-01' AND DATE '2026-09-01'
      GROUP BY ROLLUP (circle)
      ORDER BY GROUPING(circle) DESC, installations DESC

