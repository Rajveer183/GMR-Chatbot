  - q: ["Never / non-comm status", "non comm tickets summary", "never comm and not in communication tickets", "how many non-comm tickets are unassigned or escalated"]
    note: "Always complaint_type IN ('NEVER COMM', 'METER NOT IN COMMUNICATION') -- the table holds every open ticket. The card's ten figures; a filter (project / zone / category / status / remark) goes in the WHERE."
