      SELECT COUNT(*) AS low_pf_meters_both_months
      FROM (SELECT meter_no
            FROM hes_gold.lpf2_low_power_factor_meters
            WHERE data_date IN (DATE '2026-06-01', DATE '2026-07-01')
              AND severity NOT IN ('Normal', 'NoData') AND ageing_days >= 3
