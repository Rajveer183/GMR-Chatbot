  - q: ["What is our collection efficiency?", "collection efficiency", "how much has been collected vs invoiced"]
    suggest: "What is our collection efficiency?"
    note: "Collection efficiency = realised / invoiced (rupees, latest row per project)."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(lumpsum_invoiced + pmpm_invoiced + cable_invoiced) AS invoiced_cr,
             SUM(lumpsum_realised + pmpm_realised + cable_realised) AS realised_cr,
             ROUND(SUM(lumpsum_realised + pmpm_realised + cable_realised) * 100.0 / NULLIF(SUM(lumpsum_invoiced + pmpm_invoiced + cable_invoiced), 0), 2) AS collection_efficiency_pct,
             ROUND(SUM(lumpsum_realised) * 100.0 / NULLIF(SUM(lumpsum_invoiced), 0), 2) AS lumpsum_pct,
             ROUND(SUM(pmpm_realised) * 100.0 / NULLIF(SUM(pmpm_invoiced), 0), 2) AS pmpm_pct
      FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables) r
      WHERE rn = 1
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, project

  - q: ["What is the average lag between SAT and first invoice?", "SAT to invoice lag"]
    suggest: "What is the average lag between SAT and first invoice?"
    note: "Athena only (batch dates). Simple average over dated batches; say batch-weighted needs meter counts."
    sql: |
      SELECT LOWER(project) AS project, COUNT(*) AS invoiced_batches,
             ROUND(AVG(GREATEST(date_diff('day', sat_date, LEAST(COALESCE(lumpsum_invoice_date, pmpm_invoice_date), COALESCE(pmpm_invoice_date, lumpsum_invoice_date))), 0)), 1) AS avg_lag_days,
             MIN(GREATEST(date_diff('day', sat_date, LEAST(COALESCE(lumpsum_invoice_date, pmpm_invoice_date), COALESCE(pmpm_invoice_date, lumpsum_invoice_date))), 0)) AS min_lag_days,
             MAX(GREATEST(date_diff('day', sat_date, LEAST(COALESCE(lumpsum_invoice_date, pmpm_invoice_date), COALESCE(pmpm_invoice_date, lumpsum_invoice_date))), 0)) AS max_lag_days
      FROM gmr_wfm_silver.sat_milestones
      WHERE sat_date IS NOT NULL AND (lumpsum_invoice_date IS NOT NULL OR pmpm_invoice_date IS NOT NULL)
      GROUP BY LOWER(project)
      ORDER BY project

  - q: ["Estimate PMPM billing value for this month.", "PMPM monthly billing estimate"]
    suggest: "Estimate PMPM billing value for this month."
    note: "Steady-state proxy: latest PMPM invoiced (crore, to date) / months since the first PMPM invoice (read from the data) gives Rs crore per month; state that it is an estimate. Never multiply a crore amount by a meter count; the Total row must equal the sum of the projects."
    sql: |
      SELECT CASE WHEN GROUPING(r.project) = 1 THEN 'Total' ELSE UPPER(r.project) END AS project,
             SUM(r.pmpm_invoiced) AS pmpm_invoiced_to_date_cr,
             SUM(s.pmpm_meters) AS pmpm_invoiced_meters,
             ROUND(SUM(r.pmpm_invoiced) / ((EXTRACT(YEAR FROM AGE(CURRENT_DATE, DATE '2025-07-01')) * 12 + EXTRACT(MONTH FROM AGE(CURRENT_DATE, DATE '2025-07-01'))) + 1), 2) AS est_pmpm_per_month_cr
      FROM (SELECT project, pmpm_invoiced, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables) r
      JOIN (SELECT LOWER(project) AS project, SUM(meter_count) FILTER (WHERE has_pmpm_invoice) AS pmpm_meters
            FROM public.gold_mi_sat_invoice_snapshot GROUP BY 1) s ON s.project = LOWER(r.project)
      WHERE r.rn = 1
      GROUP BY ROLLUP (r.project)
      ORDER BY GROUPING(r.project) DESC, project

  - q: ["Which project should management focus on this week, and why?", "Compare Agra.", "project comparison on key KPIs"]
    suggest: "Which project should management focus on this week, and why?"
    note: "One row per project with installs (last 7 days), SAT %, eligible pending, 120+ non-SAT, defects per 1000 and collection %. focus_project = 'Yes' marks the project to focus on (worst on the most measures, then lowest SAT %); worst_on lists those measures. The answer's first words NAME the focus_project row, then quote ITS OWN figures for its worst_on measures vs the others -- never another project's numbers."
    sql: |
      WITH sat AS (SELECT LOWER(project) AS project, SUM(meter_count) AS total_mi,
                          ROUND(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) * 100.0 / NULLIF(SUM(meter_count), 0), 2) AS sat_pct_vs_mi,
                          SUM(meter_count) FILTER (WHERE is_sat_eligible) AS eligible_mi
                   FROM public.gold_mi_sat_invoice_snapshot GROUP BY 1),
      ns AS (SELECT LOWER(project) AS project, SUM(meter_count) AS eligible_pending_sat,
                    SUM(meter_count) FILTER (WHERE age_key = 'age_120_plus') AS non_sat_120_plus
             FROM public.gold_non_sat_ageing_snapshot GROUP BY 1),
      wk AS (SELECT LOWER(project) AS project, SUM(meter_count) AS installs_last_7_days FROM public.gold_mi_installation_day_agg
             WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement AND period_start BETWEEN CURRENT_DATE - 7 AND CURRENT_DATE - 1 GROUP BY 1),
      df AS (SELECT LOWER(project) AS project, SUM(defect_count) AS replacements FROM public.gold_meter_defect_event_day_agg GROUP BY 1),
      rv AS (SELECT LOWER(project) AS project,
                    ROUND((lumpsum_realised + pmpm_realised) * 100.0 / NULLIF(lumpsum_invoiced + pmpm_invoiced, 0), 2) AS collection_pct
             FROM (SELECT *, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn FROM public.revenue_receivables) r
             WHERE rn = 1)
      SELECT f.*, CASE WHEN ROW_NUMBER() OVER (ORDER BY measures_worst_on DESC, sat_pct_vs_mi) = 1 THEN 'Yes' ELSE '' END AS focus_project
      FROM (SELECT UPPER(sat.project) AS project, wk.installs_last_7_days, sat.total_mi, sat.sat_pct_vs_mi, ns.eligible_pending_sat,
                   ns.non_sat_120_plus, ROUND(df.replacements * 1000.0 / NULLIF(sat.total_mi, 0), 2) AS replacements_per_1000,
                   rv.collection_pct,
                   (CASE WHEN wk.installs_last_7_days = MIN(wk.installs_last_7_days) OVER () THEN 1 ELSE 0 END
                    + CASE WHEN sat.sat_pct_vs_mi = MIN(sat.sat_pct_vs_mi) OVER () THEN 1 ELSE 0 END
                    + CASE WHEN ns.non_sat_120_plus = MAX(ns.non_sat_120_plus) OVER () THEN 1 ELSE 0 END
                    + CASE WHEN df.replacements * 1.0 / NULLIF(sat.total_mi, 0) = MAX(df.replacements * 1.0 / NULLIF(sat.total_mi, 0)) OVER () THEN 1 ELSE 0 END
                    + CASE WHEN rv.collection_pct = MIN(rv.collection_pct) OVER () THEN 1 ELSE 0 END) AS measures_worst_on,
                   CONCAT_WS(', ',
                     CASE WHEN wk.installs_last_7_days = MIN(wk.installs_last_7_days) OVER () THEN 'fewest installs in 7 days' END,
                     CASE WHEN sat.sat_pct_vs_mi = MIN(sat.sat_pct_vs_mi) OVER () THEN 'lowest SAT %' END,
                     CASE WHEN ns.non_sat_120_plus = MAX(ns.non_sat_120_plus) OVER () THEN 'most 120+ day non-SAT' END,
                     CASE WHEN df.replacements * 1.0 / NULLIF(sat.total_mi, 0) = MAX(df.replacements * 1.0 / NULLIF(sat.total_mi, 0)) OVER () THEN 'most replacements per 1,000' END,
                     CASE WHEN rv.collection_pct = MIN(rv.collection_pct) OVER () THEN 'lowest collection %' END) AS worst_on
            FROM sat LEFT JOIN ns ON ns.project = sat.project LEFT JOIN wk ON wk.project = sat.project
            LEFT JOIN df ON df.project = sat.project LEFT JOIN rv ON rv.project = sat.project) f
      ORDER BY measures_worst_on DESC, sat_pct_vs_mi

  - q: ["Is there any link between high replacements and SAT lag by project?", "do replacements slow down SAT", "replacements vs SAT lag"]
    suggest: "Is there any link between high replacements and SAT lag by project?"
    note: "Rank projects on replacements per 1,000 installed (1 = most) and on SAT lag = 100 - % SAT vs MI (1 = most lag). same_rank_order = 'Yes' only when the two rankings match for every project -- that is the only case to call it a link; with 3 projects say the evidence is weak either way."
    sql: |
      WITH r AS (SELECT LOWER(u.project) AS project, SUM(u.defects) AS replacements, SUM(u.installed) AS installed
                 FROM (SELECT project, defect_count AS defects, 0 AS installed FROM public.gold_meter_defect_event_day_agg
                       UNION ALL
                       SELECT project, 0, meter_count FROM public.gold_mi_installation_month_agg
                       WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement) u
                 GROUP BY 1),
      s AS (SELECT LOWER(project) AS project,
                   ROUND(100 - SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) * 100.0 / NULLIF(SUM(meter_count), 0), 2) AS sat_lag_pct
            FROM public.gold_mi_sat_invoice_snapshot GROUP BY 1),
      j AS (SELECT UPPER(r.project) AS project, ROUND(r.replacements * 1000.0 / NULLIF(r.installed, 0), 2) AS replacements_per_1000,
                   s.sat_lag_pct
            FROM r JOIN s ON s.project = r.project)
      SELECT k.*, CASE WHEN BOOL_AND(replacement_rank = sat_lag_rank) OVER () THEN 'Yes' ELSE 'No' END AS same_rank_order
      FROM (SELECT project, replacements_per_1000, RANK() OVER (ORDER BY replacements_per_1000 DESC) AS replacement_rank,
                   sat_lag_pct, RANK() OVER (ORDER BY sat_lag_pct DESC) AS sat_lag_rank
            FROM j) k
      ORDER BY replacements_per_1000 DESC

