      SELECT MIN(data_date) AS first_reading_date, MAX(data_date) AS last_reading_date,
             COUNT(DISTINCT data_date) AS days_with_reading,
             ROUND(MIN_BY(wh_import, data_date) / 1000.0, 2) AS first_kwh_reading,
             ROUND(MAX_BY(wh_import, data_date) / 1000.0, 2) AS last_kwh_reading,
             ROUND((MAX_BY(wh_import, data_date) - MIN_BY(wh_import, data_date)) / 1000.0, 2) AS kwh_consumed,
             ROUND((MAX_BY(wh_import, data_date) - MIN_BY(wh_import, data_date)) / 1000.0
                   / NULLIF(DATE_DIFF('day', MIN(data_date), MAX(data_date)), 0), 2) AS avg_kwh_per_day
      FROM hes_silver.daily_usage
      WHERE meter_no = 'AL1159584' AND data_date >= DATE '2026-07-01' AND data_date < DATE '2026-08-01'

