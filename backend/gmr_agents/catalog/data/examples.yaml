    sql: "SELECT data_date AS data_month,\n       COUNT_IF(severity NOT IN ('Normal', 'NoData') AND ageing_days >= 3) AS low_pf_meters,\n       COUNT_IF(severity <> 'NoData') AS meters_with_pf_readings,\n       ROUND(COUNT_IF(severity NOT IN ('Normal', 'NoData') AND ageing_days >= 3) * 100.0 / COUNT_IF(severity <> 'NoData'), 2) AS pct_meters_low_pf,\n       ROUND(SUM(low_blocks) * 100.0 / NULLIF(SUM(total_blocks), 0), 2) AS pct_slots_below_0_9\nFROM hes_gold.lpf2_low_power_factor_meters\nWHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)\nGROUP BY data_date"
