             COALESCE(SUM(defect_count) FILTER (WHERE defective_type = 'Others'), 0) AS others,
             (SELECT SUM(meter_count) FROM public.gold_mi_installation_month_agg
              WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL
                AND UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) IN (
                  SELECT DISTINCT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) FROM public.gold_meter_defect_event_day_agg)) AS installed_meters,
             ROUND(SUM(defect_rate_numerator_count) * 100.0 / NULLIF((SELECT SUM(meter_count) FROM public.gold_mi_installation_month_agg
              WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL
                AND UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) IN (
                  SELECT DISTINCT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) FROM public.gold_meter_defect_event_day_agg)), 0), 2) AS defect_rate_pct
      FROM public.gold_meter_defect_event_day_agg

