  - q: ["Show the daily readings of meter AL1159584 in July 2026", "Fetch from source data: daily kWh import / export of a meter for a month", "daily register readings of meter X"]
    note: "Energy Audit drawer evidence (daily_usage): CUMULATIVE register at 00:00 IST, Wh -> /1000. Net = import - export. 11 days in July (5-8, 13-16, 21-23). 196 MB."
    sql: |
      SELECT data_date,
             ROUND(MAX(wh_import) / 1000.0, 2) AS kwh_import_reading,
             ROUND(MAX(wh_export) / 1000.0, 2) AS kwh_export_reading,
             ROUND((MAX(wh_import) - MAX(wh_export)) / 1000.0, 2) AS net_kwh_reading
      FROM hes_silver.daily_usage
      WHERE meter_no = 'AL1159584' AND data_date >= DATE '2026-07-01' AND data_date < DATE '2026-08-01'
      GROUP BY data_date
      ORDER BY data_date

  - q: ["Day-wise consumption of meter AL1159584 in July 2026", "daily consumption of a meter in a month", "how much did meter X use each day"]
    note: "Consumption = next reading - this reading; gaps (8 -> 13 July) span several days -> days_covered. 7 Jul -> 8 Jul 8.08 kWh. 194 MB."
    sql: |
      WITH r AS (
        SELECT data_date, MAX(wh_import) AS wh
        FROM hes_silver.daily_usage
        WHERE meter_no = 'AL1159584' AND data_date >= DATE '2026-07-01' AND data_date <= DATE '2026-08-01'
        GROUP BY data_date)
      SELECT data_date, ROUND(wh / 1000.0, 2) AS kwh_reading_at_midnight,
             LEAD(data_date) OVER (ORDER BY data_date) AS next_reading_date,
             ROUND((LEAD(wh) OVER (ORDER BY data_date) - wh) / 1000.0, 2) AS kwh_consumed,
             DATE_DIFF('day', data_date, LEAD(data_date) OVER (ORDER BY data_date)) AS days_covered
      FROM r
      ORDER BY data_date

