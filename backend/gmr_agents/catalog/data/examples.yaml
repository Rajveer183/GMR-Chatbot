  - q: ["Feeder loss on AI mapping basis", "AI mapping feeder loss", "feeder loss using outage-based mapping"]
    note: "feeder_loss_ai: consumers from the mapping audit (CONFIRMED/REASSIGN only) -- output lower, loss higher than index basis."
    sql: |
      SELECT MAX(data_date) AS data_month,
             COUNT(*) AS feeders,
             ROUND(SUM(net_input) / 1e6, 2) AS input_mu,
             ROUND(SUM(asset_billed) / 1e6, 2) AS output_mu,
             ROUND(SUM(loss_kwh) / 1e6, 2) AS energy_gap_mu,
             ROUND(SUM(loss_kwh) * 100.0 / NULLIF(SUM(net_input), 0), 2) AS average_loss_pct,
             COUNT_IF(loss_credible) AS credible_feeders,
             ROUND(COUNT_IF(loss_credible) * 100.0 / COUNT(*), 2) AS credible_pct,
             ROUND(SUM(added_kwh) / 1e6, 2) AS added_mu
      FROM hes_gold.feeder_loss_ai
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

  - q: ["Compare feeder loss on index mapping vs AI mapping project-wise", "index vs AI feeder loss", "feeder loss declared vs AI mapping"]
    note: "Aggregate each table in its own CTE, then join on cluster; input is identical on both bases."
    sql: |
      WITH i AS (SELECT cluster, SUM(net_input) AS inp, SUM(asset_billed) AS outp, SUM(loss_kwh) AS loss
                 FROM hes_gold.feeder_loss WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) GROUP BY cluster),
           a AS (SELECT cluster, SUM(net_input) AS inp, SUM(asset_billed) AS outp, SUM(loss_kwh) AS loss
                 FROM hes_gold.feeder_loss_ai WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) GROUP BY cluster)
      SELECT (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AS data_month, i.cluster AS project,
             ROUND(i.inp / 1e6, 2) AS input_mu,
             ROUND(i.outp / 1e6, 2) AS index_output_mu, ROUND(i.loss * 100.0 / NULLIF(i.inp, 0), 2) AS index_loss_pct,
             ROUND(a.outp / 1e6, 2) AS ai_output_mu, ROUND(a.loss * 100.0 / NULLIF(a.inp, 0), 2) AS ai_loss_pct
      FROM i JOIN a ON a.cluster = i.cluster
      ORDER BY i.cluster

