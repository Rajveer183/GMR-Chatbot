    note: "Compare each day with the same weekday's average over the 3 weeks before; split into technicians x installs per technician. Month-end pushes are common."
    sql: |
      SELECT d.period_start AS day, to_char(d.period_start, 'Dy') AS weekday, d.installs,
             t.technicians, ROUND(d.installs::numeric / NULLIF(t.technicians, 0), 2) AS installs_per_technician,
             CASE WHEN d.period_start BETWEEN DATE '2026-09-28' AND DATE '2026-09-29' THEN 'spike' ELSE 'baseline' END AS period_type
      FROM (SELECT period_start, SUM(meter_count) AS installs FROM public.gold_mi_installation_day_agg
            WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
              AND period_start BETWEEN DATE '2026-09-07' AND DATE '2026-09-29' GROUP BY 1) d
      LEFT JOIN (SELECT period_start, COUNT(DISTINCT technician_name) AS technicians FROM public.gold_mi_technician_productivity_day_agg
                 WHERE category = 'ALL' AND period_start BETWEEN DATE '2026-09-07' AND DATE '2026-09-29' GROUP BY 1) t
        ON t.period_start = d.period_start
      WHERE EXTRACT(ISODOW FROM d.period_start) IN (1, 2)
      ORDER BY d.period_start

