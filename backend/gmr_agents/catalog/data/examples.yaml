  - q: ["Total MI and CI across feeders", "how many feeders were audited", "total reassign in and reassign out", "consumers declared vs consumers indexed", "What is reassign in and reassign out?"]
    note: "Feeders audited = the dashboard's feeder count (rows with mi > 0 or correct_tagging > 0). SUM(out) = SUM(inc) = total reassignments -- the same consumers counted at each end."
    sql: |
      SELECT COUNT(*) FILTER (WHERE mi > 0 OR correct_tagging > 0) AS feeders, SUM(mi) AS mi_consumers_declared,
             SUM(ci) AS ci_consumers_indexed, SUM(correct_tagging) AS correct_tagging,
             SUM(out) AS reassign_out, SUM(inc) AS reassign_in, SUM(review) AS review, SUM(nodata) AS no_data
