  - q: ["Total complaint meters, SAT done meters and non-SAT meters with their complaints", "complaint meters by SAT status", "SAT done vs non-SAT complaint meters", "complaint meters SAT status for a project in a month"]
    note: "Closed Analysis 'Top 50 Meters & SAT Status' tab: only meters in areas with tickets closed in the window (default last 30 days ending yesterday -- say so); a project / zone filter goes in both the areas CTE and the meter query."
    sql: |
      WITH areas AS (
        SELECT DISTINCT COALESCE(LOWER(discom), '') AS discom, COALESCE(LOWER(zone), '') AS zone,
               COALESCE(LOWER(circle), '') AS circle, COALESCE(LOWER(division), '') AS division,
               COALESCE(LOWER(sub_division), '') AS sub_division
        FROM public.gold_om_closed_tickets_day_agg
        WHERE closed_date BETWEEN CURRENT_DATE - 31 AND CURRENT_DATE - 1),
      m AS (
        SELECT c.* FROM public.gold_om_meter_complaints_agg c
        JOIN areas a ON a.discom = COALESCE(LOWER(c.discom), '') AND a.zone = COALESCE(LOWER(c.zone), '')
                    AND a.circle = COALESCE(LOWER(c.circle), '') AND a.division = COALESCE(LOWER(c.division), '')
                    AND a.sub_division = COALESCE(LOWER(c.sub_division), ''))
      SELECT COUNT(*) AS complaint_meters,
             COUNT(*) FILTER (WHERE sat_status = 'SAT Done') AS sat_done_meters,
             ROUND(COUNT(*) FILTER (WHERE sat_status = 'SAT Done') * 100.0 / NULLIF(COUNT(*), 0), 2) AS sat_done_pct,
             COUNT(*) FILTER (WHERE sat_status = 'Non-SAT') AS non_sat_meters,
             SUM(total_complaints) AS total_complaints,
             SUM(total_complaints) FILTER (WHERE sat_status = 'SAT Done') AS sat_done_complaints,
             ROUND(SUM(total_complaints) FILTER (WHERE sat_status = 'SAT Done') * 100.0 / NULLIF(SUM(total_complaints), 0), 2) AS sat_done_complaints_pct,
             SUM(total_complaints) FILTER (WHERE sat_status = 'Non-SAT') AS non_sat_complaints,
             MAX(total_complaints) AS max_complaints_one_meter
      FROM m

  - q: ["Top 50 complaint meters in Kashi", "Top 50 meters by number of complaints", "meters with most complaints", "repeat complaint meters top 50", "which meters had the most complaints in a month"]
    note: "Same window scoping as the SAT-status tiles: areas with a ticket closed in the window (default last 30 days). A month / date range named = that closed_date window -- answerable, never refuse it; total_complaints itself is the meter's all-time count."
    sql: |
      WITH areas AS (
        SELECT DISTINCT COALESCE(LOWER(discom), '') AS discom, COALESCE(LOWER(zone), '') AS zone,
               COALESCE(LOWER(circle), '') AS circle, COALESCE(LOWER(division), '') AS division,
               COALESCE(LOWER(sub_division), '') AS sub_division
