    sql: |
      SELECT data_date AS data_month, COUNT(*) AS feeder_meters_with_outage, SUM(outage_count) AS outages,
             ROUND(SUM(total_duration_min), 0) AS outage_minutes,
             ROUND(SUM(total_duration_min) / NULLIF(SUM(outage_count), 0), 2) AS avg_minutes_per_outage
