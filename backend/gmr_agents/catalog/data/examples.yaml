    suggest: "Is the burnt-meter count rising month on month?"
    note: "Leave the current partial month out of the verdict."
    sql: |
      SELECT date_trunc('month', period_start)::date AS month,
             SUM(defect_count) FILTER (WHERE defective_type = 'Meter Burnt') AS meter_burnt,
             SUM(defect_count) AS all_defective
