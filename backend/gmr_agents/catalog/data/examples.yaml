    - How many meters have power factor deterioration?
    - power factor deterioration card
    - meters with PF issue, poor + critical and critical
    suggest: "How many meters have power factor deterioration?"
    note: Total = distinct meters on _meters (a meter can sit in two bands); band counts from the rollup.
    sql: |
      WITH b AS (
        SELECT pf_band, SUM(unique_meter_count) AS meters FROM hes_gold.power_factor_deterioration
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) GROUP BY pf_band),
       t AS (SELECT COUNT(DISTINCT meter_no) AS total FROM hes_gold.power_factor_deterioration_meters WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c))
      SELECT (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AS data_month, t.total AS meters_with_pf_issue,
             SUM(b.meters) FILTER (WHERE b.pf_band IN ('Poor', 'Critical')) AS poor_critical_meters,
             ROUND(SUM(b.meters) FILTER (WHERE b.pf_band IN ('Poor', 'Critical')) * 100.0 / t.total, 2) AS poor_critical_pct,
             SUM(b.meters) FILTER (WHERE b.pf_band = 'Critical') AS critical_meters,
             ROUND(SUM(b.meters) FILTER (WHERE b.pf_band = 'Critical') * 100.0 / t.total, 2) AS critical_pct
      FROM b CROSS JOIN t GROUP BY t.total
