  - q: ["At the current SAT pace, when will we reach 98% of eligible MI?", "SAT ETA", "when will SAT reach target"]
    suggest: "At the current SAT pace, when will we reach 98% of eligible MI?"
    note: "Pace = SAT batches: main query (Postgres) gives each project's meters still needed, its average meters per batch over its last 3 non-empty batches and batches_needed; the extra query (Athena) gives each project's last batch date and average days between its last 4 batches. ETA per project = the extra query's eta_after_<batches_needed>_batch(es) date (today + N x cadence; newer batches can still be undated, so never count from last_batch_date) -- copy that date; say 'about N more batch(es), one every ~D days, so around <that date>'. Never state an ETA without both results."
    sql: |
      WITH b AS (SELECT LOWER(project) AS project, sat_stage, SUM(meter_count) AS meters,
                        ROW_NUMBER() OVER (PARTITION BY LOWER(project) ORDER BY sat_stage DESC) AS rn
                 FROM public.gold_mi_sat_invoice_snapshot
                 WHERE sat_stage IS NOT NULL
                 GROUP BY 1, 2
                 HAVING SUM(meter_count) > 0),
      pace AS (SELECT project, ROUND(AVG(meters)) AS avg_meters_per_batch FROM b WHERE rn <= 3 GROUP BY project),
      need AS (SELECT LOWER(project) AS project,
                      SUM(meter_count) FILTER (WHERE is_sat_eligible) AS eligible_mi,
                      SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) AS total_sat,
                      GREATEST(CEIL(0.98 * SUM(meter_count) FILTER (WHERE is_sat_eligible))
                               - SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS more_needed
               FROM public.gold_mi_sat_invoice_snapshot GROUP BY 1)
      SELECT UPPER(need.project) AS project, need.eligible_mi, need.total_sat,
             ROUND(need.total_sat * 100.0 / NULLIF(need.eligible_mi, 0), 2) AS sat_pct_of_eligible,
             need.more_needed, pace.avg_meters_per_batch,
             CEIL(need.more_needed / NULLIF(pace.avg_meters_per_batch, 0)) AS batches_needed
      FROM need JOIN pace ON pace.project = need.project
      ORDER BY need.project
    extra:
      - purpose: "Each project's last SAT batch date and average days between its last 4 batches (cadence)"
        sql: |
          WITH d AS (SELECT LOWER(project) AS project, CAST(sat_date AS date) AS sat_date,
                            ROW_NUMBER() OVER (PARTITION BY LOWER(project) ORDER BY sat_date DESC) AS rn
                     FROM gmr_wfm_silver.sat_milestones
                     WHERE sat_date IS NOT NULL)
          SELECT project, MAX(sat_date) AS last_batch_date,
                 ROUND(date_diff('day', MIN(sat_date), MAX(sat_date)) / 3.0) AS avg_days_between_batches,
                 date_add('day', CAST(ROUND(date_diff('day', MIN(sat_date), MAX(sat_date)) / 3.0) AS integer), current_date) AS eta_after_1_batch,
                 date_add('day', CAST(2 * ROUND(date_diff('day', MIN(sat_date), MAX(sat_date)) / 3.0) AS integer), current_date) AS eta_after_2_batches,
                 date_add('day', CAST(3 * ROUND(date_diff('day', MIN(sat_date), MAX(sat_date)) / 3.0) AS integer), current_date) AS eta_after_3_batches
          FROM d
          WHERE rn <= 4
          GROUP BY project
          ORDER BY project

