  - q: ["Compare Agra and Kashi installations in September 2026 and give the difference.", "Agra vs Kashi installations last month", "difference between two projects' installations in a month", "how many more meters did Agra install than Kashi"]
    note: "A comparison returns EACH value and the difference (and % difference) as columns. Projects and the month come from the question."
    sql: |
      SELECT SUM(meter_count) FILTER (WHERE LOWER(project) = 'agra') AS agra_installed,
             SUM(meter_count) FILTER (WHERE LOWER(project) = 'kashi') AS kashi_installed,
             SUM(meter_count) FILTER (WHERE LOWER(project) = 'agra') - SUM(meter_count) FILTER (WHERE LOWER(project) = 'kashi') AS difference,
             ROUND((SUM(meter_count) FILTER (WHERE LOWER(project) = 'agra') - SUM(meter_count) FILTER (WHERE LOWER(project) = 'kashi')) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE LOWER(project) = 'kashi'), 0), 2) AS difference_pct
      FROM public.gold_mi_installation_month_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        AND period_start = DATE '2026-09-01'

  - q: ["Compare installations from January to September 2026 with the same period in 2025.", "year on year installations", "installations this year vs last year for the same months", "YoY growth in installations"]
    suggest: "Compare installations from January to September 2026 with the same period in 2025."
    note: "Same months in both years (the months the question names; 'this year so far' = complete months of the current year). Return both totals, the change and the % change."
    sql: |
      SELECT SUM(meter_count) FILTER (WHERE EXTRACT(YEAR FROM period_start) = 2026) AS installed_2026,
             SUM(meter_count) FILTER (WHERE EXTRACT(YEAR FROM period_start) = 2025) AS installed_2025,
             SUM(meter_count) FILTER (WHERE EXTRACT(YEAR FROM period_start) = 2026) - SUM(meter_count) FILTER (WHERE EXTRACT(YEAR FROM period_start) = 2025) AS change,
             ROUND((SUM(meter_count) FILTER (WHERE EXTRACT(YEAR FROM period_start) = 2026) - SUM(meter_count) FILTER (WHERE EXTRACT(YEAR FROM period_start) = 2025)) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE EXTRACT(YEAR FROM period_start) = 2025), 0), 2) AS change_pct
      FROM public.gold_mi_installation_month_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        AND EXTRACT(MONTH FROM period_start) BETWEEN 1 AND 9 AND EXTRACT(YEAR FROM period_start) IN (2025, 2026)

  - q: ["What share of all installed meters is from Triveni?", "project-wise share of installations", "contribution of each project to total installations", "what percent of installs is from each project"]
    suggest: "What share of all installed meters comes from each project?"
    note: "Share = part * 100 / overall total; keep the counts so the share can be checked."
