  - q: ["Invoice vs revenue released", "receivables summary delay analysis", "how much is overdue", "overdue amount lumpsum and cable", "invoice amount net vs realised"]
    note: "Dashboard card per stream: Realised + Within Timeline (unpaid, not yet due) + Overdue = Invoice Amount (Net); Overdue = invoiced - realised - within_timeline. Latest row per project, summed. A negative overdue = the operator's figures do not add up -- say so."
    sql: |
      WITH l AS (
        SELECT * FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
                       FROM public.revenue_receivables r) x
        WHERE rn = 1),
      t AS (
        SELECT SUM(lumpsum_invoiced) AS li, SUM(lumpsum_realised) AS lr, SUM(lumpsum_within_timeline) AS lw,
               SUM(pmpm_invoiced) AS pi, SUM(pmpm_realised) AS pr, SUM(pmpm_within_timeline) AS pw,
               SUM(cable_invoiced) AS ci, SUM(cable_realised) AS cr, SUM(cable_within_timeline) AS cw
        FROM l)
      SELECT v.stream, ROUND(v.inv, 2) AS invoice_amount_net_cr, ROUND(v.rea, 2) AS realised_cr,
             ROUND(v.wt, 2) AS within_timeline_cr, ROUND(v.inv - v.rea - v.wt, 2) AS overdue_cr,
             ROUND(v.rea * 100.0 / NULLIF(v.inv, 0), 2) AS pct_realised
      FROM t CROSS JOIN LATERAL (VALUES
        (1, 'Lumpsum', t.li, t.lr, t.lw), (2, 'PMPM', t.pi, t.pr, t.pw), (3, 'Cable', t.ci, t.cr, t.cw),
        (4, 'All streams', t.li + t.pi + t.ci, t.lr + t.pr + t.cr, t.lw + t.pw + t.cw)) AS v(ord, stream, inv, rea, wt)
      ORDER BY v.ord

  - q: ["receivables summary project wise", "show the receivables summary project wise", "invoice vs revenue released project wise", "overdue amount project wise", "receivables by project"]
    note: "Per project (latest row each) plus Total, each stream SEPARATE like the card (lumpsum, PMPM, cable: invoiced, realised, overdue = invoiced - realised - within_timeline) -- never one merged amount. A discom = its projects: PUVVNL = kashi + triveni, DVVNL = agra (WHERE LOWER(project) IN (...)). A negative overdue = the operator's figures do not add up -- say so."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(lumpsum_invoiced) AS lumpsum_invoiced_cr, SUM(lumpsum_realised) AS lumpsum_realised_cr,
             SUM(lumpsum_invoiced - lumpsum_realised - lumpsum_within_timeline) AS lumpsum_overdue_cr,
             SUM(pmpm_invoiced) AS pmpm_invoiced_cr, SUM(pmpm_realised) AS pmpm_realised_cr,
             SUM(pmpm_invoiced - pmpm_realised - pmpm_within_timeline) AS pmpm_overdue_cr,
             SUM(cable_invoiced) AS cable_invoiced_cr, SUM(cable_realised) AS cable_realised_cr,
             SUM(cable_invoiced - cable_realised - cable_within_timeline) AS cable_overdue_cr
      FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables r) l
      WHERE rn = 1
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, project

  - q: ["Cable revenue realized for consumer meters", "lumpsum invoiced for DT meters", "pmpm realised zone wise", "receivables category wise", "cable realised for feeder meters"]
    note: "Receivables are filed per project only -- no category, meter type or zone split. Drop that filter and give the asked stream per project plus Total; the answer opens by saying the split is not recorded."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             ROUND(SUM(cable_invoiced), 2) AS cable_invoiced_cr, ROUND(SUM(cable_realised), 2) AS cable_realised_cr,
             ROUND(SUM(cable_realised) * 100.0 / NULLIF(SUM(cable_invoiced), 0), 2) AS cable_pct_realised
      FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables r) l
      WHERE rn = 1
      GROUP BY ROLLUP(project)
      ORDER BY GROUPING(project), project

  - q: ["Total invoiced amount in crore", "total realised amount", "how much has been invoiced in total", "total invoice amount all streams"]
    note: "Amounts are already in crore -- never divide by 10^7. Each stream plus their sum, latest row per project."
    sql: |
      SELECT SUM(lumpsum_invoiced) AS lumpsum_invoiced_cr, SUM(pmpm_invoiced) AS pmpm_invoiced_cr,
             SUM(cable_invoiced) AS cable_invoiced_cr,
             SUM(lumpsum_invoiced + pmpm_invoiced + cable_invoiced) AS total_invoiced_cr
      FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables r) l
