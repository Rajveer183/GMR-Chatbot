  - q: ["Which OEM has the highest defect rate?", "defect rate OEM-wise", "Which OEM has the most defective meters?", "Sabse zyada kharab meter kis OEM ke hain", "HPL has only 59 defective meters. How can it have the highest defect rate?"]
    note: "Show both defective count and rate with the installed base; a high rate on a tiny base is noise. Defect rate counts ONLY Meter Faulty (not burnt / others): rate = meter_faulty / installed -- HPL's rate uses its faulty meters, not all its defective ones."
    sql: |
      SELECT u.oem, SUM(u.defects) AS defective, SUM(u.faulty) AS meter_faulty, SUM(u.burnt) AS meter_burnt,
             SUM(u.installed) AS installed,
             ROUND(SUM(u.faulty) * 100.0 / NULLIF(SUM(u.installed), 0), 2) AS defect_rate_pct
      FROM (SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) AS oem, defect_count AS defects,
                   defect_rate_numerator_count AS faulty,
                   CASE WHEN defective_type = 'Meter Burnt' THEN defect_count ELSE 0 END AS burnt, 0 AS installed
            FROM public.gold_meter_defect_event_day_agg
            UNION ALL
            SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')), 0, 0, 0, meter_count
            FROM public.gold_mi_installation_month_agg
            WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL
              AND UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) IN (
                SELECT DISTINCT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) FROM public.gold_meter_defect_event_day_agg)) u
      GROUP BY u.oem
      ORDER BY defect_rate_pct DESC

