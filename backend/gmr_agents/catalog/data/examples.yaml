    note: "Feeder ranking: feeder_code IS NOT NULL, ORDER BY the asked column (mi = most consumers, out = reassign out, inc = reassign in, review + nodata = pending, correct_tagging = correct; lowest accuracy = confidence_pct ASC with mi >= 100), LIMIT 10."
