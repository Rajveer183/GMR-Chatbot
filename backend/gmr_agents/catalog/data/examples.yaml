             window_end AS data_up_to, zone, circle
      FROM hes_gold.communication_failures WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND meter_no = 'AL1516111'

  - q: ["Hidden outage pockets", "hidden outages total flagged meters", "how many meters have hidden outages"]
    note: "Consolidated card: a meter counts once across detectors; % slots flagged = SUM(flagged)/SUM(checked) half-hours."
    sql: |
      SELECT MAX(data_date) AS data_month,
             COUNT(DISTINCT meter_no) AS total_flagged_meters,
             ROUND(SUM(total_block_count_flagged) * 100.0 / SUM(total_block_count), 2) AS pct_slots_flagged,
             SUM(total_flagged_occurrences) AS flagged_events,
             SUM(total_block_count_flagged) AS half_hours_flagged
      FROM hes_gold.hidden_outage_summary WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

  - q: ["Hidden outage pockets detector-wise", "hidden outage by detector"]
    sql: |
      SELECT MAX(data_date) AS data_month, detector, COUNT(DISTINCT meter_no) AS meters,
             SUM(total_block_count_flagged) AS half_hours_flagged,
             ROUND(SUM(total_block_count_flagged) * 100.0 / NULLIF(SUM(total_block_count), 0), 2) AS pct_slots_flagged,
             SUM(total_flagged_occurrences) AS flagged_events, SUM(total_occurrences) AS events_checked
      FROM hes_gold.hidden_outage_summary WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
      GROUP BY detector ORDER BY meters DESC

  - q: ["Hidden power event", "current flowing during reported outages", "how many meters had power during a reported outage"]
    sql: |
      SELECT MAX(data_date) AS data_month, COUNT(DISTINCT meter_no) AS meters,
             ROUND(SUM(total_block_count_flagged) * 100.0 / SUM(total_block_count), 2) AS pct_slots_flagged,
             SUM(total_flagged_occurrences) AS flagged_events, SUM(total_occurrences) AS outages_checked
      FROM hes_gold.hidden_outage_summary WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND detector = 'hidden_power_event'

  - q: ["Unreported block-load gap in Kashi", "missing readings during outages in Kashi"]
