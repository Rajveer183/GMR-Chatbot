  - q: ["Show the month where installations increased the most compared with the previous month.", "Which month had the biggest month-over-month increase in installations?", "biggest jump in monthly installs", "month on month installation growth"]
    suggest: "Which month had the biggest month-over-month increase in installations?"
    note: "Month-over-month = LAG over the monthly totals (one row per month first, then LAG). Partial current month is included only if asked."
    sql: |
      WITH m AS (
        SELECT period_start AS month, SUM(meter_count) AS installed
        FROM public.gold_mi_installation_month_agg
        WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        GROUP BY period_start)
      SELECT month, installed, LAG(installed) OVER (ORDER BY month) AS previous_month_installed,
             installed - LAG(installed) OVER (ORDER BY month) AS increase,
             ROUND((installed - LAG(installed) OVER (ORDER BY month)) * 100.0 / NULLIF(LAG(installed) OVER (ORDER BY month), 0), 2) AS increase_pct
      FROM m
      ORDER BY increase DESC NULLS LAST
      LIMIT 1

  - q: ["Find the division that had the highest number of installed meters in the month immediately before the month with the highest total installed meters across all divisions in 2025, with its counts in both months and the percentage change.", "top division in the month before the peak installation month", "which division led in the month before the 2025 peak month"]
    note: "Multi-step time question: (1) monthly totals for the year -> (2) peak month (ORDER BY total DESC LIMIT 1) and its previous month = (peak - INTERVAL '1 month')::date -> (3) per-division counts for BOTH months via FILTER, from the same table CROSS JOIN the peak row -> (4) rank divisions by the month the question names. Every CTE column used later must be selected in that CTE; qualify columns with table aliases."
    sql: |
      WITH m AS (
        SELECT period_start, SUM(meter_count) AS installed
        FROM public.gold_mi_installation_month_agg
        WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
          AND period_start >= DATE '2025-01-01' AND period_start < DATE '2026-01-01'
        GROUP BY period_start),
      peak AS (SELECT period_start AS peak_month, installed AS peak_month_total,
                      (period_start - INTERVAL '1 month')::date AS previous_month
               FROM m ORDER BY installed DESC LIMIT 1),
      d AS (
        SELECT t.division,
               SUM(t.meter_count) FILTER (WHERE t.period_start = p.previous_month) AS installed_previous_month,
               SUM(t.meter_count) FILTER (WHERE t.period_start = p.peak_month) AS installed_peak_month
        FROM public.gold_mi_installation_month_agg t CROSS JOIN peak p
        WHERE t.has_meter_serial AND t.progress_category IS NOT NULL AND NOT t.is_replacement AND t.division IS NOT NULL
          AND t.period_start IN (p.previous_month, p.peak_month)
        GROUP BY t.division)
      SELECT p.peak_month, p.peak_month_total, p.previous_month, UPPER(d.division) AS division,
             d.installed_previous_month, d.installed_peak_month,
             ROUND((d.installed_peak_month - d.installed_previous_month) * 100.0 / NULLIF(d.installed_previous_month, 0), 2) AS pct_change
      FROM d CROSS JOIN peak p
      ORDER BY d.installed_previous_month DESC NULLS LAST
      LIMIT 1

  - q: ["Which OEM has the lowest defect rate?", "best OEM by defect rate", "most reliable OEM", "rank OEMs by defect rate"]
    suggest: "Which OEM has the lowest defect rate?"
    note: "Rank the real OEMs only (AEW, CAP, HPL, SEIPL) -- leave out 'UNKNOWN' / blank makes. Lowest = ORDER BY rate ASC, highest = DESC; keep the installed base and counts so a tiny base is visible."
    sql: |
      SELECT u.oem, SUM(u.faulty) AS meter_faulty, SUM(u.defects) AS defective, SUM(u.installed) AS installed,
             ROUND(SUM(u.faulty) * 100.0 / NULLIF(SUM(u.installed), 0), 2) AS defect_rate_pct
      FROM (SELECT UPPER(TRIM(oem)) AS oem, defect_count AS defects, defect_rate_numerator_count AS faulty, 0 AS installed
            FROM public.gold_meter_defect_event_day_agg
            WHERE NULLIF(TRIM(oem), '') IS NOT NULL AND UPPER(TRIM(oem)) <> 'UNKNOWN'
            UNION ALL
            SELECT UPPER(TRIM(oem)), 0, 0, meter_count
            FROM public.gold_mi_installation_month_agg
            WHERE NOT is_replacement AND has_meter_serial AND NULLIF(TRIM(oem), '') IS NOT NULL
              AND UPPER(TRIM(oem)) <> 'UNKNOWN') u
      GROUP BY u.oem
      HAVING SUM(u.installed) > 0
      ORDER BY defect_rate_pct ASC

