        WHERE closed_date BETWEEN CURRENT_DATE - 31 AND CURRENT_DATE - 1 AND LOWER(project) = 'kashi')
      SELECT c.meter_serial_number, UPPER(c.project) AS project, c.zone, c.category, c.total_complaints,
             c.open_complaints, c.closed_complaints, c.sat_status, c.sat_number
      FROM public.gold_om_meter_complaints_agg c
      JOIN areas a ON a.discom = COALESCE(LOWER(c.discom), '') AND a.zone = COALESCE(LOWER(c.zone), '')
