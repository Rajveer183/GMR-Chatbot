             COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'FEEDER'), 0) AS feeder
      FROM public.gold_mi_installation_day_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        AND period_start BETWEEN CURRENT_DATE - 7 AND CURRENT_DATE - 1
      GROUP BY ROLLUP (period_start)
      ORDER BY GROUPING(period_start) DESC, period_start
  - q: ["oem wise meter installed in last 2 months", "meters installed in last 3 months", "installs in the last N months OEM wise"]
    note: "'last N months' = rolling window ending yesterday, starting the same date N months earlier (asked 23 Oct: last 2 months = 22 Aug .. 22 Oct). Day table only; not whole calendar months. State the exact dates in the answer."
    sql: |
      SELECT CASE WHEN GROUPING(oem) = 1 THEN 'Total' ELSE UPPER(oem) END AS oem, SUM(meter_count) AS meters_installed,
             MIN((CURRENT_DATE - 1 - INTERVAL '2 months')::date) AS from_date, MIN(CURRENT_DATE - 1) AS to_date
      FROM public.gold_mi_installation_day_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        AND period_start BETWEEN (CURRENT_DATE - 1 - INTERVAL '2 months')::date AND CURRENT_DATE - 1
      GROUP BY ROLLUP (oem)
      ORDER BY GROUPING(oem) DESC, meters_installed DESC
  - q: ["How many meters installed, how many SAT done, how many defects found OEM wise in Agra only DT", "OEM wise installs SAT and defects for DT meters in a project", "only DT installs SAT defects by OEM"]
    note: "Same UNION ALL pattern as the all-category version; DT = progress_category 'DT' in the installation leg (never inventory_category) and category 'DT' in the defect leg; the project filter goes on BOTH legs."
    sql: |
      SELECT u.oem, SUM(u.installed) AS installed_meters, SUM(u.sat_done) AS sat_done, SUM(u.defects) AS defects_found
      FROM (SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) AS oem, meter_count AS installed,
                   CASE WHEN has_sat_number THEN meter_count ELSE 0 END AS sat_done, 0 AS defects
            FROM public.gold_mi_installation_month_agg
            WHERE has_meter_serial AND progress_category = 'DT' AND NOT is_replacement AND LOWER(project) = 'agra'
            UNION ALL
            SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')), 0, 0, defect_count
            FROM public.gold_meter_defect_event_day_agg
            WHERE category = 'DT' AND LOWER(project) = 'agra') u
      GROUP BY u.oem
      ORDER BY installed_meters DESC

