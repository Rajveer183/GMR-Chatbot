  - q: ["Normalise replacements per 1,000 meters installed by project.", "Which project has the most replacements?", "replacements per 1000 installed"]
    suggest: "Which project has the most replacements?"
    sql: |
      SELECT CASE WHEN GROUPING(u.project) = 1 THEN 'Total' ELSE UPPER(u.project) END AS project,
             SUM(u.defects) AS replacements, SUM(u.installed) AS installed,
             ROUND(SUM(u.defects) * 1000.0 / NULLIF(SUM(u.installed), 0), 2) AS replacements_per_1000
      FROM (SELECT LOWER(project) AS project, defect_count AS defects, 0 AS installed FROM public.gold_meter_defect_event_day_agg
            UNION ALL
            SELECT LOWER(project), 0, meter_count FROM public.gold_mi_installation_month_agg
            WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement) u
      GROUP BY ROLLUP (u.project)
      ORDER BY GROUPING(u.project) DESC, replacements DESC

