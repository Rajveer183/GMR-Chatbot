      ORDER BY data_date, block_time LIMIT 500

  - q: ["Consumption spike / drop meters in Triveni by meter type"]
    sql: |
      SELECT MAX(month_date) AS data_month, category, COUNT(*) AS flagged_meters,
             COUNT_IF(meter_flag = 'Spike') AS spike_meters, COUNT_IF(meter_flag = 'Drop') AS drop_meters,
             SUM(spike_count) AS spike_readings, SUM(drop_count) AS drop_readings
      FROM hes_gold.consumption_spike_drop WHERE month_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND is_spike_or_drop_suspect AND LOWER(cluster) = 'triveni'
      GROUP BY category ORDER BY flagged_meters DESC

# verified 10 Nov 2026 against live Athena (same SQL as refs.py ids C02..C23)
  - q:
    - Show the Low Power Factor (%) by DT/Feeder card summary
    - how many meters have low power factor
    - low power factor card
    - avg low PF %
    note: 'Low PF card tiles: meters = SUM(unique_meter_count) after severity NOT IN (''Normal'',''NoData''); max ageing = MAX (the dashboard tile wrongly sums it).'
    sql: |
      SELECT MAX(data_date) AS data_month,
             SUM(unique_meter_count) AS low_pf_meters,
             ROUND(AVG(avg_low_pf_pct), 2) AS avg_low_pf_pct,
             MAX(max_ageing_days) AS max_ageing_days,
             ROUND(AVG(avg_streak_coverage_pct), 2) AS avg_streak_coverage_pct
      FROM hes_gold.lpf2_low_power_factor
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND severity NOT IN ('Normal', 'NoData')
  - q:
    - Low power factor meters by severity
    - critical poor average borderline low PF meters
    suggest: "Low power factor meters by severity"
    sql: |
      SELECT MAX(data_date) AS data_month, severity,
             SUM(unique_meter_count) AS meters, ROUND(AVG(avg_low_pf_pct), 2) AS avg_low_pf_pct
      FROM hes_gold.lpf2_low_power_factor
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND severity NOT IN ('Normal', 'NoData')
      GROUP BY severity
      ORDER BY CASE severity WHEN 'Critical' THEN 1 WHEN 'Poor' THEN 2 WHEN 'Average' THEN 3 ELSE 4 END
  - q:
    - Low power factor meters by circle
    - circle-wise low power factor
    suggest: "Low power factor meters by circle"
    sql: |
      SELECT MAX(data_date) AS data_month, circle,
             SUM(unique_meter_count) AS low_pf_meters,
             COALESCE(SUM(unique_meter_count) FILTER (WHERE severity = 'Critical'), 0) AS critical,
             COALESCE(SUM(unique_meter_count) FILTER (WHERE severity = 'Poor'), 0) AS poor,
             COALESCE(SUM(unique_meter_count) FILTER (WHERE severity = 'Average'), 0) AS average,
             COALESCE(SUM(unique_meter_count) FILTER (WHERE severity = 'Borderline'), 0) AS borderline,
             ROUND(AVG(avg_low_pf_pct), 2) AS avg_low_pf_pct
      FROM hes_gold.lpf2_low_power_factor
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND severity NOT IN ('Normal', 'NoData') AND circle IS NOT NULL
      GROUP BY circle
      ORDER BY low_pf_meters DESC
      LIMIT 15
  - q:
    - Which zone has the most low power factor meters?
    - zone-wise low PF meters
    sql: |
      SELECT MAX(data_date) AS data_month, zone,
             SUM(unique_meter_count) AS low_pf_meters,
             COALESCE(SUM(unique_meter_count) FILTER (WHERE severity = 'Critical'), 0) AS critical
      FROM hes_gold.lpf2_low_power_factor
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND severity NOT IN ('Normal', 'NoData') AND zone IS NOT NULL
