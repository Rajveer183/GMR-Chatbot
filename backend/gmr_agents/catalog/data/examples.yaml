  - q: ["How many SAT-passed meters are still not invoiced?", "SAT done but not invoiced", "Why are SAT meters not yet invoiced?"]
    suggest: "How many SAT-passed meters are still not invoiced?"
    note: "Not-invoiced SAT meters sit in specific SAT batches: show them per project and batch so the reason (batch not yet invoiced) is visible in the table. Chart one bar per project (x = project, y = not_lumpsum_invoiced, no group) -- never the batches."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             CASE WHEN GROUPING(sat_stage) = 1 THEN 'All batches' ELSE 'SAT-' || sat_stage END AS sat_batch,
             SUM(meter_count) AS sat_meters,
             COALESCE(SUM(meter_count) FILTER (WHERE NOT has_lumpsum_invoice), 0) AS not_lumpsum_invoiced,
             COALESCE(SUM(meter_count) FILTER (WHERE NOT has_pmpm_invoice), 0) AS not_pmpm_invoiced
      FROM public.gold_mi_sat_invoice_snapshot
      WHERE sat_stage IS NOT NULL
      GROUP BY ROLLUP (project, sat_stage)
      HAVING COALESCE(SUM(meter_count) FILTER (WHERE NOT has_lumpsum_invoice), 0) > 0
      ORDER BY GROUPING(project) DESC, project, GROUPING(sat_stage) DESC, sat_stage
    extra:
      - purpose: "SAT batch dates and invoice dates (which batches are not invoiced yet)"
        sql: |
          SELECT LOWER(project) AS project, sat_number, sat_date, lumpsum_invoice_date, pmpm_invoice_date
          FROM gmr_wfm_silver.sat_milestones
          WHERE lumpsum_invoice_date IS NULL OR pmpm_invoice_date IS NULL
          ORDER BY project, sat_number

  - q: ["Where is the biggest drop-off in the supply-to-collection funnel?", "Build the full funnel from supply to collection with conversion at each stage", "funnel conversion"]
    suggest: "Build the full funnel from supply to collection with conversion at each stage."
    note: "Conversion = step / previous step. Keep ALL five steps in order (never ORDER BY the loss + LIMIT 1: the first step's NULL loss sorts first); the biggest_drop column marks the step with the largest loss -- name that one as the biggest drop-off."
    sql: |
      WITH f AS (
        SELECT (SELECT total_current_inventory_count FROM public.gold_dashboard_stats_snapshot WHERE singleton) AS supplied,
               SUM(meter_count) AS installed,
               SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) AS sat_done,
               SUM(meter_count) FILTER (WHERE has_lumpsum_invoice) AS invoiced,
               (SELECT total_pmpm_collection_done_meters FROM public.gold_dashboard_stats_snapshot WHERE singleton) AS collected
        FROM public.gold_mi_sat_invoice_snapshot),
      s AS (SELECT ord, step, meters, LAG(meters) OVER (ORDER BY ord) - meters AS lost_from_previous,
                   ROUND(meters * 100.0 / NULLIF(LAG(meters) OVER (ORDER BY ord), 0), 2) AS conversion_pct
            FROM (SELECT 1 AS ord, '1 Supplied' AS step, supplied AS meters FROM f
                  UNION ALL SELECT 2, '2 Installed', installed FROM f
                  UNION ALL SELECT 3, '3 SAT done', sat_done FROM f
                  UNION ALL SELECT 4, '4 Invoiced (lumpsum)', invoiced FROM f
                  UNION ALL SELECT 5, '5 Collected (PMPM)', collected FROM f) u)
      SELECT step, meters, lost_from_previous, conversion_pct,
             CASE WHEN lost_from_previous = MAX(lost_from_previous) OVER () THEN 'Yes' ELSE '' END AS biggest_drop
      FROM s
      ORDER BY ord

  - q: ["How much was supplied in Feb '26 and how did it compare with Jan '26?", "supply this month vs last month", "compare supplies of two months"]
    sql: |
      SELECT SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-02-01' AND period_start < DATE '2026-03-01') AS supplied_feb_2026,
             SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-02-01') AS supplied_jan_2026,
             SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-02-01' AND period_start < DATE '2026-03-01')
               - SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-02-01') AS change,
             ROUND((SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-02-01' AND period_start < DATE '2026-03-01')
               - SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-02-01')) * 100.0
               / NULLIF(SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-02-01'), 0), 2) AS change_pct
      FROM public.gold_meter_inventory_event_month_agg
      WHERE period_start >= DATE '2026-01-01' AND period_start < DATE '2026-03-01'

  - q: ["In which month did supply start to decline?", "when did supply peak", "since when is supply falling"]
    suggest: "In which month did supply start to decline?"
    note: "Sustained decline starts the month AFTER the peak month (highest supply); a one-month dip that later recovers above it is not the start. Return the series plus the peak."
    sql: |
      WITH m AS (SELECT period_start AS month, SUM(inventory_count) AS supplied
                 FROM public.gold_meter_inventory_event_month_agg
                 WHERE period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '18 months')::date
                 GROUP BY period_start),
      pk AS (SELECT month AS peak_month FROM m ORDER BY supplied DESC LIMIT 1)
      SELECT m.month, m.supplied, m.supplied - LAG(m.supplied) OVER (ORDER BY m.month) AS change_vs_prev_month,
             pk.peak_month, (pk.peak_month + INTERVAL '1 month')::date AS decline_starts
      FROM m CROSS JOIN pk
      ORDER BY m.month

  - q: ["Is supply keeping pace with installation over the last three months?", "supply vs installs last 3 months", "are supplies keeping up with installations recently"]
    suggest: "Is supply keeping pace with installation over the last three months?"
    note: "'last three months' = rolling window ending yesterday (CURRENT_DATE - 1 - INTERVAL '3 months' .. CURRENT_DATE - 1) from the DAY table, one row per month (first and last months partial) plus Total. Keeping pace = supplied >= installed. Never LIMIT an ascending series (it keeps the OLDEST months)."
    sql: |
      SELECT CASE WHEN GROUPING(date_trunc('month', period_start)) = 1 THEN 'Total'
                  ELSE to_char(date_trunc('month', period_start), 'Mon YYYY') END AS month,
             SUM(inventory_count) AS supplied, SUM(installed_count) AS installed,
             SUM(inventory_count) - SUM(installed_count) AS supplied_minus_installed
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start BETWEEN (CURRENT_DATE - 1 - INTERVAL '3 months')::date AND CURRENT_DATE - 1
      GROUP BY ROLLUP (date_trunc('month', period_start))
      ORDER BY GROUPING(date_trunc('month', period_start)) DESC, date_trunc('month', period_start)

  - q: ["monthly supply trend", "supply vs installation month-wise"]
    note: "A decline starts at the first month below the previous month that is followed by lower months; the peak is the month before. Keeping pace = supplied >= installed in each month."
    sql: |
      SELECT period_start AS month, SUM(inventory_count) AS supplied, SUM(installed_count) AS installed,
             SUM(inventory_count) - SUM(installed_count) AS net_supplied_minus_installed,
             SUM(inventory_count) - LAG(SUM(inventory_count)) OVER (ORDER BY period_start) AS supply_change_vs_prev_month
      FROM public.gold_meter_inventory_event_month_agg
      WHERE period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '12 months')::date
      GROUP BY period_start
      ORDER BY period_start

  - q: ["At the current pace, how many days will our stock last?", "stock kitne din chalega", "when does stock run out"]
    suggest: "At the current pace, how many days will our stock last?"
    note: "Pace = average daily stock consumption over the last 6 months (current month by days elapsed). Run-out date = CURRENT_DATE + days_left. Store / site / godown / warehouse asks use the warehouse-wise example instead."
    sql: |
      WITH m AS (
        SELECT LOWER(project) AS project, category, date_trunc('month', period_start)::date AS mon, SUM(stock_consumed_count) AS used
        FROM public.gold_meter_inventory_event_day_agg
        WHERE period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '5 months')::date AND period_start <= CURRENT_DATE
        GROUP BY 1, 2, 3),
      p AS (SELECT project, category,
                   SUM(used / CASE WHEN mon = date_trunc('month', CURRENT_DATE)::date THEN EXTRACT(DAY FROM CURRENT_DATE)
                                   ELSE EXTRACT(DAY FROM (mon + INTERVAL '1 month - 1 day')) END) / 6 AS pace
            FROM m GROUP BY 1, 2),
      s AS (SELECT LOWER(project) AS project, category, SUM(inventory_count) - SUM(stock_consumed_count) AS stock
            FROM public.gold_meter_inventory_event_day_agg GROUP BY 1, 2),
      u AS (SELECT project, category, stock, 0 AS pace FROM s UNION ALL SELECT project, category, 0, pace FROM p)
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'TOTAL' ELSE UPPER(project) END AS project,
             CASE WHEN GROUPING(category) = 1 THEN 'All' ELSE category END AS category,
             SUM(stock) AS in_stock, ROUND(SUM(pace), 1) AS pace_per_day,
             ROUND(SUM(stock) / NULLIF(SUM(pace), 0)) AS days_left,
             CURRENT_DATE + CAST(ROUND(SUM(stock) / NULLIF(SUM(pace), 0)) AS int) AS runs_out_on
      FROM u
      GROUP BY GROUPING SETS ((), (project), (project, category))
      ORDER BY GROUPING(project) DESC, days_left NULLS LAST

  - q: ["If installs continue at today's pace, when does stock run out, and what happens to SAT?", "stock run out and SAT impact", "what happens to SAT when stock runs out"]
    note: "Postgres only. Pace = average daily new installs over the last 30 days ending yesterday; days left = remaining stock / pace. SAT impact: installs after the cutoff are not yet due; when stock runs out new installs stop, so the SAT pipeline is the eligible pending (Non-SAT card) plus not-yet-due meters."
    sql: |
      WITH p AS (SELECT SUM(meter_count) / 30.0 AS pace FROM public.gold_mi_installation_day_agg
                 WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
                   AND period_start BETWEEN CURRENT_DATE - 30 AND CURRENT_DATE - 1),
      s AS (SELECT SUM(inventory_count) - SUM(stock_consumed_count) AS stock FROM public.gold_meter_inventory_event_day_agg)
      SELECT s.stock AS remaining_stock, ROUND(p.pace, 1) AS installs_per_day,
             ROUND(s.stock / NULLIF(p.pace, 0)) AS days_left,
             CURRENT_DATE + CAST(ROUND(s.stock / NULLIF(p.pace, 0)) AS int) AS runs_out_on,
             (SELECT SUM(meter_count) FROM public.gold_non_sat_ageing_snapshot) AS eligible_pending_sat,
             (SELECT SUM(meter_count) FROM public.gold_mi_sat_invoice_snapshot WHERE sat_stage IS NULL AND NOT is_sat_eligible) AS not_yet_due_for_sat
      FROM s CROSS JOIN p

  - q: ["Which stores or sites have less than one week of stock?", "warehouse-wise days of stock left", "which warehouse will run out of stock first", "stock cover by warehouse", "kis godown mein ek hafte se kam stock hai", "warehouses with less than 15 days of stock"]
    suggest: "Which warehouses have less than one week of stock?"
    note: "Store / site / godown = warehouse. One Athena query (Postgres has warehouse stock but no warehouse pace). Stock = latest inventory row per serial with no installed_ts and no installation row (matches the unused-stock card). Pace = meters installed a day from that warehouse (installed_ts), average of the last 6 months' daily rates (current month by days elapsed). 'Less than N days' = days_left < N (days_left kept to 1 decimal so the filter and the shown value agree); under_one_week marks the 7-day ask -- when every row says 'No', the answer is 'no warehouse has less than a week' and names the lowest few with their days left. Change the 7 for another N."
    sql: |
      WITH inv AS (
        SELECT UPPER(TRIM(meter_serial_number)) AS serial, COALESCE(NULLIF(TRIM(warehouse), ''), 'UNASSIGNED') AS warehouse,
               CAST(installed_ts AS date) AS installed_on,
               ROW_NUMBER() OVER (PARTITION BY UPPER(TRIM(meter_serial_number)) ORDER BY updated_at DESC) AS rn
        FROM gmr_wfm_silver.unified_smart_meter_inventory
        WHERE meter_serial_number IS NOT NULL AND di_date IS NOT NULL),
      inst AS (SELECT DISTINCT UPPER(TRIM(new_meter_serial_number)) AS serial
               FROM gmr_wfm_silver.unified_installations
               WHERE mi_date IS NOT NULL AND new_meter_serial_number IS NOT NULL),
      s AS (SELECT i.warehouse, COUNT(*) AS stock
            FROM inv i LEFT JOIN inst x ON x.serial = i.serial
            WHERE i.rn = 1 AND i.installed_on IS NULL AND x.serial IS NULL
            GROUP BY i.warehouse),
      m AS (SELECT warehouse, date_trunc('month', installed_on) AS mon, COUNT(*) AS used
            FROM inv
            WHERE rn = 1 AND installed_on >= date_add('month', -5, date_trunc('month', current_date)) AND installed_on <= current_date
            GROUP BY 1, 2),
      p AS (SELECT warehouse,
                   SUM(used * 1.0 / CASE WHEN mon = date_trunc('month', current_date) THEN day(current_date)
                                         ELSE day(last_day_of_month(mon)) END) / 6 AS pace
            FROM m GROUP BY 1),
      u AS (SELECT warehouse AS wh, stock, 0.0 AS pace FROM s UNION ALL SELECT warehouse, 0, pace FROM p)
      SELECT CASE WHEN GROUPING(wh) = 1 THEN 'TOTAL' ELSE wh END AS warehouse,
             SUM(stock) AS in_stock, ROUND(SUM(pace), 1) AS pace_per_day,
             ROUND(SUM(stock) / NULLIF(SUM(pace), 0), 1) AS days_left,
             date_add('day', CAST(FLOOR(SUM(stock) / NULLIF(SUM(pace), 0)) AS integer), current_date) AS runs_out_on,
             CASE WHEN SUM(stock) / NULLIF(SUM(pace), 0) < 7 THEN 'Yes' ELSE 'No' END AS under_one_week
      FROM u
      GROUP BY ROLLUP (wh)
      ORDER BY GROUPING(wh) DESC, days_left NULLS LAST

  - q: ["MI pace vs stock category wise", "installation pace vs stock by category", "is installation keeping up with stock category-wise", "MI pace vs stock availability by category"]
    suggest: "MI pace vs stock category wise"
    note: "MI pace = meters installed a day over the last 6 months (current month to today). Days of stock = remaining stock / pace. Postgres date - date is already whole days (an integer): never EXTRACT(EPOCH/DAY FROM date - date)."
    sql: |
      WITH w AS (SELECT (date_trunc('month', CURRENT_DATE) - INTERVAL '5 months')::date AS since)
      SELECT CASE WHEN GROUPING(category) = 1 THEN 'Total' ELSE category END AS category,
             SUM(inventory_count) AS supplied, SUM(installed_count) AS installed,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock,
             ROUND(SUM(installed_count) FILTER (WHERE period_start >= (SELECT since FROM w)) * 1.0
                   / (CURRENT_DATE - (SELECT since FROM w) + 1), 1) AS installs_per_day,
             ROUND((SUM(inventory_count) - SUM(stock_consumed_count))
                   / NULLIF(SUM(installed_count) FILTER (WHERE period_start >= (SELECT since FROM w)) * 1.0
                            / (CURRENT_DATE - (SELECT since FROM w) + 1), 0)) AS days_of_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= CURRENT_DATE
      GROUP BY ROLLUP (category)
      ORDER BY GROUPING(category) DESC, category

  - q: ["Supplied minus installed is about 1.68 lakh, but stock shows 1.21 lakh. Where are the other ≈47,500 meters?", "Supplied minus installed is about 1.68 lakh, but stock shows 1.21 lakh. Where are the other meters?", "reconcile supplied minus installed with stock", "why doesn't stock match supplied minus installed"]
    note: "Copy this SQL as is. stock = supplied - MI installs - replacement installs + installs with no stock record (scrapped stock would subtract). The user's lakh figures are from an older refresh: answer with today's figures -- the gap is the replacement installs."
    sql: |
      SELECT inv.supplied, mi.mi_installed, inv.supplied - mi.mi_installed AS supplied_minus_installed, inv.stock AS remaining_stock,
             inv.supplied - mi.mi_installed - inv.stock AS gap,
             mi.replacement_installed,
             mi.all_installed - inv.consumed AS installs_without_stock_record,
             inv.supplied - mi.mi_installed - mi.replacement_installed + (mi.all_installed - inv.consumed) AS stock_rebuilt
      FROM (SELECT SUM(inventory_count) AS supplied, SUM(stock_consumed_count) AS consumed,
                   SUM(inventory_count) - SUM(stock_consumed_count) AS stock
            FROM public.gold_meter_inventory_event_day_agg) inv
      CROSS JOIN (SELECT SUM(meter_count) FILTER (WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement) AS mi_installed,
                         SUM(meter_count) FILTER (WHERE is_replacement) AS replacement_installed,
                         SUM(meter_count) AS all_installed
                  FROM public.gold_mi_installation_day_agg) mi

  - q: ["Describe the installation trend over the last 12 months.", "monthly installations last year", "installation trend"]
    suggest: "Describe the installation trend over the last 12 months."
    note: "The current month is partial: leave it out of peak/low reading and say so."
    sql: |
      SELECT period_start AS month, SUM(meter_count) AS meters_installed
      FROM public.gold_mi_installation_month_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        AND period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '12 months')::date
      GROUP BY period_start
      ORDER BY period_start

  - q: ["Status of ticket 3394577", "ticket 3394577 status", "who handled ticket 3394577", "details of complaint number 3394577", "is ticket 3394577 closed"]
    note: "One ticket: both ticket feeds together, matched as text exactly as typed (no prefix). Open feed gives the live status; non-QC gives work completed / closed. Say not found only when both are empty."
    sql: |
