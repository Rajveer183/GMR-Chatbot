  - q: ["Which project has the highest outstanding amount?", "How much PMPM revenue is outstanding?", "outstanding amount by project", "how much cable revenue is outstanding by project", "pending amount per project"]
    note: "Outstanding (all unpaid) = invoiced - realised per stream (Within Timeline + Overdue), in crore; a project ranking sums the three streams. Money is never the revenue ageing meter counts."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(lumpsum_invoiced - lumpsum_realised) AS lumpsum_outstanding_cr,
             SUM(pmpm_invoiced - pmpm_realised) AS pmpm_outstanding_cr,
             SUM(cable_invoiced - cable_realised) AS cable_outstanding_cr,
             SUM(lumpsum_invoiced + pmpm_invoiced + cable_invoiced - lumpsum_realised - pmpm_realised - cable_realised) AS total_outstanding_cr
      FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables r) l
      WHERE rn = 1
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, total_outstanding_cr DESC

  - q: ["Which project has the lowest % on time for cable?", "What is the % on time for lumpsum?", "within timeline percentage by project", "how much revenue was realised late"]
    note: "% on time = within_timeline / invoiced x 100 (the card's Within Timeline bar %), never % realised. 'Realised late' is not recorded -- say so and give Overdue (invoiced - realised - within_timeline) beside Within Timeline."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(cable_invoiced) AS cable_invoiced_cr, SUM(cable_within_timeline) AS cable_within_timeline_cr,
             ROUND(SUM(cable_within_timeline) * 100.0 / NULLIF(SUM(cable_invoiced), 0), 2) AS cable_pct_within_timeline,
             SUM(cable_invoiced - cable_realised - cable_within_timeline) AS cable_overdue_cr
      FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables r) l
      WHERE rn = 1
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, cable_pct_within_timeline

  - q: ["Cable revenue growth", "Cable revenue realized daily from Aug 25 2026 to Sep 24 2026", "Lumpsum realised over time", "receivables trend all projects", "realised amount history"]
    note: "Amounts are TO-DATE per submission: for each filing day take each project's latest row on or before it and SUM; growth = LAG over days. Never SUM a day's rows (repeat submissions) or difference single rows. Filings start 1 Sep 2026 -- a range before that has no data."
    sql: |
      WITH days AS (SELECT DISTINCT (created_at AT TIME ZONE 'Asia/Kolkata')::date AS as_of FROM public.revenue_receivables),
           asof AS (SELECT d.as_of, r.project, r.cable_invoiced, r.cable_realised,
                           ROW_NUMBER() OVER (PARTITION BY d.as_of, r.project ORDER BY r.created_at DESC, r.id DESC) AS rn
                    FROM days d
                    JOIN public.revenue_receivables r ON (r.created_at AT TIME ZONE 'Asia/Kolkata')::date <= d.as_of)
      SELECT as_of, SUM(cable_invoiced) AS cable_invoiced_cr, SUM(cable_realised) AS cable_realised_cr,
             COUNT(*) AS projects_filed,
             SUM(cable_realised) - LAG(SUM(cable_realised)) OVER (ORDER BY as_of) AS realised_change_cr
      FROM asof
      WHERE rn = 1
      GROUP BY as_of
      ORDER BY as_of

  - q: ["Revenue not realized meters project wise", "how many meters have revenue not realized", "revenue not realized meters zone wise", "revenue pending meters project wise"]
    note: "KPI 16: every meter without collected PMPM revenue -- both stage tables (not-installed + installed), one row per project plus Total."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             COALESCE(SUM(meter_count) FILTER (WHERE current_stage IN ('inventory', 'agency', 'supervisor', 'technician')), 0) AS not_installed_yet,
             COALESCE(SUM(meter_count) FILTER (WHERE current_stage IN ('installation_done_sat_pending', 'sat_done_revenue_pending')), 0) AS installed_revenue_pending,
             SUM(meter_count) AS revenue_not_realized
      FROM (SELECT project, category, meter_type, current_stage, meter_count
            FROM public.gold_meter_installation_pending_stage_snapshot
            UNION ALL
            SELECT project, UPPER(category), meter_type, current_stage, meter_count
            FROM public.gold_meter_revenue_pending_stage_snapshot) n
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, revenue_not_realized DESC

