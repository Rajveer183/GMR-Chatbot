  - q: ["Defect rate for DT meters in Kashi OEM wise", "defect rate for feeder meters", "defect rate by OEM for one category", "overall defect rate in a period with OEM split"]
    note: "Keep a Total row: its rate is the card's blended Defect Rate % (all faulty / all installed), not an average of OEM rates. Installs: same project / place / date filters; category via progress_category or inventory_category."
    sql: |
      SELECT CASE WHEN GROUPING(u.oem) = 1 THEN 'Total' ELSE u.oem END AS oem,
             SUM(u.defects) AS total_defective, SUM(u.faulty) AS meter_faulty, SUM(u.installed) AS installed_meters,
             ROUND(SUM(u.faulty) * 100.0 / NULLIF(SUM(u.installed), 0), 2) AS defect_rate_pct
      FROM (SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) AS oem, defect_count AS defects,
                   defect_rate_numerator_count AS faulty, 0 AS installed
            FROM public.gold_meter_defect_event_day_agg
            WHERE category = 'DT' AND LOWER(project) = 'kashi'
            UNION ALL
            SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')), 0, 0, meter_count
            FROM public.gold_mi_installation_month_agg
            WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL AND LOWER(project) = 'kashi'
              AND (progress_category = 'DT' OR inventory_category = 'DT')
              AND UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) IN (
                SELECT DISTINCT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) FROM public.gold_meter_defect_event_day_agg
                WHERE category = 'DT' AND LOWER(project) = 'kashi')) u
      GROUP BY ROLLUP (u.oem)
      ORDER BY GROUPING(u.oem) DESC, defect_rate_pct DESC

  - q: ["How many burnt meters by OEM?", "burnt meters by OEM", "OEM-wise burnt meters", "which OEM has the most burnt meters"]
    note: "Burnt meters per OEM (all time unless a period is named) plus Total -- a count of Meter Burnt, not a defect rate. A follow-up 'Which OEM?' after a burnt-meter count means this."
    sql: |
      SELECT CASE WHEN GROUPING(UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown'))) = 1 THEN 'Total'
                  ELSE UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) END AS oem,
             SUM(defect_count) AS meter_burnt
