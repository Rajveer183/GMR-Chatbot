  - q:
    - Low power factor vs power factor deterioration meters by project
    - compare low PF and PF deterioration per project
    - project wise low PF and PF issue meters
    note: Low PF = rollup SUM(unique_meter_count) with the severity filter; PF deterioration = DISTINCT meters (a meter can sit in two bands -- never sum the bands).
    sql: |
      WITH l AS (
        SELECT CASE WHEN UPPER(zone) IN ('AGRA','ALIGARH','ETAH','FIROZABAD','MATHURA') THEN 'Agra'
                    WHEN UPPER(zone) IN ('AZAMGARH','VARANASI I','VARANASI II') THEN 'Kashi'
                    WHEN UPPER(zone) IN ('MIRZAPUR','PRAYAGRAJ I','PRAYAGRAJ II') THEN 'Triveni' ELSE 'Unmapped' END AS project,
               SUM(unique_meter_count) AS low_pf_meters
        FROM hes_gold.lpf2_low_power_factor
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND severity NOT IN ('Normal', 'NoData')
        GROUP BY 1),
      d AS (
        SELECT CASE WHEN UPPER(zone) IN ('AGRA','ALIGARH','ETAH','FIROZABAD','MATHURA') THEN 'Agra'
                    WHEN UPPER(zone) IN ('AZAMGARH','VARANASI I','VARANASI II') THEN 'Kashi'
                    WHEN UPPER(zone) IN ('MIRZAPUR','PRAYAGRAJ I','PRAYAGRAJ II') THEN 'Triveni' ELSE 'Unmapped' END AS project,
               COUNT(DISTINCT meter_no) AS pf_deterioration_meters
        FROM hes_gold.power_factor_deterioration_meters
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
        GROUP BY 1)
      SELECT l.project, l.low_pf_meters, d.pf_deterioration_meters
      FROM l JOIN d ON d.project = l.project
      ORDER BY l.project
  - q:
    - How many feeders have a low PF finding and are also in the Poor PF deterioration band?
    - feeders flagged on both power factor cards
    note: Join the two per-meter tables on meter_no and month; a Low PF finding includes ageing_days >= 3.
    sql: |
      SELECT COUNT(DISTINCT m.meter_no) AS feeders_on_both_cards
      FROM hes_gold.lpf2_low_power_factor_meters m
      JOIN hes_gold.power_factor_deterioration_meters d ON d.meter_no = m.meter_no AND d.data_date = m.data_date
      WHERE m.data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
        AND m.category = 'feeder'
        AND m.severity NOT IN ('Normal', 'NoData') AND m.ageing_days >= 3
        AND d.pf_band = 'Poor'
  - q:
    - 'Voltage Deviation (%) card: how many meters are Critical (>10%) and Warning (5-10%)?'
    note: The hidden Voltage Deviation (%) card = VDI data; statuses from vdi_mean bands.
    sql: |
      SELECT MAX(data_date) AS data_month,
             COUNT(DISTINCT meter_no) AS eligible_meters,
             ROUND(SUM(CASE WHEN status <> 'Offline' THEN vdi_mean * live_blocks END)
                   / NULLIF(SUM(CASE WHEN status <> 'Offline' THEN live_blocks END), 0), 2) AS avg_voltage_deviation_pct,
             COUNT_IF(status <> 'Offline' AND vdi_mean > 10) AS critical_gt_10pct,
             ROUND(COUNT_IF(status <> 'Offline' AND vdi_mean > 10) * 100.0 / COUNT(*), 2) AS critical_pct_of_meters,
             COUNT_IF(status <> 'Offline' AND vdi_mean > 5 AND vdi_mean <= 10) AS warning_5_10pct,
             COUNT_IF(status <> 'Offline' AND vdi_mean <= 5) AS ok_le_5pct,
             COUNT_IF(status = 'Offline') AS offline
      FROM hes_gold.voltage_deviation_index
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

# Group D -- Operation Parameters reliability cards. Same shape as gmr_agents/catalog/data/examples.yaml (q / note / sql).
# Every SQL below was run live 10 Nov 2026 (verify_examples.py in this folder) and returns the dashboard figure
# (default month = July 2026: the latest month with >= 10 days of readings).
  - q: ["What are SAIDI, SAIFI, CAIDI, CAIFI and MAIFI?", "reliability indices", "SAIDI SAIFI CAIDI for this month", "show the reliability index tiles"]
    note: "SAIDI/SAIFI/CAIDI/CAIFI/MAIFI cards: every index re-derived from summed raw totals over all feeders (never AVG of the feeder ratios). July 2026: 4,976 feeders, SAIDI 3,004.44 min, SAIFI 67.12, CAIDI 44.76 min, CAIFI 73.49, MAIFI 0.0009."
    sql: |
      SELECT MAX(data_date) AS data_month, COUNT(*) AS feeders, SUM(total_consumers) AS consumers,
             SUM(events) AS interruptions,
             ROUND(SUM(dur) / NULLIF(SUM(total_consumers), 0), 2) AS saidi_min,
             ROUND(SUM(events) * 1.0 / NULLIF(SUM(total_consumers), 0), 2) AS saifi,
             ROUND(SUM(dur) / NULLIF(SUM(events), 0), 2) AS caidi_min,
             ROUND(SUM(events) * 1.0 / NULLIF(SUM(affected), 0), 2) AS caifi,
             ROUND(SUM(momentary) * 1.0 / NULLIF(SUM(total_consumers), 0), 4) AS maifi
      FROM hes_gold.reliability_indices
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

  - q: ["What is the SAIDI in Kashi?", "SAIDI for Kashi project", "Kashi reliability indices"]
    note: "Project = cluster ('Agra' / 'Kashi' / 'Triveni') on reliability_indices. Kashi July: 1,304 feeders, SAIDI 2,738.47 min, SAIFI 65.40."
    sql: |
      SELECT MAX(data_date) AS data_month, COUNT(*) AS feeders, SUM(total_consumers) AS consumers,
             ROUND(SUM(dur) / NULLIF(SUM(total_consumers), 0), 2) AS saidi_min,
             ROUND(SUM(events) * 1.0 / NULLIF(SUM(total_consumers), 0), 2) AS saifi,
             ROUND(SUM(dur) / NULLIF(SUM(events), 0), 2) AS caidi_min,
             ROUND(SUM(events) * 1.0 / NULLIF(SUM(affected), 0), 2) AS caifi,
             ROUND(SUM(momentary) * 1.0 / NULLIF(SUM(total_consumers), 0), 4) AS maifi
      FROM hes_gold.reliability_indices
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
        AND LOWER(cluster) = 'kashi'

  - q: ["SAIDI circle-wise", "SAIDI by circle", "which circle has the worst SAIDI", "reliability comparison by circle"]
    note: "Card chart 'Comparison by Circle' (it plots SAIDI on all five index boards): per circle SUM(dur)/SUM(total_consumers), worst first, 12 bars. July worst: EDC KASGANJ 4,675.00 min."
    sql: |
      SELECT MAX(data_date) AS data_month, circle, COUNT(*) AS feeders,
             ROUND(SUM(dur) / NULLIF(SUM(total_consumers), 0), 2) AS saidi_min,
             ROUND(SUM(events) * 1.0 / NULLIF(SUM(total_consumers), 0), 2) AS saifi,
             ROUND(SUM(dur) / NULLIF(SUM(events), 0), 2) AS caidi_min
      FROM hes_gold.reliability_indices
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
        AND circle IS NOT NULL
      GROUP BY circle
      ORDER BY saidi_min DESC
      LIMIT 12

  - q: ["Monthly reliability indices trend", "reliability trends monthly chart", "SAIDI month-wise", "how has SAIFI changed month by month"]
    note: "Reliability Trends (Monthly Chart): one point per month re-derived from summed totals. Outage data: June = Agra only (6 days), July = all projects (12 days), August = none (indices 0) -- say so; only July is complete."
    sql: |
      SELECT data_date AS data_month, COUNT(*) AS feeders, SUM(events) AS interruptions,
             ROUND(SUM(dur) / NULLIF(SUM(total_consumers), 0), 2) AS saidi_min,
             ROUND(SUM(events) * 1.0 / NULLIF(SUM(total_consumers), 0), 2) AS saifi,
             ROUND(SUM(dur) / NULLIF(SUM(events), 0), 2) AS caidi_min,
             ROUND(SUM(events) * 1.0 / NULLIF(SUM(affected), 0), 2) AS caifi,
             ROUND(SUM(momentary) * 1.0 / NULLIF(SUM(total_consumers), 0), 4) AS maifi
      FROM hes_gold.reliability_indices
      WHERE data_date BETWEEN DATE '2026-06-01' AND DATE '2026-08-01'
      GROUP BY data_date
      ORDER BY data_date

  - q: ["Worst 10 feeders by SAIDI", "top 10 feeders with highest SAIDI", "which feeders have the worst reliability"]
    note: "Reliability Trends 'Worst 10 Feeders' panel: feeders with >= 100 consumers only (NOT below_min_consumers, the board's default tick), sorted on the feeder's own index. July worst: 21703324595GAR (GARHI) SAIDI 11,160.22."
    sql: |
      SELECT data_date AS data_month, feeder_code, feeder_name, zone, circle, total_consumers,
             saidi, saifi, caidi, caifi, maifi
      FROM hes_gold.reliability_indices
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
        AND NOT below_min_consumers
