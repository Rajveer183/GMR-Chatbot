  - q: ["Reliability improvement trend", "reliability improvement % for SAIDI SAIFI CAIDI", "is reliability improving"]
    note: "Reliability Improvement Trend card for July holds TWO comparisons: 'months' (June vs July) and 'halves' (July 1-15 vs 16-31). Card bars = plain AVG of each feeder's *_improvement_pct per comparison; the tile mixes both (row-weighted). Positive = improved. July: months SAIDI -311.53%, halves +25.38%, tile -144.94%. Quote per comparison and say June held only Agra's outages."
    sql: |
      WITH g AS (
        SELECT comparison_mode, MAX(comparison_label) AS comparison, COUNT(*) AS feeders,
               ROUND(AVG(saidi_improvement_pct), 3) AS saidi, ROUND(AVG(saifi_improvement_pct), 3) AS saifi,
               ROUND(AVG(caidi_improvement_pct), 3) AS caidi
        FROM hes_gold.reliability_improvement_trends
        WHERE data_date >= (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND data_date < DATE_ADD('month', 1, (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c))
        GROUP BY comparison_mode)
      SELECT comparison_mode, comparison, feeders, ROUND(saidi, 2) AS avg_saidi_improvement_pct,
             ROUND(saifi, 2) AS avg_saifi_improvement_pct, ROUND(caidi, 2) AS avg_caidi_improvement_pct
      FROM g
      UNION ALL
      SELECT 'card tile (both comparisons)', NULL, SUM(feeders), ROUND(SUM(saidi * feeders) / SUM(feeders), 2),
             ROUND(SUM(saifi * feeders) / SUM(feeders), 2), ROUND(SUM(caidi * feeders) / SUM(feeders), 2)
      FROM g

  - q: ["Did SAIDI improve from the first half to the second half of July?", "first half vs second half July reliability", "fleet SAIDI before and after"]
    note: "Fleet-level before/after re-derived from sums (SUM(prev_saidi*prev_total_consumers)/SUM(prev_total_consumers)). July halves: SAIDI 1,709.82 -> 1,169.25 min (31.62% better); SAIFI 41.66 -> 28.19. 4,291 feeders improved, 560 worsened."
    sql: |
      SELECT comparison_label, COUNT(*) AS feeders,
             ROUND(SUM(prev_saidi * prev_total_consumers) / SUM(prev_total_consumers), 2) AS before_saidi_min,
             ROUND(SUM(curr_saidi * curr_total_consumers) / SUM(curr_total_consumers), 2) AS after_saidi_min,
             ROUND((SUM(prev_saidi * prev_total_consumers) / SUM(prev_total_consumers)
                    - SUM(curr_saidi * curr_total_consumers) / SUM(curr_total_consumers)) * 100.0
                   / NULLIF(SUM(prev_saidi * prev_total_consumers) / SUM(prev_total_consumers), 0), 2) AS saidi_improvement_pct,
             ROUND(SUM(prev_saifi * prev_total_consumers) / SUM(prev_total_consumers), 2) AS before_saifi,
             ROUND(SUM(curr_saifi * curr_total_consumers) / SUM(curr_total_consumers), 2) AS after_saifi,
             COUNT_IF(saidi_delta > 0) AS feeders_improved, COUNT_IF(saidi_delta < 0) AS feeders_worsened
      FROM hes_gold.reliability_improvement_trends
      WHERE comparison_mode = 'halves' AND data_date >= DATE '2026-07-01' AND data_date < DATE '2026-08-01'
      GROUP BY comparison_label

# Group F -- verified examples (Athena, 6/10 Nov 2026). Append under examples.yaml `examples:`.
  - q: ["What is the feeder loss %?", "feeder loss percentage", "average feeder loss", "total feeder input and output in MU"]
    note: "Card Feeder Loss (%) tiles: all feeders in scope; average loss = SUM(loss_kwh) / SUM(net_input), never AVG(loss_pct). July 2026: 61.42%, credible 1.29%."
    sql: |
      SELECT MAX(data_date) AS data_month,
             COUNT(*) AS feeders,
             ROUND(SUM(net_input) / 1e6, 2) AS input_mu,
             ROUND(SUM(asset_billed) / 1e6, 2) AS output_mu,
             ROUND(SUM(loss_kwh) / 1e6, 2) AS energy_gap_mu,
             ROUND(SUM(loss_kwh) * 100.0 / NULLIF(SUM(net_input), 0), 2) AS average_loss_pct,
             COUNT_IF(loss_credible) AS credible_feeders,
             ROUND(COUNT_IF(loss_credible) * 100.0 / COUNT(*), 2) AS credible_pct,
             ROUND(SUM(added_kwh) / 1e6, 2) AS added_mu
      FROM hes_gold.feeder_loss
      WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

