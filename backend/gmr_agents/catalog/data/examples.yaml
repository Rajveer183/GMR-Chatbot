  - q: ["Mapping audit in July 2026", "What was the mapping accuracy in July 2026?", "confirmed and reassigned in a named audit month"]
    note: "One named month = data_date = DATE '2026-07-01' (months stored: 2026-06-01, 2026-07-01, 2026-08-01)."
    sql: |
      SELECT data_date AS audit_month, SUM(consumer_count) AS meters_audited,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'CONFIRMED'), 0) AS confirmed,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN'), 0) AS reassigned,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW'), 0) AS review,
             COALESCE(SUM(consumer_count) FILTER (WHERE verdict = 'NO DATA'), 0) AS no_data,
             ROUND(COALESCE(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')), 0) * 100.0 / SUM(consumer_count), 1) AS mapping_accuracy_pct
      FROM hes_gold.mapping_audit_summary
      WHERE data_date = DATE '2026-07-01'
      GROUP BY data_date

  - q: ["How has mapping accuracy changed month wise?", "how did mapping accuracy change from June to August", "mapping audit month wise"]
