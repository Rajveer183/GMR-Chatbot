  - q:
    - Forecast the number of low power factor meters for next month
    - predict low PF meters in September / October
    - low power factor projection if the trend continues
    note: "Forecast: HES data runs June-August 2026 and August holds only 2-3 days. Show the actual months, then the projection as its own row: July + k x (July - June), k = months after July (September = 2). Say it is a straight-line projection from June -> July (August partial, not used); Low PF months are trailing 90-day windows, so it is indicative. Never query the empty month."
    sql: |
      WITH m AS (
        SELECT data_date, SUM(unique_meter_count) AS meters
        FROM hes_gold.lpf2_low_power_factor
        WHERE severity NOT IN ('Normal', 'NoData') AND data_date BETWEEN DATE '2026-06-01' AND DATE '2026-08-01'
        GROUP BY data_date)
      SELECT month_label, low_pf_meters, basis
      FROM (
        SELECT data_date AS sort_month, date_format(data_date, '%b %Y') AS month_label, meters AS low_pf_meters,
               CASE WHEN data_date = DATE '2026-08-01' THEN 'actual (partial, 2-3 days)' ELSE 'actual' END AS basis
        FROM m
        UNION ALL
        SELECT DATE '2026-09-01', 'Sep 2026',
               (SELECT meters FROM m WHERE data_date = DATE '2026-07-01')
                 + 2 * ((SELECT meters FROM m WHERE data_date = DATE '2026-07-01')
                        - (SELECT meters FROM m WHERE data_date = DATE '2026-06-01')),
               'projected (June -> July trend)') t
      ORDER BY sort_month
