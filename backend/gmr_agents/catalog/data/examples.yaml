  - q: ["Show meters journey avg time across the levels for revenue realized", "journey time stage wise", "average days at each level of the meter journey", "lead time per stage", "journey avg time for one year or category"]
    note: "'levels' = the six journey stages + Total Journey, one row each in workflow order (bars like the dashboard's Workflow Lead Time card). Each stage keeps its own denominator; meters = the meters behind it (DI to Agency's = the card's Total Meters). Filters (project, category, installation_year = 2025) go inside s."
    sql: |
      WITH s AS (
        SELECT SUM(inventory_to_agency_days_sum) AS di_agency, SUM(agency_to_supervisor_days_sum) AS agency_sup,
               SUM(supervisor_to_technician_days_sum) AS sup_tech, SUM(technician_to_installation_days_sum) AS tech_inst,
               SUM(meter_count) AS meters, SUM(installation_to_sat_days_sum) AS inst_sat, SUM(sat_meter_count) AS sat_meters,
               SUM(sat_to_revenue_realized_days_sum) AS sat_rev, SUM(total_journey_days_sum) AS total_days,
               SUM(revenue_realized_meter_count) AS rev_meters
        FROM public.gold_meter_journey_stage_agg)
      SELECT v.stage, v.avg_days, v.meters
      FROM s CROSS JOIN LATERAL (VALUES
        (1, 'DI to Agency', ROUND(s.di_agency / NULLIF(s.meters, 0), 2), s.meters),
        (2, 'Agency to Supervisor', ROUND(s.agency_sup / NULLIF(s.meters, 0), 2), s.meters),
        (3, 'Supervisor to Technician', ROUND(s.sup_tech / NULLIF(s.meters, 0), 2), s.meters),
        (4, 'Technician to Installation', ROUND(s.tech_inst / NULLIF(s.meters, 0), 2), s.meters),
        (5, 'Installation to SAT', ROUND(s.inst_sat / NULLIF(s.sat_meters, 0), 2), s.sat_meters),
        (6, 'SAT to Revenue', ROUND(s.sat_rev / NULLIF(s.rev_meters, 0), 2), s.rev_meters),
        (7, 'Total Journey', ROUND(s.total_days / NULLIF(s.rev_meters, 0), 2), s.rev_meters)) AS v(ord, stage, avg_days, meters)
      ORDER BY v.ord

  - q: ["how many days does each step of the meter journey take in agra zone wise", "journey levels zone wise", "journey time per stage category wise", "average days at each level by division"]
    note: "Stages BY a dimension: one row per zone (Total first), the six stages + total_journey as columns -- not one row per zone x stage."
    sql: |
      SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total'
                  WHEN zone IS NULL OR zone = '' THEN 'Unmapped' ELSE UPPER(zone) END AS zone,
             ROUND(SUM(inventory_to_agency_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS di_to_agency,
             ROUND(SUM(agency_to_supervisor_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS agency_to_supervisor,
             ROUND(SUM(supervisor_to_technician_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS supervisor_to_technician,
             ROUND(SUM(technician_to_installation_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS technician_to_installation,
             ROUND(SUM(installation_to_sat_days_sum) / NULLIF(SUM(sat_meter_count), 0), 2) AS installation_to_sat,
             ROUND(SUM(sat_to_revenue_realized_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS sat_to_revenue,
             ROUND(SUM(total_journey_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS total_journey,
             SUM(meter_count) AS total_meters
      FROM public.gold_meter_journey_stage_agg
      WHERE LOWER(project) = 'agra'
      GROUP BY ROLLUP (zone)
      ORDER BY GROUPING(zone) DESC, total_meters DESC

  - q: ["Meters Journey Avg time across the levels for Revenue realized (Total & Category wise)", "Meter journey avg time category wise", "Which category has the longest total journey?", "average journey time for DT meters", "Total journey avg time by category for 2026"]
    note: "The card's Total & Category view: a Total row plus one row per category (CONSUMER, DT, FEEDER), the six stages + total_journey as columns, in days. Replacements included (no is_replacement filter); a year = WHERE installation_year = 2026. Not the home tile's Consumer vs Non-consumer split."
    sql: |
      SELECT CASE WHEN GROUPING(category) = 1 THEN 'Total' ELSE category END AS category,
             ROUND(SUM(inventory_to_agency_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS di_to_agency,
             ROUND(SUM(agency_to_supervisor_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS agency_to_supervisor,
             ROUND(SUM(supervisor_to_technician_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS supervisor_to_technician,
             ROUND(SUM(technician_to_installation_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS technician_to_installation,
             ROUND(SUM(installation_to_sat_days_sum) / NULLIF(SUM(sat_meter_count), 0), 2) AS installation_to_sat,
             ROUND(SUM(sat_to_revenue_realized_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS sat_to_revenue,
             ROUND(SUM(total_journey_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS total_journey,
             SUM(meter_count) AS total_meters
      FROM public.gold_meter_journey_stage_agg
      GROUP BY ROLLUP (category)
      ORDER BY GROUPING(category) DESC, category

  - q: ["Which circle has the slowest SAT to revenue time in agra?", "fastest zone for one journey stage", "rank divisions by installation to SAT time", "which project has the longest installation to SAT time"]
    note: "Ranking one stage by place: that stage's ratio with ITS denominator (SAT to Revenue / Total Journey over revenue_realized_meter_count, Installation to SAT over sat_meter_count, the first four over meter_count), Total row first, ranked."
    sql: |
      SELECT CASE WHEN GROUPING(circle) = 1 THEN 'Total' ELSE UPPER(circle) END AS circle,
             ROUND(SUM(sat_to_revenue_realized_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS sat_to_revenue_days,
             SUM(revenue_realized_meter_count) AS revenue_realized_meters
      FROM public.gold_meter_journey_stage_agg
      WHERE LOWER(project) = 'agra'
      GROUP BY ROLLUP (circle)
      ORDER BY GROUPING(circle) DESC, sat_to_revenue_days DESC

  - q: ["Journey of meters AL1151970 and AL3188371", "lifecycle of two meters", "timeline of meters X and Y", "compare the journey of these meters"]
    note: "Several meters (up to 5): one row per meter -- ROW_NUMBER() per serial in each source, never LIMIT 1. Revenue realized = the batch's PMPM collection date; days_* columns give each step."
    sql: |
      WITH inv AS (SELECT meter_serial_number, di_date, gmr_to_agency_ts, agency_to_sup_ts, sup_to_tech_ts,
                          ROW_NUMBER() OVER (PARTITION BY meter_serial_number ORDER BY updated_at DESC) AS rn
                   FROM gmr_wfm_silver.unified_smart_meter_inventory WHERE meter_serial_number IN ('AL1151970', 'AL3188371')),
           mi AS (SELECT new_meter_serial_number, consumer_number, mi_date, report_category, new_meter_type, project, zone,
                         ROW_NUMBER() OVER (PARTITION BY new_meter_serial_number ORDER BY updated_at DESC) AS rn
                  FROM gmr_wfm_silver.unified_installations WHERE new_meter_serial_number IN ('AL1151970', 'AL3188371')),
           sat AS (SELECT m.meter_serial_number, m.sat_number, s.sat_date, s.pmpm_invoice_date, s.pmpm_collection_date,
                          ROW_NUMBER() OVER (PARTITION BY m.meter_serial_number ORDER BY m.updated_at DESC) AS rn
                   FROM gmr_wfm_silver.sat_meter_mappings m
                   LEFT JOIN gmr_wfm_silver.sat_milestones s ON s.project = m.project AND s.sat_number = m.sat_number
                   WHERE m.meter_serial_number IN ('AL1151970', 'AL3188371'))
      SELECT COALESCE(mi.new_meter_serial_number, inv.meter_serial_number, sat.meter_serial_number) AS meter_serial,
             mi.consumer_number, mi.report_category AS category, mi.new_meter_type AS meter_type, mi.project, mi.zone,
             inv.di_date AS supplied_on, inv.gmr_to_agency_ts AS issued_to_agency_at, inv.agency_to_sup_ts AS issued_to_supervisor_at,
             inv.sup_to_tech_ts AS issued_to_technician_at, mi.mi_date AS installed_on, sat.sat_number, sat.sat_date,
             sat.pmpm_invoice_date, sat.pmpm_collection_date AS revenue_realized_on,
             date_diff('day', CAST(inv.di_date AS date), CAST(inv.gmr_to_agency_ts AS date)) AS days_di_to_agency,
             date_diff('day', CAST(inv.di_date AS date), CAST(mi.mi_date AS date)) AS days_supply_to_install,
             date_diff('day', CAST(mi.mi_date AS date), CAST(sat.sat_date AS date)) AS days_install_to_sat,
             date_diff('day', CAST(sat.sat_date AS date), CAST(sat.pmpm_collection_date AS date)) AS days_sat_to_revenue
      FROM (SELECT * FROM mi WHERE rn = 1) mi
      FULL OUTER JOIN (SELECT * FROM inv WHERE rn = 1) inv ON inv.meter_serial_number = mi.new_meter_serial_number
      FULL OUTER JOIN (SELECT * FROM sat WHERE rn = 1) sat ON sat.meter_serial_number = COALESCE(mi.new_meter_serial_number, inv.meter_serial_number)
      ORDER BY meter_serial

  - q: ["how long has meter HP8500592 been waiting for sat", "is meter HP9000628 sat done", "SAT status of one meter", "since when is this meter pending SAT"]
    note: "One meter: its install row LEFT JOIN its SAT mapping LEFT JOIN its batch's sat_milestones (project AND sat_number) -- a meter with no SAT batch is still found. Say the SAT number and SAT date when done; waiting days = today - mi_date while no SAT batch."
    sql: |
      SELECT i.new_meter_serial_number AS meter_serial, i.mi_date AS installed_on, i.project, i.zone,
             m.sat_number, s.sat_date,
             CASE WHEN m.sat_number IS NULL THEN 'Waiting for SAT' ELSE 'SAT done' END AS sat_status,
             CASE WHEN m.sat_number IS NULL THEN date_diff('day', CAST(i.mi_date AS date), current_date) END AS days_waiting_since_install
      FROM (SELECT new_meter_serial_number, mi_date, project, zone FROM gmr_wfm_silver.unified_installations
            WHERE new_meter_serial_number = 'HP8500592' ORDER BY updated_at DESC LIMIT 1) i
      LEFT JOIN (SELECT meter_serial_number, sat_number, project FROM gmr_wfm_silver.sat_meter_mappings
                 WHERE meter_serial_number = 'HP8500592' ORDER BY updated_at DESC LIMIT 1) m
             ON m.meter_serial_number = i.new_meter_serial_number
      LEFT JOIN gmr_wfm_silver.sat_milestones s ON s.project = m.project AND s.sat_number = m.sat_number

  - q: ["is meter HP9000628 invoiced", "has meter X been billed", "invoice status of one meter", "lumpsum and PMPM invoice dates of a meter"]
    note: "A meter is invoiced when its SAT batch carries an invoice date (sat_milestones on project AND sat_number) -- read the dates, never infer from snapshot counts. No SAT batch = not invoiced because SAT is not done."
    sql: |
      SELECT i.new_meter_serial_number AS meter_serial, i.project, m.sat_number, s.sat_date,
             CASE WHEN s.lumpsum_invoice_date IS NOT NULL OR s.pmpm_invoice_date IS NOT NULL THEN 'Invoiced'
                  WHEN m.sat_number IS NULL THEN 'Not invoiced (SAT not done yet)'
                  ELSE 'Not invoiced (SAT batch not invoiced yet)' END AS invoice_status,
             s.lumpsum_invoice_date, s.lumpsum_collection_date, s.pmpm_invoice_date, s.pmpm_collection_date
      FROM (SELECT new_meter_serial_number, project FROM gmr_wfm_silver.unified_installations
            WHERE new_meter_serial_number = 'HP9000628' ORDER BY updated_at DESC LIMIT 1) i
      LEFT JOIN (SELECT meter_serial_number, sat_number, project FROM gmr_wfm_silver.sat_meter_mappings
                 WHERE meter_serial_number = 'HP9000628' ORDER BY updated_at DESC LIMIT 1) m
             ON m.meter_serial_number = i.new_meter_serial_number
      LEFT JOIN gmr_wfm_silver.sat_milestones s ON s.project = m.project AND s.sat_number = m.sat_number

  - q: ["is meter CA8081038 eligible for sat", "is this meter due for SAT", "SAT eligibility of one meter"]
    note: "Eligible = installed on or before its project's SAT cutoff (public.sat_eligibility_config, Postgres -- the extra query). Main query = the meter itself (Athena); compare its installed_on with its project's cutoff and say both dates."
    sql: |
      SELECT i.new_meter_serial_number AS meter_serial, i.mi_date AS installed_on, LOWER(i.project) AS project,
             i.report_category AS category, m.sat_number
      FROM (SELECT new_meter_serial_number, mi_date, project, report_category FROM gmr_wfm_silver.unified_installations
            WHERE new_meter_serial_number = 'CA8081038' ORDER BY updated_at DESC LIMIT 1) i
      LEFT JOIN (SELECT meter_serial_number, sat_number FROM gmr_wfm_silver.sat_meter_mappings
                 WHERE meter_serial_number = 'CA8081038' ORDER BY updated_at DESC LIMIT 1) m
             ON m.meter_serial_number = i.new_meter_serial_number
    extra:
      - purpose: "SAT eligibility cutoff date per project"
        sql: |
          SELECT project, eligibility_cutoff_date FROM public.sat_eligibility_config ORDER BY project

  - q: ["was meter HP8500592 replaced and why", "has meter X been replaced", "which meter replaced X", "replacement reason of a meter"]
    note: "Replaced = some installation lists the meter as old_meter_number (reason = that row's old_meter_status). The meter's own install row lists the OLD meter it replaced -- that is the other direction: never say 'X was replaced with <its old meter>'. No 'replaced by' row = not replaced."
    sql: |
      SELECT r.meter_role, r.other_meter, r.reason_recorded, r.on_date, r.project, r.zone, r.technician
      FROM (SELECT 'replaced by a newer meter' AS meter_role, new_meter_serial_number AS other_meter,
                   old_meter_status AS reason_recorded, mi_date AS on_date, project, zone, technician_name AS technician, updated_at
            FROM gmr_wfm_silver.unified_installations WHERE old_meter_number = 'HP8500592'
            UNION ALL
            SELECT 'installed in place of an old meter', old_meter_number, old_meter_status, mi_date, project, zone, technician_name, updated_at
            FROM gmr_wfm_silver.unified_installations WHERE new_meter_serial_number = 'HP8500592') r
      ORDER BY r.updated_at DESC

  - q: ["How many installed meters have not yet cleared SAT?", "how many meters are sat pending in Kashi", "meters pending SAT", "SAT pending meters", "feeder meters without sat", "meters without SAT", "how many meters not SAT done"]
    suggest: "How many installed meters have not yet cleared SAT?"
    note: "installed_not_sat from public.gold_mi_sat_invoice_snapshot (= MI - SAT on the MI vs SAT card); eligible_pending_sat = the Non-SAT Ageing card's total (gold_non_sat_ageing_snapshot); a place / category goes on the outer query AND both subqueries (Kashi: LOWER(project) = 'kashi' three times); not_yet_due = the difference. The answer is installed_not_sat_total; the two 'of_which' columns are its parts (they add up to it) -- never add them to it, and never call the total 'eligible'."
    sql: |
      SELECT SUM(meter_count) AS total_mi,
             SUM(meter_count) FILTER (WHERE sat_stage IS NULL) AS installed_not_sat_total,
             (SELECT SUM(meter_count) FROM public.gold_non_sat_ageing_snapshot) AS of_which_eligible_pending_sat,
             SUM(meter_count) FILTER (WHERE sat_stage IS NULL)
               - (SELECT SUM(meter_count) FROM public.gold_non_sat_ageing_snapshot) AS of_which_not_yet_due
      FROM public.gold_mi_sat_invoice_snapshot

  - q: ["SAT pending less than 60 days", "non-SAT meters younger than 90 days", "meters waiting for SAT under 30 days"]
    note: "Under N days = only the bands below N. The answer is pending_under_60_days (0 today: every non-SAT meter is 91+ days -- ages freeze at the snapshot's cutoffs); all_non_sat_meters is context only, never 'under 60 days'."
    sql: |
      SELECT COALESCE(SUM(meter_count) FILTER (WHERE age_key IN ('age_0_30', 'age_31_60')), 0) AS pending_under_60_days,
             COALESCE(SUM(meter_count) FILTER (WHERE age_key = 'age_0_30'), 0) AS days_0_30,
             COALESCE(SUM(meter_count) FILTER (WHERE age_key = 'age_31_60'), 0) AS days_31_60,
             SUM(meter_count) AS all_non_sat_meters
      FROM public.gold_non_sat_ageing_snapshot

  - q: ["Which project is worst on pending SAT?", "which project has most meters pending SAT", "SAT pending project-wise"]
    suggest: "Which project is worst on pending SAT?"
    note: "'Worst' = highest eligible pending as % of its installed meters (pending_pct_of_mi); eligible pending = the Non-SAT Ageing card. Also give the count, and say if a different project has the higher count."
    sql: |
      SELECT CASE WHEN GROUPING(u.project) = 1 THEN 'Total' ELSE UPPER(u.project) END AS project,
             SUM(u.mi) AS total_mi, SUM(u.pending) AS eligible_pending_sat,
             ROUND(SUM(u.pending) * 100.0 / NULLIF(SUM(u.mi), 0), 2) AS pending_pct_of_mi,
             SUM(u.not_sat) AS installed_not_sat
      FROM (SELECT LOWER(project) AS project, meter_count AS mi, 0 AS pending,
                   CASE WHEN sat_stage IS NULL THEN meter_count ELSE 0 END AS not_sat
            FROM public.gold_mi_sat_invoice_snapshot
            UNION ALL
            SELECT LOWER(project), 0, meter_count, 0 FROM public.gold_non_sat_ageing_snapshot) u
      GROUP BY ROLLUP (u.project)
      ORDER BY GROUPING(u.project) DESC, pending_pct_of_mi DESC

  - q: ["SAT percentage against eligible MI for Agra", "eligible sat % in Kashi", "SAT % vs eligible MI", "how much of eligible MI has SAT done", "SAT progress against eligible meters"]
    note: "% SAT vs eligible MI = ALL SAT meters (sat_stage IS NOT NULL, eligible or not) / eligible MI -- the dashboard formula, can exceed 100%. Never SAT(eligible) / eligible. Show both percentages."
    sql: |
      SELECT SUM(meter_count) AS total_mi,
             COALESCE(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0) AS eligible_mi,
             COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS total_sat,
             ROUND(COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) * 100.0
                   / NULLIF(SUM(meter_count), 0), 2) AS sat_pct_vs_mi,
             ROUND(COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0), 2) AS sat_pct_vs_eligible
      FROM public.gold_mi_sat_invoice_snapshot
      WHERE LOWER(project) = 'agra'

  - q: ["MI vs SAT vs invoice funnel", "invoice funnel project wise", "installed to SAT to invoiced funnel", "lumpsum and PMPM invoiced vs SAT", "Lumpsum invoice percentage by project", "Explain the MI vs SAT vs invoice funnel"]
    note: "The funnel card: installed, SAT done, lumpsum invoiced and PMPM invoiced, each invoice count also as % of SAT done (never of installed, never summed). 'Lumpsum / PMPM invoice percentage' = this % of SAT (meters), not the rupee % realised. Drop the project ROLLUP when no breakdown is asked. Every category unless one is asked (an explanation uses all meters). Never exclude a meter type (OTHER-Consumer_meter, NULL) the question did not."
    sql: |
      SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
             SUM(meter_count) AS installed,
             COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS sat_done,
             COALESCE(SUM(meter_count) FILTER (WHERE has_lumpsum_invoice), 0) AS lumpsum_invoiced,
             ROUND(COALESCE(SUM(meter_count) FILTER (WHERE has_lumpsum_invoice), 0) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0), 2) AS lumpsum_pct_of_sat,
             COALESCE(SUM(meter_count) FILTER (WHERE has_pmpm_invoice), 0) AS pmpm_invoiced,
             ROUND(COALESCE(SUM(meter_count) FILTER (WHERE has_pmpm_invoice), 0) * 100.0
                   / NULLIF(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0), 2) AS pmpm_pct_of_sat
      FROM public.gold_mi_sat_invoice_snapshot
      GROUP BY ROLLUP (project)
      ORDER BY GROUPING(project) DESC, installed DESC

  - q: ["Revenue not realized ageing project wise", "revenue not realized ageing for Agra", "revenue ageing by project", "uncollected PMPM meters by age project wise"]
    note: "Ageing = public.gold_revenue_ageing_snapshot (SAT done, PMPM not collected), never the current-stage tables. A project with no rows has 0 such meters (its PMPM collection arrived -- Agra today): list it as 0, never 'no data'. These are METER counts -- never Rs / crore / 'revenue of 157,979'."
    sql: |
      SELECT p.project, COALESCE(SUM(s.outstanding_count), 0) AS meters_revenue_not_realized,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) <= 30), 0) AS days_0_30,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) BETWEEN 31 AND 60), 0) AS days_31_60,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) BETWEEN 61 AND 90), 0) AS days_61_90,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) BETWEEN 91 AND 120), 0) AS days_91_120,
             COALESCE(SUM(s.outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - s.sat_date, 0) > 120), 0) AS days_120_plus
      FROM (VALUES (1, 'Total', NULL), (2, 'AGRA', 'agra'), (3, 'KASHI', 'kashi'), (4, 'TRIVENI', 'triveni')) AS p(ord, project, key)
      LEFT JOIN public.gold_revenue_ageing_snapshot s ON p.key IS NULL OR LOWER(s.project) = p.key
      GROUP BY p.ord, p.project
      ORDER BY p.ord

  - q: ["Revenue not realized ageing zone wise for kashi", "revenue ageing circle wise", "revenue ageing zone wise", "revenue not realized ageing by division"]
    note: "Place-wise revenue ageing: GROUP BY ROLLUP (zone) on the column itself (values lower-case), bands as columns, Total row first."
    sql: |
      SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total' ELSE UPPER(zone) END AS zone,
             SUM(outstanding_count) AS meters,
             COALESCE(SUM(outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) <= 30), 0) AS days_0_30,
             COALESCE(SUM(outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) BETWEEN 31 AND 60), 0) AS days_31_60,
             COALESCE(SUM(outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) BETWEEN 61 AND 90), 0) AS days_61_90,
             COALESCE(SUM(outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) BETWEEN 91 AND 120), 0) AS days_91_120,
             COALESCE(SUM(outstanding_count) FILTER (WHERE GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) > 120), 0) AS days_120_plus
      FROM public.gold_revenue_ageing_snapshot
      WHERE LOWER(project) = 'kashi'
      GROUP BY ROLLUP (zone)
      ORDER BY GROUPING(zone) DESC, meters DESC

  - q: ["How many meters are outstanding older than 90 days in triveni?", "revenue outstanding for more than 60 days", "meters with revenue pending 61-90 days", "revenue not realized older than 45 days for DT meters"]
    note: "Any age threshold on the revenue ageing snapshot (age = today - sat_date, never below 0) -- not the non-SAT ageing table. A band with no meters is answered 0."
