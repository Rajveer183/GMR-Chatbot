          FROM gmr_wfm_silver.unified_discom_escalations d
          WHERE NULLIF(TRIM(d.ticket_id), '') IS NOT NULL AND d.escalated_on IS NOT NULL
      )
      SELECT status, COUNT(*) AS tickets_decided,
             ROUND(AVG(date_diff('second', escalated_on, escalation_attended_on) / 86400.0), 2) AS avg_days_to_decide
      FROM latest
      WHERE rk = 1 AND escalation_attended_on >= escalated_on
        AND CAST(escalation_attended_on AT TIME ZONE 'Asia/Kolkata' AS date) BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
