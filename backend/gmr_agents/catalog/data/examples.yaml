  - q: ["How many HTCT meters installed from January 2026 to June 2026", "LTCT meters installed in a month", "how many 3 phase meters were installed"]
    note: "A bare meter type = inventory_meter_type across ALL categories (HTCT meters sit in CONSUMER and FEEDER, LTCT in CONSUMER and DT) -- no progress_category filter unless the question says consumer / DT / feeder."
    sql: |
      SELECT SUM(meter_count) AS htct_meters_installed
      FROM public.gold_mi_installation_month_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        AND inventory_meter_type = 'HTCT-Consumer_meter'
        AND period_start BETWEEN DATE '2026-01-01' AND DATE '2026-06-01'
