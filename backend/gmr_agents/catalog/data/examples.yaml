             COUNT_IF(NOT never_reported) AS stopped_after_reporting
      FROM hes_gold.communication_failures WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND LOWER(cluster) = 'agra'
      GROUP BY zone ORDER BY silent_meters DESC

  - q: ["When did meter AL1516111 last communicate?", "last reading date of meter AL1516111"]
