  # Group E: Overload / MD breach risk, Theft / Load diversion, Theft Analysis cards (hes_gold). Verified live 10 Nov 2026
  # (default month July 2026).
  - q: ["How many consumers are at overload / MD breach risk?", "MD breach risk", "overload risk consumers", "consumers by risk bucket 90-105 106-120 above 120"]
    note: "overload_md_breach holds at-risk consumers only; consumers assessed (and under 90%) come from load_assessed_consumers with the same filters. July: 863,367 at risk of 3,355,803 (25.73%)."
    sql: |
      WITH m AS (SELECT MAX(month_date) AS mon FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c),
           b AS (SELECT COUNT(DISTINCT meter_no) AS at_risk,
                        COUNT(DISTINCT meter_no) FILTER (WHERE risk_bucket = '>120%') AS above_120,
                        COUNT(DISTINCT meter_no) FILTER (WHERE risk_bucket = '106-120%') AS b_106_120,
                        COUNT(DISTINCT meter_no) FILTER (WHERE risk_bucket = '90-105%') AS b_90_105
                 FROM hes_gold.overload_md_breach WHERE data_date = (SELECT mon FROM m)),
           a AS (SELECT SUM(assessed_meters) AS assessed FROM hes_gold.load_assessed_consumers WHERE data_date = (SELECT mon FROM m))
      SELECT (SELECT mon FROM m) AS data_month, assessed, at_risk, above_120, b_106_120, b_90_105,
             assessed - at_risk AS under_90, ROUND(at_risk * 100.0 / NULLIF(assessed, 0), 2) AS pct_at_risk
      FROM b, a

  - q: ["MD breach risk project-wise", "overload risk by project", "which project has the most consumers at MD breach risk"]
    sql: |
      WITH m AS (SELECT MAX(month_date) AS mon FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c),
           b AS (SELECT cluster, COUNT(DISTINCT meter_no) AS at_risk,
                        COUNT(DISTINCT meter_no) FILTER (WHERE risk_bucket = '>120%') AS above_120
                 FROM hes_gold.overload_md_breach WHERE data_date = (SELECT mon FROM m) GROUP BY cluster),
           a AS (SELECT cluster, SUM(assessed_meters) AS assessed FROM hes_gold.load_assessed_consumers
                 WHERE data_date = (SELECT mon FROM m) GROUP BY cluster)
      SELECT (SELECT mon FROM m) AS data_month, b.cluster, a.assessed, b.at_risk, b.above_120,
             ROUND(b.at_risk * 100.0 / NULLIF(a.assessed, 0), 2) AS pct_at_risk
      FROM b JOIN a ON a.cluster = b.cluster
      ORDER BY b.at_risk DESC

  - q: ["Consumers above 120% of sanctioned load circle-wise in Kashi", "MD above 120% by circle in Kashi"]
    sql: |
