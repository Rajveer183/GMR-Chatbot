  - q: ["Is meter AL5998858 showing reverse flow?", "reverse flow status of meter AL5998858"]
    sql: |
      SELECT data_date AS data_month, meter_no, category, smart_meter_type, is_net_meter, has_export,
             ROUND(total_kwh_export, 2) AS total_kwh_export, ROUND(max_kwh_export, 3) AS max_half_hour_export_kwh,
             COALESCE(anomaly_type, 'no anomaly') AS anomaly_type, zone, circle, feeder_code
      FROM hes_gold.reverse_flow WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND meter_no = 'AL5998858'

  - q: ["Data quality issues", "partial days and data completeness", "how many meters have partial days"]
    note: "Card Data Quality Issues (monthly): meters = every meter with readings; partial day = 2-46 of 48 half-hour readings; % tiles are averages per meter."
    sql: |
      SELECT MAX(data_date) AS data_month,
             COUNT(*) AS meters,
             COUNT_IF(partial_days > 0) AS meters_with_partial_days,
             SUM(partial_days) AS partial_days,
             ROUND(AVG(partial_day_pct), 2) AS avg_partial_day_pct,
             ROUND(AVG(avg_completeness_pct), 2) AS avg_completeness_pct
      FROM hes_gold.data_quality_issues WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

  - q: ["Data quality issues week-wise", "partial days weekly view", "weekly data quality"]
    note: "Weekly view reads data_quality_issues_daily (partial meter-days only)."
    sql: |
      SELECT week_label, COUNT(*) AS flagged_meter_days, COUNT(DISTINCT meter_no) AS meters_affected,
             ROUND(AVG(completeness_pct), 2) AS avg_completeness_pct
