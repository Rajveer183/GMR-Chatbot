  - q: ["At the current pace, when will we cross 45 lakh installed meters?", "when will installations reach 4.5 million", "by when will we hit the installation target at this rate", "projected date to reach N meters installed"]
    note: "Projection (kind=data, never unanswerable): installed so far (MI progress filters) and the daily pace = installs in the last 30 full days ending yesterday / 30; days needed = (target - installed) / pace. Say it assumes the recent pace holds."
    sql: |
      WITH so_far AS (
        SELECT SUM(meter_count) AS installed
        FROM public.gold_mi_installation_month_agg
        WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement),
      pace AS (
        SELECT SUM(meter_count) / 30.0 AS per_day
        FROM public.gold_mi_installation_day_agg
        WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
          AND period_start BETWEEN CURRENT_DATE - 30 AND CURRENT_DATE - 1)
      SELECT so_far.installed AS installed_so_far, 4500000 AS target,
             4500000 - so_far.installed AS still_to_install,
             ROUND(pace.per_day::numeric, 0) AS installs_per_day_last_30_days,
             CEIL((4500000 - so_far.installed) / NULLIF(pace.per_day, 0)) AS days_needed,
             CURRENT_DATE + CEIL((4500000 - so_far.installed) / NULLIF(pace.per_day, 0))::int AS projected_date
      FROM so_far, pace
