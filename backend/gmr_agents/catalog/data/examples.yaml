# Verified question -> SQL examples (few-shot "training" bank for the planner).
# Every SQL here was run against the live data and its numbers checked by hand
# (eval/question_bank/verify_examples.py re-runs them all). For each question the
# planner sees the EXAMPLES_PER_QUESTION (3) most similar examples (hybrid retrieval:
# BM25 + embeddings) as worked patterns. Re-read automatically when the file changes.
#
# PROMPT COST MAP (measured 2026-10-04) -- keep each example small:
#   q[0] (first 90 chars)     triage, TRIAGE_EXAMPLE_MENU_SIZE (8) best-ranked     ~25 tok each
#   q[0] + note + sql + extra SQL planner, 3 best-ranked             ~730 tok total (~160 tok sql avg)
#   q[1:], suggest, note      retrieval index (note: first 300 chars) -- free in prompts
#   suggest                   offered follow-ups (no prompt cost)
#   q:      one or more phrasings
#   sql:    the main query
#   extra:  optional extra queries [{purpose, sql}]
#   note:   optional hint the planner should carry over
#   suggest: optional -- the exact question offered as a suggested follow-up. Only
#           examples with `suggest` are ever offered, and each one was asked live
#           and its answer checked; asked verbatim it routes to this example's SQL.
examples:
  - q: ["How many smart meters have been installed so far?", "total meters installed till date", "kitne meter lage ab tak"]
    suggest: "How many smart meters have been installed so far?"
    note: "'smart meters' = all meters. MI progress filters exactly: has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement -- nothing else."
    sql: |
      SELECT SUM(meter_count) AS meters_installed
      FROM public.gold_mi_installation_month_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement

  - q: ["How many meters were installed yesterday?", "kal kitne meter lage", "installs yesterday by category"]
    suggest: "How many meters were installed yesterday?"
    sql: |
      SELECT CURRENT_DATE - 1 AS install_date, SUM(meter_count) AS meters_installed,
             COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'CONSUMER'), 0) AS consumer,
             COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'DT'), 0) AS dtr,
             COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'FEEDER'), 0) AS feeder
      FROM public.gold_mi_installation_day_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
        AND period_start = CURRENT_DATE - 1

  - q: ["Give me the dashboard headlines", "dashboard headline numbers", "home page headlines", "top headline strip"]
    note: "The home-page strip with the card's labels: Supplied, Installed, SAT meters (+ % of eligible MI, rounded up), PMPM Invoiced, PMPM Collected -- all six columns as display cards, nothing else (no installed-last-day, no stock)."
    sql: |
      SELECT total_current_inventory_count AS supplied,
             total_meter_installations AS installed,
             total_sat_meters AS sat_meters,
             CEIL(sat_percent) AS sat_pct_of_eligible_mi,
             total_pmpm_invoice_done_meters AS pmpm_invoiced,
             total_pmpm_collection_done_meters AS pmpm_collected
      FROM public.gold_dashboard_stats_snapshot
      WHERE singleton

  - q: ["Meter installation headline", "installation module headline", "meter installation card on the home page"]
    note: "The Meter-Installation module tile: Total installed and installed on the last complete day (name that date)."
    sql: |
      SELECT s.total_meter_installations AS total_installed,
             s.meter_installed_on_last_day AS installed_on_last_day,
             (SELECT MAX(period_start) FROM public.gold_mi_installation_day_agg
              WHERE NOT is_replacement AND period_start < (NOW() AT TIME ZONE 'Asia/Kolkata')::date) AS last_day
      FROM public.gold_dashboard_stats_snapshot s
      WHERE s.singleton

  - q: ["Supply headline", "supply module headline", "inventory card on the home page"]
    note: "The Supply module tile: Supplied and Remaining stock."
    sql: |
      SELECT total_current_inventory_count AS supplied,
             total_current_remaining_stock_count AS remaining_stock
      FROM public.gold_dashboard_stats_snapshot
      WHERE singleton

  - q: ["O&M headline", "O&M module headline", "O&M card on the home page"]
    note: "The O&M module tile: Open tickets (every row of the open snapshot) and tickets closed on the last complete day (closed date before today; name that date)."
    sql: |
      WITH c AS (SELECT closed_date, SUM(closed_tickets) AS closed
                 FROM public.gold_om_closed_tickets_day_agg
                 WHERE closed_date < (NOW() AT TIME ZONE 'Asia/Kolkata')::date
                 GROUP BY closed_date)
      SELECT (SELECT SUM(ticket_count) FROM public.gold_om_open_ageing_snapshot) AS open_tickets,
             (SELECT closed FROM c ORDER BY closed_date DESC LIMIT 1) AS closed_on_last_day,
             (SELECT MAX(closed_date) FROM c) AS last_day

  - q: ["SAT headline", "SAT module headline", "SAT card on the home page"]
    note: "The SAT module tile: Total SAT meters and SAT % of eligible MI, rounded UP like the card (94.40 shows as 95)."
    sql: |
      SELECT total_sat_meters AS total_sat_meters,
             CEIL(sat_percent) AS sat_pct_of_eligible_mi,
             sat_percent AS sat_pct_exact
      FROM public.gold_dashboard_stats_snapshot
      WHERE singleton

  - q: ["Revenue headline", "revenue module headline", "revenue card on the home page"]
    note: "The Revenue module tile in Rs crore: Invoiced, Realized and Overdue over lumpsum + PMPM + cable (latest receivables row per project). Overdue per stream is clamped at 0 before adding, like the card."
    sql: |
      SELECT ROUND(SUM(lumpsum_invoiced + pmpm_invoiced + cable_invoiced), 2) AS invoiced_cr,
             ROUND(SUM(lumpsum_realised + pmpm_realised + cable_realised), 2) AS realized_cr,
             ROUND(GREATEST(SUM(lumpsum_invoiced - lumpsum_realised - lumpsum_within_timeline), 0)
                   + GREATEST(SUM(pmpm_invoiced - pmpm_realised - pmpm_within_timeline), 0)
                   + GREATEST(SUM(cable_invoiced - cable_realised - cable_within_timeline), 0), 2) AS overdue_cr
      FROM (SELECT r.*, ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
            FROM public.revenue_receivables r) l
      WHERE rn = 1

  - q: ["Meter journey headline", "meter journey module headline", "meter journey card on the home page"]
    note: "The Meter Journey module tile: average days from supply to revenue realization, Consumer vs Non-consumer (DT + feeder), new installations only (NOT is_replacement), one decimal."
    sql: |
      SELECT ROUND(SUM(total_journey_days_sum) FILTER (WHERE UPPER(category) = 'CONSUMER')
                   / NULLIF(SUM(revenue_realized_meter_count) FILTER (WHERE UPPER(category) = 'CONSUMER'), 0), 1)
               AS consumer_avg_journey_days,
             ROUND(SUM(total_journey_days_sum) FILTER (WHERE UPPER(category) <> 'CONSUMER')
                   / NULLIF(SUM(revenue_realized_meter_count) FILTER (WHERE UPPER(category) <> 'CONSUMER'), 0), 1)
               AS non_consumer_avg_journey_days
      FROM public.gold_meter_journey_stage_agg
      WHERE NOT is_replacement

  - q: ["Give me a one-line status of the program", "program status", "quick update on the programme", "export today's headline stats", "Give me installed so far, SAT percentage and remaining stock in one go"]
    suggest: "Give me installed so far, SAT percentage and remaining stock in one go."
    note: "A one-line programme status (not the home-page headline strip -- 'dashboard headlines' is its own example with the strip's six tiles). Headline numbers come from the dashboard stats row (sat_percent = SAT / ELIGIBLE meters). Never compute SAT % from gold_mi_installation_* tables. Invoiced meters = total_lumpsum_invoice_done_meters; PMPM collected = total_pmpm_collection_done_meters."
    sql: |
      SELECT refreshed_at, total_meter_installations AS meters_installed, meter_installed_on_last_day AS installed_last_day,
             total_sat_meters AS sat_meters, sat_percent AS sat_pct, total_current_inventory_count AS meters_supplied,
             total_current_remaining_stock_count AS remaining_stock, total_lumpsum_invoice_done_meters AS invoiced_meters,
             total_pmpm_collection_done_meters AS pmpm_collected_meters, average_meter_journey_days AS avg_journey_days
      FROM public.gold_dashboard_stats_snapshot
      WHERE singleton

  - q: ["What has changed since last week on the headline KPIs?", "week over week change in KPIs", "headline numbers now vs 7 days ago"]
    suggest: "What has changed since last week on the headline KPIs?"
    note: "SAT/invoice snapshots have no history: say SAT change cannot be computed."
    sql: |
      SELECT 'Meters installed' AS kpi,
             SUM(meter_count) AS now_value,
             SUM(meter_count) FILTER (WHERE period_start <= CURRENT_DATE - 7) AS week_ago_value,
             SUM(meter_count) - SUM(meter_count) FILTER (WHERE period_start <= CURRENT_DATE - 7) AS change
      FROM public.gold_mi_installation_day_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
      UNION ALL
      SELECT 'Meters supplied', SUM(inventory_count), SUM(inventory_count) FILTER (WHERE period_start <= CURRENT_DATE - 7),
             SUM(inventory_count) - SUM(inventory_count) FILTER (WHERE period_start <= CURRENT_DATE - 7)
      FROM public.gold_meter_inventory_event_day_agg
      UNION ALL
      SELECT 'Remaining stock', SUM(inventory_count - stock_consumed_count),
             SUM(inventory_count - stock_consumed_count) FILTER (WHERE period_start <= CURRENT_DATE - 7),
             SUM(inventory_count - stock_consumed_count) - SUM(inventory_count - stock_consumed_count) FILTER (WHERE period_start <= CURRENT_DATE - 7)
      FROM public.gold_meter_inventory_event_day_agg

  - q: ["Which three numbers should I worry about today?", "red flags today", "what should I worry about", "top risks", "watchlist", "Write a CXO weekly summary with three risks and three actions."]
    suggest: "Which three numbers should I worry about today?"
    note: "Each check: value vs threshold; severity = value / threshold - 1 (higher = worse). Show all, the answer names the top 3 by severity."
    sql: |
      WITH t AS (
        SELECT 'Open O&M tickets older than 60 days (% of open)' AS check_name,
               (SELECT ROUND(SUM(ticket_count) FILTER (WHERE age_key = 'age_60_plus') * 100.0 / NULLIF(SUM(ticket_count), 0), 2)
                FROM public.gold_om_open_ageing_snapshot) AS value, 20.0 AS threshold
        UNION ALL
        SELECT 'Eligible meters waiting > 90 days for SAT (% of installed)',
               (SELECT ROUND(SUM(meter_count) FILTER (WHERE age_key IN ('age_91_120', 'age_120_plus')) * 100.0
                       / (SELECT SUM(meter_count) FROM public.gold_mi_sat_invoice_snapshot), 2)
                FROM public.gold_non_sat_ageing_snapshot), 3.0
        UNION ALL
        SELECT 'Lumpsum outstanding (% of invoiced)',
               (SELECT ROUND((SUM(lumpsum_invoiced) - SUM(lumpsum_realised)) * 100.0 / NULLIF(SUM(lumpsum_invoiced), 0), 2)
                FROM (SELECT lumpsum_invoiced, lumpsum_realised,
                             ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) AS rn
                      FROM public.revenue_receivables) r WHERE rn = 1), 20.0
        UNION ALL
        SELECT 'Revenue not realized > 60 days since SAT (% of SAT meters)',
               (SELECT ROUND(SUM(outstanding_count) FILTER (WHERE CURRENT_DATE - sat_date > 60) * 100.0
                       / (SELECT SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) FROM public.gold_mi_sat_invoice_snapshot), 2)
                FROM public.gold_revenue_ageing_snapshot), 5.0
        UNION ALL
        SELECT 'Installs: last 7 days vs previous 7 (% drop)',
               (SELECT ROUND((1 - SUM(meter_count) FILTER (WHERE period_start > CURRENT_DATE - 7) * 1.0
                       / NULLIF(SUM(meter_count) FILTER (WHERE period_start <= CURRENT_DATE - 7), 0)) * 100, 2)
                FROM public.gold_mi_installation_day_agg
                WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
                  AND period_start > CURRENT_DATE - 14), 20.0
        UNION ALL
        SELECT 'Defect rate (%)',
               (SELECT ROUND((SELECT SUM(defect_rate_numerator_count) FROM public.gold_meter_defect_event_day_agg) * 100.0
                       / SUM(meter_count), 2)
                FROM public.gold_mi_installation_month_agg
                WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL), 1.5
      )
      SELECT check_name, value, threshold,
             ROUND(LEAST(GREATEST(value / threshold - 1, -1), 3), 2) AS severity,
             CASE WHEN value > threshold THEN 'RED FLAG' ELSE 'ok' END AS status
      FROM t
      ORDER BY severity DESC

  - q: ["What is our remaining stock?", "how much stock is left", "stock balance", "meters in stock now"]
    suggest: "What is our remaining stock?"
    note: "Remaining stock = SUM(inventory_count) - SUM(stock_consumed_count) -- NEVER supplied minus installed (installs without a stock record would distort it)."
    sql: |
      SELECT SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock,
             SUM(inventory_count) AS meters_supplied, SUM(stock_consumed_count) AS stock_consumed
      FROM public.gold_meter_inventory_event_day_agg

  - q: ["What percentage of supplied meters has been installed?", "utilization rate", "supply utilization", "What is the supply utilization rate?"]
    suggest: "What percentage of supplied meters has been installed?"
    note: "Always the card's four figures: supplies, installed, utilization %, remaining stock -- never the rate alone."
    sql: |
      SELECT SUM(inventory_count) AS meters_supplied, SUM(installed_count) AS meters_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= CURRENT_DATE

  - q: ["Supply utilization summary from 23 Jun 2026 to 23 Sep 2026 in Varanasi I and Varanasi II zone", "utilization rate between two dates", "supply utilization for a date range zone wise"]
    note: "Utilization for a range = cumulative up to the END date (never in-range rows only -- that can exceed 100%); the range's own supplied / installed are extra FILTER columns."
    sql: |
      SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total' ELSE UPPER(zone) END AS zone,
             SUM(inventory_count) AS total_supplies, SUM(installed_count) AS total_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock,
             SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-06-23') AS supplied_in_period,
             SUM(installed_count) FILTER (WHERE period_start >= DATE '2026-06-23') AS installed_in_period
      FROM public.gold_meter_inventory_event_day_agg
      WHERE LOWER(project) = 'kashi' AND LOWER(zone) IN ('varanasi i', 'varanasi ii')
        AND period_start <= DATE '2026-09-23'
      GROUP BY ROLLUP (zone)
      ORDER BY GROUPING(zone) DESC, zone

  - q: ["Supply utilization rate for OEMs CAP and SEIPL", "supply utilization for some OEMs", "utilization rate for two SKUs", "supply utilization for these warehouses"]
    note: "warehouse / sku / oem are event-table columns. Several named: Total (them combined) first via ROLLUP, then each. One named: the same four figures without the ROLLUP."
    sql: |
      SELECT CASE WHEN GROUPING(UPPER(oem)) = 1 THEN 'Total' ELSE UPPER(oem) END AS oem,
             SUM(inventory_count) AS total_supplies, SUM(installed_count) AS total_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE UPPER(oem) IN ('CAP', 'SEIPL') AND period_start <= CURRENT_DATE
      GROUP BY ROLLUP (UPPER(oem))
      ORDER BY GROUPING(UPPER(oem)) DESC, total_supplies DESC

  - q: ["Supply utilization rate warehouse wise", "supply utilization OEM wise", "supply utilization SKU wise", "remaining stock and utilization by warehouse"]
    note: "X-wise = plain GROUP BY over every row up to the as-of date (no per-month window that drops quiet groups); installs with no warehouse stay only in the Total. Swap warehouse for oem / sku."
    sql: |
      SELECT CASE WHEN GROUPING(warehouse) = 1 THEN 'Total' ELSE UPPER(warehouse) END AS warehouse,
             SUM(inventory_count) AS total_supplies, SUM(installed_count) AS total_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= CURRENT_DATE
      GROUP BY ROLLUP (warehouse)
      HAVING GROUPING(warehouse) = 1 OR COALESCE(TRIM(warehouse), '') <> ''
      ORDER BY GROUPING(warehouse) DESC, total_supplies DESC

  - q: ["Supply utilization monthwise from Jan 2026 to Aug 2026 in Kashi", "monthly utilization rate trend", "utilization rate month by month"]
    note: "Trend = running totals: earlier history folds into the first month, rate per month = cumulative installed / cumulative supplied (never one month's installs / that month's supplies)."
    sql: |
      WITH m AS (
        SELECT GREATEST(date_trunc('month', period_start)::date, DATE '2026-01-01') AS month,
               SUM(inventory_count) AS supplied, SUM(installed_count) AS installed
        FROM public.gold_meter_inventory_event_month_agg
        WHERE LOWER(project) = 'kashi' AND period_start <= DATE '2026-08-31'
        GROUP BY 1)
      SELECT to_char(month, 'Mon YYYY') AS month,
             SUM(supplied) OVER (ORDER BY month) AS cumulative_supplied,
             SUM(installed) OVER (ORDER BY month) AS cumulative_installed,
             ROUND(SUM(installed) OVER (ORDER BY month) * 100.0 / NULLIF(SUM(supplied) OVER (ORDER BY month), 0), 2) AS utilization_rate_pct
      FROM m
      ORDER BY m.month

  - q: ["remaining stock type wise as of june 2026", "stock by meter type as on a date", "meter type wise stock left"]
    note: "Stock is a balance: everything up to the END of the named month (period_start <= last day), never that month's rows alone (that gives negative 'stock'). Output the stored meter_type; the app shows it as 1PH / 3PH / LTCT / HTCT (consumer), DTR, Feeder."
    sql: |
      SELECT CASE WHEN GROUPING(meter_type) = 1 THEN 'Total' ELSE meter_type END AS meter_type,
             CASE WHEN GROUPING(meter_type) = 1 THEN 'All' ELSE MIN(category) END AS category,
             SUM(inventory_count) AS supplied_till_date,
             SUM(stock_consumed_count) AS used_from_stock,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
      FROM public.gold_meter_inventory_event_day_agg
      WHERE period_start <= DATE '2026-06-30'
      GROUP BY ROLLUP (meter_type)
      ORDER BY GROUPING(meter_type) DESC, remaining_stock DESC

  - q: ["mi pace vs stock category wise", "Is installation pace keeping up with stock category wise in Kashi", "installs per day vs remaining stock by category", "days of stock left by category", "MI pace vs stock availability for a warehouse / OEM / SKU"]
    note: "Card figures first (supplies, installed, utilization %, remaining stock), then the pace. MI pace = average meters installed per day over the 6 months up to the as-of date (that month so far + 5 full months); stock = as of that date. The as-of date lives ONLY in w (CURRENT_DATE, or e.g. DATE '2026-08-31' for 'as of August 2026') -- every other place reads (SELECT as_of FROM w) / (SELECT since FROM w), so nothing extra goes into GROUP BY. One SELECT with GROUP BY ROLLUP (never join separate CTEs without ON). pace_period carries the window so the answer can state it. Without 'category wise' drop the category column and ROLLUP; warehouse / oem / sku wise or a picked one uses those event-table columns the same way."
    sql: |
      WITH w AS (SELECT CURRENT_DATE AS as_of, (date_trunc('month', CURRENT_DATE) - INTERVAL '5 months')::date AS since)
      SELECT CASE WHEN GROUPING(category) = 1 THEN 'Total' ELSE category END AS category,
             SUM(inventory_count) AS total_supplies, SUM(installed_count) AS total_installed,
             ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
             SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock,
             ROUND(SUM(installed_count) FILTER (WHERE period_start >= (SELECT since FROM w)) * 1.0
                   / ((SELECT as_of FROM w) - (SELECT since FROM w) + 1), 1) AS installs_per_day,
             ROUND((SUM(inventory_count) - SUM(stock_consumed_count))
                   / NULLIF(SUM(installed_count) FILTER (WHERE period_start >= (SELECT since FROM w)) * 1.0
                            / ((SELECT as_of FROM w) - (SELECT since FROM w) + 1), 0)) AS days_of_stock_left,
             (SELECT to_char(since, 'DD Mon YYYY') || ' to ' || to_char(as_of, 'DD Mon YYYY') FROM w) AS pace_period
      FROM public.gold_meter_inventory_event_day_agg
      WHERE LOWER(project) = 'kashi' AND period_start <= (SELECT as_of FROM w)
      GROUP BY ROLLUP (category)
      ORDER BY GROUPING(category) DESC, days_of_stock_left

  - q: ["mi pace vs stock daily from 1 sep 2026 to 15 sep 2026 in agra", "installation pace vs stock day wise", "daily installs vs remaining stock trend"]
    note: "One row per day (generate_series, so quiet days show 0): that day's received / installed, and remaining stock at the end of the day = running SUM(inventory_count - stock_consumed_count) with all earlier history folded into the first day. Every column the outer query uses must come out of the CTE."
    sql: |
      WITH days AS (SELECT generate_series(DATE '2026-09-01', DATE '2026-09-15', INTERVAL '1 day')::date AS day),
      e AS (
        SELECT GREATEST(period_start, DATE '2026-09-01') AS day,
               SUM(inventory_count) FILTER (WHERE period_start >= DATE '2026-09-01') AS received,
               SUM(installed_count) FILTER (WHERE period_start >= DATE '2026-09-01') AS installed,
               SUM(inventory_count - stock_consumed_count) AS net_stock
        FROM public.gold_meter_inventory_event_day_agg
        WHERE LOWER(project) = 'agra' AND period_start <= DATE '2026-09-15'
        GROUP BY 1)
      SELECT to_char(days.day, 'DD Mon YYYY') AS day,
             COALESCE(e.received, 0) AS meters_received,
             COALESCE(e.installed, 0) AS meters_installed,
             SUM(COALESCE(e.net_stock, 0)) OVER (ORDER BY days.day) AS remaining_stock
      FROM days LEFT JOIN e ON e.day = days.day
      ORDER BY days.day

  - q: ["Un-utilized stock ageing for Agra HW", "stock ageing for a warehouse", "unused stock ageing in Prayagraj HW", "stock ageing for Aligarh Warehouse"]
    note: "A name ending HW / ZW / SWH / Warehouse is the warehouse (LOWER(warehouse) = 'agra_hw'), never the project 'agra'. Total plus every age band."
    sql: |
      SELECT 'Agra_HW' AS warehouse, SUM(stock_count) AS total_stock,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) <= 30), 0) AS days_0_30,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) BETWEEN 31 AND 60), 0) AS days_31_60,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) BETWEEN 61 AND 90), 0) AS days_61_90,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) > 90), 0) AS days_90_plus
      FROM public.gold_inventory_unutilized_stock_snapshot
      WHERE LOWER(warehouse) = 'agra_hw'

  - q: ["Unutilized stock ageing", "un-utilised stock ageing card", "how old is our unused stock", "stock ageing bands"]
    note: "The card: one row per band in order (0-30, 31-60, 61-90, 90+ days) plus Total, every stage and warehouse. A place / category / stage filter goes in the ON clause."
    sql: |
      SELECT b.label AS ageing_band, COALESCE(SUM(s.stock_count), 0) AS stock
      FROM (VALUES (1, 0, 30, '0-30 days'), (2, 31, 60, '31-60 days'), (3, 61, 90, '61-90 days'), (4, 91, NULL, '90+ days'),
                   (5, NULL, NULL, 'Total')) AS b(ord, lo, hi, label)
      LEFT JOIN public.gold_inventory_unutilized_stock_snapshot s
        ON b.lo IS NULL OR (GREATEST(CURRENT_DATE - s.inventory_date, 0) >= b.lo
                            AND (b.hi IS NULL OR GREATEST(CURRENT_DATE - s.inventory_date, 0) <= b.hi))
      GROUP BY b.ord, b.label
      ORDER BY b.ord

  - q: ["Consumer stock ageing type wise", "unutilized stock ageing by meter type", "unused 1 phase 3 phase stock by age", "stock ageing meter type wise"]
    note: "Stock ageing is the un-utilised stock snapshot -- never gold_non_sat_ageing_snapshot (installed meters waiting for SAT). 'Consumer type wise' = the consumer meter types of category 'CONSUMER', the card's four bands as columns."
    sql: |
      SELECT CASE WHEN GROUPING(meter_type) = 1 THEN 'Total' ELSE meter_type END AS meter_type,
             SUM(stock_count) AS total_stock,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) <= 30), 0) AS days_0_30,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) BETWEEN 31 AND 60), 0) AS days_31_60,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) BETWEEN 61 AND 90), 0) AS days_61_90,
             COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) > 90), 0) AS days_90_plus
      FROM public.gold_inventory_unutilized_stock_snapshot
      WHERE category = 'CONSUMER'
      GROUP BY ROLLUP (meter_type)
      ORDER BY GROUPING(meter_type) DESC, total_stock DESC

  - q: ["90+ days stock still in the warehouse in Triveni", "stock older than 90 days lying with agencies", "old stock with supervisors in Kashi", "how much aged stock is still in the warehouse"]
