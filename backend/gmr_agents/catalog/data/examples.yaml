  - q: ["Mapping audit status of meter AL1157377", "which feeder is meter AL1157377 on", "AI based and index based feeder of a consumer", "outage match for meter X", "Outage match for consumer AL0500051", "What is the outage match of meter AL1157377 on its original feeder and on the reassigned feeder?", "why was meter X reassigned", "Why was meter AL4712235 reassigned to another feeder?", "Why did meter X move from feeder Y to another feeder?", "substation of consumer X"]
    note: "One consumer (latest month): verdict, index-based (declared) and AI-based (recommended) feeder with names, substation, and the outage matches 'dark of seen' for the declared and the best feeder -- the reason for the verdict. AI-based feeder is empty for REVIEW / NO DATA (undecided)."
    sql: |
      SELECT a.meter_no, a.data_date AS audit_month, a.verdict, a.cluster AS project, a.zone, a.sub_station,
             a.declared_feeder AS index_based_feeder, d.feeder_name AS index_based_feeder_name,
             a.auto_feeder AS ai_based_feeder, r.feeder_name AS ai_based_feeder_name,
             CAST(a.declared_dark AS VARCHAR) || ' of ' || CAST(a.declared_dark + a.declared_powered AS VARCHAR) AS declared_feeder_outage_match,
             a.best_feeder, CAST(a.best_dark AS VARCHAR) || ' of ' || CAST(a.best_dark + a.best_powered AS VARCHAR) AS best_feeder_outage_match,
             a.mapping_confidence, a.was_cross_substation
      FROM hes_gold.mapping_audit a
      LEFT JOIN hes_gold.mapping_audit_feeder d ON d.feeder_code = a.declared_feeder AND d.data_date = a.data_date
      LEFT JOIN hes_gold.mapping_audit_feeder r ON r.feeder_code = a.auto_feeder AND r.data_date = a.data_date
      WHERE a.meter_no = 'AL1157377'
        AND a.data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)

  - q: ["Which feeders was meter SC11051607 scored against?", "candidate feeders of a consumer", "evidence for meter X", "supporting and contradicting outages for meter X"]
    note: "The dashboard's consumer drawer: every candidate feeder of the consumer's substation, ranked supporting DESC, net_score DESC (latest month). The first row is where the evidence points; is_current_feeder marks the index-based (declared) one. 'Why reassigned' alone is answered from mapping_audit (its declared vs best outage match) -- use this table only when the candidate feeders / scores are asked."
    sql: |
      SELECT c.candidate_feeder, f.feeder_name, c.supporting AS outages_dark_with_feeder,
             c.contradicting AS outages_stayed_powered, c.net_score, c.is_declared AS is_current_feeder
      FROM hes_gold.mapping_audit_candidates c
      LEFT JOIN hes_gold.mapping_audit_feeder f ON f.feeder_code = c.candidate_feeder AND f.data_date = c.data_date
      WHERE c.meter_no = 'SC11051607'
        AND c.data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)
      ORDER BY c.supporting DESC, c.net_score DESC
      LIMIT 40

  - q: ["What is the runner-up feeder for meter SC11051607?", "How close was the call for meter SC11051607 between its top two feeders?", "second best feeder for a consumer", "margin between the top two candidate feeders"]
    note: "The dashboard drawer's order: supporting DESC, net_score DESC. rank 1 = the feeder the evidence points to, rank 2 = the runner-up; margin = the gap in outages dark and in net score between them. Athena has no OFFSET here -- pick ranks with ROW_NUMBER."
    sql: |
      SELECT t.candidate_rank, t.candidate_feeder, f.feeder_name, t.supporting AS outages_dark_with_feeder,
             t.contradicting AS outages_stayed_powered, t.net_score, t.is_declared AS is_current_feeder,
             MAX(CASE WHEN t.candidate_rank = 1 THEN t.supporting END) OVER () - MAX(CASE WHEN t.candidate_rank = 2 THEN t.supporting END) OVER () AS margin_outages_dark,
             MAX(CASE WHEN t.candidate_rank = 1 THEN t.net_score END) OVER () - MAX(CASE WHEN t.candidate_rank = 2 THEN t.net_score END) OVER () AS margin_net_score
      FROM (SELECT c.*, ROW_NUMBER() OVER (ORDER BY c.supporting DESC, c.net_score DESC) AS candidate_rank
            FROM hes_gold.mapping_audit_candidates c
            WHERE c.meter_no = 'SC11051607' AND c.data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)) t
      LEFT JOIN hes_gold.mapping_audit_feeder f ON f.feeder_code = t.candidate_feeder AND f.data_date = t.data_date
      WHERE t.candidate_rank <= 2
      ORDER BY t.candidate_rank

  - q: ["Show the outage windows behind meter SC11051607's reassignment", "outage log for meter X", "when did the feeders go dark for meter X", "did meter X go dark with each outage", "Show the outage windows and times for meter AL4712306", "Show the outage windows for meter AL1157377"]
    note: "Only REASSIGN consumers have outage rows. Main query = one row per candidate feeder (its outages, how many the meter went dark in, first / last outage in IST, feeder name) -- summarise from it ('went dark in 12 of 12 outages of SAHAWAR PTW vs 5 of 7 of SAHAWAR DEHAT, its current feeder'). The extra query lists every outage. Latest month unless one is named."
    sql: |
      SELECT e.candidate_feeder, f.feeder_name,
             COUNT(DISTINCT e.event_id) AS outages,
             COUNT(DISTINCT CASE WHEN e.consumer_dark THEN e.event_id END) AS outages_meter_went_dark,
             CASE WHEN e.candidate_feeder = MAX(e.declared_feeder) THEN 'Yes' ELSE 'No' END AS is_current_feeder,
             MIN(e.slot) AT TIME ZONE 'Asia/Kolkata' AS first_outage_ist, MAX(e.slot) AT TIME ZONE 'Asia/Kolkata' AS last_outage_ist
      FROM hes_gold.mapping_audit_evidence e
      LEFT JOIN hes_gold.mapping_audit_feeder f ON f.feeder_code = e.candidate_feeder AND f.data_date = e.data_date
      WHERE e.meter_no = 'SC11051607'
        AND e.data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)
      GROUP BY e.candidate_feeder, f.feeder_name
      ORDER BY outages_meter_went_dark DESC, outages DESC
    extra:
      - purpose: "Every outage of each candidate feeder (IST) and whether the meter went dark"
        sql: |
          SELECT candidate_feeder, event_id AS outage_no,
                 MIN(slot) AT TIME ZONE 'Asia/Kolkata' AS outage_start_ist, MAX(slot) AT TIME ZONE 'Asia/Kolkata' AS outage_end_ist,
                 COUNT(*) AS half_hour_slots,
                 CASE WHEN BOOL_OR(consumer_dark) THEN 'Yes' ELSE 'No' END AS consumer_went_dark,
                 COUNT_IF(NOT consumer_comm) AS slots_without_reading,
                 CASE WHEN candidate_feeder = MAX(declared_feeder) THEN 'Yes' ELSE 'No' END AS is_current_feeder
          FROM hes_gold.mapping_audit_evidence
          WHERE meter_no = 'SC11051607'
            AND data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)
          GROUP BY candidate_feeder, event_id
          ORDER BY candidate_feeder, event_id
          LIMIT 500

  - q: ["Did meter AL4710864 go dark when feeder SAHAWAR PTW had outages?", "did consumer X lose supply with feeder Y", "outage match of meter X with a named feeder"]
    note: "Only the named feeder among THIS meter's candidates (name -> feeder_code via mapping_audit_feeder LIKE, restricted to the meter's own candidate feeders, so a same-name feeder of another substation never matches). One row per matching feeder: its outages and how many the meter went dark in."
    sql: |
      SELECT e.candidate_feeder, f.feeder_name,
             COUNT(DISTINCT e.event_id) AS outages_of_feeder,
             COUNT(DISTINCT CASE WHEN e.consumer_dark THEN e.event_id END) AS outages_meter_went_dark,
             CASE WHEN e.candidate_feeder = MAX(e.declared_feeder) THEN 'Yes' ELSE 'No' END AS is_current_feeder
      FROM hes_gold.mapping_audit_evidence e
      JOIN hes_gold.mapping_audit_feeder f ON f.feeder_code = e.candidate_feeder AND f.data_date = e.data_date
      WHERE e.meter_no = 'AL4710864'
        AND e.data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)
        AND UPPER(f.feeder_name) LIKE '%SAHAWAR PTW%'
      GROUP BY e.candidate_feeder, f.feeder_name

  - q: ["Proof pack for re-tags on feeder SAHAWAR", "evidence for every reassigned consumer of a feeder", "outages behind the re-tags of feeder X", "export the proof pack for feeder X", "How many reassigned consumers of feeder SAHAWAR DEHAT went dark in every outage of their new feeder?"]
    note: "Lead with the Totals result (consumers re-tagged, how many went dark in every outage of their suggested feeder); the list is the proof per consumer. The dashboard's proof-pack export, summarised per consumer: re-tagged consumers declared to the named feeder (feeder name -> its feeder_code via mapping_audit_feeder), with outages of their suggested feeder and how many they went dark in. Latest month."
    sql: |
      SELECT e.meter_no AS consumer_meter, e.sub_station, e.declared_feeder AS feeder_on_record,
             a.auto_feeder AS feeder_suggested,
             COUNT(DISTINCT e.event_id) AS outages_of_suggested_feeder,
             COUNT(DISTINCT CASE WHEN e.consumer_dark THEN e.event_id END) AS outages_consumer_went_dark
      FROM hes_gold.mapping_audit_evidence e
      JOIN hes_gold.mapping_audit a ON a.meter_no = e.meter_no AND a.data_date = e.data_date
      WHERE e.data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)
        AND e.declared_feeder IN (SELECT feeder_code FROM hes_gold.mapping_audit_feeder
                                  WHERE UPPER(feeder_name) LIKE '%SAHAWAR%'
                                    AND data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary))
        AND e.candidate_feeder = a.auto_feeder
      GROUP BY e.meter_no, e.sub_station, e.declared_feeder, a.auto_feeder
      ORDER BY outages_consumer_went_dark DESC
      LIMIT 200
    extra:
      - purpose: "Totals: re-tagged consumers of the feeder(s) and how many went dark in every outage of their suggested feeder"
        sql: |
          SELECT COUNT(*) AS consumers_retagged,
                 COUNT_IF(dark = outages) AS dark_in_every_outage,
                 ROUND(AVG(dark * 100.0 / NULLIF(outages, 0)), 1) AS avg_pct_outages_dark
          FROM (SELECT e.meter_no, COUNT(DISTINCT e.event_id) AS outages,
                       COUNT(DISTINCT CASE WHEN e.consumer_dark THEN e.event_id END) AS dark
                FROM hes_gold.mapping_audit_evidence e
                JOIN hes_gold.mapping_audit a ON a.meter_no = e.meter_no AND a.data_date = e.data_date
                WHERE e.data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)
                  AND e.declared_feeder IN (SELECT feeder_code FROM hes_gold.mapping_audit_feeder
                                            WHERE UPPER(feeder_name) LIKE '%SAHAWAR%'
                                              AND data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary))
                  AND e.candidate_feeder = a.auto_feeder
                GROUP BY e.meter_no) t

