      GROUP BY week_label ORDER BY MIN(data_date)

  - q: ["Partial days circle-wise", "data quality issues by circle", "which circle has the most partial days"]
    sql: |
      SELECT MAX(data_date) AS data_month, circle, SUM(partial_days) AS partial_days,
             COUNT_IF(partial_days > 0) AS meters_with_partial_days, COUNT(*) AS meters,
             ROUND(AVG(avg_completeness_pct), 2) AS avg_completeness_pct
      FROM hes_gold.data_quality_issues WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND circle IS NOT NULL
      GROUP BY circle ORDER BY partial_days DESC LIMIT 15

  - q: ["Meters stopped communicating", "how many meters are not communicating", "silent meters count", "non-communicating meters"]
    note: "Card Meters Stopped Communicating: silent 3+ days at the end of the month's data; always split never reported vs stopped after reporting. HES readings, not O&M tickets."
    sql: |
      SELECT MAX(data_date) AS data_month, MAX(window_end) AS data_up_to,
             COUNT(*) AS silent_meters,
             COUNT_IF(never_reported) AS never_reported,
             COUNT_IF(NOT never_reported) AS stopped_after_reporting,
             ROUND(AVG(days_since_last_seen), 2) AS avg_days_silent,
             ROUND(AVG(CASE WHEN never_reported THEN days_since_last_seen END), 2) AS avg_days_silent_never_reported
      FROM hes_gold.communication_failures WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

  - q: ["Non-communicating meters by silence period", "meters stopped communicating by days silent bucket"]
    note: "nc_bucket stores 'Non_Communicating_3_30_Days' etc."
    sql: |
      SELECT MAX(data_date) AS data_month, nc_bucket, COUNT(*) AS meters,
             COUNT_IF(never_reported) AS never_reported, COUNT_IF(NOT never_reported) AS stopped_after_reporting
      FROM hes_gold.communication_failures WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
      GROUP BY nc_bucket ORDER BY MIN(days_since_last_seen)

