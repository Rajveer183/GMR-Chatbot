  - q: ["Top 5 divisions by installations in the last 30 days.", "bottom 5 divisions by installations last month", "best and worst divisions by installs", "rank zones by installations last 30 days"]
    suggest: "Top 5 divisions by installations in the last 30 days."
    note: "Top / bottom N: ORDER BY DESC / ASC with LIMIT N, real names only (no Total row, no blank division)."
    sql: |
      SELECT UPPER(project) AS project, UPPER(division) AS division, SUM(meter_count) AS installed
      FROM public.gold_mi_installation_day_agg
      WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
