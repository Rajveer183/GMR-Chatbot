    note: "By decision date (escalation_attended_on, IST), latest escalation per ticket; the card's escalated_month is the escalation month, not the decision month."
    sql: |
      WITH latest AS (
          SELECT d.*,
                 COALESCE(NULLIF(UPPER(TRIM(d.escalation_status)), ''), 'UNKNOWN') AS status,
                 COUNT(*) OVER (PARTITION BY UPPER(TRIM(d.discom)), UPPER(TRIM(d.ticket_id))) AS times_escalated,
                 ROW_NUMBER() OVER (PARTITION BY UPPER(TRIM(d.discom)), UPPER(TRIM(d.ticket_id))
                                    ORDER BY d.escalated_on DESC, d.escalation_attended_on DESC NULLS LAST,
