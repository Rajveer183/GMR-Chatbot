    sql: |
      SELECT MAX(data_date) AS data_month,
             COUNT_IF(anomaly_type = 'non_net_meter_exporting') AS non_net_meters_exporting,
             ROUND(SUM(CASE WHEN anomaly_type = 'non_net_meter_exporting' THEN total_kwh_export END), 1) AS export_kwh,
             COUNT_IF(is_anomaly) AS total_flagged_meters
      FROM hes_gold.reverse_flow WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND LOWER(cluster) = 'kashi'

  - q: ["Reverse flow anomalies month-wise", "reverse flow trend by month"]
    note: "August holds 2-3 days of readings."
    sql: |
      SELECT data_date AS data_month, COUNT_IF(is_anomaly) AS total_flagged_meters,
             COUNT_IF(anomaly_type = 'net_meter_non_exporting') AS net_meters_not_exporting,
             COUNT_IF(anomaly_type = 'non_net_meter_exporting') AS non_net_meters_exporting
