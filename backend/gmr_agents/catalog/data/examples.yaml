             SUM(total_flagged_occurrences) AS flagged_events
      FROM hes_gold.hidden_outage_summary WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND detector = 'unreported_blockload_gap' AND LOWER(cluster) = 'kashi'

  - q: ["Which hidden outage detectors flagged feeder meter SC10292807?", "hidden outage details of meter SC10292807"]
    sql: |
      SELECT data_date AS data_month, meter_no, category, detector, days_affected, total_block_count_flagged AS half_hours_flagged,
             pct_blocks_flagged, total_flagged_occurrences AS flagged_events,
             first_slot AT TIME ZONE 'Asia/Kolkata' AS first_slot_ist, last_slot AT TIME ZONE 'Asia/Kolkata' AS last_slot_ist
      FROM hes_gold.hidden_outage_summary WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND meter_no = 'SC10292807'
      ORDER BY half_hours_flagged DESC

  - q: ["Consumption spikes / drops", "how many meters have consumption spikes or drops", "abnormal consumption meters"]
    note: "Card Consumption Spikes / Drops: suspects only (10+ outlier readings); outlier readings tile = average per meter."
    sql: |
      SELECT MAX(month_date) AS data_month,
             COUNT(*) AS flagged_meters,
             COUNT_IF(meter_flag = 'Spike') AS spike_meters,
             COUNT_IF(meter_flag = 'Drop') AS drop_meters,
             ROUND(AVG(total_outliers), 2) AS avg_outlier_readings_per_meter,
             SUM(spike_count) AS spike_readings,
             SUM(drop_count) AS drop_readings
      FROM hes_gold.consumption_spike_drop WHERE month_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AND is_spike_or_drop_suspect

  - q: ["Show the spike and drop readings of meter HP8000235", "flagged readings of meter HP8000235"]
