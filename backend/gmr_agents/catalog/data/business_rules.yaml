# Declarative business rules for the LLM SQL planner (WFM + MDM).
# The planner prompt gets `global` plus 2-3 matching `topics`. Rules mirror the
# dashboard-verified behaviour of the former planner/fast_paths templates.
#
# PROMPT COST MAP (measured 2026-10-04; ~4 chars = 1 token). Every word here is paid
# for on every question that reaches the field -- keep the hot fields short:
#   global.rules              SQL planner, EVERY call (+ repairs)   ~1,180 tok  <- hottest
#   topics.<k>.rules          SQL planner, top 2 topics             ~130-440 tok each
#   topics.<k>.example        SQL planner, top 2 topics             ~70-280 tok each
#                             (overlaps examples.yaml; PROMPT_COMPACT=rule_examples drops it)
#   topics.<k>.title          triage, EVERY call, all topics        ~10 tok each
#   topics.<k>.description    triage, only the TRIAGE_TOPIC_FULL best-ranked topics
#                             (~45 tok each) + topic retrieval index
#   topics.<k>.keywords       retrieval index only -- free in prompts
#   topics.<k>.answer_notes   answer writer, the question's topics  ~0-190 tok
#   retrieval_synonyms        retrieval only -- free in prompts
#   explain_only              explain answers only (glossary chunks)
version: 1

global:
  rules:
    - "Rankings (top / bottom N, best / worst, highest / lowest, rank X by Y): rank the real items only -- never put the ROLLUP 'Total' row among them (leave it out of ranked lists, or give it as a separate overall figure). Comparisons (compare A and B, A vs B, difference, gap, how many more): return each compared value AND the difference (and % difference when useful) as separate columns, one row per item or one row with both. A month / week / year still in progress (the current one) is partial: never call it the highest or lowest -- rank complete periods, and mention the partial one separately if relevant."
    - "Filters come ONLY from the question (and, for a follow-up, the previous turn). Places, periods and categories that appear in an Example are illustrations -- never copy them into a question that does not state them."
    - "Dates are IST, inclusive. 'last N days' = N full days ending YESTERDAY: CURRENT_DATE - N .. CURRENT_DATE - 1 (asked on 23 Oct, 'last 7 days' = 16 Oct .. 22 Oct); 'last week' = the same 7 days ending yesterday; 'this week' = month-anchored week (days 1-7, 8-14, 15-21, 22-28, 29-end) holding today, to today; 'this month' = 1st .. today; 'last month' = whole previous calendar month; 'last N months' = rolling window ending YESTERDAY, starting the same date N months earlier: period_start BETWEEN (CURRENT_DATE - 1 - INTERVAL 'N months')::date AND CURRENT_DATE - 1 (asked on 23 Oct, 'last 2 months' = 22 Aug .. 22 Oct) -- read it from the day table, never whole months from the month table; 'this year' = 1 Jan .. today; 'in 2026' (a year) = 1 Jan .. 31 Dec of it -- the current year runs to today, never to an earlier day; 'last year' = previous calendar year; month without year = most recent occurrence; 'since X' = X .. today. No date = all time, except O&M closed/productivity."
    - "An explicit daily/weekly/monthly ask wins. Weeks are month-anchored, never ISO: date_trunc('month', d)::date + ((EXTRACT(DAY FROM d)::int - 1) / 7) * 7. Breakdowns get a leading Total row: GROUP BY ROLLUP (bucket), CASE WHEN GROUPING(bucket) = 1 THEN 'Total' ... END, ORDER BY GROUPING(bucket) DESC."
    - "Places: project > discom > zone > circle > division > sub_division. Projects: agra, kashi, triveni ('cluster' = project). A bare name = highest level holding it ('agra' = project, 'agra zone' = zone). Compare LOWER(col) = 'kashi' / LOWER(col) IN (...). 'varanasi' zone = ('varanasi i','varanasi ii') but 'varanasi project' / 'varanasi cluster' = project kashi; 'prayagraj' = ('prayagraj i','prayagraj ii'). Circle/division names carry prefixes ('edc agra', 'edd chunar'): bare name -> LOWER(col) LIKE '%chunar%'; a FULL stored name with its prefix ('EDC Varanasi', 'EUDD Cantt Mathura', 'EUDSD Vrindavan') -> LOWER(col) = 'edc varanasi' exactly (LIKE '%varanasi%' would also take EUDC I / EUDC II Varanasi). 'Varanasi zone(s)' = zones VARANASI I + VARANASI II only (Azamgarh is a Kashi zone, never part of 'Varanasi'); 'Prayagraj zone(s)' = PRAYAGRAJ I + PRAYAGRAJ II only (not Mirzapur). Only the word Kashi / Triveni / project means the whole project."
    - "'<level>-wise' / 'by <level>' = GROUP BY that column, label CASE WHEN GROUPING(col) = 1 THEN 'Total' WHEN col IS NULL OR col = '' THEN 'Unmapped' ELSE UPPER(col) END -- GROUPING first, or the ROLLUP total row becomes 'Unmapped' and is counted twice (on the inventory / stock tables a blank zone/circle/division is 'Not installed yet (in stock)' - a meter has no place until it is installed). 'Which X has the most/highest' = rank DESC; 'lowest/lagging/behind' = ASC. make/vendor/brand/manufacturer = oem (AEW, CAP, HPL, SEIPL, Unknown)."
    - "Categories: CONSUMER, DT, FEEDER. DTR/transformer = 'DT' in Postgres; Athena silver spells it 'DTR' (report_category, complaint_entity_type). Show DT as 'DTR' for installation/SAT/non-SAT/defect/utilization, 'DT' elsewhere. Consumer meter types: '1PH-Consumer_meter','3PH-Consumer_meter','LTCT-Consumer_meter','HTCT-Consumer_meter' (DT meters are meter_type '3PLTCTSM', feeder 'HTCTPTSM'). WORDING: 'type wise' / 'by type' alone = by CATEGORY (Consumer / DTR / Feeder, GROUP BY category); 'consumer type wise' / 'consumer meter type wise' / naming a consumer type = category = 'CONSUMER' GROUP BY meter_type (1PH / 3PH / LTCT / HTCT); 'meter type wise' = every meter_type (1PH, 3PH, LTCT, HTCT, DTR, Feeder). Keep 'consumer' in the resolved question whenever the user says it. There is no Other type: drop NULL/'OTHER-Consumer_meter' rows from type breakdowns, keep them in Total."
    - "Numbers: % = ROUND(x * 100.0 / NULLIF(y, 0), 2); ratios ROUND(.., 2). Gold tables hold pre-counted rows: SUM the count column (meter_count, ticket_count, ...), never COUNT(*). Money is crore rupees (Rs X cr)."
    - "One engine per query. Postgres = public.<table>: CURRENT_DATE, date_trunc('month', d)::date, CURRENT_DATE - 7, INTERVAL '1 month', SUM(x) FILTER (WHERE ...); date - date is already whole days (integer) - never EXTRACT(EPOCH/DAY FROM it). Athena/Trino = gmr_wfm_silver.<t> / hes_gold.<t>: current_date, date_add('day', -7, current_date), date_diff('day', a, b), COUNT_IF(...). Never SELECT *; alias every column; no JOIN between gold tables (scalar subqueries or UNION ALL); bound Athena silver scans by date or place; LIMIT lists to 500."
    - "Snapshot topics (SAT, non-SAT, journey, current stage, stock/revenue ageing, open tickets, receivables) are as on the latest refresh: no date range - say so. Missing latitude/longitude, photos, duplicate/invalid/mismatched records, lot/firmware are not available - say so instead of answering a plain count."

topics:
  installation:
    domain: wfm
    title: "MI progress (meters installed)"
    description: "How many meters / consumers / DTRs / feeders / meter types were installed, for any period and place, trends, spikes, weekday dips, replacement installs, meter lists."
    keywords: [installed, installation, installations, mi, mi progress, meters installed, how many installed, lagaye, install trend, daily installs, consumers installed, dtr installed, feeders installed, 1ph, 3ph, ltct, htct, replacement installed, spike, jump, dip, sunday, weekday, list meters, lage, lagaye gaye, kitne meter, meter lage, installs, how many meters, million meters, progress]
    tables: [gold_mi_installation_month_agg, gold_mi_installation_day_agg, gold_mi_technician_productivity_day_agg, unified_installations]
    answer_notes:
      - "MI progress counts new installs only; replacement installs (new meters fitted for defective ones) are excluded."
      - "A bare 'how many meters?' is ambiguous: say 'Assuming you mean installed meters (all time)' and offer supplied / SAT as alternatives."
      - "Only the current calendar month and today are partial (data lands with a lag) - never call them a drop. Earlier months are complete: never label a past month partial just because it is the last row (follow PERIODS when given)."
      - "Trend reading: the low and the peak are the true minimum / maximum among COMPLETE periods in RESULT - check every row before naming them."
      - "Sunday is the weekly off-day: ~85% fewer technicians, installs per technician stay normal. Month-end (last 2-4 days) usually shows pushes."
    rules:
      - "Installed meters = SUM(meter_count) FROM public.gold_mi_installation_month_agg (whole months / all time) or public.gold_mi_installation_day_agg (day ranges, weeks) WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement. Date = period_start."
      - "Category = progress_category (DTR = 'DT') for EVERY installed count -- also inside multi-measure or follow-up queries ('only DT') -- never inventory_category (that column is for the SAT / stock views); consumer meter type = inventory_meter_type (never progress_meter_type). A bare meter type ('HTCT / LTCT / 1PH / 3PH meters installed') = that inventory_meter_type across ALL categories -- no progress_category filter (HTCT meters are also FEEDER meters, LTCT also DT meters; the dashboard counts them the same way); only 'consumer ... type wise' or 'consumer HTCT' adds progress_category = 'CONSUMER'. Categories and types add up to the total. 'consumers/DTR/feeders installed' means installed meters of that category - never MDM or inventory tables."
      - "Default grain (no explicit ask): multi-month range -> monthly; range under 31 days -> daily; single day/month/all time -> one total."
      - "Matching the dashboard card ('as on dashboard', 'the way the dashboard shows it'): grain from the range length - up to 45 days daily, 46-150 days weekly (month-anchored weeks), longer monthly; with no dates the card ends yesterday and starts 30 days (daily) / 3 months (weekly) / 12 months (monthly) back. Show the trend per period split into CONSUMER / DT / FEEDER plus total."
      - "gold_mi_installation_month_agg holds ONE row per whole month dated the 1st, so a range that ends (or starts) mid-month must read that partial month from gold_mi_installation_day_agg - never filter the month table with period_start <= a mid-month date (it would count the whole month)."
      - "Replacement installs (new meters fitted for defective ones) = SUM(meter_count) WHERE is_replacement - excluded from MI progress, counted in stock/SAT/non-SAT."
      - "Meter lists (Athena): gmr_wfm_silver.unified_installations WHERE TRIM(COALESCE(new_meter_serial_number,'')) <> '' AND UPPER(TRIM(report_category)) IN ('CONSUMER','DTR','FEEDER') AND mi_date in range; columns new_meter_serial_number, consumer_number, mi_date, new_meter_type, new_meter_make, project, zone, division, technician_name, agency; LIMIT 500."
      - "Trend reading: peak, low, last k periods vs first k, latest full period vs previous; leave the running period out of the reading."
      - "Jump/drop on a day: compare its installs with the same weekdays in the 3 weeks before; split into technicians (COUNT(DISTINCT technician_name) from gold_mi_technician_productivity_day_agg WHERE category = 'ALL') and installs per technician; note month-end, Sundays, recent stock receipts."
      - "Weekday pattern: average installs per weekday over the last 90 complete days (days with 0 count); Sunday is the weekly off-day (fewer technicians, not slower)."
    example:
      question: "Zone-wise meters installed in Kashi this year"
      sql: |
        SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total'
                    WHEN zone IS NULL OR zone = '' THEN 'Unmapped' ELSE UPPER(zone) END AS zone,
               SUM(meter_count) AS total,
               COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'CONSUMER'), 0) AS consumer,
               COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'DT'), 0) AS dtr,
               COALESCE(SUM(meter_count) FILTER (WHERE progress_category = 'FEEDER'), 0) AS feeder
        FROM public.gold_mi_installation_day_agg
        WHERE has_meter_serial AND progress_category IS NOT NULL AND NOT is_replacement
          AND LOWER(project) = 'kashi'
          AND period_start BETWEEN date_trunc('year', CURRENT_DATE)::date AND CURRENT_DATE
        GROUP BY ROLLUP (zone)
        ORDER BY GROUPING(zone) DESC, SUM(meter_count) DESC

  defect:
    domain: wfm
    title: "Defective / replaced meters and defect rate"
    description: "Defective (replaced) meters by type (burnt, faulty, others), reason, OEM, place, period; defect rate %; burnt trend; OEM quality; why an OEM's rate is high."
    keywords: [defect, defective, defect rate, faulty, burnt, burn, terminal burnt, replaced, replacement, meter replacement, failure rate, oem quality, quality issue, load enhancement, tampered, reason wise, kharab, jala]
    tables: [gold_meter_defect_event_day_agg, gold_mi_installation_month_agg, gold_mi_installation_day_agg]
    answer_notes:
      - "Defect counts are meters reported burnt / faulty / replaced in the period (work completed date) -- write 'reported burnt' or 'replaced', never 'installed'."
      - "Defect rate counts Meter Faulty only, over installs of OEMs with defects; burnt is usually a site/load issue, not the OEM."
      - "A high rate from a small installed base (e.g. a few thousand meters) is statistically weak - state the base."
      - "Rate vs count questions (e.g. 'X has few defects, how is its rate highest?'): show each OEM's defects AND installed base from RESULT - a small denominator makes the rate high."
    rules:
      - "Defective meters = SUM(defect_count) FROM public.gold_meter_defect_event_day_agg; period_start = defect (work completed) date; columns category, meter_type, oem, defective_type ('Meter Burnt','Meter Faulty','Others'), detailed_defective_type (reason)."
      - "OEM key: UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown'))."
      - "Defect rate % = SUM(defect_rate_numerator_count) (Meter Faulty only) * 100 / installed, installed = SUM(meter_count) FROM gold_mi_installation_month_agg (day table for partial months) WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL AND <OEM key> IN (SELECT DISTINCT <OEM key> FROM the defect table with the same filters). Apply the same date/place/category filters to both sides (installs: progress_category, inventory_meter_type). Combine via UNION ALL or scalar subqueries."
      - "A 'total defective' answer also shows faulty, burnt, others and load change (UPPER(detailed_defective_type) IN ('LOAD ENHANCEMENT','LOAD REDUCTION'): inside Others, not a fault)."
      - "Burnt trend: monthly Meter Burnt, also per 10,000 cumulative installed; 'METER TERMINAL BURNT' points to connection/load. If burnt's share collapses while total replacements hold, call it a reporting change."
      - "OEM quality: compare with peers in the same category per 1,000 meter-years (installed x years since install month); flag when >15% worse. A high rate from a tiny installed base is noise - state the base."
      - "'Meter replacement' / 'meters replaced' / the Meter Replacement card (KPI 4) = the defective OLD meters: gold_meter_defect_event_day_agg, also for place-wise and meter-type-wise splits (its zone / circle / division / meter_type columns). Only 'replacement installs' / 'new meters fitted as replacements' read gold_mi_installation_day_agg SUM(meter_count) WHERE is_replacement (close but not equal)."
      - "Meter Replacement card: tiles Total Defective, Meter Burnt, Meter Faulty, Others (+ 1PH / 3PH / LTCT / HTCT for consumer), Installed Meters and Defect Rate %; no dates = all time. A defect rate answer split by OEM keeps a Total row (GROUP BY ROLLUP): its rate = all faulty / all installed is the card's Defect Rate %."
    example:
      question: "Defect rate OEM-wise in Kashi"
      sql: |
        SELECT u.oem_key AS oem, SUM(u.defects) AS defective, SUM(u.faulty) AS meter_faulty,
               SUM(u.installed) AS installed,
               ROUND(SUM(u.faulty) * 100.0 / NULLIF(SUM(u.installed), 0), 2) AS defect_rate_pct
        FROM (
          SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) AS oem_key, defect_count AS defects,
                 defect_rate_numerator_count AS faulty, 0 AS installed
          FROM public.gold_meter_defect_event_day_agg
          WHERE LOWER(project) = 'kashi'
          UNION ALL
          SELECT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')), 0, 0, meter_count
          FROM public.gold_mi_installation_month_agg
          WHERE NOT is_replacement AND has_meter_serial AND oem IS NOT NULL AND LOWER(project) = 'kashi'
            AND UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown')) IN (
              SELECT DISTINCT UPPER(COALESCE(NULLIF(TRIM(oem), ''), 'Unknown'))
              FROM public.gold_meter_defect_event_day_agg WHERE LOWER(project) = 'kashi')
        ) u
        GROUP BY u.oem_key
        ORDER BY defect_rate_pct DESC

  mi_productivity:
    domain: wfm
    title: "MI productivity (installs per technician per day)"
    description: "Installation productivity per technician per day, active technicians, active days, monthly productivity trend, top performer / requires support technician, which zone is least productive and why, what-if on productivity or technicians. The DEFAULT for any productivity / technician question with no O&M, complaint or ticket word -- 'productivity per technician per day', 'active technicians in a zone', 'feeder / DT / consumer productivity' (FEEDER, DT, CONSUMER are MI meter categories here, not MDM feeders)."
    keywords: [productivity, per technician, per day, technicians, active technicians, active days, installer, efficiency, productivity trend, monthly productivity, what if, if productivity, more technicians, lowest productivity, why, team, kitne technician, feeder productivity, dt productivity, dtr productivity, consumer productivity, top performer, requires support]
    tables: [gold_mi_technician_productivity_day_agg, gold_mi_productivity_trend_month_agg]
    answer_notes:
      - "Productivity per team = meters installed / technician-days (one technician working one day = 1)."
      - "Low productivity drivers: many technician-days with 0-1 installs, few working days per technician, a heavier DT/feeder mix (slower jobs). Never blame a named person: for 'who is responsible' explain the drivers by zone/unit and say productivity is a team/process measure; a technician list may be shown as data, without calling anyone responsible. A 'top performer' / 'requires support' / 'lowest performing technician' question asks for the dashboard card's pick: name the first technician of the result neutrally as a data point (e.g. 'The card's Requires Support pick is X at 1.00 meters per technician-day; N technicians tie at that value') -- naming them is the answer, not blame."
    rules:
      - "public.gold_mi_technician_productivity_day_agg / _month_agg hold ROLL-UP rows -- read exactly ONE level, never add levels together (that double counts every install): all categories = category = 'ALL' (meter_type NULL); one category = category = 'CONSUMER'/'DT'/'FEEDER' AND meter_type = 'ALL'; one meter type = category <> 'ALL' AND meter_type = '1PH-Consumer_meter' (any category unless consumer is named, then also category = 'CONSUMER'). Category-wise = category <> 'ALL' AND meter_type = 'ALL' GROUP BY category; consumer type-wise = category = 'CONSUMER' AND meter_type <> 'ALL' GROUP BY meter_type. NEVER category <> 'ALL' alone (2x installs), never a query with no category filter (3x)."
      - "Meter types live in fixed categories: 1PH / 3PH only in CONSUMER; LTCT in CONSUMER and DT (DT meters are 3-phase LTCT); HTCT in CONSUMER and FEEDER. A meter type alone ('3PH productivity', 'LTCT meters') = the dashboard's type filter: category <> 'ALL' AND meter_type = 'X-Consumer_meter' across every category -- for LTCT / HTCT also show the consumer-only part (SUM(...) FILTER (WHERE category = 'CONSUMER')). Only 'LTCT consumer' / 'consumer LTCT' wording limits it to category = 'CONSUMER'. NEVER pair DT with 1PH/3PH/HTCT or FEEDER with 1PH/3PH/LTCT (no such rows)."
      - "Answer shape: a question asking productivity / installations / active technicians / active days for ONE place, category and period, with no 'wise', 'by', 'each', 'trend', 'daily', 'weekly', 'monthly' or 'per technician list' word = ONE summary row (no GROUP BY); never GROUP BY period_start or technician_name for it."
      - "TABLE CHOICE: MI productivity questions (summary, day / week / month wise, project / discom / zone / circle / division / sub-division wise, category, technician) read gold_mi_technician_productivity_day_agg (or _month_agg for whole months) -- the dashboard's MI-Productivity per team card. Month wise = GROUP BY period_start on _month_agg; discom wise = GROUP BY discom. A question that names the Monthly Productivity trend card -- the words 'productivity trend', 'monthly productivity', 'month-wise productivity', 'KPI 3' or 'average active technicians' -- reads gold_mi_productivity_trend_month_agg instead: it counts a technician-day once (KPI 2 counts it once per place), so its productivity is higher and only the cube matches that card."
      - "Filters come only from the question: add a category or meter_type filter ONLY when the question names one (consumer / DT / DTR / feeder / 1PH / 3PH / LTCT / HTCT); a place-only question ('PUVVNL productivity', 'Mathura zone productivity') = category = 'ALL'. Never copy a filter from an example or an earlier question."
      - "Dashboard card (MI-Productivity per team): Total installations = SUM(installation_count); Active technicians = COUNT(DISTINCT technician_name); Productivity = installs / SUM(technician_day_count), 2 decimals; Active days = distinct dates for a range up to 45 days (the card counts its trend buckets: weeks for 46-150 days, months beyond). Comparison by place leaves out rows with no place name. No dates + 'as on dashboard' = CURRENT_DATE - 31 .. CURRENT_DATE - 1."
      - "Top performer / requires support (the card's insights): per technician_name over the whole range, NO minimum-days filter; top = ORDER BY productivity DESC, installations DESC, technician_name; requires support = ORDER BY productivity ASC, installations ASC, technician_name. Show the top / bottom 10, name the first as the card's pick, and say how many tie at that productivity."
      - "A named technician: technician_name ILIKE '%<name>%' (stored names carry prefixes / suffixes / IDs), no place filter unless the question states one; GROUP BY project, technician_name so every matching technician is listed."
      - "Productivity per technician per day = ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2); active technicians = COUNT(DISTINCT technician_name); active days = COUNT(DISTINCT period_start); installations = SUM(installation_count). Replacements are excluded; 'how many installed' belongs to the installation topic."
      - "KPI 3 cube (gold_mi_productivity_trend_month_agg): every SELECT filters project (= 'ALL' program-wide or LOWER(project) = 'x'), aggregate_level and filter_level -- each row is repeated per project / scope, so a missing one multiplies installs. Roll-up levels as above (category = 'ALL'; category = 'X' AND meter_type = 'ALL'; the meter-type row). Place scope = filter_level = 'zone'/'circle'/'division'/'sub_division' AND filter_label = 'UPPER NAME' (the cube has no zone / circle columns). Months overlapping the range count whole: month_end >= start AND month_start <= end; no dates = the card default, months overlapping CURRENT_DATE - 1 - 12 months .. CURRENT_DATE - 1."
      - "KPI 3 card shapes: trend = GROUP BY month_start; summary = ONE row over the whole window (not the latest month); 'X wise' comparison = aggregate_level = X GROUP BY label over the whole window (project wise = aggregate_level = 'project' AND project = 'ALL'; inside a place = that place's filter_level / filter_label); category wise = category <> 'ALL' AND meter_type = 'ALL' GROUP BY category; consumer type wise = category = 'CONSUMER' AND meter_type <> 'ALL' GROUP BY meter_type. Measures: productivity = ROUND(SUM(total_installations)::numeric / NULLIF(SUM(technician_day_count), 0), 2); active technicians = SUM(active_technicians) (the card adds months, so a person working 3 months counts 3 times -- say so); avg active technicians (per month) = ROUND(SUM(technician_day_count)::numeric / NULLIF(SUM(active_days), 0), 2)."
      - "Why lowest/highest unit: last 30 complete days; drop units with <2% of technician-days; compare with the average: rate, share of technician-days with installation_count <= 1 and >= 5, working days per technician, meter-type mix (expected rate at all-unit per-type rates)."
      - "Who is highest/lowest BY TECHNICIAN (a named-person extreme, not a project/discom/zone/category one -- those already return every value, see PLAN rules): never a bare LIMIT 1. First find the extreme value (MIN/MAX of SUM(installation_count) per technician_name), then SELECT every technician tied at that exact value -- just technician_name and the installed count, two columns, no LIMIT on them (verified live: many technicians tie at 1 meter installed) -- and NEVER add a COUNT(*)/tie-count column to this SELECT: the number of rows returned already IS the tie count (the answer writer is given RESULT's own row count / 'total available' alongside the rows), so a repeated tie-count column adds nothing and renders as the same number copy-pasted down every row of the table, which looks broken. display.table should list only technician_name and the installed count -- never a tie-count/rank column. The ANSWER TEXT (summary/insights), not the table, is where the tie count is stated, always first ('47 technicians tied for the lowest installation count at 1 meter each.'), derived from that row count. Then: tie count <= 10 -> name every one of them in the summary; tie count > 10 -> state the count only in the summary, do not list the names there either (too many to usefully name) -- this 10 cutoff is for the SUMMARY TEXT only, never for the SQL, which always fetches every tied row so the count itself is exact. Never name just one technician as if uniquely lowest/highest unless the tie count is actually 1."
      - "What-if: base = last 30 complete days; technicians a day = SUM(technician_day_count) / calendar days; installs a day = productivity x technicians; extra = p_new * t_new - p_old * t_old (x30 a month)."
    example:
      question: "Zone-wise installation productivity in Triveni last month"
      sql: |
        SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total'
                    WHEN zone IS NULL OR zone = '' THEN 'Unmapped' ELSE UPPER(zone) END AS zone,
               ROUND(SUM(installation_count)::numeric / NULLIF(SUM(technician_day_count), 0), 2) AS productivity,
               COUNT(DISTINCT technician_name) AS active_technicians,
               COUNT(DISTINCT period_start) AS active_days,
               SUM(installation_count) AS installations
        FROM public.gold_mi_technician_productivity_day_agg
        WHERE category = 'ALL' AND LOWER(project) = 'triveni'
          AND period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '1 month')::date
          AND period_start < date_trunc('month', CURRENT_DATE)::date
        GROUP BY ROLLUP (zone)
        ORDER BY GROUPING(zone) DESC, productivity DESC

  sat_progress:
    domain: wfm
    title: "MI vs SAT progress and invoice funnel"
    description: "Total MI, eligible MI, Total SAT, SAT %, SAT stages (SAT-1..13), meters pending SAT, lumpsum/PMPM invoiced meters and %, MI vs SAT vs invoice funnel, which project lags on SAT."
    keywords: [sat, sat done, total sat, sat progress, sat percent, sat %, eligible, eligible mi, total mi, sat stage, sat 1, sat 13, stage wise, lumpsum invoiced, pmpm invoiced, funnel, certified, lagging, sat pending, not invoiced, baaki]
    tables: [gold_mi_sat_invoice_snapshot, gold_mi_installation_day_agg, sat_eligibility_config]
    answer_notes:
      - "SAT batches are accepted per project in sequence (SAT-1 oldest). The newest batches are smaller/partial; SAT-12 and SAT-13 have no batch dates yet."
      - "Installed-not-SAT (sat_stage IS NULL) = eligible pending (non-SAT) + installed after the cutoff (not yet due). Never call the whole figure eligible."
      - "A plain count of meters 'without SAT' / 'pending SAT' / 'not SAT done' (no age bands asked) ALWAYS returns three columns -- installed_not_sat (public.gold_mi_sat_invoice_snapshot, sat_stage IS NULL), eligible_pending_sat (the Non-SAT Ageing card: SUM(meter_count) of public.gold_non_sat_ageing_snapshot, same filters), not_yet_due (the difference) -- and the answer quotes all three (total = eligible pending + not yet due). Never only one of them."
      - "Total MI includes replacements; eligible MI = installed on/before the project's SAT cutoff (public.sat_eligibility_config). % SAT vs eligible can exceed 100%."
      - "On the dashboard's MI vs SAT bars, the two percentages are % SAT vs MI and % SAT vs eligible MI."
      - "Label each % exactly by its column: sat_pct_vs_mi = 'of installed meters', sat_pct_vs_eligible = 'of eligible meters'."
      - "'Worst'/'best' project: say which measure decides it (count or %) and give both when they disagree."
    rules:
      - "public.gold_mi_sat_invoice_snapshot (no dates, replacements included; columns project.., category, meter_type, sat_stage, is_sat_eligible, has_lumpsum_invoice, has_pmpm_invoice, meter_count)."
      - "Total MI = SUM(meter_count); Eligible MI = FILTER (WHERE is_sat_eligible) (installed on/before the project cutoff in public.sat_eligibility_config); Total SAT = FILTER (WHERE sat_stage IS NOT NULL); SAT (eligible) = both."
      - "% SAT vs MI = Total SAT / Total MI; % SAT vs eligible MI = Total SAT (ALL SAT meters, sat_stage IS NOT NULL) / Eligible MI (dashboard formula, can exceed 100%) -- never SAT(eligible) / Eligible MI. Always show eligible MI, Total SAT and the %."
      - "Lumpsum / PMPM invoiced = FILTER (WHERE has_lumpsum_invoice / has_pmpm_invoice); invoice % = invoiced / Total SAT - never / MI, never add lumpsum and PMPM. 'SAT done not invoiced' = sat_stage IS NOT NULL AND NOT has_lumpsum_invoice (or has_pmpm_invoice)."
      - "Pending: installed not SAT = sat_stage IS NULL; eligible pending = the Non-SAT Ageing card total (gold_non_sat_ageing_snapshot; sat_stage IS NULL AND is_sat_eligible on this snapshot can differ by a few meters); not due yet = sat_stage IS NULL AND NOT is_sat_eligible."
      - "'SAT progress' = Total MI, Total SAT, % SAT vs MI and pending. Lagging/behind = lowest % SAT vs MI, not fewest SAT."
      - "MI vs SAT vs Invoice funnel = installed, SAT done, lumpsum invoiced, PMPM invoiced, plus % lumpsum of SAT and % PMPM of SAT. Lumpsum and PMPM counts are equal today (every batch carries both) -- that is the data."
      - "Stage-wise: WHERE sat_stage IS NOT NULL GROUP BY sat_stage, label 'SAT-' || sat_stage. sat_stage is a tier: never SUM it."
      - "OEM-wise: the snapshot has no oem; use gold_mi_installation_day_agg (no replacement filter) with inventory_category as category, inventory_meter_type, sat_stage, meter_count - Total MI / Total SAT only."
    example:
      question: "SAT progress project-wise"
      sql: |
        SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
               SUM(meter_count) AS total_mi,
               COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS total_sat,
               ROUND(COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) * 100.0
                     / NULLIF(SUM(meter_count), 0), 2) AS sat_pct_vs_mi,
               COALESCE(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0) AS eligible_mi,
               ROUND(COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) * 100.0
                     / NULLIF(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0), 2) AS sat_pct_vs_eligible,
               COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NULL), 0) AS installed_sat_pending
        FROM public.gold_mi_sat_invoice_snapshot
        GROUP BY ROLLUP (project)
        ORDER BY GROUPING(project) DESC, total_mi DESC

  sat_target:
    domain: wfm
    title: "SAT target, gap and ETA"
    description: "How many more SAT meters are needed to reach X% of eligible (or total) MI, room left, SAT pace per month and when the target will be reached."
    keywords: [sat target, reach, 95%, 98%, how many more sat, when will we reach, by when, kab tak, sat pace, eta, target percent, achieve, gap to target]
    tables: [gold_mi_sat_invoice_snapshot, sat_milestones]
    rules:
      - "Base = Eligible MI (Total MI when the question says 'of MI/installed') from public.gold_mi_sat_invoice_snapshot; % now = Total SAT / base * 100."
      - "Needed = GREATEST(CEIL(target / 100.0 * base) - Total SAT, 0). Strict view: CEIL(target/100 * eligible) - SAT(eligible)."
      - "Room = Eligible MI - SAT(eligible) (Total MI - Total SAT on the MI base); needed > room means unreachable until the cutoff moves."
      - "Pace (separate Athena query): gmr_wfm_silver.sat_milestones (project, sat_number 'SAT-n', sat_date) gives each batch's SAT date; batch size = snapshot SUM(meter_count) per LOWER(project), sat_stage. Pace = meters in batches with sat_date >= today - 182 days, * 30.44 / 182 per month. Undated batches sit between their dated neighbours."
      - "ETA = today + needed / (pace / 30.44) days; also say how many batches of the recent average size that is. Give per-project figures when several projects are in scope."
    example:
      question: "How many more SAT meters does Triveni need to reach 95% of eligible?"
      sql: |
        SELECT SUM(meter_count) FILTER (WHERE is_sat_eligible) AS eligible_mi,
               SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) AS total_sat,
               ROUND(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL) * 100.0
                     / NULLIF(SUM(meter_count) FILTER (WHERE is_sat_eligible), 0), 2) AS sat_pct_now,
               GREATEST(CEIL(0.95 * SUM(meter_count) FILTER (WHERE is_sat_eligible))
                        - SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS more_needed,
               SUM(meter_count) FILTER (WHERE is_sat_eligible AND sat_stage IS NULL) AS room_eligible_waiting
        FROM public.gold_mi_sat_invoice_snapshot
        WHERE LOWER(project) = 'triveni'

  sat_invoice:
    domain: wfm
    title: "SAT batches, invoicing lag and PMPM estimate"
    description: "SAT batch dates, lag between SAT and first invoice, invoice and collection dates per batch, why SAT-done meters are not invoiced, estimated PMPM billing for the month."
    keywords: [sat batch, sat date, milestone, invoice date, lag, sat to invoice, first invoice, collection date, not invoiced, why not invoiced, pmpm estimate, estimate billing, pmpm rate, per meter rate]
    tables: [sat_milestones, gold_mi_sat_invoice_snapshot, revenue_receivables, gold_meter_revenue_pending_stage_snapshot]
    answer_notes:
      - "Invoicing is done per SAT batch after acceptance; a batch with no invoice date (e.g. the newest batches) explains SAT-done meters not yet invoiced."
    rules:
      - "gmr_wfm_silver.sat_milestones (Athena, ~34 rows): one row per project + sat_number ('SAT-n'; stage = CAST(regexp_extract(sat_number, '(\\d+)') AS INTEGER)) with sat_date, lumpsum_invoice_date, pmpm_invoice_date, lumpsum_collection_date, pmpm_collection_date. Compare LOWER(project)."
      - "SAT -> first invoice lag per batch = GREATEST(date_diff('day', sat_date, LEAST(lumpsum_invoice_date, pmpm_invoice_date)), 0) (whichever is set); the average is weighted by batch meters (snapshot SUM(meter_count) per project, sat_stage) - a second, Postgres query. Say how many meters lack dates."
      - "Not invoiced (Postgres): snapshot sat_stage IS NOT NULL AND NOT has_pmpm_invoice / NOT has_lumpsum_invoice / neither. This is NOT the current-stage 'SAT done, revenue pending' (that one = SAT number but no PMPM COLLECTION, whatever the invoice status) nor revenue ageing (SAT date, no PMPM collection) -- never explain one with the other. Reasons in the data: invoicing is per SAT batch, milestone dates are operator-entered, unparsable SAT numbers."
      - "PMPM rate (Rs/meter/month) = latest pmpm_invoiced (cr) * 1e7 / meter-months billed (each batch's lumpsum-invoiced meters x months since its pmpm_invoice_date, as of the receivables row). Estimate for a month = rate x PMPM-invoiced meters (has_pmpm_invoice). Lumpsum rate = latest lumpsum_invoiced * 1e7 / lumpsum-invoiced meters. Steady-state estimate, no month column exists."
    example:
      question: "Days between SAT and first invoice for each SAT batch"
      sql: |
        SELECT LOWER(project) AS project, sat_number AS sat_batch, sat_date,
               LEAST(lumpsum_invoice_date, pmpm_invoice_date) AS first_invoice_date,
               GREATEST(date_diff('day', sat_date, LEAST(lumpsum_invoice_date, pmpm_invoice_date)), 0) AS lag_days,
               lumpsum_collection_date, pmpm_collection_date
        FROM gmr_wfm_silver.sat_milestones
        WHERE sat_date IS NOT NULL
        ORDER BY project, sat_date

  non_sat_ageing:
    domain: wfm
    title: "Non-SAT ageing (eligible meters pending SAT)"
    description: "Eligible installed meters still waiting for SAT, by age band (0-30 .. 120+ days), place, category; revenue at risk from them; why meters get stuck; why young bands are empty."
    keywords: [non sat, non-sat, sat pending, pending sat, not sat, waiting for sat, ageing, aging, age band, older than 90 days, 120+ days, stuck, revenue at risk, blocked, cutoff, eligible pending, atka]
    tables: [gold_non_sat_ageing_snapshot, gold_mi_sat_invoice_snapshot, gold_mi_installation_day_agg, sat_eligibility_config]
    answer_notes:
      - "Non-SAT counts ELIGIBLE meters only: installs after the project cutoff (public.sat_eligibility_config) are 'not yet due' and not aged - so 0-90 day bands are empty."
      - "Any mismatch between project totals and band totals usually means different scopes (all pending vs eligible pending, or replacements in/out) - quote both figures from RESULT."
      - "A plain count 'without SAT' / 'pending SAT' (no age bands asked) is not an ageing question: return installed_not_sat and not_yet_due from public.gold_mi_sat_invoice_snapshot (sat_stage IS NULL; AND NOT is_sat_eligible) and eligible_pending_sat from the Non-SAT Ageing card (SUM(meter_count) of public.gold_non_sat_ageing_snapshot), and quote all three. Per project / 'which project is worst' = the card's project totals too."
      - "Why meters get stuck: 'stuck' = ELIGIBLE meters with no SAT batch. Not-yet-due meters (installed after the cutoff) are not stuck, so the cutoff is never the reason. No reason is recorded: say so, then name the group with the highest stuck rate (DTR far above consumer)."
    rules:
      - "Non-SAT = ELIGIBLE meters only (installed on/before the project cutoff) without a SAT batch: SUM(meter_count) FROM public.gold_non_sat_ageing_snapshot. Never count is_non_sat_pending alone (includes not-yet-eligible installs). (gold_mi_sat_invoice_snapshot WHERE sat_stage IS NULL AND is_sat_eligible differs by a few meters -- quote the ageing snapshot, the card's figure.)"
      - "Bands age_key: 'age_0_30','age_31_60','age_61_90','age_91_120','age_120_plus' (days since installation, frozen at refresh); order with CASE. Only band edges 30/60/90/120 are answerable: 'over 90 days' = age_91_120 + age_120_plus. An ageing question gets Total plus every band; labels 0-30 days ... 120+ days."
      - "Young bands are empty because the newest cutoff (public.sat_eligibility_config.eligibility_cutoff_date) is already months old; installs after the cutoff are not in this card."
      - "No oem, no dates. Category labels: DT -> 'DTR'."
      - "Card answer (no breakdown asked): one row per band in order (0-30 .. 120+, empty bands as 0) plus Total, over the whole scope -- never split by project unless asked. 'X wise' adds the bands as columns per X (see example)."
      - "Revenue at risk = meters in the asked bands x lumpsum per meter (blocked) and x PMPM per meter per month (deferred); rates from the latest revenue_receivables row (see sat_invoice topic); a year = lumpsum + 12 x PMPM."
      - "Stuck why: stuck rate = eligible pending / eligible per group - category, meter_type (snapshot), replacement vs new (gold_mi_installation_day_agg is_non_sat_pending, period_start <= project cutoff). No reason field exists."
    example:
      question: "Non-SAT ageing project-wise"
      sql: |
        SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
               SUM(meter_count) AS total_non_sat,
               COALESCE(SUM(meter_count) FILTER (WHERE age_key = 'age_0_30'), 0) AS days_0_30,
               COALESCE(SUM(meter_count) FILTER (WHERE age_key = 'age_31_60'), 0) AS days_31_60,
               COALESCE(SUM(meter_count) FILTER (WHERE age_key = 'age_61_90'), 0) AS days_61_90,
               COALESCE(SUM(meter_count) FILTER (WHERE age_key = 'age_91_120'), 0) AS days_91_120,
               COALESCE(SUM(meter_count) FILTER (WHERE age_key = 'age_120_plus'), 0) AS days_120_plus
        FROM public.gold_non_sat_ageing_snapshot
        GROUP BY ROLLUP (project)
        ORDER BY GROUPING(project) DESC, total_non_sat DESC

  receivables:
    domain: wfm
    title: "Receivables: invoice vs revenue released (money)"
    description: "Receivables summary - delay analysis (money, crore): Invoice Amount (Net), Realised, Within Timeline (unpaid, not yet due), Overdue, outstanding, % realised for lumpsum, PMPM and cable, per project, and their history across submissions."
    keywords: [receivables, invoiced amount, invoice amount net, net invoice, realised, realized, released, collected, collection, outstanding, overdue, overdue amount, dues, payment, delay analysis, within timeline, on time, crore, revenue released, lumpsum amount, pmpm amount, cable revenue, paisa, collection efficiency, money stuck, owes]
    tables: [revenue_receivables]
    answer_notes:
      - "Collection efficiency = realised / invoiced (rupees, crore)."
      - "Amounts are to-date balances: never add them across days or submissions ('Rs 57.5 crore per day', 'a combined Rs 370.2 crore') -- give the latest figure and its change since the first day shown."
      - "Amounts are filed per project only. When the question asks for a category (consumer / DT / feeder), meter type, zone or date split, open with one plain sentence that this split is not recorded, then give the project-level figures as the closest answer."
    rules:
      - "public.revenue_receivables: operator-entered amounts already in crore; columns lumpsum_/pmpm_/cable_ x invoiced, realised, within_timeline; project lower-case; created_at."
      - "Current figures = each project's LATEST row: ROW_NUMBER() OVER (PARTITION BY project ORDER BY created_at DESC, id DESC) = 1, then SUM across projects."
      - "Dashboard card (Receivables summary - Delay analysis), per stream: Invoice Amount (Net) = <stream>_invoiced; Realised = <stream>_realised; Within Timeline = <stream>_within_timeline = UNPAID money that is not yet due; Overdue = invoiced - realised - within_timeline (unpaid and past due). Realised + Within Timeline + Overdue = Invoice Amount. Outstanding (all unpaid) = invoiced - realised = Within Timeline + Overdue; % realised = realised / invoiced x 100. Never 'realised - within_timeline' and never call within_timeline 'realised on time'."
      - "Default answer and 'delay analysis' / 'overdue' / 'invoice vs revenue released': per stream (Lumpsum, PMPM, Cable) plus All streams -- invoice_amount_net, realised, within_timeline, overdue, % realised. A negative overdue means the operator's figures do not add up (within_timeline larger than the unpaid amount): show it and say so."
      - "History/trend/change: every row ORDER BY project, created_at (latest vs previous submission per project). To-date amounts should not fall - flag a decrease as a correction."
      - "Totals over time ('growth', 'trend', 'daily', 'over time', 'history' for all projects): amounts are TO-DATE, so never SUM rows of a day / month (that adds repeat submissions: 420.4 cr) and never difference single rows (-100 cr). For each as-of day = DISTINCT (created_at AT TIME ZONE 'Asia/Kolkata')::date, take each project's latest row filed on or before it (ROW_NUMBER() OVER (PARTITION BY as_of, project ...)) and SUM those; growth = LAG over as-of days. Submissions exist only from 1 Sep 2026: say a range with no filing has no data."
      - "% on time / % within timeline = <stream>_within_timeline / <stream>_invoiced x 100 (the card's Within Timeline bar %; card rounds to whole %), never % realised. 'Realised late' is not recorded: realised money is not split into on-time / late. Say so, then give Overdue (invoiced - realised - within_timeline, unpaid past due) and Within Timeline."
      - "Amounts are already in crore: never divide or multiply them by 10^5 / 10^7. Outstanding / pending amount / 'highest outstanding' = invoiced - realised per stream (all three streams summed for a project ranking), never the revenue ageing meter counts."
      - "Discom = its projects: PUVVNL = kashi + triveni, DVVNL = agra -- filter LOWER(project) IN (...) for a discom. Project-wise keeps every stream separate (lumpsum, PMPM, cable columns), never one merged amount."
      - "Filed per project only: no category, zone, meter type or date split. Such a question is NOT unanswerable: drop that filter, return the asked stream/measure per project plus Total (the answer writer says the split is not recorded). Never use meter-count tables for money."
    example:
      question: "Lumpsum and PMPM invoiced vs realised project-wise"
      sql: |
        SELECT UPPER(project) AS project,
               lumpsum_invoiced, lumpsum_realised, lumpsum_invoiced - lumpsum_realised AS lumpsum_outstanding,
               ROUND(lumpsum_realised * 100.0 / NULLIF(lumpsum_invoiced, 0), 2) AS lumpsum_pct_realised,
               pmpm_invoiced, pmpm_realised, pmpm_invoiced - pmpm_realised AS pmpm_outstanding,
               ROUND(pmpm_realised * 100.0 / NULLIF(pmpm_invoiced, 0), 2) AS pmpm_pct_realised,
               created_at AS submitted_at
        FROM (SELECT r.project, r.created_at, r.lumpsum_invoiced, r.lumpsum_realised, r.pmpm_invoiced,
                     r.pmpm_realised,
                     ROW_NUMBER() OVER (PARTITION BY r.project ORDER BY r.created_at DESC, r.id DESC) AS rn
              FROM public.revenue_receivables r) latest
        WHERE rn = 1
        ORDER BY project

  revenue_ageing:
    domain: wfm
    title: "Revenue not realized ageing"
    description: "SAT-certified meters whose PMPM revenue is not yet collected, aged from the SAT date: bands, any threshold, average and oldest age, by place, category, meter type or SAT date."
    keywords: [revenue not realized, revenue not realised, revenue ageing, uncollected, pmpm not collected, outstanding meters, days since sat, oldest sat date, average age, revenue pending ageing]
    tables: [gold_revenue_ageing_snapshot]
    rules:
      - "public.gold_revenue_ageing_snapshot: SUM(outstanding_count) = SAT-done meters whose batch has no PMPM collection date. Every figure is a METER count: say '157,979 meters', never Rs / crore (money is the receivables topic)."
      - "Age = GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0). Bands: <= 30, 31-60, 61-90, 91-120, > 120 days; any custom threshold works."
      - "Average age = SUM(age * n) / SUM(n) with n = SUM(outstanding_count) per sat_date in a subquery; oldest = MIN(sat_date)."
      - "Breakdowns: place, category (DT label 'DT'), meter_type, sat_date. Not Non-SAT ageing, not rupees (receivables), not the current-stage tables."
      - "A project / place with no rows has 0 outstanding (its PMPM collection arrived -- Agra today): answer 0 and say why, never 'no data'. Show every band, empty ones as 0."
      - "'outstanding older than N days' / 'outstanding for N-M days' = this table with GREATEST(today - sat_date, 0) > N (or BETWEEN): never gold_non_sat_ageing_snapshot (meters waiting for SAT)."
      - "Why it differs from the current-stage 'SAT done, revenue pending' (540,367 vs 157,979 on 27 Oct 2026): both mean 'SAT batch has no PMPM collection date', but this ageing table keeps only meters whose SAT batch has a SAT date in sat_milestones (an age needs a start date); the current-stage count keeps every installed meter carrying a SAT number with no PMPM collection recorded, including batches with no milestone row / SAT date (all of Agra's 188,688)."
    example:
      question: "Revenue not realized ageing band-wise"
      sql: |
        SELECT CASE WHEN GROUPING(band) = 1 THEN 'Total' ELSE band END AS age_band,
               SUM(outstanding_count) AS meters
        FROM (SELECT outstanding_count,
                     CASE WHEN GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) <= 30 THEN '0-30 days'
                          WHEN GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) <= 60 THEN '31-60 days'
                          WHEN GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) <= 90 THEN '61-90 days'
                          WHEN GREATEST((CURRENT_TIMESTAMP AT TIME ZONE 'Asia/Kolkata')::date - sat_date, 0) <= 120 THEN '91-120 days'
                          ELSE '120+ days' END AS band
              FROM public.gold_revenue_ageing_snapshot) b
        GROUP BY ROLLUP (band)
        ORDER BY GROUPING(band) DESC, band

  current_stage:
    domain: wfm
    title: "Meters current stage (revenue not realized)"
    description: "Where meters without realized revenue sit now: inventory, agency, supervisor, technician (not installed), installed SAT pending, SAT done revenue pending; by project, category or meter type."
    keywords: [current stage, which stage, stuck where, with agency, with supervisor, with technician, in inventory, not installed, not yet installed, uninstalled, installed sat pending, sat done revenue pending, revenue not realized stage, pipeline]
    tables: [gold_meter_installation_pending_stage_snapshot, gold_meter_revenue_pending_stage_snapshot]
    rules:
      - "Source = (SELECT project, discom, zone, category, meter_type, current_stage, meter_count FROM public.gold_meter_installation_pending_stage_snapshot UNION ALL SELECT project, discom, zone, UPPER(category), meter_type, current_stage, meter_count FROM public.gold_meter_revenue_pending_stage_snapshot) n; every figure SUM(meter_count). Both have discom and zone (the first four stages take the zone of the warehouse holding the meter, like stock), so a zone / discom filter or zone-wise breakdown goes on the outer query over n."
      - "current_stage order: 'inventory','agency','supervisor','technician' (not yet installed), 'installation_done_sat_pending','sat_done_revenue_pending' (installed, revenue pending). Total = all six. The app shows them as the dashboard's workflow stages: DI to Agency, Agency to Supervisor, Supervisor to Technician, Technician to Installation, Installation to SAT, SAT to Revenue -- answer with THESE names, never 'installation pending' / 'SAT pending' wording."
      - "Stage definitions (gold ETL): the first four = meters in stock not yet installed, by the furthest hand-off reached; 'installation_done_sat_pending' = installed meter with no SAT number; 'sat_done_revenue_pending' = installed meter with a SAT number whose SAT batch has no PMPM collection date (invoicing does not matter). 'Not (yet) installed' = SUM of the first four from gold_meter_installation_pending_stage_snapshot (109,837 on 27 Oct 2026), never blank serials in unified_installations."
      - "'revenue not realized meters' (any count or breakdown: total, project / zone / category wise) = dashboard KPI 16 = ALL SIX stages from the UNION source (both tables): meters not installed yet are revenue-not-realized too. The revenue-pending table alone (installed meters only) is used only when the question names an installed stage ('installed but SAT pending', 'SAT done but revenue pending'); 'revenue not realized ageing' is the revenue_ageing topic."
      - "'stage wise' / 'each stage' / 'revenue not realized stage wise' = ALL SIX stages from the UNION source above (both tables), one row per stage in workflow order (ORDER BY CASE current_stage ...) plus Total -- never the revenue-pending table alone (that is only the last two stages)."
      - "Circle / division / sub_division exist only for stages 5-6 (gold_meter_revenue_pending_stage_snapshot); for a circle or division question give stages 5-6 for it and say the first four stages are tracked per warehouse / zone. No dates."
      - "Not unutilized stock ageing, not Non-SAT ageing."
      - "Consumer meters = category 'CONSUMER' with every meter_type, OTHER-Consumer_meter included -- never drop a meter type the question did not exclude."
    example:
      question: "Current stage of meters with revenue not realized, project-wise"
      sql: |
        SELECT CASE WHEN GROUPING(project) = 1 THEN 'Total' ELSE UPPER(project) END AS project,
               COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'inventory'), 0) AS inventory,
               COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'agency'), 0) AS agency,
               COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'supervisor'), 0) AS supervisor,
               COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'technician'), 0) AS technician,
               COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'installation_done_sat_pending'), 0) AS installed_sat_pending,
               COALESCE(SUM(meter_count) FILTER (WHERE current_stage = 'sat_done_revenue_pending'), 0) AS sat_done_revenue_pending,
               SUM(meter_count) AS total_meters
        FROM (SELECT project, category, meter_type, current_stage, meter_count
              FROM public.gold_meter_installation_pending_stage_snapshot
              UNION ALL
              SELECT project, UPPER(category), meter_type, current_stage, meter_count
              FROM public.gold_meter_revenue_pending_stage_snapshot) n
        GROUP BY ROLLUP (project)
        ORDER BY GROUPING(project) DESC, total_meters DESC

  journey_time:
    domain: wfm
    title: "Meter journey average time"
    description: "Average days per journey stage: DI to agency, agency to supervisor, supervisor to technician, technician to installation, installation to SAT, SAT to revenue, total journey; slowest zone or category."
    keywords: [journey, journey time, average days, lead time, turnaround, levels, journey levels, journey steps, across the levels, di to agency, agency to supervisor, supervisor to technician, technician to installation, installation to sat, sat to revenue, total journey, how long, slowest, fastest, kitne din, journey stage]
    tables: [gold_meter_journey_stage_agg]
    rules:
      - "public.gold_meter_journey_stage_agg; every figure is a ratio of sums ROUND(SUM(x) / NULLIF(SUM(den), 0), 2), never AVG: DI to Agency inventory_to_agency_days_sum, Agency to Supervisor agency_to_supervisor_days_sum, Supervisor to Technician supervisor_to_technician_days_sum, Technician to Installation technician_to_installation_days_sum - all / meter_count; Installation to SAT installation_to_sat_days_sum / sat_meter_count; SAT to Revenue sat_to_revenue_realized_days_sum and Total Journey total_journey_days_sum / revenue_realized_meter_count. Total meters = SUM(meter_count)."
      - "Stages do not add up to Total Journey (different denominators) - say so when showing all."
      - "Always include total meters (SUM(meter_count)) -- the card's Total Meters tile -- beside the stage averages (a 'Total meters' row or a total_meters column)."
      - "WORDING: 'levels' / 'stages' / 'steps' / 'across the levels' / 'stage wise' of the meter journey = the SIX stages (DI to Agency, Agency to Supervisor, Supervisor to Technician, Technician to Installation, Installation to SAT, SAT to Revenue) plus Total Journey -- one row per stage in that order, never only the total. 'for revenue realized' = the usual figures (SAT to Revenue and Total Journey are over revenue-realized meters). The journey starts at DI (receipt into stock), not at installation. Stages BY another dimension ('zone wise', 'category wise', 'by division', 'project wise'): ONE ROW PER that dimension (ROLLUP Total row) with the six stages + total_journey as COLUMNS (di_to_agency ... total_journey) -- never one row per zone x stage (35 rows the answer cannot cover)."
      - "Replacements included; add NOT is_replacement only when asked to exclude them (the home-page headline tile is the one exception). Only time filter: installation_year (integer) -- 'meters installed in 2025' / 'for 2026' = WHERE installation_year = 2025, never supply_month."
      - "'Total & Category wise' / 'category wise' / 'by category' = the card's comparison: one row per category (CONSUMER, DT, FEEDER) plus a Total row (GROUP BY ROLLUP (category)), the six stages + total_journey as columns. Never the home tile's Consumer vs Non-consumer split."
      - "Every figure is in DAYS -- never hours."
      - "'time to revenue realization' alone = Total Journey. Slowest/fastest = rank by the asked stage. Category label 'DT'; consumer types via meter_type."
    example:
      question: "Average journey time per stage zone-wise for Agra"
      sql: |
        SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total'
                    WHEN zone IS NULL OR zone = '' THEN 'Unmapped' ELSE UPPER(zone) END AS zone,
               ROUND(SUM(inventory_to_agency_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS di_to_agency,
               ROUND(SUM(agency_to_supervisor_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS agency_to_supervisor,
               ROUND(SUM(supervisor_to_technician_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS supervisor_to_technician,
               ROUND(SUM(technician_to_installation_days_sum) / NULLIF(SUM(meter_count), 0), 2) AS technician_to_installation,
               ROUND(SUM(installation_to_sat_days_sum) / NULLIF(SUM(sat_meter_count), 0), 2) AS installation_to_sat,
               ROUND(SUM(sat_to_revenue_realized_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS sat_to_revenue,
               ROUND(SUM(total_journey_days_sum) / NULLIF(SUM(revenue_realized_meter_count), 0), 2) AS total_journey,
               SUM(meter_count) AS total_meters
        FROM public.gold_meter_journey_stage_agg
        WHERE LOWER(project) = 'agra'
        GROUP BY ROLLUP (zone)
        ORDER BY GROUPING(zone) DESC, total_meters DESC

  inventory_utilization:
    domain: wfm
    title: "Supply, utilization rate and remaining stock"
    description: "Meters supplied/received into stock, installed, supply utilization rate %, remaining stock, MI pace vs stock, supply trend, supplied minus installed vs stock reconciliation."
    keywords: [supply, supplied, received, receipts, inventory, utilization, utilisation, utilization rate, remaining stock, stock balance, stock left, available stock, mi pace, keeping pace, supply vs installation, reconcile, reconciliation, net, maal]
    tables: [gold_meter_inventory_event_day_agg, gold_meter_inventory_event_month_agg, gold_mi_installation_day_agg]
    answer_notes:
      - "Supplied - MI installs differs from stock because replacement installs also leave stock, and some installs have no stock record."
      - "MI pace vs stock: say what each number is and its period in the first sentence -- 'stock today', 'average installs per day over <pace_period>', 'days of stock left at that pace' -- then name the category / place that runs out first. Never a bare Yes/No 'keeping pace' without the numbers behind it."
      - "Utilization rate is always cumulative (everything supplied / installed up to that date), so it never jumps above 100% for one month or one date range. For a range, the rate is as of the range's end date; the range's own supplied / installed are movement, shown beside it, never divided into a rate."
      - "Zone-wise / one-zone supplied, stock and utilization include the meters still in stock, counted in the zone of the warehouse holding them (the app maps each warehouse to its zone from the live data). Group by zone as usual. Circle / division have no stock: there, stock shows as 'Not installed yet (in stock)' -- never call that a circle / division and never answer just '0'."
      - "A supply utilization or MI pace vs stock answer gives the card's four figures: total supplies, total installed, utilization % and remaining stock (never the rate alone). MI pace vs stock adds installs per day and days of stock left beside them."
      - "Two or more warehouses / OEMs / SKUs / projects named: a Total row for them combined first (GROUP BY ROLLUP), then one row each."
    rules:
      - "public.gold_meter_inventory_event_day_agg (month_agg for whole months). Supplies = SUM(inventory_count); installed = SUM(installed_count); utilization % = installed / supplies; remaining stock = SUM(inventory_count) - SUM(stock_consumed_count)."
      - "Cumulative up to the period end: WHERE period_start <= end (rate and stock are always balances) -- also for 'utilization from <date> to <date>' / 'utilization summary for <period>' / 'utilization in <month>': rate = SUM(installed_count) / SUM(inventory_count) over period_start <= the END date; in-period supplied / installed may be added as SUM(...) FILTER (WHERE period_start >= start) columns. NEVER compute utilization % from one period's rows only. Exception (counts only, no rate): 'how many supplied/installed IN <period>' without till/so far/cumulative = that period only (period_start BETWEEN), plus net = supplied - installed and a keeping-pace verdict (supplies >= installs)."
      - "Trend tables (monthwise / weekly utilization): running totals SUM(x) OVER (ORDER BY bucket), with earlier history folded into the first bucket (GREATEST(date_trunc('month', period_start), start) and no lower date bound); utilization % per bucket = cumulative installed / cumulative supplied."
      - "circle/division are NULL for meters still in stock: label them 'Not installed yet (in stock)' (zone is filled from the warehouse automatically). category by the inventory SKU rule; DT/feeder stock meter_type is raw '3PLTCTSM'/'HTCTPTSM'."
      - "warehouse, sku and oem are columns of both event tables (the meter's stock warehouse / SKU / OEM): filter with LOWER(warehouse) = 'agra_hw', UPPER(oem) = 'AEW', UPPER(sku) = 'M-1PWC1060-C-CAP'. Warehouse-wise / OEM-wise / SKU-wise = GROUP BY that column over every row up to the as-of date (never only the groups active in the latest month), blank label rows left out of the breakdown but kept in the Total."
      - "A name ending HW / ZW / SWH / Warehouse is a WAREHOUSE, never a project: 'Agra HW' = warehouse Agra_HW, not project agra. Warehouses: Agra_HW, Aligarh Warehouse, Azamgarh_ZW, BALLIA_SWH, Chandauli_SWH, GHAZIPUR_SWH, JAUNPUR_SWH, MAU_SWH, Mirzapur_ZW, Prayagraj_HW, Varanasi_HW."
      - "Reconciliation 'supplied - installed vs stock': supplied - MI-progress installs - replacement installs (gold_mi_installation_day_agg is_replacement; they leave stock but are not MI progress) +/- net adjustment (installs with no stock record less scrapped stock) = stock. Separate queries per table."
    example:
      question: "Supply utilization category-wise as of today"
      sql: |
        SELECT CASE WHEN GROUPING(category) = 1 THEN 'Total'
                    WHEN category = 'DT' THEN 'DTR' WHEN category = 'FEEDER' THEN 'Feeder'
                    WHEN category = 'CONSUMER' THEN 'Consumer' ELSE 'Unmapped' END AS category,
               SUM(inventory_count) AS total_supplies,
               SUM(installed_count) AS total_installed,
               ROUND(SUM(installed_count) * 100.0 / NULLIF(SUM(inventory_count), 0), 2) AS utilization_rate_pct,
               SUM(inventory_count) - SUM(stock_consumed_count) AS remaining_stock
        FROM public.gold_meter_inventory_event_day_agg
        WHERE period_start <= CURRENT_DATE
        GROUP BY ROLLUP (category)
        ORDER BY GROUPING(category) DESC, total_supplies DESC

  stock_ageing:
    domain: wfm
    title: "Unutilized stock ageing"
    description: "Meters lying unused in stock by age since DI date, warehouse, OEM, SKU, holder stage (warehouse/agency/supervisor/technician), project, category, meter type."
    keywords: [unused stock, unutilized, unutilised, stock ageing, stock aging, old stock, lying, warehouse, store, godown, sku, held by technician, with technicians, with technician, with supervisors, with agency, unused meters, lying unused, days old, 90+ days, di date]
    tables: [gold_inventory_unutilized_stock_snapshot]
    rules:
      - "public.gold_inventory_unutilized_stock_snapshot: SUM(stock_count) = received, never installed, never scrapped."
      - "Age = GREATEST(CURRENT_DATE - inventory_date, 0); bands <= 30, 31-60, 61-90, > 90 days; any custom threshold works. An ageing question gets Total plus every band."
      - "Dimensions: project, warehouse (mixed case, e.g. 'Agra_HW' - compare UPPER(warehouse)), oem (UPPER), sku, current_stage ('warehouse','agency','supervisor','technician'), category, meter_type. No zone/circle/division, no date range (as of today)."
      - "'Less than N days of stock' is the stock_cover topic, not age. Show every band, empty ones as 0."
      - "A name ending HW / ZW / SWH / Warehouse is a WAREHOUSE filter (LOWER(warehouse) = 'agra_hw'), never a project: 'Agra HW' is warehouse Agra_HW, not project agra."
    example:
      question: "Unused stock ageing warehouse-wise"
      sql: |
        SELECT CASE WHEN GROUPING(warehouse) = 1 THEN 'Total' ELSE UPPER(warehouse) END AS warehouse,
               SUM(stock_count) AS total_stock,
               COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) <= 30), 0) AS days_0_30,
               COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) BETWEEN 31 AND 60), 0) AS days_31_60,
               COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) BETWEEN 61 AND 90), 0) AS days_61_90,
               COALESCE(SUM(stock_count) FILTER (WHERE GREATEST(CURRENT_DATE - inventory_date, 0) > 90), 0) AS days_90_plus
        FROM public.gold_inventory_unutilized_stock_snapshot
        GROUP BY ROLLUP (warehouse)
        ORDER BY GROUPING(warehouse) DESC, total_stock DESC

  stock_cover:
    domain: wfm
    title: "Stock cover (how many days stock will last)"
    description: "At the current pace, how many days the stock will last, overall and per project/category/meter type/OEM/warehouse; which sites have less than N days of stock."
    keywords: [how many days, stock last, run out, running out, days of stock, stock cover, enough stock, at current pace, less than a week of stock, kitne din chalega, sites running out, stores running out, warehouse days left, godown stock]
    tables: [gold_meter_inventory_event_day_agg, gold_inventory_unutilized_stock_snapshot, gold_mi_installation_day_agg, unified_smart_meter_inventory, unified_installations]
    answer_notes:
      - "'Which have less than N days' with none below N: say none, and name the lowest few with their days left."
      - "Days left = stock / average daily stock consumption (last 6 months). Run-out date = today + days left. When stock runs out, installs stop, so the eligible pool for SAT stops growing."
    rules:
      - "Stock = SUM(inventory_count) - SUM(stock_consumed_count) over all dates of public.gold_meter_inventory_event_day_agg."
      - "Pace (meters leaving stock a day) default = average of the last 6 months' daily rates: each month's SUM(stock_consumed_count) / its days (current month: days elapsed), averaged over 6 (missing months = 0). 'last N days/weeks' or a named range = consumed in it / its days; 'last N months' = N-month average."
      - "Days left = stock / pace; pace < 1 a day = 'not being used'. Show total, each category and each project; say what runs out first (< 85% of the total's days and >= 5% of stock)."
      - "Store / site / godown / depot = warehouse. Warehouse-wise is ONE Athena query on gmr_wfm_silver (follow the warehouse example): stock = latest unified_smart_meter_inventory row per serial with no installed_ts and no unified_installations row; pace = meters installed a day from that warehouse (installed_ts). Never answer a store / site / warehouse ask with project or category rows."
      - "OEM-wise: stock from gold_inventory_unutilized_stock_snapshot; pace = meters installed a day from gold_mi_installation_day_agg WHERE has_meter_serial - separate queries."
      - "'less than N days/weeks of stock' = list scopes with days left < N, the rest after."
    example:
      question: "How many days will stock last project-wise at the current pace?"
      sql: |
        WITH m AS (
          SELECT LOWER(project) AS project, date_trunc('month', period_start)::date AS mon,
                 SUM(stock_consumed_count) AS used
          FROM public.gold_meter_inventory_event_day_agg
          WHERE period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '5 months')::date
            AND period_start <= CURRENT_DATE
          GROUP BY 1, 2),
        p AS (SELECT project, SUM(used / CASE WHEN mon = date_trunc('month', CURRENT_DATE)::date
                   THEN EXTRACT(DAY FROM CURRENT_DATE) ELSE EXTRACT(DAY FROM (mon + INTERVAL '1 month - 1 day')) END) / 6 AS pace
              FROM m GROUP BY 1),
        s AS (SELECT LOWER(project) AS project, SUM(inventory_count) - SUM(stock_consumed_count) AS stock
              FROM public.gold_meter_inventory_event_day_agg GROUP BY 1)
        SELECT COALESCE(UPPER(u.project), 'TOTAL') AS project, SUM(u.stock) AS in_stock,
               ROUND(SUM(u.pace), 1) AS pace_per_day,
               ROUND(SUM(u.stock) / NULLIF(SUM(u.pace), 0)) AS days_left
        FROM (SELECT project, stock, 0 AS pace FROM s UNION ALL SELECT project, 0, pace FROM p) u
        GROUP BY ROLLUP (u.project)
        ORDER BY GROUPING(u.project) DESC, days_left

  om_open_tickets:
    domain: wfm
    title: "O&M not-closed ticket ageing"
    description: "Open O&M complaint tickets by age band (0-7 .. 60+ days), source (1912/AUTO/MANUAL), status, complaint type, place, category; ticket lists, one ticket, technician/agency backlog."
    keywords: [open tickets, open complaints, not closed, pending complaints, ticket ageing, complaint ageing, 60+ days, backlog, 1912, auto ticket, unassigned, escalated, not in communication, never comm, complaint type, ticket number, o&m open]
    tables: [gold_om_open_ageing_snapshot, unified_active_complaints, unified_non_qc_complaints]
    answer_notes:
      - "Open tickets per technician: also say how many open tickets have no technician assigned (out of all open), when that figure is in the results -- they sit with no one."
    rules:
      - "public.gold_om_open_ageing_snapshot: SUM(ticket_count); age_key 'age_0_7','age_8_15','age_16_30','age_31_60','age_60_plus' (days since raised, frozen at refresh), order with CASE; thresholds only at 7/15/30/60. Default answer = Total plus every band."
      - "Card answer (O&M Active Ticket Ageing): Total open, SAT Done (sat_status = 'SAT DONE'), SAT Pending (sat_status = 'SAT PENDING') and every age band, for the asked filters (source / status / complaint type / SAT status / category / place). Several values of one filter (AUTO and MANUAL, two statuses): a Total row for them combined first (GROUP BY ROLLUP), then one row each."
      - "Includes every active-feed row, RESOLVED too - say so unless a status is filtered. complaint_status upper-case ('UNASSIGNED','ASSIGNED','CAN NOT ATTEND','ESCALATED TO DISCOM','WORK IN PROGRESS','RESOLVED','ACCEPTED','ON HOLD'); complaint_source '1912','AUTO','MANUAL'; complaint_type upper-case (e.g. 'METER NOT IN COMMUNICATION','NEVER COMM'); category label 'DT'. 'meter type wise' = meter_type, not complaint_type."
      - "Ticket lists, one ticket, technician/supervisor/agency backlog (Athena): gmr_wfm_silver.unified_active_complaints, age = date_diff('day', CAST(complaint_created_date AS DATE), current_date) (as of today); columns complaint_no, ticket_id, complaint_status, complaint_type, complaint_by, old_meter_serial_number, consumer_number, technician_name, supervisor, agency, project, zone, division. Status there is mixed case: compare UPPER(TRIM(complaint_status)). Require a filter; LIMIT 200."
      - "Open tickets per technician: ONLY gmr_wfm_silver.unified_active_complaints (the one table with a technician per ticket): COUNT(*) per technician_name WHERE UPPER(TRIM(complaint_status)) <> 'RESOLVED' AND NULLIF(TRIM(technician_name), '') IS NOT NULL, plus a separate count of open tickets with no technician (unassigned). Never join the ageing snapshot (or any place-level count) to technician / productivity tables on place columns: every ticket is repeated per technician-day row and the counts are inflated many times."
    example:
      question: "Open O&M tickets ageing by complaint source"
      sql: |
        SELECT CASE WHEN GROUPING(complaint_source) = 1 THEN 'Total' ELSE complaint_source END AS source,
               SUM(ticket_count) AS total_open,
               COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_0_7'), 0) AS days_0_7,
               COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_8_15'), 0) AS days_8_15,
               COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_16_30'), 0) AS days_16_30,
               COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_31_60'), 0) AS days_31_60,
               COALESCE(SUM(ticket_count) FILTER (WHERE age_key = 'age_60_plus'), 0) AS days_60_plus
        FROM public.gold_om_open_ageing_snapshot
        GROUP BY ROLLUP (complaint_source)
        ORDER BY GROUPING(complaint_source) DESC, total_open DESC

  om_closed_tickets:
    domain: wfm
    title: "O&M ticket closed analysis (closed date)"
    description: "O&M tickets closed per day/week/month, place, category, complaint type (the Ticket Closed Analysis card), closures by technician, and the closed ticket rows."
    keywords: [closed tickets, tickets closed, closed analysis, closure, closures, closed date, daily closures, resolved tickets, non qc, ticket closed analysis, band hua]
    tables: [gold_om_closed_tickets_day_agg, gold_om_technician_productivity_day_agg, unified_non_qc_complaints, unified_complaints]
    answer_notes:
      - "One closure figure: the card's closed tickets (every category, consumers included). Do not add a second 'work completed' figure or say consumer tickets have no closed date -- in today's data the card's count equals work completed (18,320 both for 25 Aug - 24 Sep 2026)."
    rules:
      - "Card counts: public.gold_om_closed_tickets_day_agg, SUM(closed_tickets) by closed_date (columns project..sub_division lower-case, feeder, dtr, category 'CONSUMER'/'DT'/'FEEDER', meter_type, complaint_type upper-case). Every category is in it. One query; no extra work-completed query."
      - "Closures by technician (no technician column on the card table): public.gold_om_technician_productivity_day_agg WHERE category = 'ALL', SUM(complaint_count) by technician_name (a named one: technician_name ILIKE '%<name>%'), period_start = closing day."
      - "Closed ticket ROWS ('list the closures', 'show the complaints closed on <day>'): Athena unified_non_qc_complaints (helpdesk_ticket_id) UNION ALL unified_complaints (QC) WHERE CAST(work_completed_at AT TIME ZONE 'Asia/Kolkata' AS date) in the window, place LOWER(TRIM(project)) = 'x', LIMIT 200 -- by work completion (silver closed_date is mostly empty: 4 Triveni rows in Sep 2026 against the card's 2,333). Category = CASE WHEN UPPER(TRIM(complaint_entity_type)) IN ('DT','DTR') THEN 'DT' WHEN UPPER(TRIM(complaint_entity_type)) = 'FEEDER' THEN 'FEEDER' ELSE 'CONSUMER' END; complaint type TRIM(sub_complaint_type)."
      - "No date given = last 30 days ending yesterday (CURRENT_DATE - 31 .. CURRENT_DATE - 1) unless 'all time' / 'month wise' over all data; say the default was used."
    example:
      question: "Closed tickets month-wise in Kashi this year"
      sql: |
        SELECT CASE WHEN GROUPING(date_trunc('month', closed_date)) = 1 THEN 'Total'
                    ELSE to_char(date_trunc('month', closed_date), 'Mon YYYY') END AS month,
               SUM(closed_tickets) AS closed_tickets
        FROM public.gold_om_closed_tickets_day_agg
        WHERE LOWER(project) = 'kashi'
          AND closed_date BETWEEN date_trunc('year', CURRENT_DATE)::date AND CURRENT_DATE - 1
        GROUP BY ROLLUP (date_trunc('month', closed_date))
        ORDER BY GROUPING(date_trunc('month', closed_date)) DESC, date_trunc('month', closed_date)

  meter_complaints:
    domain: wfm
    title: "Complaints per meter (repeat-complaint meters)"
    description: "Counts across many meters: meters with repeat complaints; complaints by SAT status (SAT Done vs Non-SAT); worst meters by place or category. ONE named meter or consumer number (its complaints / tickets / history) is meter_lookup, not this topic."
    keywords: [complaints per meter, repeat complaints, repeated complaints, multiple complaints, frequent complaints, meter wise complaints, most complaints, problem meters, chronic, sat done complaints, non-sat complaints, baar baar]
    tables: [gold_om_meter_complaints_agg]
    rules:
      - "public.gold_om_meter_complaints_agg: one row per meter_serial_number; total_complaints, open_complaints, closed_complaints; sat_status 'SAT Done' / 'Non-SAT', sat_number 'SAT-1'..'SAT-13'; category CONSUMER/DT/FEEDER."
      - "Place columns are UPPER-case here (zone 'AGRA', discom 'DVVNL'/'PuVVNL'), project lower-case: compare with UPPER(col) = 'AGRA' / LOWER(project) = 'agra'."
      - "Repeat-complaint meter = total_complaints > 1. Meters = COUNT(*); complaints = SUM(total_complaints)."
      - "Dashboard 'Top 50 Meters & SAT Status' (O&M Ticket Closed Analysis tab): meters only in areas (discom, zone, circle, division, sub_division) with a ticket CLOSED in the asked window of public.gold_om_closed_tickets_day_agg (closed_date; no period = last 30 days ending yesterday, say so) -- join on COALESCE(LOWER(col), '') for all five; project / category / place filters on both tables. Tiles: complaint meters = COUNT(*), SAT Done / Non-SAT meters (sat_status) and their %, total complaints and per SAT status. Top 50 = ORDER BY total_complaints DESC LIMIT 50 with serial, place, category, total / open / closed complaints, SAT status and number. The answer changes with the window."
      - "CONSUMER rows hold only OPEN complaints (closed_complaints is always 0) and DT/FEEDER rows only CLOSED ones -- never report consumer closed = 0 as a real figure; say which kind each category counts."
    example:
      question: "Repeat-complaint meters by zone and SAT status"
      sql: |
        SELECT zone, sat_status,
               COUNT(*) FILTER (WHERE total_complaints > 1) AS repeat_meters,
               COUNT(*) AS meters_with_complaints,
               SUM(total_complaints) AS complaints
        FROM public.gold_om_meter_complaints_agg
        GROUP BY zone, sat_status
        ORDER BY repeat_meters DESC

  om_non_comm:
    domain: wfm
    title: "Never / Non-comm status (open communication-failure tickets)"
    description: "Open NEVER COMM and METER NOT IN COMMUNICATION tickets: total, never comm vs not in communication, distinct meters, repeat tickets, assigned / unassigned, escalated to discom, meter already replaced SM to SM, SAT pending; by status, technician remark, age band, place, category."
    keywords: [never comm, non comm, non-comm, non communication, not in communication, meter not communicating, communication failure, sm to sm, already replaced, repeat tickets, distinct meters, remark, technician remark, door closed, consumer refusal, unassigned non comm]
    tables: [gold_om_open_ticket_detail_snapshot]
    answer_notes:
      - "Open the answer with total non-comm tickets split into Never Comm and Not in Communication, then the asked breakdown."
    rules:
      - "public.gold_om_open_ticket_detail_snapshot WHERE complaint_type IN ('NEVER COMM', 'METER NOT IN COMMUNICATION'): SUM(ticket_count). Columns project, discom, zone, circle, division, sub_division (lower-case), category, complaint_type, complaint_status (upper-case, e.g. 'UNASSIGNED'), is_escalated, remark_bucket (technician remark, upper-case; 'NO REMARK' = not attended yet), age_key ('age_0_7'..'age_60_plus'), raised_month, sat_status ('SAT DONE'/'SAT PENDING'), is_sm_replaced, ticket_count, repeat_ticket_count."
      - "Card tiles: total = SUM(ticket_count); never comm = FILTER (complaint_type = 'NEVER COMM'); not in communication = FILTER (complaint_type = 'METER NOT IN COMMUNICATION'); repeat tickets = SUM(repeat_ticket_count); distinct meters = total - repeat; unassigned = FILTER (complaint_status = 'UNASSIGNED'); assigned = total - unassigned; escalated to discom = FILTER (is_escalated); meter replaced SM to SM = FILTER (is_sm_replaced); SAT pending = FILTER (sat_status = 'SAT PENDING')."
      - "Status / remark / age wise: GROUP BY that column (age in band order 0-7, 8-15, 16-30, 31-60, 60+), with never comm and not in communication columns. A remark filter: remark_bucket = UPPER('<remark>')."
    example:
      question: "Never / non-comm status"
      sql: |
        SELECT SUM(ticket_count) AS total_tickets,
               SUM(ticket_count) FILTER (WHERE complaint_type = 'NEVER COMM') AS never_comm,
               SUM(ticket_count) FILTER (WHERE complaint_type = 'METER NOT IN COMMUNICATION') AS not_in_communication,
               SUM(ticket_count) - SUM(repeat_ticket_count) AS distinct_meters,
               SUM(repeat_ticket_count) AS repeat_tickets,
               SUM(ticket_count) FILTER (WHERE complaint_status <> 'UNASSIGNED') AS assigned,
               SUM(ticket_count) FILTER (WHERE complaint_status = 'UNASSIGNED') AS unassigned,
               SUM(ticket_count) FILTER (WHERE is_escalated) AS escalated_to_discom,
               SUM(ticket_count) FILTER (WHERE is_sm_replaced) AS meter_replaced_sm_to_sm,
               SUM(ticket_count) FILTER (WHERE sat_status = 'SAT PENDING') AS sat_pending
        FROM public.gold_om_open_ticket_detail_snapshot
        WHERE complaint_type IN ('NEVER COMM', 'METER NOT IN COMMUNICATION')

  om_escalations:
    domain: wfm
    title: "O&M tickets escalated to the discom (SmartEMS DISESC)"
    description: "Tickets the field team escalated to the discom: total, older than 30 days, non-comm, discom decision pending / approved / rejected, average days the discom took to decide; by technician remark, complaint received, age since escalation, place."
    keywords: [escalated to discom, escalation, escalations, disesc, discom escalation, discom approved, discom rejected, pending with discom, discom decision, days to attend, technician remark escalation]
    tables: [gold_om_discom_escalation_snapshot]
    rules:
      - "public.gold_om_discom_escalation_snapshot: SUM(ticket_count). Columns project..sub_division (lower-case), category (CONSUMER only -- DT / feeder escalations are 0), complaint_type (complaint received), technician_remark, escalation_status ('PENDING','APPROVED','REJECTED'), age_key (days since escalation, 'age_0_7'..'age_60_plus'), ticket_count, attended_count, attend_days_sum."
      - "Card tiles: escalated = SUM(ticket_count); older than 30 days = FILTER (age_key IN ('age_31_60','age_60_plus')); non-comm = FILTER (complaint_type IN ('NEVER COMM','METER NOT IN COMMUNICATION')); pending / approved / rejected = FILTER (escalation_status = ...); discom average days to attend = ROUND(SUM(attend_days_sum)::numeric / NULLIF(SUM(attended_count), 0), 2) (never AVG of avg_days_to_attend)."
      - "Remark / complaint / age / status wise: GROUP BY technician_remark / complaint_type / age_key / escalation_status, largest first (ages in band order). A remark filter: technician_remark = UPPER('<remark>') -- the WHOLE remark as one value, '/' included ('TEMPORARILY DISCONNECTED/ TD FROM POLE' is one remark, never split into two)."
      - "Not the open-ticket status 'ESCALATED TO DISCOM' (om_open_tickets) -- this table keeps approved / rejected tickets too."
      - "escalation_status also has 'UNKNOWN' (blank status in SmartEMS): escalated total = PENDING + APPROVED + REJECTED + UNKNOWN; never present the three named statuses as adding up to the total."
      - "Per ticket / meter / consumer / feeder / DTR / sub-station / technician / discom officer / exact date or date range / decided-on month / repeat escalations: not in this snapshot -> topic om_escalation_detail (gmr_wfm_silver.unified_discom_escalations)."
    example:
      question: "O&M tickets escalated to discom"
      sql: |
        SELECT SUM(ticket_count) AS escalated_tickets,
               SUM(ticket_count) FILTER (WHERE age_key IN ('age_31_60', 'age_60_plus')) AS older_than_30_days,
               SUM(ticket_count) FILTER (WHERE complaint_type IN ('NEVER COMM', 'METER NOT IN COMMUNICATION')) AS non_comm_tickets,
               SUM(ticket_count) FILTER (WHERE escalation_status = 'PENDING') AS discom_pending,
               SUM(ticket_count) FILTER (WHERE escalation_status = 'APPROVED') AS discom_approved,
               SUM(ticket_count) FILTER (WHERE escalation_status = 'REJECTED') AS discom_rejected,
               ROUND(SUM(attend_days_sum)::numeric / NULLIF(SUM(attended_count), 0), 2) AS discom_avg_days_to_attend
        FROM public.gold_om_discom_escalation_snapshot

  hhu_reading:
    domain: wfm
    title: "HHU reading trend (handheld-unit meter-data uploads)"
    description: "O&M tickets with an HHU meter-data upload per day / week / month: tickets, upload OK / failed / other, success rate, upload attempts, technicians; by place."
    keywords: [hhu, hhu reading, handheld, hand held unit, hhu upload, meter data upload, upload failed, upload success, hhu trend, hhu done]
    tables: [gold_om_hhu_reading_day_agg]
    rules:
      - "public.gold_om_hhu_reading_day_agg: period_start = day of the ticket's latest upload; columns project..sub_division (lower-case), technician_name, category (CONSUMER only), hhu_status ('OK','FAILED','OTHER'), ticket_count, upload_count."
      - "Tickets with HHU upload = SUM(ticket_count); OK / failed / other = FILTER (hhu_status = ...); success rate = ROUND(OK * 100.0 / NULLIF(tickets, 0), 2); upload attempts = SUM(upload_count); technicians = COUNT(DISTINCT technician_name). Always give tickets, OK, failed and the success rate."
      - "Every window ends yesterday at the latest (period_start <= CURRENT_DATE - 1): the table already holds today's partial uploads and the card never shows today -- 'in 2026' = 2026-01-01 .. CURRENT_DATE - 1."
      - "No period given = the card's default: the last 12 months ending yesterday (period_start BETWEEN (CURRENT_DATE - 1) - INTERVAL '12 months' AND CURRENT_DATE - 1); say so. Trend: daily = period_start; weekly = the month's 7-day blocks (date_trunc('month', period_start)::date + ((EXTRACT(DAY FROM period_start)::int - 1) / 7) * 7); monthly = date_trunc('month', period_start)."
    example:
      question: "HHU reading trend month wise in 2026"
      sql: |
        SELECT CASE WHEN GROUPING(date_trunc('month', period_start)) = 1 THEN 'Total'
                    ELSE to_char(date_trunc('month', period_start), 'Mon YYYY') END AS month,
               SUM(ticket_count) AS tickets_with_hhu_upload,
               COALESCE(SUM(ticket_count) FILTER (WHERE hhu_status = 'OK'), 0) AS upload_ok,
               COALESCE(SUM(ticket_count) FILTER (WHERE hhu_status = 'FAILED'), 0) AS upload_failed,
               COALESCE(SUM(ticket_count) FILTER (WHERE hhu_status = 'OTHER'), 0) AS upload_other,
               ROUND(SUM(ticket_count) FILTER (WHERE hhu_status = 'OK') * 100.0 / NULLIF(SUM(ticket_count), 0), 2) AS success_rate_pct,
               SUM(upload_count) AS upload_attempts
        FROM public.gold_om_hhu_reading_day_agg
        WHERE period_start BETWEEN DATE '2026-01-01' AND CURRENT_DATE - 1
        GROUP BY ROLLUP (date_trunc('month', period_start))
        ORDER BY GROUPING(date_trunc('month', period_start)) DESC, date_trunc('month', period_start)

  om_productivity:
    domain: wfm
    title: "O&M productivity per team"
    description: "ONLY for O&M complaint/ticket work (a question naming O&M, complaints or tickets) - plain 'productivity' / 'per team' / 'productivity per technician per day' / 'active technicians' / 'top performer' is mi_productivity. O&M closed tickets (QC + non-QC by work completion), active technicians, tickets per technician per day, monthly trend, top performers and technicians needing support."
    keywords: [o&m productivity, om productivity, complaint productivity, tickets per technician, closed complaints, resolution speed, o&m top performer, o&m requires support, complaint technician, maintenance team, o&m trend, active months]
    tables: [gold_om_technician_productivity_day_agg, unified_complaints, unified_non_qc_complaints]
    answer_notes:
      - "A named technician: when several stored names match, say how many match and give each one's project and productivity; the grouping is project (not zone) unless the result has a zone column."
    rules:
      - "public.gold_om_technician_productivity_day_agg: all categories = category = 'ALL' rows (each ticket once); one category = category = 'X' (its rows are split by meter type) or a consumer type = meter_type = 'X'. period_start = closing (work completed) date."
      - "Closed tickets = SUM(complaint_count); active technicians = COUNT(DISTINCT technician_name); technician-days = COUNT(DISTINCT (technician_name, period_start)); productivity per technician per day = ROUND(SUM(complaint_count)::numeric / NULLIF(COUNT(DISTINCT (technician_name, period_start)), 0), 2) -- never SUM(technician_day_count) (a technician fixing two meter types in a day counts twice: 2.42 instead of the card's 2.77); active days = COUNT(DISTINCT period_start); active months = COUNT(DISTINCT date_trunc('month', period_start)). The card shows closed tickets, active technicians, active days and productivity."
      - "No date given = last 30 days ending yesterday (period_start BETWEEN CURRENT_DATE - 31 AND CURRENT_DATE - 1); the monthly trend card defaults to the last 13 months (from the 1st). Say the default was used; 'all time' removes it."
      - "'Tickets closed per technician per day' for a place = that place's team figure (one number, card style), not a per-technician list."
      - "'O&M productivity' / 'per team' = the team measure (pooled closed tickets / pooled technician-days), per project with a ROLLUP 'Total' row -- never one row per technician. Per-technician rows only when technicians, top / bottom performers or a named technician are asked."
      - "A named technician: technician_name ILIKE '%<name>%' (stored names carry prefixes / suffixes / IDs), no place filter unless the question states one; GROUP BY project, technician_name so every matching technician is listed with closed tickets, technician-days and productivity."
      - "Top performer / requires support: GROUP BY technician_name ORDER BY productivity DESC (ASC), closed tickets DESC (ASC), name; default 10."
      - "Ticket rows (Athena) -- 'list the tickets closed by technician X', 'show all complaints closed in <place> on <day>': unified_non_qc_complaints (helpdesk_ticket_id) UNION ALL unified_complaints (QC, no ticket number) WHERE CAST(work_completed_at AT TIME ZONE 'Asia/Kolkata' AS date) in the window AND LOWER(technician_name) LIKE '%<name lower-case>%' (Athena has no ILIKE) -- by work completion, never closed_date (mostly empty); need a technician or <= 31 days; LIMIT 200. Never the gold productivity table for a ticket list."
      - "'Requires support' = the LOWEST productivity technician(s) (the dashboard's insight): name them, never 'no outlier'. Ties at the bottom: say how many share it and name the first by closed tickets."
      - "Active technicians over a period = COUNT(DISTINCT technician_name) over the whole period, so it is less than the monthly counts added up: a technician active in several months is one person in the total but counted once in every month they worked."
      - "Not MI productivity tables."
    example:
      question: "Top 10 O&M technicians in Agra last month"
      sql: |
        SELECT technician_name AS technician,
               ROUND(SUM(complaint_count)::numeric / NULLIF(COUNT(DISTINCT period_start), 0), 2) AS productivity,
               SUM(complaint_count) AS closed_tickets,
               COUNT(DISTINCT period_start) AS technician_days
        FROM public.gold_om_technician_productivity_day_agg
        WHERE category = 'ALL' AND LOWER(project) = 'agra'
          AND period_start >= (date_trunc('month', CURRENT_DATE) - INTERVAL '1 month')::date
          AND period_start < date_trunc('month', CURRENT_DATE)::date
        GROUP BY technician_name
        ORDER BY productivity DESC, closed_tickets DESC, technician
        LIMIT 10

  supply_funnel:
    domain: wfm
    title: "Supply-to-collection funnel"
    description: "End-to-end funnel supplied -> installed -> SAT done -> invoiced -> collected, the biggest drop-off between steps, with money outstanding."
    keywords: [funnel, drop off, drop-off, biggest drop, leakage, bottleneck, supply to collection, end to end, where are we losing, conversion, collected meters, full funnel]
    tables: [gold_dashboard_stats_snapshot, gold_mi_sat_invoice_snapshot, sat_milestones, revenue_receivables]
    answer_notes:
      - "Funnel: supplied -> installed -> SAT done -> lumpsum invoiced -> PMPM collected; the biggest drop-off is the largest 'lost' between consecutive steps."
      - "Quote each step's conversion % exactly from RESULT (conversion_pct = this step / the previous step); never recompute it against another step."
    rules:
      - "Steps: Supplied = gold_dashboard_stats_snapshot.total_current_inventory_count (all projects only; leave out for one project); Installed = SUM(meter_count) of gold_mi_sat_invoice_snapshot; SAT done = FILTER sat_stage IS NOT NULL; Lumpsum invoiced = FILTER has_lumpsum_invoice; Lumpsum collected = meters of SAT batches whose sat_milestones row has lumpsum_collection_date (PMPM invoiced/collected alongside)."
      - "Collection dates are per SAT batch (gmr_wfm_silver.sat_milestones, Athena) - a separate query; batch meters = snapshot GROUP BY LOWER(project), sat_stage."
      - "Lost = previous step - step; % lost = lost / previous; biggest drop-off = largest lost. Add money outstanding (invoiced - realised per stream) from latest revenue_receivables rows."
      - "Project filter only; no zone/category/dates."
    example:
      question: "Where is the biggest drop-off in the supply-to-collection funnel?"
      sql: |
        SELECT (SELECT total_current_inventory_count FROM public.gold_dashboard_stats_snapshot WHERE singleton) AS supplied,
               SUM(meter_count) AS installed,
               COALESCE(SUM(meter_count) FILTER (WHERE sat_stage IS NOT NULL), 0) AS sat_done,
               COALESCE(SUM(meter_count) FILTER (WHERE has_lumpsum_invoice), 0) AS lumpsum_invoiced,
               COALESCE(SUM(meter_count) FILTER (WHERE has_pmpm_invoice), 0) AS pmpm_invoiced
        FROM public.gold_mi_sat_invoice_snapshot

  dashboard_stats:
    domain: wfm
    title: "Dashboard headline stats and watchlist"
    description: "Home-page headline numbers (installed, SAT %, stock, journey, invoiced, PMPM collected), their change since a date, one-line status, and which numbers to worry about today."
    keywords: [dashboard, headline, headlines, module headline, home page card, overview, summary, status, one line, quick update, kpis, program status, what to worry about, red flags, watchlist, concerns, since last week, home page, overall numbers]
    tables: [gold_dashboard_stats_snapshot, gold_mi_installation_day_agg, gold_meter_inventory_event_day_agg, gold_inventory_monthly_balance, gold_om_open_ageing_snapshot, gold_om_closed_tickets_day_agg, gold_meter_journey_stage_agg, revenue_receivables]
    answer_notes:
      - "Any SAT % must name its base: SAT / eligible MI is 'of eligible meters' (the higher figure), SAT / total MI is 'of installed meters'."
      - "sat_percent on the home page = SAT meters / ELIGIBLE MI (not programme completion, not SAT / installed). Describe it as 'SAT % of eligible meters'. SAT and invoice snapshots have no history, so week-over-week change exists only for installs, supply and stock."
    rules:
      - "'<module> headline' (Meter installation, Supply, O&M, SAT, Revenue, Meter journey) or 'dashboard headlines' = ONLY that home-page tile's figures, labelled as the card labels them (see the headline examples), answered in one line like the tile -- not the module's KPI cards. Installation: total installed + installed on the last complete day; Supply: supplied + remaining stock; O&M: open tickets + closed on the last complete day; SAT: total SAT meters + SAT % of eligible MI rounded up; Revenue: invoiced / realized / overdue in Rs crore (overdue clamped at 0 per stream); Meter journey: consumer vs non-consumer average journey days, new installations only (NOT is_replacement). Strip: supplied, installed, SAT meters with % of eligible MI, PMPM invoiced, PMPM collected."
      - "public.gold_dashboard_stats_snapshot WHERE singleton (one global row, refreshed_at): total_meter_installations, meter_installed_on_last_day, total_sat_meters, sat_percent, total_current_inventory_count, total_current_remaining_stock_count, total_journey_completed_meters, average_meter_journey_days, total_invoice_done_meters, total_pmpm_collection_done_meters. JSONB series (monthly_installations, sat_stage_trend, ...) are chart data only. Place-scoped asks go to the KPI topics."
      - "As of / change since a date: recompute from dated tables - installed = SUM(meter_count) FILTER (WHERE period_start <= d) of gold_mi_installation_day_agg with MI eligibility; received = SUM(inventory_count), remaining = SUM(inventory_count - stock_consumed_count) with period_start <= d. SAT has no dated history - say so."
      - "Watchlist (top 3 unless N asked), flag when: open tickets older than 60 days > 20% of open; installed meters waiting > 90 days for SAT > 3% of installed, or no SAT batch for 30 days; no invoice for 45 days or lumpsum outstanding > 20%; revenue not realized > 60 days > 5% of SAT; last 7 days' installs > 20% below the 7 before; any stock cover < 30 days; defect rate > 1.5%. Severity = value / threshold - 1 (cap 3)."
    example:
      question: "Give me the dashboard headline numbers"
      sql: |
        SELECT refreshed_at, total_meter_installations, meter_installed_on_last_day, total_sat_meters,
               sat_percent, total_current_inventory_count, total_current_remaining_stock_count,
               total_journey_completed_meters, average_meter_journey_days, total_invoice_done_meters,
               total_pmpm_collection_done_meters
        FROM public.gold_dashboard_stats_snapshot
        WHERE singleton

  meter_lookup:
    domain: wfm
    title: "Single meter / consumer / ticket lookup"
    description: "Status of one meter serial, consumer number or O&M ticket / complaint number: installation details, SAT batch, stock/custody, replacement, ticket status, technician, work completion."
    keywords: [meter serial, serial number, meter no, this meter, status of meter, consumer number, is meter sat done, was meter replaced, meter details, who installed meter, meter history, ticket on meter, ticket, ticket number, ticket no, status of ticket, complaints of consumer, complaints of meter, tickets of consumer, complaint history, ticket status, complaint number, complaint no, helpdesk ticket, which technician handled]
    tables: [unified_installations, sat_meter_mappings, unified_smart_meter_inventory, unified_complaints, unified_active_complaints, unified_non_qc_complaints, unified_discom_escalations]
    answer_notes:
      - "Ticket dates: 'work completed on' is not 'closed on' -- call a ticket closed only when a closed date is shown. Say where it was found in plain words (open tickets / completed O&M work); 'not found' only when every source is empty."
    rules:
      - "ONE identifier = look in EVERY table that holds that kind of identifier together (UNION ALL of per-table SELECTs with the same columns, a found_in label in plain words), never one table only: 'not found' is said only when none of them has it. Identifiers are stored as TEXT: compare TRIM(col) = '<value exactly as typed>' -- never add prefixes (no 'TKT-') or change the value. Digits-only values (consumer / ticket numbers) can carry leading zeros ('0061239000'): match regexp_replace(TRIM(col), '^0+', '') = regexp_replace('<value>', '^0+', '')."
      - "Escalated to discom? (one meter / consumer / ticket): gmr_wfm_silver.unified_discom_escalations WHERE UPPER(TRIM(old_meter_serial_number)) = '<serial>' (or consumer_number / ticket_id) -- every escalation row with escalated_on AT TIME ZONE 'Asia/Kolkata', COALESCE(NULLIF(UPPER(TRIM(escalation_status)), ''), 'UNKNOWN') AS status, escalation_attended_on, escalation_supervisor_remarks; never consumer_name / mobile_no / address."
      - "Ticket / complaint number: gmr_wfm_silver.unified_active_complaints (ticket_id or complaint_no; complaint_status, complaint_type, complaint_created_date = raised on) UNION ALL gmr_wfm_silver.unified_non_qc_complaints (helpdesk_ticket_id or complaint_no; status from dates: closed_date -> 'Closed', work_completed_at -> 'Work completed'; sub_complaint_type). Both: project, zone, division, consumer_number, old_meter_serial_number, technician_name. created_at / ingested_at are load times, never the raised date. A ticket in both = current status from the active feed, completion from non-QC."
      - "Tickets / complaints of one meter / consumer / technician: the same two tables PLUS gmr_wfm_silver.unified_complaints (QC complaint work: sub_complaint_type, work_completed_at, no ticket number), by meter (TRIM(old_meter_serial_number) = 'X' OR TRIM(new_meter_serial_number) = 'X' where the table has both; non-QC has only old) / TRIM(consumer_number) = 'X' or LOWER(technician_name) LIKE '%<name lower-case>%' (Athena has no ILIKE), newest first, LIMIT 200. Return the ticket ROWS (status, type, technician, dates), never only a count -- the answer gives the count and the latest status from them."
      - "Athena gmr_wfm_silver tables, exact match first: new_meter_serial_number (letters + digits, e.g. 'CA6028422') vs consumer_number (digits only) - match the column to the value's format; latest row by updated_at DESC. Normalised fallback: regexp_replace(upper(trim(col)), '[^A-Z0-9]+', '') = 'X'."
      - "Installation: unified_installations (mi_date, report_category, new_meter_type, new_meter_make, project..sub_division, technician_name, agency). SAT: sat_meter_mappings.meter_serial_number -> sat_number; batch dates from sat_milestones on project + sat_number (declared joins); eligible if mi_date <= project cutoff (Postgres sat_eligibility_config, separate query)."
      - "Stock/custody: unified_smart_meter_inventory (meter_serial_number, di_date, warehouse, sku, manufacturer, meter_status, gmr_to_agency_ts, agency_to_sup_ts, sup_to_tech_ts, installed_ts)."
      - "Replacement: unified_complaints with old/new_meter_serial_number both set and work_completed_at set; O&M tickets: unified_non_qc_complaints / unified_active_complaints by old_meter_serial_number."
      - "MDM readings (consumption, voltage, theft) are not here."
      - "Never look a meter serial up in unified_smart_meter_asset (network / GIS master, not a meter status table). Search inventory, installations and SAT mappings together (FULL OUTER JOIN of one-row CTEs) so a meter found in any of them is found."
      - "'Current stage' / 'which stage' of ONE meter = furthest step reached, named as the dashboard workflow stages: SAT batch SAT-1..13 with PMPM collection -> Revenue realized; SAT batch -> SAT to Revenue; installed (installations row or installed_ts) -> Installation to SAT; sup_to_tech_ts -> Technician to Installation; agency_to_sup_ts -> Supervisor to Technician; gmr_to_agency_ts -> Agency to Supervisor; else in stock -> DI to Agency."
    example:
      question: "When was meter CA6028422 installed and by whom?"
      sql: |
        SELECT new_meter_serial_number AS meter_serial, consumer_number, mi_date AS installed_on,
               report_category AS category, new_meter_type AS meter_type, new_meter_make AS make,
               project, zone, division, technician_name AS technician, agency
        FROM gmr_wfm_silver.unified_installations
        WHERE new_meter_serial_number = 'CA6028422'
        ORDER BY updated_at DESC
        LIMIT 5

  mdm_autoindexing:
    domain: mdm
    title: "Consumer-to-feeder mapping audit (auto-indexing)"
    description: "The dashboard's Consumer-to-Feeder Mapping Audit (Advanced Analytics): meters audited, confirmed, reassigned, review, no data, auto-indexing concluded, pending verification, mapping accuracy, counts and % by project/discom/zone/circle/division/substation; feeders (MI, CI, reassign in/out, review, no data, confidence); one consumer's index-based vs AI-based feeder, substation and outage match; correction queue; rankings; definitions."
    keywords: [auto indexing, autoindexing, feeder mapping, feeder tagging, mapping audit, mapping auditor, mapping accuracy, confirmed, reassign, reassigned, reassignment, re-tag, retag, review, no data, pending verification, meters audited, feeder count, substation, correct tagging, confidence, system feeder, ai feeder, ai based, index based, outage match, mi, ci, reassign in, reassign out, correction queue, mismatch, system-index accuracy, declared feeder, recommended feeder, candidate feeder, candidates, scored against, supporting, contradicting, net score, evidence, outage windows, outage log, went dark, proof pack, why reassigned]
    tables: [mapping_audit_summary, mapping_audit_feeder, mapping_audit, mapping_audit_candidates, mapping_audit_evidence]
    answer_notes:
      - "Confirmed = the declared feeder matches the outage evidence; Reassign = the evidence points to another feeder (re-tag it); Review = evidence seen but not decisive (field check); No data = never seen in a feeder-specific outage window. Auto-indexing CONCLUDED (decided, = the dashboard's Mapping Accuracy / correctly mapped) = Confirmed + Reassign; PENDING verification = Review + No data (target < 5%). Concluded + pending = meters audited. Name the two parts with their numbers when giving concluded or pending."
      - "Dashboard cards: Mapping Accuracy = (confirmed + reassign) / audited (target 95%); Pending Verification = (review + no data) / audited (target < 5%); System-Index Accuracy = confirmed / (confirmed + reassign); Mismatches to Re-tag = reassign; Meters Audited with feeders and substations. Percentages to one decimal."
      - "Say which month the figures are for (the latest audit month unless asked). Feeder: MI = consumers declared to it, CI = consumers in the field indexing register, reassign OUT = moved away, reassign IN = moved here, confidence = decided share of MI. Index-based feeder = the declared (system) one; AI-based = the audit's recommended one."
      - "Correct feeder tagging drives feeder/DT energy accounting, AT&C loss calculation, outage attribution and reliability indices."
      - "Outage match = 'dark of seen': of the feeder-specific outage windows observed for that feeder, how many times the consumer also went dark (e.g. 3 of 3 = the consumer lost supply in all 3 outages of that feeder, strong evidence it sits on it). The declared feeder's match vs the best feeder's match is the reason for the verdict. It has nothing to do with complaints."
      - "'What is / what does X mean' with figures: define the term first in plain words (reassign OUT = consumers moved away from the feeder they were tagged to; reassign IN = the same consumers arriving at their new feeder, so the two totals are always equal), then quote the figure."
      - "Name the AUDIT month: audit_month / data_date in RESULT (e.g. 2026-08-01 = August 2026), or 'the latest audit month' when RESULT has none -- never today's calendar month."
      - "Columns that settle the answer: rank_* / candidate_rank = 1 is the top row; *_at_lowest (substations_at_lowest, feeders_at_lowest) = how many tie at the lowest value -- quote that number, never the count of rows shown; total_in_queue = the whole list; audit_month = the month to name. A list shows only the first rows by evidence: never say 'all' consumers share a feeder or substation. Feeder confidence_pct = (correct_tagging + out) / mi = the share of its declared consumers the audit could DECIDE (confirmed there or moved away) -- not 'confirmed on this feeder'."
      - "Rankings ('which ... has the most / lowest'): the FIRST row of the result is the answer -- name it with its own figure, then the next one or two. A ranking never names a Total row. List answers (correction queue, re-tag lists): lead with total_in_queue (all of them), not the rows shown. 'Outage match' of a meter = its mapping_audit row (declared X of Y vs best X of Y), also for REVIEW / NO DATA meters -- the outage log has rows for REASSIGN consumers only."
      - "Outage evidence counts (supporting, outages_meter_went_dark, best_dark, declared_dark) are outages in which the consumer WENT DARK (lost supply) with that feeder -- evidence it sits on it; contradicting / *_powered = outages it stayed powered. The feeder the evidence points to = the one with the MOST outages the meter went dark in (the first row): name it first, then compare the current feeder (is_current_feeder = Yes / is_declared). Count every row of the result when saying how many candidate feeders there are."
      - "Feeder auto = consumers the evidence places on this feeder (correct_tagging + reassign in), the AI-based count -- not whether auto-indexing has started. A list answer gives the table's total row count as the total, never a count of the rows shown."
    rules:
      - "Month: every query pins ONE data_date. No month named = the latest: data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary). Months stored: 2026-06-01, 2026-07-01, 2026-08-01 ('July' = DATE '2026-07-01'). Never sum months."
      - "Counts and % for all / a place: hes_gold.mapping_audit_summary -- meters audited = SUM(consumer_count); confirmed / reassign / review / no data = SUM(consumer_count) FILTER (WHERE verdict = 'CONFIRMED' / 'REASSIGN' / 'REVIEW' / 'NO DATA'); concluded = confirmed + reassign; pending = review + no data; % = ROUND(x * 100.0 / SUM(consumer_count), 1); substations = COUNT(DISTINCT sub_station). Project = its zones (no project column): Agra = UPPER(zone) IN ('AGRA','ALIGARH','ETAH','FIROZABAD','MATHURA'); Kashi = ('AZAMGARH','VARANASI I','VARANASI II'); Triveni = ('MIRZAPUR','PRAYAGRAJ I','PRAYAGRAJ II'); project-wise = a CASE on zone. discom_code 'DVVNL' / 'PUVVNL'; zone / circle / division / sub_division / sub_station are upper-case names (compare UPPER(col) LIKE '%NAME%'). Breakdown by a level = GROUP BY that column with a ROLLUP Total."
      - "Feeders: hes_gold.mapping_audit_feeder, one row per feeder_code (exclude feeder_code IS NULL, the 51,103 consumers with no feeder). Columns mi, ci, auto, correct_tagging, out (reassign out), inc (reassign in), review, nodata, determined, confidence_pct. Feeders audited (dashboard) = COUNT(*) FILTER (WHERE mi > 0 OR correct_tagging > 0) over ALL rows; SUM(out) = SUM(inc) = total reassignments (never add them). Named feeder: UPPER(feeder_name) LIKE '%NAME%', one row per feeder_code. Rankings: ORDER BY the asked column, feeder_code IS NOT NULL, LIMIT 10; lowest accuracy / confidence = confidence_pct ASC with mi >= 100. Feeder accuracy = confidence_pct; correctly-tagged % = correct_tagging * 100.0 / mi. Project = its zones (as above)."
      - "One consumer: hes_gold.mapping_audit WHERE meter_no = 'X' AND data_date = latest -- verdict, declared_feeder (index-based), auto_feeder (AI-based), best_feeder, sub_station, zone, cluster (project), outage match of the declared feeder = declared_dark || ' of ' || (declared_dark + declared_powered), of the best/recommended feeder = best_dark || ' of ' || (best_dark + best_powered), mapping_confidence, was_cross_substation. Feeder names: LEFT JOIN hes_gold.mapping_audit_feeder on feeder_code AND data_date. 'Why reassigned' = compare the two outage matches."
      - "Correction queue (consumers to re-tag, reassign list): hes_gold.mapping_audit WHERE verdict = 'REASSIGN' AND data_date = latest (+ LOWER(cluster) = 'agra' for a project, or zone / sub_station), columns meter_no, sub_station, declared_feeder (current), auto_feeder (move to), best_dark (evidence), best_dark + best_powered (windows seen), ORDER BY best_dark DESC, LIMIT 200; count them from mapping_audit_summary."
      - "Athena: a ROLLUP label must not reuse the grouped column's name (CASE WHEN GROUPING(zone) = 1 THEN 'Total' ELSE zone END AS zone_name), and ORDER BY GROUPING(zone) DESC, SUM(...) DESC -- not the output alias -- or Athena rejects 'Invalid reference to output of SELECT clause from grouping()'. COALESCE every SUM(...) FILTER (...) to 0."
      - "Rankings (which substation / feeder / zone / division has the most / least ...): skip the blank row of consumers with no hierarchy (sub_station / zone / division IS NOT NULL, feeder_code IS NOT NULL). 'Most / highest X' = the count of X; a share only when share / % / accuracy / confidence is asked (then a size floor, >= 500 consumers or mi >= 100). Totals over the feeder table keep every row (the dashboard counts the no-feeder row)."
      - "Evidence behind one consumer's verdict (the dashboard's consumer drawer): hes_gold.mapping_audit_candidates WHERE meter_no = 'X' AND data_date = latest -- candidate_feeder, supporting (outages dark with it), contradicting (outages it stayed powered), net_score, is_declared (TRUE = its current feeder), ORDER BY supporting DESC, net_score DESC, LIMIT 40. The first row is the feeder the evidence points to. Use it only when candidate feeders / scores are asked; plain 'why was meter X reassigned' = the one-consumer mapping_audit row (declared vs best outage match). Feeder names: LEFT JOIN hes_gold.mapping_audit_feeder f ON f.feeder_code = c.candidate_feeder AND f.data_date = c.data_date."
      - "Outage log / proof pack (only REASSIGN consumers have rows): hes_gold.mapping_audit_evidence -- one row per 30-minute slot of an outage (UTC; show slot AT TIME ZONE 'Asia/Kolkata'). Per outage: GROUP BY candidate_feeder, event_id -> MIN(slot) start, MAX(slot) end, BOOL_OR(consumer_dark) went_dark. Always WHERE data_date AND (meter_no = 'X' or declared_feeder / candidate_feeder = the feeder_code; a feeder NAME -> feeder_code IN (SELECT feeder_code FROM hes_gold.mapping_audit_feeder WHERE UPPER(feeder_name) LIKE '%NAME%' AND data_date = ...)). Never scan it without a meter or feeder: it holds ~90-500M rows a month."
      - "Never the old autoindexing tables (hierarchy_summary_autoindexing, consumer_detail_autoindexing, feeder_ranking_autoindexing): they hold one stale month from a pinned meter list and no longer match the dashboard."
    example:
      question: "Confirmed, reassigned, review and no data zone-wise in Kashi"
      sql: |
        SELECT CASE WHEN GROUPING(zone) = 1 THEN 'Total' ELSE zone END AS zone_name,
               SUM(consumer_count) AS meters_audited,
               SUM(consumer_count) FILTER (WHERE verdict = 'CONFIRMED') AS confirmed,
               SUM(consumer_count) FILTER (WHERE verdict = 'REASSIGN') AS reassigned,
               SUM(consumer_count) FILTER (WHERE verdict = 'REVIEW') AS review,
               SUM(consumer_count) FILTER (WHERE verdict = 'NO DATA') AS no_data,
               ROUND(SUM(consumer_count) FILTER (WHERE verdict IN ('CONFIRMED', 'REASSIGN')) * 100.0 / SUM(consumer_count), 1) AS concluded_pct
        FROM hes_gold.mapping_audit_summary
        WHERE data_date = (SELECT MAX(data_date) FROM hes_gold.mapping_audit_summary)
          AND UPPER(zone) IN ('AZAMGARH', 'VARANASI I', 'VARANASI II')
        GROUP BY ROLLUP (zone)
        ORDER BY GROUPING(zone) DESC, SUM(consumer_count) DESC

  # Technical dashboard cards (HES meter data on Athena hes_gold). Formulas follow the dashboard KpiBoard
  # (HES-FRONTEND-GMR src/kpi/*Model.js + HES-BACKEND-GMR _stats_sql) over the tables gmr-etl kpi_80/82/85/12
  # write; references recomputed live 6 Nov 2026. Default month = the board's own default (pickDefaultMonth:
  # latest month with >= 10 days of readings).
  mdm_power_quality:
    domain: mdm
    title: "Power quality (voltage deviation, fluctuation, unbalance, drop, low-voltage pockets, current unbalance, % time out of band)"
    description: "The Technical > Power Quality cards: Voltage Deviation Index (VDI), Voltage Fluctuation Index (VFI), Voltage Unbalance Index (VUI), Voltage Drop (V), Low-voltage pockets, Meter Current Unbalance (%), % time beyond the voltage tolerance band, % time with unacceptable current imbalance (>10%): averages, meters by status, by circle / zone / meter type, dips and surges, per meter."
    keywords: [power quality, voltage, vdi, voltage deviation, deviation index, vfi, voltage fluctuation, fluctuation, voltage stability, dips, surges, swings, vui, voltage unbalance, unbalance, voltage drop, drop depth, under voltage, undervoltage, low voltage, low-voltage pockets, over voltage, overvoltage, tolerance band, out of band, voltage band, compliance, current unbalance, unacceptable current imbalance, phase current, 10%, poor, moderate, good, severe, mild, stable, unstable, chronic violation, non compliant, borderline]
    tables: [voltage_deviation_index, voltage_fluctuation_index, voltage_unbalance_index, voltage_drop, current_unbalance, pct_time_out_of_band, pct_time_current_imbalance, low_voltage_pockets, low_voltage_pockets_meters]
    answer_notes:
      - "Forecasts: say plainly it is an estimate from June and July (the complete months), give the projected figure and the method (e.g. same change as June to July), and that August is partial (2-3 days) so it was not used."
      - "Always name the month (data_month in RESULT, e.g. 2026-07-01 = July 2026). With no month asked it is the dashboard's default month: the latest month with at least 10 days of meter readings (July 2026 now; August 2026 holds only 2-3 days). Say so in one short clause."
      - "Card meanings: VDI = how far voltage sits from nominal (230 V; 63.5 V on PT feeder / HT meters), % -- Good <= 2, Moderate <= 5, Poor > 5. VFI = swing against the meter's own daily average voltage, % -- Stable < 2, Moderate < 5, Unstable >= 5; dips = slots more than 5% below, surges = more than 5% above. VUI = worst phase-voltage deviation from the 3-phase mean, % (3-phase meters only) -- Good <= 2, Moderate <= 3, Poor > 3. Voltage drop = volts below the 0.9 x nominal floor (207 V) in under-voltage slots; status is graded on the deepest drop: OK none, Mild < 5 V, Moderate < 15 V, Severe >= 15 V. Current unbalance = worst phase-current deviation from the 3-phase mean, % -- Good < 3, Moderate < 5, Elevated < 10, Poor >= 10. % time beyond band = share of live half-hours outside +-10% of nominal (Compliant < 5%, Borderline < 15%, NonCompliant < 30%, ChronicViolation >= 30%). % time CI > 10% (Compliant <= 5%, Borderline <= 15%, NonCompliant > 15%)."
      - "Averages are weighted by each meter's readings (the dashboard tile), not a plain mean of meters -- say 'average' and quote it with 2 decimals and its unit (% or V). Eligible meters = meters with a row that month, offline ones included."
      - "Low-voltage pockets: meters persistently (4+ consecutive days) below 200 V -- Critical < 150 V, Poor 150-180 V, Average 180-200 V (PT meters 54 / 57 / 60 V); a meter can be in several bands, so the total is distinct meters."
      - "Rankings: the first row of RESULT is the answer; never rank the blank / NULL area."
      - "Per-area answers: each area's figure comes from that area's own row in RESULT -- before naming the highest or lowest, check every row of the column you quote (and say which column: this month or last month)."
    rules:
      - "Forecasts / months with no data: HES data runs June-August 2026 (August holds only 2-3 days). A question about September 2026 or later, 'next month', 'predict' or 'if the trend continues' = query the month-wise series (GROUP BY data_date, June-August) and project from the COMPLETE months (June, July) -- never pin the empty month (it returns 0 rows), never let partial August drive the trend."
      - "Month: every query pins ONE month on data_date (1st of the month). No month / 'current' / 'latest' = the dashboard default month: data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). A named month = DATE 'YYYY-MM-01' (months stored 2026-06-01, 2026-07-01, 2026-08-01). Month-wise = GROUP BY data_date. Always SELECT the month as data_month. Never sum months."
      - "Places: these tables have NO cluster/project column -- project = its zones: Agra = UPPER(zone) IN ('AGRA','ALIGARH','ETAH','FIROZABAD','MATHURA'); Kashi = ('AZAMGARH','VARANASI I','VARANASI II'); Triveni = ('MIRZAPUR','PRAYAGRAJ I','PRAYAGRAJ II'). discom_code 'DVVNL' (Agra) / 'PUVVNL' (Kashi + Triveni). zone / circle / division / sub_division / sub_station / feeder_name / dtr_name are upper-case ('EDC II JAUNPUR'): UPPER(col) LIKE '%NAME%' (zone 'varanasi' = both VARANASI I and II). Meter type = role: '1ph' (1-phase consumer), '3ph' (3-phase consumer), 'ht' (HT consumer), 'dtr' (DT meter), 'feeder'; consumers = role IN ('1ph','3ph','ht'). One meter = meter_no = 'X'."
      - "VDI (hes_gold.voltage_deviation_index): eligible meters = COUNT(DISTINCT meter_no); average VDI = SUM(vdi_mean * live_blocks) / SUM(live_blocks) over status <> 'Offline'; peak VDI = AVG(vdi_p95), spike-weighted VDI = AVG(vdi_rms), both over status <> 'Offline'."
      - "VFI (hes_gold.voltage_fluctuation_index): average = SUM(vfi_pct * live_blocks) / SUM(live_blocks) over status <> 'Offline'; dips % = SUM(vf_band_lt_m10 + vf_band_m10_m5) * 100.0 / SUM(band_total); surges % = SUM(vf_band_p5_p10 + vf_band_gt_p10) * 100.0 / SUM(band_total)."
      - "VUI (hes_gold.voltage_unbalance_index) and current unbalance (hes_gold.current_unbalance) and % time CI (hes_gold.pct_time_current_imbalance): ALWAYS WHERE blocks_3ph > 0. Scoreable = status NOT IN ('Offline','1-Phase','Offline/NoLoad','PT-Scaled'). Average VUI = SUM(vui_mean * phase_v_live_blocks) / SUM(phase_v_live_blocks) over scoreable; time 2-3% = SUM(vui_band_2_3_blocks), > 3% = SUM(vui_gt_3pct_blocks), each * 100.0 / SUM(phase_v_live_blocks). Average current unbalance = SUM(current_unbalance_mean * phase_i_live_blocks) / SUM(phase_i_live_blocks) over scoreable; average peak = AVG(current_unbalance_max) over scoreable; % time above 10% = SUM(ci_gt_10pct_blocks) * 100.0 / SUM(phase_i_live_blocks) (same on pct_time_current_imbalance)."
      - "Voltage drop (hes_gold.voltage_drop): average drop depth (V) = SUM(drop_mean * intervals_with_drop) / SUM(intervals_with_drop) over status <> 'Offline'; average deepest drop = AVG(drop_max), drop slots per meter = AVG(intervals_with_drop), both over status <> 'Offline'; severe share = COUNT_IF(status = 'Severe') * 100.0 / COUNT_IF(status <> 'Offline')."
      - "% time beyond voltage band (hes_gold.pct_time_out_of_band): SUM(oob_blocks) * 100.0 / SUM(live_blocks); over-voltage = SUM(ov_blocks), under-voltage = SUM(uv_blocks), same denominator. Never AVG(pct_time_oob)."
      - "Meters by status = COUNT(*) GROUP BY status WHERE status <> 'Offline' (and <> 'unknown'); one row per meter per month. By area / meter type = GROUP BY circle (default level) / zone / division / role with the same weighted formula and HAVING SUM(<weight>) > 0; rankings skip the NULL area and sort DESC (worst first)."
      - "Low-voltage pockets: meters flagged = COUNT(DISTINCT meter_no) FROM hes_gold.low_voltage_pockets_meters (band 'Critical' / 'Poor' / 'Average', ageing_bucket '3-30 Days' / '31-60 Days' / '61-90 Days' / 'More than 90 Days', category = meter type: 'consumer_1_phase' (1-phase consumers) / 'consumer_3_phase' / 'consumer_ht' / 'dt_meter' / 'feeder' -- phases_affected only says which phases R/Y/B were low, never the meter type; cluster 'Agra' / 'Kashi' / 'Triveni'); band x ageing chart = SUM(unique_meter_count) FROM hes_gold.low_voltage_pockets GROUP BY band, ageing_bucket. Its tables are low_voltage_pockets*, never voltage_drop."
      - "The hidden 'Voltage Deviation (%)' card is the same data as VDI (mean_abs_dev_pct = vdi_mean on every row): when that card or its statuses are named, use hes_gold.voltage_deviation_index -- Critical = status <> 'Offline' AND vdi_mean > 10, Warning = vdi_mean > 5 AND <= 10, OK = vdi_mean <= 5 (Offline separate); average and by-area exactly as VDI. Never hes_gold.voltage_deviation. Its statuses: OK <= 5%, Warning 5-10%, Critical > 10% (VDI's own card says Good / Moderate / Poor at 2 / 5%)."
      - "ROUND every figure to 2 decimals. One table per KPI; never JOIN two of them."
    example:
      question: "Average voltage deviation index circle-wise in Kashi"
      sql: |
        SELECT MAX(data_date) AS data_month,
               CASE WHEN GROUPING(circle) = 1 THEN 'Total' ELSE circle END AS circle_name,
               COUNT(DISTINCT meter_no) AS eligible_meters,
               ROUND(SUM(CASE WHEN status <> 'Offline' THEN vdi_mean * live_blocks END)
                     / NULLIF(SUM(CASE WHEN status <> 'Offline' THEN live_blocks END), 0), 2) AS avg_vdi_pct,
               COUNT_IF(status = 'Poor') AS poor_meters
        FROM hes_gold.voltage_deviation_index
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND UPPER(zone) IN ('AZAMGARH', 'VARANASI I', 'VARANASI II') AND circle IS NOT NULL
        GROUP BY ROLLUP (circle)
        ORDER BY GROUPING(circle) DESC, 4 DESC

  mdm_dt_load:
    domain: mdm
    title: "DT load management (DT load kVA, % DT loading, % DT peak loading, DT load rise)"
    description: "The Technical > Load Management DT cards: DT load in kVA (load profile, hours above rating, most stressed DTs), % DT loading bands (DTs above rating, never above 20%, time above rating), % DT peak loading (overloaded > 100% / 90-100%, underloaded < 20%, top overloaded DTs, feeders with most overloaded DTs), DT load rise since last month."
    keywords: [dt load, dt loading, transformer load, transformer loading, dtr loading, kva, load profile, load duration curve, rating, rated capacity, above rating, overloaded, overload, overloading, underloaded, underload, peak loading, peak load, dt peak, 90%, 100%, 120%, never above 20, stressed dts, load rise, load change, rose, fell, increase in load, since last month, asset loading spread, feeders with most overloaded dts]
    tables: [dt_loading, dt_peak_loading, dt_peak_loading_feeder, dt_load_kva, dt_load_rise]
    answer_notes:
      - "Forecasts: say plainly it is an estimate from June and July (the complete months), give the projected figure and the method (e.g. same change as June to July), and that August is partial (2-3 days) so it was not used."
      - "Always name the month (data_month in RESULT). With no month asked it is the dashboard's default month: the latest month with at least 10 days of readings (July 2026 now; August 2026 holds only 2-3 days)."
      - "% DT loading = half-hour load (kVAh x 2 x CT ratio) as % of the DT's kVA rating; 'peaked above rating' = its highest half-hour was 100% or more. % DT peak loading uses the DT's maximum demand: Overloaded > 100%, Overloaded 90-100%, Underloaded < 20%, else Normal. Load rise = this month's average loading minus last month's, in percentage points. The two loading cards differ because one uses half-hour energy and the other maximum demand."
      - "Per-area answers: each area's figure comes from that area's own row in RESULT -- before naming the highest or lowest, check every row of the column you quote (and say which column: this month or last month)."
      - "Load rise / 'this month vs last month': 'this month' is the DATA month (data_month, e.g. July 2026) and 'last month' the month before it (June 2026) -- never today's calendar month (it is not October / November)."
      - "Lists of DTs leave out implausible ones (loading 200%+ or a CT far too large for the DT's rating), as the dashboard does. Quote DT counts as whole numbers, percentages with 1-2 decimals."
    rules:
      - "Forecasts / months with no data: HES data runs June-August 2026 (August holds only 2-3 days). A question about September 2026 or later, 'next month', 'predict' or 'if the trend continues' = query the month-wise series (GROUP BY data_date, June-August) and project from the COMPLETE months (June, July) -- never pin the empty month (it returns 0 rows), never let partial August drive the trend."
      - "Month: every query pins ONE month. dt_loading / dt_peak_loading / dt_peak_loading_feeder / dt_load_rise: data_date = month 1st; dt_load_kva is one row per DT per DAY -- filter month_date (data_date is the day). No month / 'current' / 'latest' = the dashboard default month: (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). Named month = DATE 'YYYY-MM-01'. SELECT the month as data_month."
      - "Places: cluster = project, stored 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi'); zone / circle / division / sub_division upper-case (UPPER(col) LIKE '%NAME%'); feeder_code, dtr_code, meter_no (the DT meter). No category / role column."
      - "% DT loading (hes_gold.dt_loading, one row per DT x loading_band -- count DTs with COUNT(DISTINCT meter_no)): DTs assessed = COUNT(DISTINCT meter_no); peaked above rating = COUNT(DISTINCT meter_no) FILTER (WHERE peak_block_band IN ('100-120%','>120%')); never above 20% = ... peak_block_band = '<20%'; time above rating % = SUM(block_count) FILTER (WHERE loading_band IN ('100-120%','>120%')) * 100.0 / SUM(block_count); DTs by monthly peak = COUNT(DISTINCT meter_no) GROUP BY peak_block_band (bands '<20%','20-35%','35-55%','55-70%','70-85%','85-100%','100-120%','>120%'). Areas with most DTs above rating: per area over * 100.0 / dts, HAVING COUNT(DISTINCT meter_no) >= 20, ORDER BY pct DESC, over DESC LIMIT 10."
      - "% DT peak loading (hes_gold.dt_peak_loading, one row per DT): COUNT(DISTINCT meter_no) total and FILTER (WHERE load_status = 'Overloaded >100%' / 'Overloaded 90-100%' / 'Underloaded <20%' / 'Normal'); 'overloaded' alone = both overloaded statuses, each named. By band = GROUP BY peak_band. Top overloaded DTs: meter_no, dtr_code, feeder_code, ROUND(peak_load_kva,1), pct_peak_loading, dtr_rating_kva WHERE pct_peak_loading < 200 AND <plausible CT> ORDER BY pct_peak_loading DESC LIMIT 10. Feeders with most overloaded DTs: hes_gold.dt_peak_loading_feeder WHERE overloaded_90_dts > 0 ORDER BY overloaded_90_dts DESC LIMIT 10 (overloaded_90_dts = above 90% incl. above 100%, overloaded_100_dts, assessed_dts, max_loaded_dt, max_pct_peak_loading)."
      - "Loading bands include their lower edge ('>120%' = 120 and above, '100-120%' = 100 up to 120): 'above 120%' / 'over 100%' on dt_load_kva / dt_loading = the band column (peak_band / peak_block_band / loading_band IN (...)), never a strict pct > N. On dt_peak_loading 'overloaded' = load_status (strictly > 100 / > 90)."
      - "A change between two months ('from June to July', 'why did loading fall/rise') = the LATER month's dt_load_rise row: pct_loading (that month) vs prev_pct_loading (the month before), DTs present in both (prev_pct_loading IS NOT NULL). Never compare the earlier month's own row (its prev is the month before it, often NULL). For 'why', also give the drivers: DTs that fell / rose over 10 points and new DTs."
      - "'Monthly peak' is the % DT Loading card's name (each DT's highest half-hour in the month), not a month-wise ask: one month unless months are asked. Which card: 'DTs by monthly peak' / '% DT loading' / 'above rating' / 'never above 20%' = dt_loading (peak_block_band); 'peak loading' / 'overloaded' / 'underloaded' / 'DTs by peak loading band' = dt_peak_loading (load_status, peak_band); 'DT-days' / 'kVA' / 'hours above rating' / 'load profile' = dt_load_kva; 'rise' / 'change since last month' = dt_load_rise."
      - "Plausible CT (dashboard 'believable DT'): (ct_ratio IS NULL OR dtr_rating_kva IS NULL OR TRY_CAST(split_part(ct_ratio, '/', 1) AS double) <= 2 * dtr_rating_kva * 1000 / (sqrt(3) * 433))."
      - "DT load kVA (hes_gold.dt_load_kva): one DT = WHERE meter_no = 'X' (or dtr_code = 'X') AND month_date = ...: rating = MAX(dtr_rating_kva), CT = MAX(ct_ratio), peak load = MAX(peak_load_kva), peak % = MAX(peak_pct_loading), hours above rating = SUM(cardinality(filter(load_profile, x -> x > dtr_rating_kva))) / 2.0, days with data = COUNT(*), readings = SUM(slots_reported), average load = AVG(avg_load_kva). Most stressed DTs: GROUP BY meter_no, dtr_code, hours = SUM(overload_slots) / 2.0, HAVING SUM(overload_slots) > 0 AND MAX(peak_pct_loading) < 200, WHERE <plausible CT>, ORDER BY hours DESC LIMIT 10. By peak band: COUNT(DISTINCT meter_no) and COUNT(*) DT-days GROUP BY peak_band."
      - "DT load rise (hes_gold.dt_load_rise, one row per DT): DTs compared = COUNT_IF(prev_pct_loading IS NOT NULL); new DTs = COUNT_IF(prev_pct_loading IS NULL); average loading now = AVG(pct_loading) and last month = AVG(prev_pct_loading), both over compared DTs (plain mean of DTs); rose over 10 points = COUNT_IF(load_rise_pp >= 10); fell over 10 = COUNT_IF(load_rise_pp < -10). 'Rose / more than N points' uses the card's bands, lower bound included: more than 20 = load_rise_pp >= 20 ('Rose >20 pp'), more than 5 = >= 5; 'fell more than N' = load_rise_pp < -N. Change bands: NULL 'No previous month', < -10 'Fell >10 pp', < -5 'Fell 5-10 pp', < 5 'Stable (±5 pp)', < 10 'Rose 5-10 pp', < 20 'Rose 10-20 pp', else 'Rose >20 pp'. Biggest rises: load_rise_pp > 0 AND peak_pct_loading < 200 AND NOT COALESCE(prev_peak_pct_loading > 200, false) AND <plausible CT> ORDER BY load_rise_pp DESC LIMIT 10 (drops: < 0, ASC)."
      - "ROUND percentages to 2 decimals (pp and kVA to 1). Never JOIN two of these tables."
    example:
      question: "How many DTs are overloaded and underloaded on peak loading in Kashi?"
      sql: |
        SELECT MAX(data_date) AS data_month,
               COUNT(DISTINCT meter_no) AS dts_assessed,
               COUNT(DISTINCT meter_no) FILTER (WHERE load_status = 'Overloaded >100%') AS overloaded_above_100,
               COUNT(DISTINCT meter_no) FILTER (WHERE load_status = 'Overloaded 90-100%') AS overloaded_90_100,
               COUNT(DISTINCT meter_no) FILTER (WHERE load_status = 'Underloaded <20%') AS underloaded_below_20
        FROM hes_gold.dt_peak_loading
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND LOWER(cluster) = 'kashi'

  mdm_load_violation:
    domain: mdm
    title: "% consumers with load violation (max demand above sanctioned load)"
    description: "The Technical > Load Management card % Consumers with Load Violation: consumers whose maximum demand exceeds their sanctioned load by more than 60%, as a share of consumers assessed; by project / circle / zone / category; excess kW; violator lists."
    keywords: [load violation, sanctioned load, contracted load, max demand, maximum demand, md, exceeds sanctioned, overdrawing, excess load, excess kw, violators, consumers with load violation, load violation percentage]
    tables: [load_violation, load_assessed_consumers]
    answer_notes:
      - "Forecasts: say plainly it is an estimate from June and July (the complete months), give the projected figure and the method (e.g. same change as June to July), and that August is partial (2-3 days) so it was not used."
      - "'Consumers with load violation by circle / zone ...' is the card's chart: flagged consumers per area, most first -- lead with the area that has the MOST violators and its count, then give its % of assessed; name the highest % separately only if it is a different area."
      - "A load violation = the consumer's maximum demand in the month is more than 1.6 x (60% above) its sanctioned load. % = violators / consumers assessed (consumers with a sanctioned load and a max-demand reading). Quote violators, assessed and the % (2 decimals), and name the month (July 2026 is the dashboard default when no month is asked)."
    rules:
      - "Forecasts / months with no data: HES data runs June-August 2026 (August holds only 2-3 days). A question about September 2026 or later, 'next month', 'predict' or 'if the trend continues' = query the month-wise series (GROUP BY data_date, June-August) and project from the COMPLETE months (June, July) -- never pin the empty month (it returns 0 rows), never let partial August drive the trend."
      - "Month: data_date = month 1st; no month / 'latest' = the dashboard default month (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). Months stored 2026-06..08."
      - "hes_gold.load_violation holds VIOLATORS only (one row per consumer): violators = COUNT(DISTINCT meter_no). Denominator = SUM(assessed_meters) FROM hes_gold.load_assessed_consumers with the SAME month and place / category filters. % = violators * 100.0 / assessed, computed from two CTEs (WITH v AS (...), a AS (...) SELECT ... FROM v, a); per area / project: GROUP BY that column in both CTEs and JOIN v and a on it."
      - "Filters: cluster 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi'); category 'consumer_1_phase' / 'consumer_3_phase'; zone / circle / division / sub_division upper-case (UPPER(col) LIKE '%NAME%'). load_assessed_consumers has no feeder / dtr / meter columns -- a % below sub_division is not available (counts are). Flagged consumers by area = COUNT(DISTINCT meter_no) GROUP BY circle (default) ORDER BY 2 DESC. Lists: meter_no, sanctioned_load_kw, md_kw, excess_kw, excess_pct ORDER BY excess_kw DESC LIMIT 200."
    example:
      question: "What % of consumers have load violation in Kashi?"
      sql: |
        WITH m AS (SELECT MAX(month_date) AS mon FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c),
             v AS (SELECT COUNT(DISTINCT meter_no) AS violators FROM hes_gold.load_violation
                   WHERE data_date = (SELECT mon FROM m) AND LOWER(cluster) = 'kashi'),
             a AS (SELECT SUM(assessed_meters) AS assessed FROM hes_gold.load_assessed_consumers
                   WHERE data_date = (SELECT mon FROM m) AND LOWER(cluster) = 'kashi')
        SELECT (SELECT mon FROM m) AS data_month, violators, assessed,
               ROUND(violators * 100.0 / NULLIF(assessed, 0), 2) AS pct_consumers_with_load_violation
        FROM v, a

  # Operation Analytics imbalance cards (HES, Athena hes_gold; gmr-etl kpi_13_phase_imbalance_sigma.py +
  # kpi_17_imbalance_reduction.py; dashboard KpiBoard Layout E / Layout D). Recomputed live 10 Nov 2026.
  # NOT the Power Quality VUI / current-unbalance / % time CI cards (mdm_power_quality) -- see routing.md.
  mdm_phase_imbalance:
    domain: mdm
    title: "Phase imbalance (Operation Analytics): Voltage / Current Imbalance, Imbalance Alerts, Phase imbalance reduced by minimum 30%"
    description: "The Operation Analytics cards built on the 3-sigma phase test: Voltage Imbalance and Current Imbalance (meters imbalanced on 3+ days, ageing, imbalanced half-hours / days), Voltage / Current Imbalance Alerts (Critical / Poor / Average grades), and Phase imbalance reduced by minimum 30% (meters whose imbalance fell 30+ points from last month, voltage and current)."
    keywords: [voltage imbalance, current imbalance, phase imbalance, voltage/current imbalance, imbalance alerts, imbalance alert, alerts when threshold exceeded, threshold exceeded, imbalance reduction, imbalance reduced, reduced by 30, minimum 30%, 30 points, improved, improvement, reduce imbalance, imbalanced half-hours, imbalanced days, imbalance days, imbalance %, 3-sigma, 3 sigma, sigma, ageing, age band, 3-30 days, not flagged, critical, severity, dominant severity, meters assessed, out of balance, phases out of balance]
    tables: [voltage_imbalance, current_imbalance, voltage_imbalance_alerts, current_imbalance_alerts, voltage_imbalance_reduction, current_imbalance_reduction]
    answer_notes:
      - "Always name the month (data_month). No month asked = the dashboard default, the latest month with >= 10 days of readings (July 2026; August holds 2 days). On the reduction card data_month is the CURRENT month of the pair: July 2026 = June -> July."
      - "Imbalance here is the 3-sigma phase test, not the % unbalance of the Power Quality cards: a half-hour is imbalanced when one phase (or all three) sits further from the others than 3 x the normal spread of that meter type at that time of day; a day counts when more than 50% of its half-hours are imbalanced; a meter is flagged (aged '3-30 Days', ...) at 3+ such days. Lead with flagged meters, then meters assessed."
      - "Alerts grade each day by its share of imbalanced half-hours: Critical >= 85%, Poor >= 70%, Average >= 50%; each alert meter carries its dominant grade (the one with the most imbalanced half-hours) and needs 3+ days at it. Quote Critical / Poor / Average counts and the total."
      - "Reduction: a meter qualifies when last month's imbalance % minus this month's is 30 percentage POINTS or more (client spec), not a 30% relative fall. Give voltage and current side by side -- never add them (a meter can improve on both). If asked how reliable it is: qualifies_live counts only half-hours with a usable 3-phase reading (voltage 1,110 of 1,522 in July still qualify); a big fall in live_share_curr means the meter simply reported fewer usable readings."
      - "August 2026 holds only 2 days: no meter can reach 3 imbalanced days, so August shows 0 flagged meters on the imbalance card -- say it is partial, never 'no imbalance'."
    rules:
      - "Month: data_date = month 1st, one row per meter per month. No month / 'current' / 'latest' = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). Named month = DATE 'YYYY-MM-01' (imbalance / alerts: June-August; reduction: 2026-07-01 = June->July, 2026-08-01 = July->August, no June row). Month-wise = GROUP BY data_date. Never sum months."
      - "Places: cluster = project 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi'); zone / circle / division / sub_division upper-case (UPPER(col) LIKE '%NAME%'); discom_code 'DVVNL' / 'PUVVNL'; feeder_code, dtr_code, meter_no. Meter type = category: 'dt_meter', 'feeder', 'consumer_3_phase', 'consumer_ht' (no 1-phase meters, no role column). No sub_station."
      - "Voltage / Current Imbalance (hes_gold.voltage_imbalance / current_imbalance -- every meter assessed): meters assessed = COUNT(*); flagged = COUNT_IF(ageing_bucket IS NOT NULL) (NULL = 'Not flagged (under 3 days)'); imbalanced half-hours = SUM(imbalanced_blocks); imbalance % = ROUND(AVG(imbalance_pct), 2) (plain mean per meter, the card tile); imbalanced days = SUM(imbalance_days). By age band = GROUP BY ageing_bucket. 'Meters with voltage imbalance' = flagged. Worst meters: ORDER BY imbalance_days DESC, imbalance_pct DESC LIMIT 10."
      - "Imbalance Alerts (hes_gold.voltage_imbalance_alerts / current_imbalance_alerts -- alert meters ONLY, one row each): alert meters = COUNT(*); by grade = COUNT_IF(severity = 'Critical' / 'Poor' / 'Average'); imbalanced half-hours = SUM(severity_blocks); imbalanced days = SUM(severity_days). ageing_bucket uses severity_days; ageing_bucket_run / severity_run_days (consecutive-day reading) only when 'consecutive' is asked."
      - "Phase imbalance reduced by minimum 30% (hes_gold.voltage_imbalance_reduction + current_imbalance_reduction, every meter compared): improved = COUNT(*) WHERE qualifies -- ALWAYS filter qualifies (unfiltered = ~168,000 meters compared). Card = voltage count and current count, one scalar subquery per table (or two CTEs joined on the area for a breakdown: FULL OUTER JOIN, COALESCE 0, ORDER BY GREATEST(...) DESC LIMIT 12). Tiles over qualifying meters: AVG(reduction_pp) points, AVG(prev_pct) last month %, AVG(curr_pct) this month %. 'Relative 30%' = qualifies_relative; 'live readings' = qualifies_live. Lists: meter_no, prev_pct, curr_pct, reduction_pp ORDER BY reduction_pp DESC LIMIT 10."
      - "Which card: 'alert(s)' / 'threshold exceeded' / Critical-Poor-Average grades = *_alerts; 'reduc*' / 'improv*' / '30%' / '30 points' = *_reduction; else voltage_imbalance / current_imbalance. Voltage vs current: pick the table the question names; 'phase imbalance' without voltage/current = both (two queries or two subqueries). 'unbalance', VUI, '% time ... >10%', 'unacceptable' are the Power Quality cards (mdm_power_quality), never these tables."
      - "Athena: COUNT_IF / FILTER, no '::' casts; ROUND percentages to 2 decimals. Never JOIN these tables row-by-row on meter_no (different populations); combine aggregates only."
    example:
      question: "Phase imbalance reduced by minimum 30% in Kashi"
      sql: |
        SELECT (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) AS data_month,
               (SELECT COUNT(*) FROM hes_gold.voltage_imbalance_reduction
                WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
                  AND qualifies AND LOWER(cluster) = 'kashi') AS voltage_meters_improved,
               (SELECT COUNT(*) FROM hes_gold.current_imbalance_reduction
                WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
                  AND qualifies AND LOWER(cluster) = 'kashi') AS current_meters_improved

  # Operation Analytics anomaly / data cards (HES meter data on Athena hes_gold). Formulas follow the dashboard's
  # generic KpiBoard tiles (HES-FRONTEND-GMR src/kpi/cards.js + rollup.js over HES-BACKEND-GMR /breakdown) on the
  # tables gmr-etl kpi_40/30/31/41/47 write; references recomputed live 10 Nov 2026. Default month = the board default
  # (latest month with >= 10 days of readings = July 2026), the same expression as the power-quality cards.
  mdm_reverse_flow:
    domain: mdm
    title: "Reverse flow (net meters not exporting, non-net meters exporting)"
    description: "The Operation Analytics card Reverse Flow: consumer meters whose export is wrong for their type -- net (solar) meters that exported nothing all month, and meters that are not net meters but exported energy; flagged meters, by type / area / month, export kWh, one meter."
    keywords: [reverse flow, reverse energy, export, exporting, exported, kwh export, net meter, net metering, net-metered, nsm, solar, rooftop, non net meter, net meter not exporting, never exported, unauthorised generation, backfeed, anomaly type]
    tables: [reverse_flow]
    answer_notes:
      - "Always name the month (data_month, e.g. 2026-07-01 = July 2026). With no month asked it is the dashboard's default month: the latest month with at least 10 days of readings (July 2026; August 2026 holds only 2-3 days)."
      - "Lead with Total Flagged Meters, then its two kinds: net meters that exported nothing all month (likely miswired, dead inverter or export register) and non-net meters that exported (unauthorised generation or wrong meter type on record). Export by a net meter is normal and never counted."
      - "The card's Export (kWh) tile is the AVERAGE export per flagged meter (non-exporting net meters count as 0) -- say 'average per flagged meter'; total kWh only when asked."
    rules:
      - "hes_gold.reverse_flow: one row per consumer meter (consumer_1_phase / consumer_3_phase only) per month, EVERY consumer checked -- findings are is_anomaly = true. Month: data_date = month 1st; no month = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). Month-wise = GROUP BY data_date. Never sum months."
      - "Card tiles: total flagged meters = COUNT_IF(is_anomaly); net meters not exporting = COUNT_IF(anomaly_type = 'net_meter_non_exporting'); non-net meters exporting = COUNT_IF(anomaly_type = 'non_net_meter_exporting'); Export (kWh) tile = ROUND(AVG(CASE WHEN is_anomaly THEN total_kwh_export END), 2). Consumers checked = COUNT(*); net meters = COUNT_IF(is_net_meter) (smart_meter_type 'NSM1-PH' / 'NSM3-PH'). A share = flagged * 100.0 / COUNT(*)."
      - "By area (chart: meters per circle split by type): WHERE is_anomaly AND <area> IS NOT NULL GROUP BY circle (default) / zone / division / feeder_code ORDER BY flagged DESC. Lists: anomaly_type = '...' ORDER BY total_kwh_export DESC (kWh, 2 decimals) LIMIT 10. One meter: meter_no = 'X' -- anomaly_type NULL = no anomaly."
      - "Places: cluster 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi'); discom_code 'DVVNL' / 'PUVVNL'; zone / circle / division / sub_division upper-case (UPPER(col) LIKE '%NAME%'); category consumer_1_phase / consumer_3_phase."
    example:
      question: "Reverse flow anomalies in Kashi"
      sql: |
        SELECT MAX(data_date) AS data_month,
               COUNT_IF(is_anomaly) AS total_flagged_meters,
               COUNT_IF(anomaly_type = 'net_meter_non_exporting') AS net_meters_not_exporting,
               COUNT_IF(anomaly_type = 'non_net_meter_exporting') AS non_net_meters_exporting,
               ROUND(AVG(CASE WHEN is_anomaly THEN total_kwh_export END), 2) AS avg_export_kwh_per_flagged_meter
        FROM hes_gold.reverse_flow
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND LOWER(cluster) = 'kashi'

  mdm_meter_data:
    domain: mdm
    title: "Meter data health (Data Quality Issues: partial days; Meters Stopped Communicating: silent / never reported)"
    description: "The Operation Analytics cards Data Quality Issues (meters reporting only part of a day's 48 half-hour readings: partial days, partial-day %, completeness %, weekly / daily view) and Meters Stopped Communicating (meters silent 3+ days or never reported: days since last seen, silence period buckets, by meter type / area, one meter's last contact)."
    keywords: [data quality, data quality issues, partial day, partial days, incomplete data, missing readings, missing blocks, completeness, data completeness, blocks reported, stopped communicating, not communicating, non-communicating meters, silent meters, gone silent, last seen, last communicated, last reading, days since last seen, never reported, no data received, silence period, communication failure]
    tables: [data_quality_issues, data_quality_issues_daily, communication_failures]
    answer_notes:
      - "Always name the month (data_month). No month asked = the dashboard default month (July 2026, the latest with at least 10 days of readings)."
      - "Data quality: a partial day = a day the meter sent 2-46 of its 48 half-hour readings (0-1 is a silent day, 47-48 complete). Quote partial days, meters with partial days and the average completeness %. Partial-day % and completeness % are averages per meter."
      - "Meters stopped communicating: a meter is listed once it has been silent 3+ days at the end of the month's data (July data runs to 24 Jul). Always give silent meters split into never reported (no reading ever -- a commissioning problem) and stopped after reporting. These are HES meter readings, not O&M complaint tickets."
    rules:
      - "Month: data_quality_issues / communication_failures: data_date = month 1st; data_quality_issues_daily: month_date = month 1st (data_date is the DAY). No month = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). Never sum months."
      - "Data Quality Issues card (hes_gold.data_quality_issues, one row per meter per month, EVERY meter with readings): meters = COUNT(*); partial days = SUM(partial_days); meters with partial days = COUNT_IF(partial_days > 0); partial days % = ROUND(AVG(partial_day_pct), 2); completeness % = ROUND(AVG(avg_completeness_pct), 2). By area: GROUP BY circle (default) ORDER BY SUM(partial_days) DESC."
      - "Weekly / daily view (hes_gold.data_quality_issues_daily, one row per PARTIAL meter-day only): flagged meter-days = COUNT(*), meters affected = COUNT(DISTINCT meter_no), GROUP BY week_label ('Week 1 July' = days 1-7 ... 'Week 5 July' = 29-31; ORDER BY MIN(data_date)) or data_date; missing_blocks, completeness_pct per row. Days / weeks with issues = COUNT(DISTINCT data_date / week_label)."
      - "Meters Stopped Communicating (hes_gold.communication_failures, one row per SILENT meter -- days_since_last_seen >= 3 -- per month): silent meters = COUNT(*); never reported = COUNT_IF(never_reported); stopped after reporting = COUNT_IF(NOT never_reported); average days silent = ROUND(AVG(days_since_last_seen), 2); data up to = MAX(window_end). Silence period = nc_bucket, stored 'Non_Communicating_3_30_Days' / 'Non_Communicating_31_60_Days' / 'Non_Communicating_61_90_Days' / 'Non_Communicating_More_than_90_Days' (order by MIN(days_since_last_seen)). Meter type = category ('consumer_1_phase', 'consumer_3_phase', 'consumer_ht', 'dt_meter', 'feeder'). One meter: meter_no = 'X' -> last_seen_date, days_since_last_seen; no row = it reported within 3 days of the data's end."
      - "Places: cluster 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'agra'); zone / circle / division / sub_division upper-case (UPPER(col) LIKE '%NAME%'). communication_failures has ~107,500 meters with NULL area every month: totals keep them, rankings skip them (zone IS NOT NULL)."
    example:
      question: "How many meters have stopped communicating?"
      sql: |
        SELECT MAX(data_date) AS data_month, MAX(window_end) AS data_up_to,
               COUNT(*) AS silent_meters,
               COUNT_IF(never_reported) AS never_reported,
               COUNT_IF(NOT never_reported) AS stopped_after_reporting,
               ROUND(AVG(days_since_last_seen), 2) AS avg_days_silent
        FROM hes_gold.communication_failures
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)

  mdm_hidden_outage:
    domain: mdm
    title: "Hidden outage pockets (hidden power event, outage not recorded, unreported block-load gap, abnormal current flow)"
    description: "The Operation Analytics card Hidden Outage Pockets and its four detector rows: meters whose readings contradict the outage record -- current flowing during a reported outage (Hidden Power Event), voltage and current at zero with no outage logged (Outage Not Recorded), no reading at all inside a reported outage (Unreported Block-Load Gap), current on a phase with no voltage (Abnormal Current Flow); flagged meters, % half-hours flagged, flagged events, by detector / area / meter type, one meter."
    keywords: [hidden outage, hidden outages, hidden outage pockets, hidden power event, power during outage, current during outage, outage not recorded, unrecorded outage, unlogged outage, outage nobody logged, unreported outage, unreported block-load gap, unreported blockload gap, block load gap, missing readings during outage, abnormal current flow, current without voltage, zero voltage current, detector, flagged events, slots flagged]
    tables: [hidden_outage_summary, hidden_outage_events]
    answer_notes:
      - "Always name the month (data_month). No month = the dashboard default month (July 2026). July is the only month with all four detectors: June has no Hidden Power Event, August (2-3 days) only Outage Not Recorded and Abnormal Current Flow."
      - "Total Flagged Meters counts a meter once even if several detectors flagged it; per-detector meter counts add up to more. % slots flagged = flagged half-hours as a share of the half-hours each detector checks (Abnormal Current Flow has no such base). Flagged events = outages (or, for Outage Not Recorded, unlogged dark spells) containing a flagged half-hour."
      - "These are not outage counts or SAIDI/SAIFI (reliability cards) and not the feeder-mapping outage match."
    rules:
      - "hes_gold.hidden_outage_summary: one row per meter x detector per month, data_date = month 1st; no month = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). detector = 'hidden_power_event' / 'outage_not_recorded' / 'unreported_blockload_gap' / 'abnormal_current_flow'; a detector card = WHERE detector = '...'; the consolidated card = all four."
      - "Card tiles: total flagged meters = COUNT(DISTINCT meter_no); % slots flagged = ROUND(SUM(total_block_count_flagged) * 100.0 / SUM(total_block_count), 2) (never AVG(pct_blocks_flagged)); flagged events = SUM(total_flagged_occurrences); events checked = SUM(total_occurrences); half-hours flagged = SUM(total_block_count_flagged). Per detector: GROUP BY detector, COUNT(DISTINCT meter_no), NULLIF the denominator (abnormal_current_flow has NULL total_block_count / occurrences)."
      - "By area / type: GROUP BY circle (default) / zone / division / feeder_code / category ('feeder', 'dt_meter', 'consumer_3_phase', 'consumer_1_phase') with <area> IS NOT NULL, ORDER BY meters DESC. Places: cluster 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster)); zone..sub_division upper-case. No sub_station, dtr_code or role column."
      - "One meter: summary WHERE meter_no = 'X' (detector, days_affected, total_block_count_flagged, pct_blocks_flagged, total_flagged_occurrences, first_slot / last_slot are UTC -- show AT TIME ZONE 'Asia/Kolkata'). Slot-by-slot list only from hes_gold.hidden_outage_events WHERE meter_no = 'X' AND month_date = ... (it holds 300M+ rows a month -- never scan it without meter_no)."
    example:
      question: "Hidden outage pockets detector-wise"
      sql: |
        SELECT MAX(data_date) AS data_month, detector,
               COUNT(DISTINCT meter_no) AS meters,
               ROUND(SUM(total_block_count_flagged) * 100.0 / NULLIF(SUM(total_block_count), 0), 2) AS pct_slots_flagged,
               SUM(total_flagged_occurrences) AS flagged_events
        FROM hes_gold.hidden_outage_summary
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
        GROUP BY detector
        ORDER BY meters DESC

  mdm_spike_drop:
    domain: mdm
    title: "Consumption spikes / drops (abnormal half-hour consumption readings)"
    description: "The Operation Analytics card Consumption Spikes / Drops: meters with 10+ half-hour kWh readings outside their own monthly baseline +/- 3 sigma; flagged meters, spike vs drop meters, spike / drop readings, by area / meter type / month, one meter's flagged readings."
    keywords: [consumption spike, consumption drop, spikes, drops, spikes and drops, spike drop, abnormal consumption, unusual consumption, sudden jump, sudden fall, outlier readings, outliers, abnormal readings, baseline, 3 sigma, kwh import spike]
    tables: [consumption_spike_drop, consumption_spike_drop_detail]
    answer_notes:
      - "Always name the month (data_month). No month = the dashboard default month (July 2026). August has only 2-3 days (2,320 meters) -- never use it for a trend."
      - "A reading is a spike (drop) when it is more than 3 x the spread of the meter's own 48 half-hour baselines above (below) that half-hour's monthly average; a meter is flagged with 10 or more such readings in the month, and called a Spike meter when spikes >= drops, else a Drop meter. Outlier readings is an average per flagged meter."
    rules:
      - "hes_gold.consumption_spike_drop: one row per meter per month, the WHOLE fleet -- findings are is_spike_or_drop_suspect = true. Month column is month_date (no data_date): month_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c) when no month is asked."
      - "Card tiles (always AND is_spike_or_drop_suspect): flagged meters = COUNT(*); spike meters = COUNT_IF(meter_flag = 'Spike'); drop meters = COUNT_IF(meter_flag = 'Drop'); outlier readings = ROUND(AVG(total_outliers), 2) (average per meter); spike readings = SUM(spike_count); drop readings = SUM(drop_count). By area / type: GROUP BY circle (default) / zone / division / category with <area> IS NOT NULL ORDER BY flagged DESC."
      - "One meter's flagged readings: hes_gold.consumption_spike_drop_detail WHERE meter_no = 'X' AND month_date = ... -- data_date, block_time (UTC 'HH:MM'), actual_kwh_import, baseline_mean, upper, lower, flag 'Spike' / 'Drop', deviation; ORDER BY data_date, block_time LIMIT 500. It holds only suspect meters' outlier readings (90M+ rows a month): never scan it without meter_no."
      - "Places: cluster 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster)); zone..sub_division upper-case; category 'consumer_1_phase' / 'consumer_3_phase' / 'consumer_ht' / 'dt_meter' / 'feeder'. Never JOIN the two tables for a count."
    example:
      question: "Consumption spikes and drops in Agra"
      sql: |
        SELECT MAX(month_date) AS data_month,
               COUNT(*) AS flagged_meters,
               COUNT_IF(meter_flag = 'Spike') AS spike_meters,
               COUNT_IF(meter_flag = 'Drop') AS drop_meters,
               ROUND(AVG(total_outliers), 2) AS avg_outlier_readings_per_meter,
               SUM(spike_count) AS spike_readings,
               SUM(drop_count) AS drop_readings
        FROM hes_gold.consumption_spike_drop
        WHERE month_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND is_spike_or_drop_suspect AND LOWER(cluster) = 'agra'

  mdm_power_factor:
    domain: mdm
    title: "Power factor (Low Power Factor (%) by DT/Feeder, Power factor deterioration)"
    description: "The Technical cards on power factor: Low Power Factor (%) by DT/Feeder (meters whose share of readings below PF 0.9 is 20%+ for 3+ observed days -- severity Critical / Poor / Average / Borderline, avg low PF %, ageing days, streak coverage; by circle / zone / category, DT and feeder meters, one meter's PF) and Power factor deterioration (meters with > 3 consecutive days of mostly-poor PF, by PF band Critical / Poor / Moderate, category, circle, days in band)."
    keywords: [power factor, pf, low power factor, low pf, below 0.9, pf below 0.9, poor power factor, bad power factor, kvah, reactive, lagging, leading pf, pf deterioration, power factor deterioration, deteriorating, pf band, pf issue, meters with pf issue, critical pf, poor pf, moderate pf, borderline, avg low pf, ageing days, streak, streak coverage, low pf by dt, low pf by feeder]
    tables: [lpf2_low_power_factor, lpf2_low_power_factor_meters, lpf2_low_power_factor_daily, power_factor_deterioration, power_factor_deterioration_meters]
    answer_notes:
      - "Always name the month. No month asked = the dashboard default, July 2026 (latest month with 10+ days of readings; August has 2-3). Low Power Factor months are rolling 90-day snapshots (July = readings up to 24 July, June included) -- say 'as of <month>', never add months."
      - "Low Power Factor card: a meter is flagged when it is Borderline or worse (share of its PF-valid half-hours below 0.9: Critical > 50%, Poor > 35%, Average > 25%, Borderline >= 20%) and has 3+ observed flagged days in its current run. Quote meters flagged, avg low PF % and max ageing days; give streak coverage beside ageing (low coverage = sparse feed, not a chronic meter). All flagged meters are in the 3-30 Days band today."
      - "How a meter's low PF % is worked out (explain in these words, never as a formula with column names): each half-hour's power factor = kWh / kVAh (half-hours with no kVAh are skipped); low PF % = the share of the meter's valid half-hours with PF below 0.9, over a trailing 90-day window ending on the month's last day of readings (July = June + July). Severity comes from that share; a day is flagged when 20%+ of its readings (at least 12 that day) are below 0.9, and ageing = flagged days in the current run. The card's avg low PF % is the average of those meter shares across the area's groups."
      - "Power factor deterioration: Meters with PF issue = meters with more than 3 consecutive days where at least half the readings had PF < 0.95; band by the day's dominant PF: Critical < 0.30, Poor 0.30-0.85, Moderate 0.85-0.95, Leading PF > 1.0. Quote Poor + Critical and Critical with their % of meters with PF issue."
      - "The two cards are different measures: 'low power factor' = the Low PF card; 'deteriorat*' / 'PF band' / 'PF issue' = Power factor deterioration. Quote meters as whole numbers, % with 2 decimals."
    rules:
      - "Month: data_date = month 1st. No month / 'latest' = data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c); named month = DATE 'YYYY-MM-01'; month-wise = GROUP BY data_date. lpf2_low_power_factor_daily is one row per meter per DAY: filter data_date BETWEEN the month's 1st and last day. SELECT the month as data_month."
      - "Places: lpf2_low_power_factor, power_factor_deterioration(_meters) have NO cluster -- project = zones: Agra UPPER(zone) IN ('AGRA','ALIGARH','ETAH','FIROZABAD','MATHURA'), Kashi ('AZAMGARH','VARANASI I','VARANASI II'), Triveni ('MIRZAPUR','PRAYAGRAJ I','PRAYAGRAJ II'); lpf2_low_power_factor_meters also has cluster 'Agra'/'Kashi'/'Triveni'. Meter type = category: 'consumer_1_phase', 'consumer_3_phase', 'consumer_ht', 'dt_meter' (DT), 'feeder'. 'By DT / feeder' = category IN ('dt_meter','feeder')."
      - "Low PF card (hes_gold.lpf2_low_power_factor, rollup of aged meters): ALWAYS WHERE severity NOT IN ('Normal','NoData'). Meters = SUM(unique_meter_count); avg low PF % = ROUND(AVG(avg_low_pf_pct), 2); max ageing days = MAX(max_ageing_days) (never SUM); avg streak coverage % = ROUND(AVG(avg_streak_coverage_pct), 2). By severity / ageing_bucket / circle / zone / category = GROUP BY that column, same measures, ORDER BY meters DESC. No feeder_code / dtr_code / meter_no on this table."
      - "One meter / feeder / DT, or lists (hes_gold.lpf2_low_power_factor_meters, one row per meter): low_pf_pct, low_blocks, total_blocks (PF-valid half-hours), severity, ageing_days, ageing_bucket, streak_coverage_pct, avg_pf, min_pf, as_of_date. One meter = meter_no = 'X'; a feeder's own PF = category = 'feeder' AND feeder_code = 'X'; a DT = category = 'dt_meter' AND (dtr_code = 'X' OR meter_no = 'X'). Worst lists: WHERE severity NOT IN ('Normal','NoData') AND ageing_days >= 3 ORDER BY low_pf_pct DESC, total_blocks DESC LIMIT 10. Share of meters flagged = that count * 100.0 / COUNT_IF(severity <> 'NoData'); share of readings below 0.9 = SUM(low_blocks) * 100.0 / SUM(total_blocks). Day-wise for one meter = lpf2_low_power_factor_daily (pct_time_low_pf, avg_power_factor, status, is_flagged_day)."
      - "PF deterioration: band counts = SUM(unique_meter_count) FROM hes_gold.power_factor_deterioration GROUP BY pf_band ('Critical','Poor','Moderate','Leading PF'). Meters with PF issue (total) = COUNT(DISTINCT meter_no) FROM hes_gold.power_factor_deterioration_meters (a meter can sit in two bands -- never sum bands for the total). Poor + Critical = band sum for pf_band IN ('Poor','Critical'); % = * 100.0 / total. Days in band = qualifying_days on _meters (MIN, APPROX_PERCENTILE 0.5 / 0.9, MAX, AVG by pf_band). Per area: band shares = band SUM / area SUM * 100."
      - "Counting flagged meters on hes_gold.lpf2_low_power_factor_meters (lists, both-months, joins with power_factor_deterioration_meters, medians) ALWAYS WHERE severity NOT IN ('Normal','NoData') AND ageing_days >= 3 -- the card's own rule (the rollup holds only these meters). Without ageing_days >= 3, July = 868,698 meters instead of the card's 711,642. Only a one-meter lookup (meter_no = 'X') skips it."
      - "Median / percentile of low PF % = APPROX_PERCENTILE(low_pf_pct, p) FROM hes_gold.lpf2_low_power_factor_meters with the flagged filter above -- never a percentile of avg_low_pf_pct on the rollup (that is a mean per group, not a meter)."
      - "PF deterioration meters per project / zone / circle (no band asked) = COUNT(DISTINCT meter_no) FROM hes_gold.power_factor_deterioration_meters GROUP BY the place -- never SUM(unique_meter_count) across bands (Agra 291,868 distinct vs 361,738 summed)."
      - "Forecasts / months with no data: HES data runs June-August 2026 (August holds only 2-3 days). A question about September 2026 or later, 'next month', 'predict' or 'if the trend continues' = query the month-wise series (data_date BETWEEN DATE '2026-06-01' AND DATE '2026-08-01' GROUP BY data_date) and project from the COMPLETE months (June, July) -- never pin the empty month (it returns 0 rows), never let partial August drive the trend. Low PF months are trailing 90-day windows: say the projection is indicative."
      - "Legacy hes_gold.low_power_factor* and voltage_deviation are not used. ROUND to 2 decimals; never JOIN two of these tables."
    example:
      question: "How many meters have low power factor in Kashi?"
      sql: |
        SELECT MAX(data_date) AS data_month,
               SUM(unique_meter_count) AS low_pf_meters,
               ROUND(AVG(avg_low_pf_pct), 2) AS avg_low_pf_pct,
               MAX(max_ageing_days) AS max_ageing_days,
               ROUND(AVG(avg_streak_coverage_pct), 2) AS avg_streak_coverage_pct
        FROM hes_gold.lpf2_low_power_factor
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND severity NOT IN ('Normal', 'NoData')
          AND UPPER(zone) IN ('AZAMGARH', 'VARANASI I', 'VARANASI II')

  # Operation Parameters reliability cards (HES dashboard: Reliability Trends, Number / Duration of Outages,
  # Feeders with Maximum Outages, Reliability Improvement Trend, SAIDI..MAIFI). gmr-etl kpi_20 / kpi_25 / kpi_26;
  # references recomputed live 10 Nov 2026 (grpD/refs.json).
  mdm_reliability:
    domain: mdm
    title: "Supply reliability (SAIDI, SAIFI, CAIDI, CAIFI, MAIFI, outage frequency and duration, reliability improvement)"
    description: "The Operation Parameters reliability cards: SAIDI / SAIFI / CAIDI / CAIFI / MAIFI (fleet, by project / zone / circle / division / feeder category, worst and best feeders, one feeder), the Reliability Trends monthly chart, Number of Outages (Frequency), Duration of Outages (Minutes), Feeders with Maximum Outages (top feeders / DTs / consumers by outage count or minutes, comparison by area), Reliability Improvement Trend (period-over-period change in the indices)."
    keywords: [saidi, saifi, caidi, caifi, maifi, reliability, reliability index, reliability indices, reliability trend, reliability improvement, interruption, interruptions, momentary interruption, sustained, outage, outages, number of outages, outage frequency, outage duration, duration of outages, outage minutes, feeders with maximum outages, most outages, tripped, trips, went off, without power, power cut, worst feeders, best feeders, feeder category, improvement, improved, worsened, first half, second half]
    tables: [reliability_indices, outage_ranking, reliability_improvement_trends]
    answer_notes:
      - "Always name the month (data_month). With no month asked it is the dashboard's default month: July 2026 (the latest month with at least 10 days of readings). Outage data is thin outside July: June holds only Agra's (DVVNL) outages over 6 days, August has none (every index 0, no outage_ranking rows) -- say so whenever June or August appears, and never call a June-to-July rise a real deterioration."
      - "Meanings: SAIDI = outage minutes per consumer served in the month; SAIFI = interruptions per consumer served; CAIDI = minutes per interruption (SAIDI / SAIFI); CAIFI = interruptions per consumer actually affected; MAIFI = momentary (< 5 min) interruptions per consumer served. SAIDI/SAIFI here count momentary outages too (source behaviour, not IEEE 1366). Units: SAIDI and CAIDI in minutes, the rest are counts per consumer -- 2 decimals (MAIFI 4)."
      - "Reliability indices are consumer outages rolled up to each consumer's feeder; Number / Duration of Outages count the outages a meter itself recorded (feeder meter, DT meter or consumer meter). Say which one you quote."
      - "Rankings: the first row of RESULT is the answer; feeder lists show feeder_code (+ feeder_name). Worst/best feeder lists only rate feeders with >= 100 consumers and outage lists leave out meters with fewer than 5 outages -- say so in one clause."
      - "Reliability Improvement Trend: positive % = improved (fewer / shorter interruptions). July holds two comparisons -- June vs July (months) and July 1-15 vs 16-31 (halves); quote each by its label. The card's % is a plain average of each feeder's own %, swamped by feeders with tiny baselines; give the fleet before/after figures too when asked if reliability improved."
    rules:
      - "Month: data_date = month 1st (reliability_indices, outage_ranking: 2026-06-01, 2026-07-01, + 2026-08-01 on reliability_indices). No month / 'current' / 'latest' = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). Month-wise = GROUP BY data_date. Never sum months."
      - "reliability_indices: one row per feeder per month (4,976 feeders, every feeder incl. zero-outage ones). Fleet / area index = re-derive from summed raw totals, NEVER AVG(saidi): SAIDI = SUM(dur) / SUM(total_consumers); SAIFI = SUM(events) * 1.0 / SUM(total_consumers); CAIDI = SUM(dur) / SUM(events); CAIFI = SUM(events) * 1.0 / SUM(affected); MAIFI = SUM(momentary) * 1.0 / SUM(total_consumers). Card tiles and area charts use ALL feeders; by area = GROUP BY circle (default) / zone / division / sub_division / feeder_category, worst first."
      - "Worst / best N feeders: the feeder's own column (saidi / saifi / caidi / caifi / maifi) WHERE NOT below_min_consumers (>= 100 consumers) ORDER BY <index> DESC (worst) or ASC (best), feeder_code LIMIT N. Feeder type = LOWER(feeder_category) = 'rural' / 'urban' / 'urban hq' / 'urban tehsil' / 'agriculture' / 'industrial' / 'substation' / 'mixed' / 'independent' / 'ttz (taj trapezium zone)' / 'domestic'; NULL = unknown. One feeder: feeder_code = 'X' or UPPER(feeder_name) LIKE '%X%'."
      - "outage_ranking: one row per meter per month with its own outages: outage_count, total_duration_min, avg_duration_min, max_duration_min, days_with_outage. ALWAYS pin category: 'feeder' (default; 'feeders with outages'), 'dt_meter' (DTs, label dtr_code), 'consumer_1_phase', 'consumer_3_phase', 'consumer_ht' -- never add categories together (one outage appears on the feeder, its DTs and its consumers). Top N (Number of Outages / Feeders with Maximum Outages / Duration of Outages) = WHERE NOT below_min_outages ORDER BY outage_count (or total_duration_min) DESC LIMIT N; feeder label = COALESCE(feeder_code, meter_no). Comparison by area = SUM(outage_count) or SUM(total_duration_min) GROUP BY circle (default) WHERE <area> IS NOT NULL, top 10, all meters (no < 5 filter). Average minutes per outage = SUM(total_duration_min) / SUM(outage_count)."
      - "reliability_improvement_trends: one row per feeder per comparison: comparison_mode 'months' (comparison_label '2026-06 vs 2026-07', data_date = the later month) or 'halves' ('2026-07 days 1-15 vs 16-EOM', data_date 2026-07-16). A month = data_date >= month 1st AND < next month 1st (July returns both comparisons) -- always GROUP BY comparison_mode, comparison_label. Card % = ROUND(AVG(<index>_improvement_pct), 2) per comparison (NULL when the baseline was 0). Fleet before/after = SUM(prev_<i> * prev_total_consumers) / SUM(prev_total_consumers) vs the curr_ equivalent (SAIDI / SAIFI / MAIFI); improved = COUNT_IF(<i>_delta > 0) (delta = prev - curr), worsened = COUNT_IF(<i>_delta < 0)."
      - "Places: cluster = project, stored 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi'); discom_code 'DVVNL' / 'PUVVNL'; zone / circle / division / sub_division upper-case (UPPER(col) LIKE '%NAME%'); reliability_indices also has sub_station, feeder_name. Never JOIN two of these tables, and never use them for hidden-outage or mapping-audit questions."
      - "ROUND minutes and indices to 2 decimals (MAIFI 4)."
    example:
      question: "SAIDI and SAIFI by zone in Kashi"
      sql: |
        SELECT MAX(data_date) AS data_month, zone, COUNT(*) AS feeders, SUM(total_consumers) AS consumers,
               ROUND(SUM(dur) / NULLIF(SUM(total_consumers), 0), 2) AS saidi_min,
               ROUND(SUM(events) * 1.0 / NULLIF(SUM(total_consumers), 0), 2) AS saifi,
               ROUND(SUM(dur) / NULLIF(SUM(events), 0), 2) AS caidi_min
        FROM hes_gold.reliability_indices
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND LOWER(cluster) = 'kashi'
        GROUP BY zone
        ORDER BY saidi_min DESC

# Group F -- Finance energy-audit cards. Merge under business_rules.yaml `topics:` next to mdm_load_violation.
  mdm_energy_loss:
    domain: mdm
    title: "Energy audit: Feeder Loss (%), LT Loss (%), Top X Best/Worst Feeders/DTs, Energy Gap (kWh)"
    description: "The Finance energy-audit cards: Feeder Loss (%) (feeder meter input vs the energy its mapped consumers recorded), LT Loss (%) (same one level down, DT vs its consumers), Top X Best/Worst Feeders/DTs (also 'Top High Loss DTs / Feeders') ranked by loss %, Consumption Comparison - Energy Gap (kWh), and the AI-mapping basis of Feeder Loss (consumers attached by the outage-based mapping audit instead of the declared feeder). Tiles: total feeders/DTs, input MU, output MU, average loss %, credible %, units added; status split; feeder/DT lists; consumers behind one feeder/DT."
    keywords: [feeder loss, lt loss, dt loss, line loss, technical loss, distribution loss, energy loss, energy audit, energy accounting, energy gap, consumption comparison, at&c, atc loss, input energy, net input, output unit, energy fed, energy recorded at consumers, unbilled energy, loss percentage, loss kwh, loss in mu, negative loss, credible feeders, loss category, top x, best feeders, worst feeders, high loss feeders, high loss dts, ai mapping basis, index mapping, units added]
    tables: [feeder_loss, dt_loss, feeder_loss_ai, feeder_loss_consumers, dt_loss_consumers, feeder_loss_ai_consumers]
    answer_notes:
      - "Always name the month (data_month). With no month asked it is the dashboard default month (July 2026). These tables hold June and July 2026 only -- August was never computed: say so instead of showing an empty answer."
      - "Loss % = (energy fed in - energy recorded at the mapped consumers) / energy fed in. An area's loss is fleet-weighted (its feeders' kWh summed, then divided) -- never an average of feeder percentages. Quote energy totals in MU (million kWh, 2 decimals) and single feeders/DTs in kWh."
      - "Caveat every loss figure in one sentence: the feeder input carries the feeder meter's multiplying factor (2,000-8,000) while consumers use 1, and HES delivery is partial-month, so the absolute % (about 61% fleet-wide) is not a commercial loss; rankings between feeders are usable. Only 1.29% of feeders (92 of 7,154 in July) pass the dashboard's 'credible' gate. LT (DT) loss uses a placeholder MF of 1.0 and comes out NEGATIVE fleet-wide (-482%): say it is not a usable figure yet, give the counts."
      - "Best-by-loss lists are led by feeders/DTs with impossible negative loss (consumers recorded more than the feeder meter -- a meter or mapping error); worst lists are led by feeders at 100% (input recorded, consumers reported nothing). Say which it is, and offer the credible-only ranking."
      - "AT&C loss proper needs billing and collection efficiency, which are not in the data: answer with the feeder energy gap % (the dashboard's Energy Gap card calls it AT&C loss) and say it is the energy-side proxy."
      - "AI basis (feeder_loss_ai) attaches only consumers the mapping audit CONFIRMED or REASSIGNED (about 61% of the fleet, no HT consumers), so its output reads lower and its loss higher than index basis -- that gap is coverage, not more theft."
    rules:
      - "Month: data_date = month 1st (stored 2026-06-01, 2026-07-01). No month / 'current' / 'latest' = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). Named month = DATE 'YYYY-MM-01'. Month-wise = GROUP BY data_date. SELECT the month as data_month."
      - "Which table: feeder / 'feeder loss' / 'energy gap' / 'consumption comparison' / 'AT&C' / 'energy audit' = hes_gold.feeder_loss; 'LT loss' / 'DT loss' / DTs / transformers = hes_gold.dt_loss; 'AI mapping / AI basis / outage-based mapping' = hes_gold.feeder_loss_ai (index vs AI = both, each aggregated in its own CTE, JOIN on cluster or feeder_code). One row per feeder (dt_loss: per DT) per month. Never JOIN feeder_loss to dt_loss."
      - "Tiles (any scope, all rows -- no loss_category filter): feeders (DTs) = COUNT(*); input MU = SUM(net_input) / 1e6; output MU = SUM(asset_billed) / 1e6; energy gap MU = SUM(loss_kwh) / 1e6; average loss % = SUM(loss_kwh) * 100.0 / NULLIF(SUM(net_input), 0) (loss_kwh is NULL on no-consumer rows; keep the denominator over all rows, as the dashboard does); credible % = COUNT_IF(loss_credible) * 100.0 / COUNT(*); units added MU = SUM(added_kwh) / 1e6. Never AVG(loss_pct)."
      - "Status split = COUNT(*) GROUP BY loss_category: POSITIVE_LOSS(_PARTIAL_MONTH) (input >= consumers), NEGATIVE_LOSS(_PARTIAL_MONTH) (consumers > input), NO_CHILDREN_MAPPED (no consumers attached, no loss %), PARENT_ERROR (feeder meter read 0 but consumers recorded energy), PARENT_NO_DATA (nothing reported). 'Negative loss' = loss_pct < 0. Only the two POSITIVE/NEGATIVE categories have a loss_pct."
      - "Filters: 'credible only' = loss_credible AND NOT COALESCE(negative_loss, false); 'qualified' (full-month window) = is_qualified (FALSE for every July row). Places: cluster 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi'); zone / circle / division / sub_division upper-case (UPPER(col) LIKE '%NAME%'); feeder_code; dtr_code on dt_loss (codes like 'SAR/SDH/DT049'); feeder_code on dt_loss = the DT's parent feeder. No category / meter_no on feeder_loss / dt_loss. dt_loss has 1 row with NULL dtr_code and cluster: keep it in fleet totals, label it '(no project)' in project splits."
      - "Area breakdowns: GROUP BY cluster / zone / circle ... with the tile formulas, ORDER BY the asked measure. Project-wise with a Total: GROUP BY ROLLUP (cluster), label CASE WHEN GROUPING(cluster) = 1 THEN 'Total' ELSE cluster END AS project, ORDER BY GROUPING(cluster), <expression> (not the alias)."
      - "Top X best / worst (default 10, the card allows 1-50): worst = ORDER BY loss_pct DESC NULLS LAST, net_input DESC; best = ORDER BY loss_pct ASC NULLS LAST, net_input DESC; LIMIT X. 'Highest energy gap / loss in kWh' = ORDER BY loss_kwh DESC NULLS LAST. Feeder list columns: feeder_code (dtr_code), cluster, zone, ROUND(loss_pct, 2), ROUND(net_input, 3) AS input_kwh, ROUND(asset_billed, 3) AS output_kwh, ROUND(loss_kwh, 3), children_mapped, children_reporting, loss_category. Feeders/DTs 'in the ranking' = loss_pct IS NOT NULL."
      - "One feeder / DT: WHERE feeder_code = 'X' (dt_loss: dtr_code = 'X'). The window columns are named current_date / previous_date: ALWAYS write \"current_date\" in double quotes (bare current_date is today's date in Athena) and alias it (AS window_end). mapping_coverage is a 0-1 fraction (x 100 for %)."
      - "Consumers behind one feeder / DT: hes_gold.feeder_loss_consumers WHERE feeder_code = 'X' (dt_loss_consumers: dtr_code = 'X'; AI basis: feeder_loss_ai_consumers), same data_date; one row per REPORTING consumer: meter_no, category, mapping_confidence, child_days, parent_days, raw_kwh, billed_kwh (pro-rated to the feeder's days; SUM = the feeder's asset_billed), added_kwh; ORDER BY billed_kwh DESC LIMIT 200."
      - "Forecasts / months with no data: data runs June-July 2026 only. 'Next month' / September / 'if the trend continues' = the month-wise series (June, July) and a projection from them -- never pin an empty month."
      - "ROUND % to 2 decimals, MU to 2, kWh to 3. Athena: no '::' casts; COUNT_IF for counts."
    example:
      question: "What is the feeder loss in Kashi?"
      sql: |
        SELECT MAX(data_date) AS data_month, COUNT(*) AS feeders,
               ROUND(SUM(net_input) / 1e6, 2) AS input_mu,
               ROUND(SUM(asset_billed) / 1e6, 2) AS output_mu,
               ROUND(SUM(loss_kwh) / 1e6, 2) AS energy_gap_mu,
               ROUND(SUM(loss_kwh) * 100.0 / NULLIF(SUM(net_input), 0), 2) AS average_loss_pct,
               ROUND(COUNT_IF(loss_credible) * 100.0 / COUNT(*), 2) AS credible_pct
        FROM hes_gold.feeder_loss
        WHERE data_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND LOWER(cluster) = 'kashi'

  # WFM: discom escalation detail (Athena gmr_wfm_silver.unified_discom_escalations; 10 Nov 2026)
  om_escalation_detail:
    domain: wfm
    title: "Discom escalations in detail (ticket, feeder, technician, dates)"
    description: "Ticket-level DISESC escalations: one ticket/meter/consumer's escalation history and discom decision, escalations by feeder / DTR / sub-station / technician / discom officer, daily or date-range counts, decisions in a month, tickets escalated more than once, discom remarks."
    keywords: [escalation history, escalated ticket, ticket escalated, escalated again, more than once, repeat escalation, re-escalated, escalated by technician, technician escalated, feeder wise escalation, dtr wise escalation, sub station escalation, discom officer, discom supervisor, discom remark, discom said, decided on, approved on, rejected on, escalated on, escalated yesterday, escalated today, daily escalations, escalations between]
    tables: [unified_discom_escalations]
    answer_notes:
      - "Card totals (escalated / pending / approved / rejected / older than 30 days / non-comm / average days) come from the Escalated to Discom card (om_escalations, public.gold_om_discom_escalation_snapshot); this table reconciles with it ticket for ticket (42,026 on 6 Nov). Use it only for what the card cannot split."
      - "SmartEMS lists a ticket once per escalation; counts are TICKETS at their latest escalation unless the question asks for escalation events (daily escalations, escalations between dates) -- then say 'escalations' and also give distinct tickets."
      - "Never show consumer_name, mobile_no, address, technician_number, escalation_supervisor_number, latitude/longitude."
    rules:
      - "gmr_wfm_silver.unified_discom_escalations (Athena, ~43k rows, all CONSUMER): one row per escalation (discom, ticket_id, escalated_on). Columns project (lower-case), discom ('DVVNL','PuVVNL'), zone..sub_division (upper-case), sub_station, feeder, dtr, consumer_number, old_meter_serial_number, ticket_id, complaint_reason, technician_remarks, technician_name, escalated_on, escalation_status ('Pending','Approved','Rejected', NULL), escalation_attended_on, escalation_supervisor (discom officer, set only once decided), escalation_supervisor_remarks."
      - "Ticket counts: dedup to the latest escalation per ticket -- ROW_NUMBER() OVER (PARTITION BY UPPER(TRIM(discom)), UPPER(TRIM(ticket_id)) ORDER BY escalated_on DESC, escalation_attended_on DESC NULLS LAST, updated_at DESC, business_key_hash DESC) = 1, WHERE NULLIF(TRIM(ticket_id), '') IS NOT NULL AND escalated_on IS NOT NULL; times escalated = COUNT(*) OVER the same partition. Status = COALESCE(NULLIF(UPPER(TRIM(escalation_status)), ''), 'UNKNOWN')."
      - "Timestamps are UTC: dates = CAST(col AT TIME ZONE 'Asia/Kolkata' AS date) (the card's months/ages use IST). 'Last N days' ends yesterday. Days to decide = date_diff('second', escalated_on, escalation_attended_on) / 86400.0 where escalation_attended_on >= escalated_on."
      - "One ticket's history (ticket_id given) = all its rows ordered by escalated_on, no dedup. Lookup by meter: UPPER(TRIM(old_meter_serial_number)); by consumer: TRIM(consumer_number) (text, keep leading zeros); by ticket: UPPER(TRIM(ticket_id)). A meter/consumer can have several tickets."
      - "Place filters: LOWER(TRIM(project)) = 'kashi'; UPPER(TRIM(zone)) = 'VARANASI II'. feeder / dtr / sub_station are free text with codes: GROUP BY them as stored, never guess a feeder name -- match with UPPER(feeder) LIKE UPPER('%<name>%')."
      - "Discom officer-wise = escalation_supervisor (NULL while pending: filter IS NOT NULL). Technician-wise = technician_name as stored. Discom remarks are free text: UPPER(TRIM(escalation_supervisor_remarks)), blank -> 'NO REMARK'."
    example:
      question: "Top 10 feeders by tickets escalated to discom in Kashi"
      sql: |
        WITH latest AS (
            SELECT d.*,
                   COALESCE(NULLIF(UPPER(TRIM(d.escalation_status)), ''), 'UNKNOWN') AS status,
                   ROW_NUMBER() OVER (PARTITION BY UPPER(TRIM(d.discom)), UPPER(TRIM(d.ticket_id))
                                      ORDER BY d.escalated_on DESC, d.escalation_attended_on DESC NULLS LAST,
                                               d.updated_at DESC, d.business_key_hash DESC) AS rk
            FROM gmr_wfm_silver.unified_discom_escalations d
            WHERE NULLIF(TRIM(d.ticket_id), '') IS NOT NULL AND d.escalated_on IS NOT NULL
        )
        SELECT feeder, COUNT(*) AS escalated_tickets, COUNT_IF(status = 'PENDING') AS discom_pending
        FROM latest
        WHERE rk = 1 AND LOWER(TRIM(project)) = 'kashi'
        GROUP BY feeder
        ORDER BY escalated_tickets DESC, feeder
        LIMIT 10

  # Technical > Load Management (remainder) + Theft Analysis cards. Formulas follow the dashboard KpiBoard over the
  # tables gmr-etl kpi_60 / kpi_70 / kpi_72 / kpi_45 write; references recomputed live 10 Nov 2026 (default month July).
  mdm_overload_diversion:
    domain: mdm
    title: "Overload / MD breach risk and theft / load diversion (consumer maximum demand vs sanctioned load, utilisation factor)"
    description: "The Technical > Load Management cards Overload / MD breach risk (consumers whose maximum demand is 90%+ of sanctioned load, by risk bucket 90-105% / 106-120% / >120%, under 90% healthy) and Theft / Load diversion (consumers flagged for a low utilisation factor: energy recorded far below what their maximum demand implies): counts, % of consumers, by project / circle / zone / category, month-wise, one consumer."
    keywords: [overload, md breach, breach risk, md risk, maximum demand risk, overload risk, at risk, risk bucket, 90-105%, 106-120%, above 120%, ">120%", under 90%, healthy, load diversion, diversion, diverting, diversion suspects, utilisation factor, utilization factor, uf, low utilisation, hollow consumption, bypass, theft / load diversion, credible sanctioned load]
    tables: [overload_md_breach, load_diversion, load_assessed_consumers]
    answer_notes:
      - "Always name the month (data_month in RESULT). With no month asked it is the dashboard's default month: the latest month with at least 10 days of readings (July 2026 now; August 2026 holds only 2-3 days)."
      - "MD breach risk: overload % = maximum demand / sanctioned load. Buckets: 90-105% (90 to under 106), 106-120%, >120% (above 120); below 90% = healthy. Quote meters at risk, the bucket counts and the % of consumers assessed (2 decimals). This card is 'at risk' -- different from % Consumers with Load Violation (more than 60% above sanctioned load)."
      - "Caveat in one clause when quoting MD breach or diversion: about 63% of sanctioned loads are a 1 kW system default, so many flags rest on a doubtful sanctioned load (credible = sanctioned load above 1 kW, 37% of July's at-risk consumers)."
      - "Load diversion: a consumer is flagged when its utilisation factor (energy recorded / (maximum demand x active hours)) is below 0.3. Roughly half of consumers are flagged (52% in July), so say 'flagged as diversion suspects by the dashboard rule', never 'stealing'."
      - "Per-area answers: the first row of RESULT is the area with the most; check every row of the column you quote before naming the highest or lowest."
    rules:
      - "Forecasts / months with no data: HES data runs June-August 2026 (August holds only 2-3 days). 'next month' / 'predict' = query the month-wise series (GROUP BY data_date) and project from June and July; never pin an empty month."
      - "Month: data_date = month 1st; no month / 'latest' = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). Named month = DATE 'YYYY-MM-01'. SELECT the month as data_month. Never sum months."
      - "Places: cluster 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi'); zone / circle / division / sub_division upper-case (UPPER(col) LIKE '%NAME%'); category 'consumer_1_phase' / 'consumer_3_phase' only. One consumer = meter_no = 'X'."
      - "hes_gold.overload_md_breach holds AT-RISK consumers only (one row per consumer, overload_pct >= 90): at risk = COUNT(DISTINCT meter_no); buckets = COUNT(DISTINCT meter_no) FILTER (WHERE risk_bucket = '>120%' / '106-120%' / '90-105%'); 'above 120%' = risk_bucket = '>120%' (never overload_pct > 120 on a filtered subset of another bucket). Consumers assessed = SUM(assessed_meters) FROM hes_gold.load_assessed_consumers with the SAME month and cluster / zone..sub_division / category filters (two CTEs; JOIN on the area column for per-area %). Under 90% = assessed - at risk; % at risk = at risk * 100.0 / assessed. Credible = sanctioned_load_kw > 1 (there is NO assessment_credible column). Lists: meter_no, sanctioned_load_kw, md_kw, overload_pct, risk_bucket ORDER BY overload_pct DESC LIMIT 200."
      - "hes_gold.load_diversion holds EVERY scored consumer (one row per consumer per month) with is_diversion_suspect (= uf_value < 0.3): scored = COUNT(DISTINCT meter_no); suspects = COUNT(DISTINCT meter_no) FILTER (WHERE is_diversion_suspect); % = suspects * 100.0 / scored (same table, no other denominator); average UF = AVG(uf_value). Flagged consumers by area (the card's chart) = WHERE is_diversion_suspect GROUP BY circle (default level) ORDER BY 2 DESC. Columns: sanctioned_load_kw, md_kw, monthly_kwh, active_hours, uf_value, overload_pct."
      - "Which table: 'MD breach' / 'overload risk' / 'risk bucket' / '90-105' / '106-120' / '120%' on consumers = overload_md_breach; 'diversion' / 'utilisation factor' / 'theft / load diversion' = load_diversion; 'load violation' / '60% above sanctioned' = load_violation (topic mdm_load_violation). Never JOIN overload_md_breach to load_diversion."
      - "ROUND percentages to 2 decimals, UF to 4."
    example:
      question: "How many consumers are at MD breach risk in Kashi?"
      sql: |
        WITH m AS (SELECT MAX(month_date) AS mon FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c),
             b AS (SELECT COUNT(DISTINCT meter_no) AS at_risk,
                          COUNT(DISTINCT meter_no) FILTER (WHERE risk_bucket = '>120%') AS above_120,
                          COUNT(DISTINCT meter_no) FILTER (WHERE risk_bucket = '106-120%') AS b_106_120,
                          COUNT(DISTINCT meter_no) FILTER (WHERE risk_bucket = '90-105%') AS b_90_105
                   FROM hes_gold.overload_md_breach WHERE data_date = (SELECT mon FROM m) AND LOWER(cluster) = 'kashi'),
             a AS (SELECT SUM(assessed_meters) AS assessed FROM hes_gold.load_assessed_consumers
                   WHERE data_date = (SELECT mon FROM m) AND LOWER(cluster) = 'kashi')
        SELECT (SELECT mon FROM m) AS data_month, assessed, at_risk, above_120, b_106_120, b_90_105,
               assessed - at_risk AS under_90, ROUND(at_risk * 100.0 / NULLIF(assessed, 0), 2) AS pct_at_risk
        FROM b, a

  mdm_theft_anomaly:
    domain: mdm
    title: "Theft analysis and anomalies (theft suspect flags, areas with highest theft risk, % reduction in theft events, total anomalies detected, repeat anomaly tracking)"
    description: "The Technical > Theft Analysis cards: Theft Suspect Flags (meters with an evening-heavy or night-zero consumption pattern for 10+ days), Areas with Highest Theft Risk (theft-suspect and diversion-flagged meters per area), % Reduction in Theft Events (suspects this month vs last), Total Anomalies Detected (meters flagged per anomaly type), Repeat Anomaly Tracking (meters flagged by exactly 3 / 5 / 7 / 9 detector KPIs)."
    keywords: [theft, theft suspect, theft suspects, suspect flags, energy theft, pilferage, chori, evening high, evening consumption, day night pattern, night zero, streak, theft risk, highest theft risk, risk areas, theft events, reduction in theft, theft reduction, theft trend, anomalies, anomaly, total anomalies, anomaly type, anomalies detected, repeat anomaly, repeat anomalies, flagged by kpis, multiple detectors, field visit candidates, flagged kpis]
    tables: [energy_theft_suspect, theft_risk_by_area, theft_reduction_trend, total_anomalies_detected, repeat_anomaly_tracking]
    answer_notes:
      - "Always name the month (data_month in RESULT). With no month asked it is the dashboard's default month: July 2026 (the latest month with at least 10 days of readings). Theft suspects need a 10-day streak, so June (5 days of data) and August (2 days) show none -- say so instead of calling them theft-free."
      - "Theft suspect = 10+ consecutive days with either more than 40% of the day's energy between 6 and 10 pm (evening_high) or near-zero night use with normal daytime use (day_night_pattern). A meter can show both patterns on different days, so the two pattern counts can add to slightly more than the total."
      - "% Reduction in theft events: July compares with June, which had no suspects (too few days of data), so there is no baseline and the % cannot be computed -- give last month's and this month's suspects instead. August's 100% is from only 2 days of data; say it is not a real reduction."
      - "Areas with highest theft risk and the anomaly roll-ups are built from the detector tables as they stood when the roll-up ran: July's areas card counts theft suspects only (no load-diversion flags), and July's anomaly totals have no Load Diversion, MD Breach Risk or Load Violation type. Mention this in one clause when quoting them."
      - "Total anomalies: a meter flagged by two types counts once in each, so the grand total is anomaly flags, not distinct meters. Repeat anomaly: counted only when EXACTLY 3, 5, 7 or 9 detectors flagged the meter (4, 6, 8 are in no band)."
      - "Per-area answers: the first row of RESULT is the area with the most; check every row before naming the highest or lowest."
    rules:
      - "Month: no month / 'latest' / 'this month' = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c). energy_theft_suspect: filter month_date (its data_date is the DAY -- never data_date = month 1st); every other table here: data_date = month 1st. SELECT the month as data_month. Never sum months."
      - "Places: cluster 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi') on energy_theft_suspect, theft_risk_by_area, total_anomalies_detected, repeat_anomaly_tracking. theft_reduction_trend has NO cluster: project = zones -- Agra = UPPER(zone) IN ('AGRA','ALIGARH','ETAH','FIROZABAD','MATHURA'), Kashi = ('AZAMGARH','VARANASI I','VARANASI II'), Triveni = ('MIRZAPUR','PRAYAGRAJ I','PRAYAGRAJ II'). zone / circle / division / sub_division upper-case. category 'consumer_1_phase' / 'consumer_3_phase' / 'consumer_ht' / 'dt_meter' / 'feeder' (theft_risk_by_area and repeat_anomaly_tracking have none)."
      - "Theft Suspect Flags (hes_gold.energy_theft_suspect, one row per meter per DAY, whole fleet): ALWAYS AND is_theft_suspect; suspects = COUNT(DISTINCT meter_no); by pattern = COUNT(DISTINCT meter_no) FILTER (WHERE suspect_pattern = 'evening_high' / 'day_night_pattern'); by area = GROUP BY circle (default) ORDER BY 2 DESC; per meter lists GROUP BY meter_no with MAX(streak_length) AS longest_streak_days (never list day rows). Never COUNT(*) (counts meter-days)."
      - "Areas with highest theft risk (hes_gold.theft_risk_by_area, one row per at-risk meter): at-risk meters = COUNT(DISTINCT meter_no) GROUP BY circle (default level) / zone / division / cluster ORDER BY 2 DESC; COUNT_IF(theft_flag) theft suspects, COUNT_IF(diversion_flag) diversion suspects, COUNT_IF(theft_flag AND diversion_flag) both."
      - "% Reduction in theft events (hes_gold.theft_reduction_trend, one row per sub-division): prev = SUM(prev_suspects) (month in prev_period), curr = SUM(curr_suspects), reduction % = (SUM(prev_suspects) - SUM(curr_suspects)) * 100.0 / NULLIF(SUM(prev_suspects), 0). Never AVG(reduction_pct). By area = GROUP BY zone / circle with the same formula."
      - "Total anomalies (hes_gold.total_anomalies_detected): meters flagged per type = SUM(distinct_meters) GROUP BY anomaly_type ORDER BY 2 DESC (types: Hidden_Outage_Pockets, Consumption_Spike_Drop, Low_Voltage_Pockets, Meters_Stopped_Communicating, Power_Factor_Deterioration, Reverse_Flow_Anomaly, Data_Quality_Issue, Theft_Suspect_Flags, Load_Diversion, MD_Breach_Risk, Consumers_With_Load_Violation, Voltage_Current_Imbalance, Voltage_Imbalance_Alert, Current_Imbalance_Alert); total anomaly flags = SUM(distinct_meters). Never COUNT(*) (rows are area x category x type)."
      - "Repeat anomaly (hes_gold.repeat_anomaly_tracking, one row per meter): meters = COUNT(DISTINCT meter_no) GROUP BY repeat_band ('3','5','7','9'; ORDER BY CAST(repeat_band AS INTEGER) DESC) or FILTER (WHERE repeat_count = N); flagged_kpis lists the detectors ('Hidden Outage, Spike/Drop, PF Deterioration'); one meter = meter_no = 'X'. Lists ORDER BY repeat_count DESC LIMIT 200."
      - "Which table: 'theft suspect' / 'evening' / 'day night' / 'streak' = energy_theft_suspect; 'theft risk' / 'risk areas' = theft_risk_by_area; 'reduction' / 'theft trend' / 'went down' = theft_reduction_trend; 'anomalies detected' / 'anomaly type' = total_anomalies_detected; 'repeat' / 'flagged by N KPIs' / 'multiple detectors' = repeat_anomaly_tracking. One table per query; never JOIN them."
      - "ROUND percentages to 2 decimals."
    example:
      question: "How many theft suspects are there circle-wise in Kashi?"
      sql: |
        SELECT MAX(month_date) AS data_month,
               CASE WHEN GROUPING(circle) = 1 THEN 'Total' ELSE circle END AS circle_name,
               COUNT(DISTINCT meter_no) AS theft_suspects,
               COUNT(DISTINCT meter_no) FILTER (WHERE suspect_pattern = 'evening_high') AS evening_high,
               COUNT(DISTINCT meter_no) FILTER (WHERE suspect_pattern = 'day_night_pattern') AS day_night_pattern
        FROM hes_gold.energy_theft_suspect
        WHERE month_date = (SELECT MAX(month_date) FROM (SELECT month_date FROM hes_gold.dt_load_profile WHERE month_date >= DATE '2026-06-01' GROUP BY month_date HAVING COUNT(DISTINCT data_date) >= 10) c)
          AND is_theft_suspect AND LOWER(cluster) = 'kashi'
        GROUP BY ROLLUP (circle)
        ORDER BY GROUPING(circle) DESC, 3 DESC

  # Per-meter SOURCE readings (HES, Athena hes_silver) -- what the dashboard's KPI drill drawer 'Fetch from source data'
  # (stages 2-3: HES-BACKEND-GMR hes_kpi_repo.meter_source_daily / meter_source_readings) and the Energy Audit drawer
  # evidence (_meter_daily_usage_month) read. Not a KPI card. Researched live 10 Nov 2026 (group H).
  mdm_meter_readings:
    domain: mdm
    title: "One meter's readings: half-hour (block) readings and daily register readings"
    description: "Raw readings of ONE meter (or one consumer number): its half-hourly voltage, current, kWh / kVAh import and export and power factor on a day (hes_silver.block_usage), and its daily cumulative register readings, day-wise consumption, consumption between two dates and maximum demand (hes_silver.daily_usage)."
    keywords: [half hour readings, half-hourly, 30 minute, block readings, block load, interval data, load profile of meter, readings of meter, meter readings, raw readings, source data, fetch from source data, kwh, kvah, units consumed, consumption of meter, usage of meter, daily readings, daily consumption, day-wise consumption, register reading, cumulative reading, kwh import, kwh export, net kwh, voltage of meter, current of meter, phase-wise voltage, phase voltage, max demand of meter, peak load time]
    tables: [block_usage, daily_usage, dim_meter, dim_meter_replaced]
    answer_notes:
      - "These are the meter's own reported readings (source data), not a dashboard KPI verdict. Always name the meter and the date(s). Times are IST (rtc); a day holds 48 half-hours -- say how many it reported if fewer."
      - "HES data exists only for: June 1-2 (Kashi/Triveni only), June 27-30, July 5-9, 13-17, 20-24 and August 1-2 2026 (the 1st / 9th / 17th / 24th of July and 3 August are partial tails). daily_usage has no August. A date outside these = 'no readings received for that day', never 'meter was off'."
      - "Daily register readings are CUMULATIVE totals at 00:00 IST of data_date: consumption = later reading minus earlier reading; a gap of several days (e.g. 8 -> 13 July) is several days of use -- say so, never call it one day."
      - "Feeder meters (and HT / CT meters) report secondary-side values: voltage ~63 V per phase and a few amps; true energy = reading x MF (dim_meter.mf, e.g. 4000). DT meter readings are also CT-secondary amps. Say this when quoting a feeder / DT meter."
      - "A meter missing from dim_meter but found in dim_meter_replaced was swapped out (replaced_by, replaced_on): its readings until then are real -- name the replacement meter."
    rules:
      - "COST (Athena bills per byte; block_usage is ~3.1 billion rows, ~175M/day, partitioned ONLY by discom_code + data_date -- never by meter): EVERY query on hes_silver.block_usage MUST have meter_no = 'X' (or meter_no IN (SELECT meter_no FROM hes_gold.dim_meter WHERE <consumer_id match>)) AND data_date = DATE 'YYYY-MM-DD' (or BETWEEN two dates at most 3 days apart). One day for one meter scans ~0.4-0.8 GB; never a month, never without meter_no, never a place filter instead of meter_no, select only the columns needed (no SELECT *). daily_usage: meter_no AND a data_date range of at most one month (~0.2 GB)."
      - "Which table: half-hour / 30-min / interval / voltage / current / phase / power factor / 'at what time' / peak load on a DAY = block_usage (one day). Daily readings, day-wise / monthly / between-dates consumption, register, cumulative, maximum demand = daily_usage. A per-day summary over more than 3 days or a month = daily_usage for energy; for voltage / completeness over a month use the Power Quality / meter data cards (mdm_power_quality, mdm_meter_data), never a month of block_usage."
      - "No date asked: block_usage = DATE '2026-08-02' (latest full day), daily_usage = July 2026 (data_date >= DATE '2026-07-01' AND data_date < DATE '2026-08-01'; the HES default month). 'Last month' / 'this month' = July 2026 (no HES data after August 2026). 'On 14 July' = data_date = DATE '2026-07-14'."
      - "block_usage columns (one row per meter per half-hour, data_date = IST day, rtc = IST block start text, reading_ts_utc = timestamp, ORDER BY reading_ts_utc): energy in Wh / VAh per half-hour -- kWh = wh_import / 1000.0, kwh export = wh_export / 1000.0, kVAh = vah_import / 1000.0 (DOUBLE). 1-phase: average_voltage, average_current (DOUBLE). 3-phase / DT / feeder: voltage_rn, voltage_yn, voltage_bn, current_r, current_y, current_b are VARCHAR -> TRY_CAST(x AS DOUBLE); average_voltage is NULL for them. power_factor_total is always NULL: PF = wh_import / NULLIF(vah_import, 0) (day: SUM(wh_import) / NULLIF(SUM(vah_import), 0)). Demand kW of a half-hour = wh_import * 2 / 1000.0. meter_type here is 'consumer' / 'dtr' / 'feeder'."
      - "Day summary (the drawer's stage 2 row): COUNT(*) half-hours reported, 48 expected, ROUND(COUNT(*) * 100.0 / 48, 1) completeness %, SUM(wh_import) / 1000.0 kWh, AVG(NULLIF(voltage, 0)) (a 0 = not reporting), MIN(NULLIF(voltage, 0)), MAX(voltage); voltage = COALESCE(average_voltage, TRY_CAST(voltage_rn AS DOUBLE)) when the meter type is unknown. Below / above band: COUNT_IF(average_voltage < 216) / COUNT_IF(average_voltage > 253) (230 V +-6%)."
      - "daily_usage (one row per meter per IST day; rare duplicate rows -> GROUP BY data_date with MAX()): wh_import / wh_export / vah_import / vah_export are CUMULATIVE register Wh -> / 1000.0 = kWh reading; net = (MAX(wh_import) - MAX(wh_export)) / 1000.0 (the drawer's Net kWh). Consumption between two dates = (MAX_BY(wh_import, data_date) - MIN_BY(wh_import, data_date)) / 1000.0 with the first and last reading dates; day-wise = LEAD(wh) OVER (ORDER BY data_date) - wh with the next reading date and days covered (filter up to the day after the month to close its last day). Maximum demand: md_w_import (VARCHAR W, billing-period-to-date) -> MAX_BY(TRY_CAST(md_w_import AS DOUBLE), data_date) / 1000.0 kW at md_w_date_time."
      - "Consumer number: meter_no IN (SELECT meter_no FROM hes_gold.dim_meter WHERE regexp_replace(TRIM(consumer_id), '^0+', '') = regexp_replace('<number>', '^0+', '')) -- never a JOIN without the meter filter. Meter serials: meter_no = '<serial as typed, upper-case>'. Never filter block_usage / daily_usage on cluster / zone (lower-case copies, not partitions)."
      - "Feeder / DT meter energy: multiply by (SELECT MAX(mf) FROM hes_gold.dim_meter WHERE meter_no = 'X') and say so. Feeder / DT LOSS, DT LOADING, PQ indices, spikes, outages are their cards' topics, not raw readings."
    example:
      question: "Show the half-hourly readings of meter AL1159584 on 14 July 2026"
      sql: |
        SELECT rtc AS reading_time_ist,
               average_voltage AS voltage_v, average_current AS current_a,
               ROUND(wh_import / 1000.0, 3) AS kwh_import, ROUND(wh_export / 1000.0, 3) AS kwh_export,
               ROUND(vah_import / 1000.0, 3) AS kvah_import,
               ROUND(wh_import / NULLIF(vah_import, 0), 3) AS power_factor
        FROM hes_silver.block_usage
        WHERE meter_no = 'AL1159584' AND data_date = DATE '2026-07-14'
        ORDER BY reading_ts_utc

  # HES meter master (hes_gold.dim_meter) -- the dimension every HES board joins for hierarchy, category and the
  # filter dropdowns (HES-BACKEND-GMR hes_kpi.py filter-options / filter-tree, hes_kpi_repo._geo_join_sql).
  mdm_meter_master:
    domain: mdm
    title: "HES meter master: where a meter is (zone .. feeder / DT), meter counts by project / zone / category / feeder / DT"
    description: "The HES meter master: which project, discom, zone, circle, division, sub-division, sub-station, feeder and DT a meter or consumer number is on, its category, meter type, MF, sanctioned load and consumer number; replaced (swapped-out) meters; counts of HES meters by project, zone, category; meters / DTs on a feeder; meters on a DT; a feeder's own meter."
    keywords: [meter master, hes meters, mdm meters, dim_meter, which zone is meter, which circle, which division, which dt, which transformer, hierarchy of meter, where is meter, meter details, consumer number, consumer id, meters on feeder, meters on dt, consumers on dt, dt meters, feeder meters, feeder meter number, mf, multiplying factor, meter category, smart meter type, 1 phase, 3 phase, ht, how many hes meters, replaced meter, replaced by]
    tables: [dim_meter, dim_meter_replaced]
    answer_notes:
      - "dim_meter is the CURRENT meter population (built from the asset master / installation master; current-state snapshot, not history). A swapped-out meter is only in dim_meter_replaced (located where its replacement is, with replaced_by and replaced_on). Say which one the answer came from."
      - "107,509 meters (inventory only) have no hierarchy at all (project / zone .. feeder NULL): call them 'not placed', never drop them silently from a total."
      - "This is the HES master, not WFM installation progress: 'how many meters installed' is the WFM installation card. Quote counts as whole numbers."
    rules:
      - "Table: hes_gold.dim_meter (4,381,272 rows, one per meter_no; small, ~0.5-65 MB a query). Never dim_meter_energy (retired 16 Sep 2026, stale copy) or dim_meter_asof_* (frozen 8 Sep 2026 pin). One meter lookup = UNION ALL of dim_meter (found_in 'current meter') and hes_gold.dim_meter_replaced (found_in 'replaced meter', + replaced_by, replaced_on) WHERE meter_no = '<serial>'."
      - "Columns: category 'consumer_1_phase' / 'consumer_3_phase' / 'consumer_ht' / 'dt_meter' / 'feeder'; meter_type 'CONSUMER' / 'DT' / 'FEEDER'; smart_meter_type = inventory code (1PH-STSM, 3PH-STSM, 3PLTCTSM, HTCTPTSM, ...); discom_code 'DVVNL' / 'PUVVNL'; cluster = project 'Agra' / 'Kashi' / 'Triveni' (LOWER(cluster) = 'kashi'); zone / circle / division / sub_division / sub_station upper-case (division has 2 casing duplicates: compare UPPER(col)); feeder_code, feeder_name, dtr_code, dtr_name, feeder_meter_no (the feeder's own meter), consumer_id (TEXT, may have leading zeros), mf, sanctioned_load_kw, installation_date, mapping_confidence."
      - "Consumer number: regexp_replace(TRIM(consumer_id), '^0+', '') = regexp_replace('<number>', '^0+', '') (a consumer can have more than one meter row). Feeder by code: feeder_code = 'X'; by name: UPPER(feeder_name) LIKE '%NAME%'. DT: dtr_code = 'X' (codes like 'JYO/TO1/DT011')."
      - "Counts: meters = COUNT(*); by category COUNT_IF(category = ...); consumer meters = meter_type = 'CONSUMER'. By project: GROUP BY COALESCE(cluster, 'Not placed'). Meters on a feeder: WHERE feeder_code = 'X' -- total, by category, COUNT(DISTINCT dtr_code) DTs, MAX(feeder_meter_no). Meters on a DT: WHERE dtr_code = 'X' (list meter_no, category, consumer_id; LIMIT 200). A feeder's own meter: category = 'feeder' AND feeder_code = 'X' (meter_no, mf). DT meter of a DT: category = 'dt_meter' AND dtr_code = 'X'."
      - "A plain 'which feeder / substation is meter X on' is the mapping audit's lookup (mdm_autoindexing: index-based vs AI-based feeder); use dim_meter when DT / zone / circle / division / project / MF / consumer number / category is asked, or the meter is not in the audit."
    example:
      question: "Which zone, circle, division, substation, feeder and DT is meter AL1159584 on?"
      sql: |
        SELECT meter_no, category, consumer_id, cluster AS project, zone, circle, division, sub_division, sub_station,
               feeder_code, feeder_name, dtr_code, dtr_name, 'current meter' AS found_in,
               CAST(NULL AS varchar) AS replaced_by, CAST(NULL AS date) AS replaced_on
        FROM hes_gold.dim_meter WHERE meter_no = 'AL1159584'
        UNION ALL
        SELECT meter_no, category, NULL, cluster, zone, circle, division, sub_division, sub_station,
               feeder_code, feeder_name, dtr_code, dtr_name, 'replaced meter', replaced_by, replaced_on
        FROM hes_gold.dim_meter_replaced WHERE meter_no = 'AL1159584'

# Domain words people use -> the programme's own terms. Retrieval only: the
# query is expanded with these before BM25 + embedding search (never changes
# the question the LLM answers).
retrieval_synonyms:
  shipped: supplied supply
  delivered: supplied supply
  received: supplied supply
  fitted: installed installation
  put in: installed installation
  went in: installed installation
  lage: installed installation
  lagaye: installed installation
  acceptance testing: SAT
  acceptance: SAT
  maker: OEM
  manufacturer: OEM
  vendor: OEM
  brand: OEM
  fail: defective defect rate faulty
  kharab: defective defect
  jala: burnt
  money: receivables collection invoiced realised
  stuck with the discom: outstanding receivables collection efficiency
  owes: outstanding receivables
  dues: outstanding receivables
  bill: invoice
  billing: invoice PMPM
  run dry: stock last days
  run out: stock last days
  kitne din: how many days
  re-tag: reassign re-tagged feeder tagging auto-indexing
  retag: reassign re-tagged feeder tagging auto-indexing
  field check: review pending verification
  four months: 120 days
  three months: 90 days
  outrunning: keeping pace supply installation
  through sat: SAT rate percentage
  best to worst: rank SAT percentage by project
